#
# Documentation hub for ra8-firmware (ADR-0005, #900).
#
# This file owns the repository's PROSE: the manuals, specs and decision
# records under docs/. It does not own any API reference. Those are produced
# by the language-native generators and mounted under /api/ by the site
# assembler:
#
#   /            this hub (MkDocs)
#   /api/c/      doxygen, over the public C ABI headers
#   /api/zig/    zig autodoc, per migrated Zig library
#   /api/rust/   rustdoc, over the host and HIL crates
#
# Build it with `just docs::hub` (never a bare `mkdocs build`: the wrapper
# pins the generator versions from docs/hub-requirements.txt). Generated HTML
# lands in build/docs/hub/ and is never committed.
#
# The nav below is exhaustive by policy, and scripts/checks/check_docs_hub_nav.py
# enforces that: every Markdown file under docs/ is either reachable from this
# nav or explicitly excluded, so a new manual cannot land invisible.

site_name: ra8-firmware
site_description: Bare-metal firmware for the Renesas RA8 family (RA8D2 / RA8P1)
site_author: Brighton Sikarskie
repo_url: https://github.com/bsikar/ra8-firmware
repo_name: bsikar/ra8-firmware
copyright: Copyright (c) 2026 Brighton Sikarskie

docs_dir: docs
site_dir: build/docs/hub
use_directory_urls: true

# Fail closed. A broken internal link, a nav entry pointing at a file that was
# renamed, or an unrecognised config key is an error, not a log line.
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The manuals are written for github.com first, so they link to tree files
# with ordinary relative paths. The hook rewrites anything leaving docs/ into
# an absolute repository URL and fails the build on a target that does not
# exist, which is what keeps strict mode meaningful here.
hooks:
  - scripts/gen/mkdocs_repo_links.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

# Non-prose assets under docs/ belong to other generators or to git, not to
# the hub. Excluding them keeps the published tree free of files no reader
# would ever open.
exclude_docs: |
  doxygen_theme/
  badges/
  generated/
  *.csv
  *.dox
  *.xml

nav:
  - Home: index.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Modules: MODULES.md
      - Rings and worlds: RING_AND_WORLD.md
      - Memory map: MEMORY_MAP.md
      - Dual core: DUAL_CORE.md
      - Driver status: DRIVER_STATUS.md
      - C6 wireless architecture: design/c6_wireless_architecture.md
      - C6 update pipeline: design/c6_update_pipeline.md
  - Decisions:
      - Index: adr/README.md
      - "ADR-0001 SIL 3 / DO-178C Level B target": adr/0001-iec-61508-sil-3-do-178c-level-b-target.md
      - "ADR-0002 cppcheck-only MISRA enforcement": adr/0002-cppcheck-only-misra-enforcement.md
      - "ADR-0003 Test-only internal headers": adr/0003-test-only-internal-headers.md
      - "ADR-0004 Deactivated-condition policy": adr/0004-deactivated-condition-policy.md
      - "ADR-0005 Multi-language documentation architecture": adr/0005-multi-language-documentation-architecture.md
      - "ADR-0006 Sequencing naming/linkage legacy backlog": adr/0006-naming-linkage-backlog-sequencing.md
      - "ADR-0007 Front-light driver interface": adr/0007-front-light-driver-interface.md
      - "ADR-0008 Vendoring-completeness contract": adr/0008-vendoring-completeness-contract.md
      - "ADR-0009 E-reader input and service interfaces": adr/0009-ereader-input-and-service-interfaces.md
      - "ADR-0010 SDRAM interface supply domain": adr/0010-sdram-interface-supply-domain.md
      - "ADR-0011 Chip-boot duplication across board libraries": adr/0011-chip-boot-duplication-across-board-libraries.md
      - "ADR-0012 C23 capability and ABI contract assertion": adr/0012-c23-capability-and-abi-contract-assertion.md
      - "ADR-0013 Reflow named character reference set": adr/0013-reflow-named-character-references.md
  - Toolchain and build:

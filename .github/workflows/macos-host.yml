# SCHEDULING ONLY -- the gate body lives in scripts/ci.sh (gate:
# macos-host-build). See .github/workflows/firmware.yml for the design note.
#
# The only Mac in this CI suite (#899). Every other workflow runs on Linux, so
# nothing else can observe whether the host Zig roots link against Apple's own
# libSystem stub on Apple Silicon -- the exact failure the issue reports. A
# cross-build for aarch64-macos from Linux cannot: an explicit target makes the
# query non-native, zig links its bundled stub instead, and the SDK stub that
# omits arm64-macos is never touched.
#
# GitHub-HOSTED, ephemeral macos-14 (arm64). It is not an Ansible-managed
# runner, so it provisions its own pinned Zig, and untrusted fork code stays on
# a throwaway VM that can reach none of the self-hosted infrastructure.
#
# On a clock rather than per push: the runner image and its Command Line Tools
# move underneath us, which is the variable this gate exists to watch, and a
# nightly signal is what catches an SDK change nobody in this repository made.
#
# NEITHER TRIGGER BELOW FIRES WHILE THIS FILE IS OFF THE DEFAULT BRANCH.
# GitHub runs `schedule` from the latest commit on the default branch only,
# and offers `workflow_dispatch` only for workflows that exist there -- the
# ref to run is a choice made at dispatch time, but an absent file is not
# listed and `gh workflow run` answers "could not find any workflows named".
# This file lands through the #899 stack into zig/dev, so merging that stack
# starts no nightly and produces no Run workflow button. Until zig/dev reaches
# main, the only way to get a real macOS reading is to run the gate by hand on
# an arm64 Mac:
#
#     just quality::local::gate macos-host-build
#
# See docs/MACOS_HOST_BUILDS.md, "What runs on a clock".
---
name: macos-host

on:
  schedule:
    # Nightly, 07:41 UTC -- off the hour, clear of the other scheduled jobs.
    - cron: "41 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Same pin as .devcontainer/Dockerfile (ARG ZIG_VERSION), with the sha256 of
  # the macOS arm64 tarball published in ziglang.org's download index. Bump
  # both together, and with the Dockerfile.
  ZIG_VERSION: 0.14.1
  ZIG_SHA256_AARCH64_MACOS: 39f3dc5e79c22088ce878edc821dedb4ca5a1cd9f5ef915e9b3cc3053e8faefa

jobs:
  macos-host-build:
    name: macOS arm64 host build (Zig roots, native SDK link)
    runs-on: macos-14
    # A WEDGED JOB HERE IS THE MOST EXPENSIVE WAY THIS SUITE CAN FAIL. Every
    # other workflow runs on Linux or on the self-hosted ra8-ci fleet, where a
    # minute costs nothing; GitHub bills a hosted macOS minute at 10x a Linux
    # one. With no timeout-minutes the job inherits GitHub's 6 h default, so
    # one stalled step (a download that hangs on a mirror without closing the
    # connection, a `zig build test` that deadlocks on the one platform
    # nothing else in CI exercises) spends 360 macOS minutes -- 3600 billable
    # -- before anything cancels it, then does it again the next night,
    # unattended, because a schedule has nobody watching it.
    #
    # 60 rather than fuzz-nightly.yml's 300: that gate is a time budget by
    # construction and runs where minutes are free. This one provisions a
    # toolchain and builds and tests the Zig host roots on one machine, which
    # is minutes of work on Linux. An hour is a wide margin for a cold runner
    # and a slow download while still cutting a hang off inside the hour.
    # Raise it only against a real run that reports needing more; never to
    # make a hang look like slowness.
    timeout-minutes: 60
    steps:
      - uses: extractions/setup-just@v3
        with:
          # Must match .devcontainer/Dockerfile (ARG JUST_VERSION); the
          # action's default floats.
          just-version: 1.40.0
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned Zig toolchain
        run: |
          # ci-parity: infra -- installs the pinned Zig compiler on the hosted
          # macOS runner and runs no project check. The runner image ships no
          # Zig at all, and this is a disposable GitHub-hosted VM, not an
          # Ansible-managed host, so provisioning belongs here. The download is
          # version-pinned and sha256-verified like every binary in
          # .devcontainer/Dockerfile, and it installs to /usr/local/zig so the
          # layout matches the container the other gates run in.
          set -euo pipefail
          # The download carries its own bounds rather than leaning on the
          # job's timeout-minutes, because curl's default is no timeout at all
          # and this is where an unattended nightly stalls most cheaply:
          # connect inside 20s, abort a transfer that has dropped under
          # 1 KiB/s for a minute (the shape a dead mirror takes -- socket
          # open, bytes stopped -- which a plain --max-time cannot tell from a
          # slow link), and a 10 min hard ceiling over the whole operation.
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            --connect-timeout 20 --speed-limit 1024 --speed-time 60 \
            --max-time 600 \
            -o "${RUNNER_TEMP}/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          # A MISMATCH HERE IS ALMOST NEVER A BAD DOWNLOAD, and shasum -c's
          # own wording says it is: "zig.tar.xz: FAILED" and "1 computed
          # checksum did NOT match" describe corruption or tampering, so the
          # reader goes looking at mirrors. On this repository the cause has
          # one overwhelmingly likelier shape: ZIG_VERSION above moved and
          # ZIG_SHA256_AARCH64_MACOS did not, because the digest sits on its
          # own env line and a nightly has nobody watching it. The comparison
          # below is the one shasum -c makes, against the same sha256, byte
          # for byte; only the diagnosis changes, so the next person reads
          # the real cause off the log instead of re-downloading a file that
          # was never wrong.
          recorded="${ZIG_SHA256_AARCH64_MACOS}"
          computed="$(shasum -a 256 "${RUNNER_TEMP}/zig.tar.xz" | cut -d ' ' -f 1)"
          if [ "${computed}" != "${recorded}" ]; then
            {
              echo "pinned Zig ${ZIG_VERSION}: sha256 mismatch"
              echo "  recorded: ${recorded:-<empty>}"
              echo "  computed: ${computed}"
              echo "  tarball:  zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
              echo
              echo "Most likely the version moved and the digest did not."
              echo "Three places carry the Zig pin, in one commit:"
              echo "  - ZIG_VERSION + ZIG_SHA256_AARCH64_MACOS, this file"
              echo "  - ARG ZIG_VERSION, .devcontainer/Dockerfile"
              echo "  - the RECORDED_DISTS row in"
              echo "    scripts/checks/check_zig_dist_pins.py"
              if [ "$(printf '%s' "${recorded}" | tr 'A-Z' 'a-z')" \
                   = "${computed}" ]; then
                echo
                echo "The two differ only in case. Digests are recorded"
                echo "lowercase here; paste the index's value verbatim."
              fi
              echo
              echo "If all three already agree on this version, then treat"
              echo "it as a bad or tampered download and compare against"
              echo "ziglang.org's published download index."
            } >&2
            exit 1
          fi
          sudo rm -rf /usr/local/zig
          sudo mkdir -p /usr/local/zig
          sudo tar -xf "${RUNNER_TEMP}/zig.tar.xz" --strip-components=1 -C /usr/local/zig
          rm "${RUNNER_TEMP}/zig.tar.xz"
          test "$(/usr/local/zig/zig version)" = "${ZIG_VERSION}"
          echo /usr/local/zig >> "${GITHUB_PATH}"

      - run: just quality::local::gate macos-host-build

      # THE TRANSCRIPT IS THE FINDING, and until now it died with the
      # workspace. gate_macos_host_build tees its measurement half to
      # macos-host.log at the repository root (scripts/ci/gates/manual.sh):
      # which libSystem stub the build graph pinned and why, what the
      # forced-SDK leg found, which host root broke. This is the one gate that
      # runs on hardware nobody here can log into, so that transcript is the
      # only channel through which an arm64 Mac reports back on #899, and a
      # hosted runner's own log cannot be attached to an issue, diffed against
      # last night's, or read at all once the run ages out. The gate writes the
      # file precisely so a step here can save it. Same shape as
      # fuzz-nightly.yml's sweep log, deliberately: two nightlies, one habit.
      - name: Upload the gate transcript
        # A FAILING RUN IS THE ONE WHOSE TRANSCRIPT MATTERS. Without always()
        # the artefact would exist only for the nights when there was nothing
        # to diagnose.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-log
          path: macos-host.log
          # The gate's preconditions -- wrong host, Rosetta, no pinned Zig --
          # refuse BEFORE the tee runs, so a refused run leaves no transcript
          # at all. That diagnosis is already on the step's stderr, and it must
          # not be replaced here by a secondary upload-action failure.
          if-no-files-found: ignore
          retention-days: 30

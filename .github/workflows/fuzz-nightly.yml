# SCHEDULING ONLY -- the gate body lives in scripts/ci.sh (gate: fuzz-sweep).
# See .github/workflows/firmware.yml for the design note.
#
# Nightly libFuzzer sweep (#239). The `make fuzz` smoke run gives each
# harness ~30 seconds -- enough to catch a build break, not enough to find
# parser bugs. This workflow deep-runs every registered harness (the
# RA8_FUZZ_TARGETS registry in tests/fuzz/CMakeLists.txt, consumed through
# scripts/utils/run_fuzz.sh --all) with a real per-target budget, fails on
# any crash, and uploads the crash reproducers from tests/build-fuzz/crashes/.
#
# libFuzzer is clang-only. run_fuzz.sh auto-selects the first clang on PATH
# able to link -fsanitize=fuzzer (the self-hosted runner ships versioned
# clang majors plus the libclang-rt fuzzer runtime -- the same packages the
# mcdc gate's -fprofile link path needs); the gate's preflight probe proves
# that before spending the budget, so a de-provisioned runner fails in seconds
# with an actionable message instead of after hours.
name: fuzz-nightly

on:
  schedule:
    # 07:23 UTC nightly -- off-peak for the self-hosted runner, which serves
    # PR gates during the day (odd minute to avoid the on-the-hour stampede).
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: "Per-target fuzz budget in seconds"
        required: false
        default: "600"

# One nightly sweep at a time; a manual dispatch supersedes a stuck run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer sweep (all harnesses)
    runs-on: [self-hosted, Linux, X64]
    # 13 harnesses x 600 s = ~130 min of fuzzing plus the clang build of the
    # host tree. Generous slack so a slow runner does not truncate the sweep.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # RA8_FUZZ_SECONDS is empty on schedule events; the gate defaults to 600
      # and validates the value, so an unparseable input fails immediately
      # rather than being handed to libFuzzer as "no limit".
      - env:
          RA8_FUZZ_SECONDS: ${{ inputs.seconds_per_target }}
        run: bash scripts/ci.sh --gate fuzz-sweep

      - name: Upload crash artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: tests/build-fuzz/crashes/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-log
          path: fuzz-nightly.log
          if-no-files-found: ignore
          retention-days: 30

# Nightly libFuzzer sweep (#239). The `make fuzz` smoke run gives each
# harness ~30 seconds -- enough to catch a build break, not enough to find
# parser bugs. This workflow deep-runs every registered harness (the
# RA8_FUZZ_TARGETS registry in tests/fuzz/CMakeLists.txt, consumed through
# scripts/utils/run_fuzz.sh --all) with a real per-target budget, fails on
# any crash, and uploads the crash reproducers from tests/build-fuzz/crashes/.
#
# libFuzzer is clang-only. run_fuzz.sh auto-selects the first clang on PATH
# able to link -fsanitize=fuzzer (the self-hosted runner ships versioned
# clang majors plus the libclang-rt fuzzer runtime -- the same packages the
# mcdc job's -fprofile link path needs); the preflight step proves that
# before spending the budget, so a de-provisioned runner fails in seconds
# with an actionable message instead of after hours.
name: fuzz-nightly

on:
  schedule:
    # 07:23 UTC nightly -- off-peak for the self-hosted runner, which serves
    # PR gates during the day (odd minute to avoid the on-the-hour stampede).
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: "Per-target fuzz budget in seconds"
        required: false
        default: "600"

# One nightly sweep at a time; a manual dispatch supersedes a stuck run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer sweep (all harnesses)
    runs-on: [self-hosted, Linux, X64]
    # 13 harnesses x 600 s = ~130 min of fuzzing plus the clang build of the
    # host tree. Generous slack so a slow runner does not truncate the sweep.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Resolve per-target budget
        id: budget
        env:
          # Empty on schedule events; the workflow_dispatch input otherwise.
          REQUESTED: ${{ inputs.seconds_per_target }}
        run: |
          budget="${REQUESTED:-600}"
          case "$budget" in
            ''|*[!0-9]*)
              echo "invalid seconds_per_target: '$budget'" >&2
              exit 1
              ;;
          esac
          if [ "$budget" -eq 0 ]; then
            echo "seconds_per_target must be >= 1 (0 means 'no limit' to libFuzzer)" >&2
            exit 1
          fi
          echo "seconds=$budget" >> "$GITHUB_OUTPUT"
          echo "Per-target budget: ${budget}s"

      - name: Preflight -- clang + libFuzzer runtime + harness registry
        run: |
          set -e
          # --list parses RA8_FUZZ_TARGETS and cross-checks it against the
          # tests/fuzz/fuzz_ra8_*.c sources, so registry drift fails here.
          echo "Registered harnesses:"
          bash scripts/utils/run_fuzz.sh --list
          # Compiler probe: the same trivial -fsanitize=fuzzer link
          # run_fuzz.sh performs during compiler auto-selection, done here
          # explicitly so a de-provisioned runner is diagnosed in seconds.
          probe="$(mktemp -d)"
          printf 'int LLVMFuzzerTestOneInput(const unsigned char* d, unsigned long n);\nint LLVMFuzzerTestOneInput(const unsigned char* d, unsigned long n) { (void)d; (void)n; return 0; }\n' > "$probe/p.c"
          found=""
          for cand in clang clang-22 clang-21 clang-20 clang-19 clang-18 clang-17; do
            if command -v "$cand" >/dev/null 2>&1 \
               && "$cand" -fsanitize=fuzzer -o "$probe/p" "$probe/p.c" >/dev/null 2>&1; then
              found="$cand"
              break
            fi
          done
          rm -rf "$probe"
          if [ -z "$found" ]; then
            echo "FAIL: no clang on this runner can link -fsanitize=fuzzer." >&2
            echo "      Install clang-<N> + libclang-rt-<N>-dev (the same" >&2
            echo "      packages the mcdc job's profile runtime comes from)." >&2
            exit 1
          fi
          echo "libFuzzer-capable compiler: $found"

      - name: Run every harness (per-target budget)
        run: |
          set -o pipefail
          bash scripts/utils/run_fuzz.sh --all "${{ steps.budget.outputs.seconds }}" \
            2>&1 | tee fuzz-nightly.log

      - name: Upload crash artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: tests/build-fuzz/crashes/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-log
          path: fuzz-nightly.log
          if-no-files-found: ignore
          retention-days: 30

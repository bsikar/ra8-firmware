name: board-sim-smoke

# board_sim (tools/board_sim) is the Unicorn-based RA8D2 board emulator: it boots
# the real cross-compiled firmware .elf on an emulated Cortex-M with the RA8D2
# peripheral space modelled. This gate builds it headless on the Linux runner and
# boots known-good example images, asserting each reaches its main loop without
# faulting (no invalid opcode / unmapped access) and is not parked in a
# panic/fault halt -- guarding the emulator, the GLCDC bring-up path, and the
# modelled peripheral blocks (GPIO / SCI UART / GPT+ICU IRQ / USB CDC).
#
# board_sim needs Unicorn + Capstone. The self-hosted runner has passwordless
# sudo + apt but no pkg-config, so this installs the system -dev packages (a
# no-op once present) and the build finds them with CMake's find_library (off the
# APPLE path -- no pkg-config required). The live --view window is macOS-only
# (Cocoa); this gate is headless, which board_sim supports via board_view_stub.c.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  board-sim-smoke:
    name: board_sim boot smoke
    runs-on: [self-hosted, Linux, X64]
    # Two board_sim_smoke.sh passes (boot smoke over every app + the ra_io
    # fabric gate) plus the emulator build. Now that ~100 example apps link the
    # ra_board_ek_ra8d2 BSP, the per-app build is a touch heavier and the job
    # sat right at the old 20 min ceiling -- a slower runner got cancelled at
    # the last ra_io demo. 30 min gives headroom without masking a real hang
    # (each board_sim run is still bounded by BOARD_SIM_WALL_S / MAX_CHUNKS).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Idempotent: skip apt entirely once the libraries are present on this
      # long-lived runner, so only the first run pays the install cost.
      - name: Install Unicorn + Capstone
        run: |
          if ! ldconfig -p | grep -q 'libunicorn'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libunicorn-dev libcapstone-dev
          fi

      # #178: build the emulated firmware with the SAME pinned Arm GNU Toolchain
      # 13.3 the release cross-build uses (the runner provisions
      # /opt/arm-gnu-toolchain-13.3), so board_sim exercises release-identical
      # codegen. cmake/toolchain-ra8d2.cmake also HINTS this path and now asserts
      # 13.3 fatally by default; putting it on PATH keeps board_sim consistent
      # with the build-cross job.
      - name: Pin arm-none-eabi-gcc 13.3 on PATH
        run: |
          if [ -x /opt/arm-gnu-toolchain-13.3/bin/arm-none-eabi-gcc ]; then
            echo "/opt/arm-gnu-toolchain-13.3/bin" >> "$GITHUB_PATH"
          fi

      - name: board_sim boot smoke
        run: bash scripts/board_sim_smoke.sh

      # ra_io fabric (#155) end-to-end gate: every storage backend driven through
      # the same VFS API (block device -> ra_fs FAT format/mount -> VFS mkdir +
      # nested file round-trip), plus the format registry, the LRU sector cache,
      # and the DEFLATE stream, asserted by each demo's PASS banner. Covers
      # RAM/SRAM, external SDRAM, SD-over-SPI, native SDHI, OSPI NOR
      # (erase-before-write), and on-chip MRAM (program/erase).
      - name: ra_io fabric board_sim gate (#155-#161)
        run: |
          bash scripts/board_sim_smoke.sh \
            ra_io_demo ra_io_sdram_demo ra_io_compress_demo \
            ra_io_sd_demo ra_io_sdhi_demo ra_io_xspi_demo ra_io_mram_demo \
            ra_io_fsfmt_demo ra_io_cache_demo

  # SIL (simulator-in-the-loop): the hardware-free mirror of the bench HIL suite
  # (scripts/hil_all.sh). Every app under examples/ek_ra8d2/hw_validated/hil/ is
  # booted in board_sim headless and checked against the SAME per-app hil.conf
  # expectation the real board is checked against -- the uart_scrape / alive UART
  # banners, and the jlink_memprobe progress counters via board_sim's --dump-sym /
  # --stop-sym. No hardware, so it belongs in CI: it would have caught the recent
  # board_sim div-0 the moment it landed. Where hil_all.sh flashes one physical
  # board serially, board_sim instances share no hardware, so sil_all.sh runs the
  # ~145 apps in PARALLEL at -j = the runner's core count; each run is bounded by
  # the SIL_*_MAX_CHUNKS / SIL_*_WALL_S caps so a hung app cannot stall the job.
  # rtt_scrape / hil_eth_tcp apps SKIP (RTT + a live TCP peer are not modelled);
  # SKIPs never fail the gate, only genuine board_sim modelling gaps or firmware
  # regressions do. If the app count ever outgrows one job, shard by passing a
  # slice of `sil_all.sh --list` app names across a matrix of jobs; today the
  # parallel single job stays well inside the board-sim-smoke budget.
  sil-integration:
    name: SIL integration (all hil apps in board_sim)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    # WIP / non-blocking. board_sim does not yet model the USBHS host controller
    # (0x40351000; the 11 usb_selftest_* / dfu_selftest_* self-loop apps), the
    # two-image-TZ NS world (cpu1_pingpong_ipc, tz_nsc_cgc_usb), or a bit-exact
    # DRW/D2 alpha-blend (drw_blend_demo) -- 14 genuine modelling gaps, being
    # closed one board_sim seam at a time (never SKIP'd or allowlisted). The job
    # still RUNS and logs every gap on every push, but does not gate main while
    # the seams are in flight. Drop this line to make it enforcing once
    # sil_all.sh is green.
    continue-on-error: true
    steps:
      # Do NOT fetch LFS during checkout (lfs: false). On the persistent
      # self-hosted runner, actions/checkout's `git lfs install --local` aborts
      # with exit 2 on a stale/conflicting LFS hook left in the reused
      # workspace. The bake step below fetches the content/library/*.epub
      # sources explicitly with `git lfs install --local --force`, which
      # overwrites that hook and cannot be tripped by leftover runner state.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Unicorn + Capstone
        run: |
          if ! ldconfig -p | grep -q 'libunicorn'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libunicorn-dev libcapstone-dev
          fi

      # ereader_shelf compiles against a generated (gitignored) MRAM library
      # header baked from three Git-LFS epub sources; a clean CI checkout lacks
      # it, so the app would otherwise fail to build. Regenerate just that subset
      # here (fast: three books via build_books.sh --shelf-only). sil_all.sh also
      # regenerates it on demand, but doing it explicitly keeps the requirement
      # (Git-LFS epubs + Pillow) visible in the job and fails loudly if unmet.
      - name: Bake ereader_shelf library (Git-LFS epubs + Pillow)
        run: |
          # --force overwrites any stale LFS hook the reused runner workspace
          # left behind (the reason lfs:true at checkout aborted with exit 2).
          git lfs install --local --force
          git lfs pull
          # Pillow via a PEP 668-safe venv (mirrors the firmware.yml lint-tool
          # setup): a plain `pip install --user` aborts with
          # externally-managed-environment on the newer runner images. Fall
          # back to --user --break-system-packages where python3-venv is
          # missing. The venv bin dir is exported for the SIL step below,
          # whose sil_all.sh re-bakes books on demand and needs the same
          # Pillow.
          # Pillow is PINNED: the ereader_shelf golden framebuffer hash
          # (fb=FA3AB5B5 in its hil.conf) covers the SHELF RENDER of the baked
          # cover thumbnails, and Pillow's decode/resample bytes vary across
          # releases -- an unpinned 'latest' bake produced a different fb hash
          # and failed the gate. 12.2.0 is the version that baked the golden
          # (same pinning policy as clang-format-22 / arm-gcc 13.3).
          if python3 -m venv "$RUNNER_TEMP/bakeenv" 2>/dev/null \
             && "$RUNNER_TEMP/bakeenv/bin/pip" install --quiet Pillow==12.2.0; then
            echo "$RUNNER_TEMP/bakeenv/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/bakeenv/bin:$PATH"
          else
            echo "venv unavailable; installing Pillow via pip --user --break-system-packages"
            python3 -m pip install --quiet --user --break-system-packages Pillow==12.2.0
          fi
          bash scripts/build_books.sh --shelf-only

      - name: Pin arm-none-eabi-gcc 13.3 on PATH
        run: |
          if [ -x /opt/arm-gnu-toolchain-13.3/bin/arm-none-eabi-gcc ]; then
            echo "/opt/arm-gnu-toolchain-13.3/bin" >> "$GITHUB_PATH"
          fi

      - name: SIL integration (board_sim, parallel over all hil apps)
        run: bash scripts/sil_all.sh -j "$(nproc)"

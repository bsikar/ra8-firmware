name: board-sim-smoke

# board_sim (tools/board_sim) is the Unicorn-based RA8D2 board emulator: it boots
# the real cross-compiled firmware .elf on an emulated Cortex-M with the RA8D2
# peripheral space modelled. This gate builds it headless on the Linux runner and
# boots known-good example images, asserting each reaches its main loop without
# faulting (no invalid opcode / unmapped access) and is not parked in a
# panic/fault halt -- guarding the emulator, the GLCDC bring-up path, and the
# modelled peripheral blocks (GPIO / SCI UART / GPT+ICU IRQ / USB CDC).
#
# board_sim needs Unicorn + Capstone. The self-hosted runner has passwordless
# sudo + apt but no pkg-config, so this installs the system -dev packages (a
# no-op once present) and the build finds them with CMake's find_library (off the
# APPLE path -- no pkg-config required). The live --view window is macOS-only
# (Cocoa); this gate is headless, which board_sim supports via board_view_stub.c.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  board-sim-smoke:
    name: board_sim boot smoke
    runs-on: [self-hosted, Linux, X64]
    # Two board_sim_smoke.sh passes (boot smoke over every app + the ra_io
    # fabric gate) plus the emulator build. Now that ~100 example apps link the
    # ra_board_ek_ra8d2 BSP, the per-app build is a touch heavier and the job
    # sat right at the old 20 min ceiling -- a slower runner got cancelled at
    # the last ra_io demo. 30 min gives headroom without masking a real hang
    # (each board_sim run is still bounded by BOARD_SIM_WALL_S / MAX_CHUNKS).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Idempotent: skip apt entirely once the libraries are present on this
      # long-lived runner, so only the first run pays the install cost.
      - name: Install Unicorn + Capstone
        run: |
          if ! ldconfig -p | grep -q 'libunicorn'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libunicorn-dev libcapstone-dev
          fi

      # #178: build the emulated firmware with the SAME pinned Arm GNU Toolchain
      # 13.3 the release cross-build uses (the runner provisions
      # /opt/arm-gnu-toolchain-13.3), so board_sim exercises release-identical
      # codegen. cmake/toolchain-ra8d2.cmake also HINTS this path and now asserts
      # 13.3 fatally by default; putting it on PATH keeps board_sim consistent
      # with the build-cross job.
      - name: Pin arm-none-eabi-gcc 13.3 on PATH
        run: |
          if [ -x /opt/arm-gnu-toolchain-13.3/bin/arm-none-eabi-gcc ]; then
            echo "/opt/arm-gnu-toolchain-13.3/bin" >> "$GITHUB_PATH"
          fi

      - name: board_sim boot smoke
        run: bash scripts/board_sim_smoke.sh

      # ra_io fabric (#155) end-to-end gate: every storage backend driven through
      # the same VFS API (block device -> ra_fs FAT format/mount -> VFS mkdir +
      # nested file round-trip), plus the format registry, the LRU sector cache,
      # and the DEFLATE stream, asserted by each demo's PASS banner. Covers
      # RAM/SRAM, external SDRAM, SD-over-SPI, native SDHI, OSPI NOR
      # (erase-before-write), and on-chip MRAM (program/erase).
      - name: ra_io fabric board_sim gate (#155-#161)
        run: |
          bash scripts/board_sim_smoke.sh \
            ra_io_demo ra_io_sdram_demo ra_io_compress_demo \
            ra_io_sd_demo ra_io_sdhi_demo ra_io_xspi_demo ra_io_mram_demo \
            ra_io_fsfmt_demo ra_io_cache_demo

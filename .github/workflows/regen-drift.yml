---
name: regen-drift gate

# Runs the byte-identical regeneration gate on Ubuntu 24.04 using the locked
# Python environment (.venv via uv.lock), zig 0.17.0, and clang-format-22.
on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  regen-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install zig 0.17.0
        run: |
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Locked Python environment
        run: /bin/bash -p scripts/dev/setup_python.sh

      - name: Install clang-format 22 (parity byte-identity)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-format-22

      - name: Drift gate
        run: bash scripts/checks/check_regen_drift.sh

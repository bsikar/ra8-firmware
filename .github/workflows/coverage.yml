# SCHEDULING ONLY -- the gate body lives in scripts/ci.sh (gate:
# coverage-report). See .github/workflows/firmware.yml for the design note.
#
# This workflow is separate from firmware.yml and has been missed by a "local
# green" run before, which is exactly why the ci-parity gate walks EVERY
# workflow file rather than firmware.yml alone.
---
name: coverage

on:
  push:
    branches: [main, dev]
  # PRs targeting dev run the same coverage gate as PRs targeting main (#357).
  # dev is the working branch, so the review path must exercise the same
  # branch-health gates it does for main -- coverage was previously only
  # checked on a PR to main or post-merge on dev.
  pull_request:
    branches: [main, dev]

# Per-commit isolation on push (#366): identical rationale to firmware.yml. Key
# the group on the commit SHA for push events so a burst of dev pushes never
# cancels an in-flight coverage run -- a cancelled run reads as skipped-not-
# failed and would otherwise sit green next to a real result on branch health.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Statement + branch coverage gate (gcc + gcovr).
  #
  # The plain coverage flow described in docs/COVERAGE.md. Runs in parallel with
  # the MC/DC pipeline (firmware.yml -> mcdc job) and produces an independent
  # ratchetable baseline against .github/coverage-baseline.txt.
  # ---------------------------------------------------------------------------
  coverage:
    name: Statement + branch coverage
    runs-on: ra8-ci
    # SECURITY: self-hosted + pull_request trigger. Run on push / dispatch and
    # on PRs ONLY from this same repo (never a fork). See SECURITY.md.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install build + coverage toolchain
        run: |
          # ci-parity: infra -- runner package provisioning only; runs no
          # project check. The coverage-report gate hard-fails when gcovr is
          # still absent afterwards, so a failed install can never look green.
          #
          # Probe first, apt only for what is genuinely absent. ra8-ci is an
          # ephemeral pod booted from the devcontainer image: it already carries
          # this entire toolchain, and its runner user has NO passwordless sudo,
          # so an unconditional `sudo apt-get` dies on "sudo: a password is
          # required" before the gate ever runs. The probe makes this step a
          # no-op on the pod and still self-heals a bare host runner. Same shape
          # as the tidy job's dependency provisioning in firmware.yml.
          set -euo pipefail
          missing=""
          command -v make >/dev/null 2>&1 || missing="$missing build-essential"
          command -v cmake >/dev/null 2>&1 || missing="$missing cmake"
          command -v gcc >/dev/null 2>&1 || missing="$missing gcc"
          command -v g++ >/dev/null 2>&1 || missing="$missing g++"
          command -v gcovr >/dev/null 2>&1 || missing="$missing gcovr"
          command -v python3 >/dev/null 2>&1 || missing="$missing python3"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y --no-install-recommends $missing
          else
            echo "build + coverage toolchain already present -- nothing to install"
          fi

      - run: bash scripts/ci.sh --gate coverage-report

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cobertura XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: build/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 30

# SCHEDULING ONLY -- the body lives in scripts/ci.sh (gate: docs-publish).
# See .github/workflows/firmware.yml for the design note.
#
# Build the Doxygen HTML and publish it to the gh-pages branch on every push
# to main (and on manual dispatch). Generated HTML is never committed to a
# source branch: the orphan gh-pages branch is force-updated with a single
# fresh commit each run, so it never accumulates generated-HTML history.
#
# `make docs` builds with the project-pinned doxygen release, never the distro
# one -- the in-tree HTML templates and theme are only valid for that exact
# version. scripts/builders/provision_doxygen.sh resolves it from the pod's
# persistent pinned-tool cache (the /var/cache/ra8-tools hostPath mount, #486),
# and downloads it sha256-verified on a cold cache. An ARC pod is ephemeral --
# one pod per job -- so that mount, not the workspace, is what makes the
# second run offline. graphviz is REQUIRED, not optional: build_docs.sh falls
# back to text-only output when `dot` is absent, which would publish a
# diagram-free site over the live one. It is already in the runner image
# (.devcontainer/Dockerfile), so the provisioning step below probes and
# no-ops; the docs-publish gate then hard-requires `dot` and verifies the
# built tree actually contains its diagrams before pushing.
#
# One-time repo setup (owner): Settings -> Pages -> Build and deployment ->
# Source = "Deploy from a branch", Branch = gh-pages / (root).
---
name: docs-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# The publish step force-pushes to the gh-pages branch.
permissions:
  contents: write

# Never let two publishes race the gh-pages force-push.
concurrency:
  group: docs-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build + publish Doxygen HTML
    runs-on: ra8-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install graphviz
        run: |
          # ci-parity: infra -- runner package provisioning only; runs no
          # project check. Without graphviz the published site silently loses
          # every authored diagram.
          #
          # Probe first, apt only if genuinely absent. ra8-ci is an ephemeral
          # pod booted from the devcontainer image, which already carries
          # graphviz, and the pod's runner user has NO passwordless sudo -- so
          # an unconditional `sudo apt-get` would die on "sudo: a password is
          # required". The probe no-ops on the pod and still provisions a bare
          # host runner.
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci.sh --gate docs-publish

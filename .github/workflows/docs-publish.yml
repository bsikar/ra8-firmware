# SCHEDULING ONLY -- the body lives in scripts/ci.sh (gate: docs-publish).
# See .github/workflows/firmware.yml for the design note.
#
# Build the Doxygen HTML and publish it to the gh-pages branch on every push
# to main (and on manual dispatch). Generated HTML is never committed to a
# source branch: the orphan gh-pages branch is force-updated with a single
# fresh commit each run, so it never accumulates generated-HTML history.
#
# `make docs` builds with the project-pinned doxygen release: on first use
# scripts/utils/provision_doxygen.sh downloads the official binary (sha256
# verified) into build/tools/, which persists in the self-hosted runner's
# workspace, so later runs are offline. The runner's distro doxygen is never
# used -- the in-tree HTML templates and theme are only valid for the pinned
# version. graphviz is optional -- build_docs.sh falls back to text-only
# output when `dot` is absent.
#
# One-time repo setup (owner): Settings -> Pages -> Build and deployment ->
# Source = "Deploy from a branch", Branch = gh-pages / (root).
name: docs-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# The publish step force-pushes to the gh-pages branch.
permissions:
  contents: write

# Never let two publishes race the gh-pages force-push.
concurrency:
  group: docs-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build + publish Doxygen HTML
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Install graphviz
        run: |
          # ci-parity: infra -- runner package provisioning only; runs no
          # project check. Idempotent on this long-lived runner. Without
          # graphviz the published site silently loses every @dot diagram.
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci.sh --gate docs-publish

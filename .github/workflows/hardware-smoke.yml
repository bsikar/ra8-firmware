name: hardware-smoke

# Superseded by .github/workflows/hil.yml.
#
# hil.yml runs on the Pi 5 self-hosted runner (pi5-star-hil, labels:
# [self-hosted, hil, pi5, ra8d2]) which has the EK-RA8D2 board wired to
# it.  That workflow handles the HIL gate for uart_hello today and is the
# template for adding further apps.
#
# This file is kept so external references to the old name do not 404.
# It does nothing -- all real gate logic lives in hil.yml.

on:
  workflow_dispatch:

jobs:
  redirect:
    name: "Superseded by hil.yml -- nothing to do here"
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Notice
        run: |
          echo "Hardware-in-the-loop CI is now in .github/workflows/hil.yml."
          echo "This workflow is a tombstone kept for link-compatibility only."

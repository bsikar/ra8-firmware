name: ui-render

# Resolution-adaptive bedroom UI gate. The shared GUIX UI
# (examples/shared/bedroom_ui) was made to fit any panel size; this workflow
# guards that. It builds tools/simulator headless (no Cocoa -- the simulator's
# CMake links the no-op window shim off the APPLE path) and runs
# scripts/ui_render_check.sh, which renders every panel descriptor and tab to a
# PPM and asserts the frame fills the panel: a non-trivial distinct-color count
# plus content in all four quadrants. That quadrant check is what catches a
# regression back to the old top-left clipping.
#
# Unlike examples/host/* (macOS-only dev tools, skipped by the firmware
# workflow), the simulator builds headless on Linux, so this gate runs on the
# self-hosted Linux runner. The cross/host build deps + cmake are already on
# the runner; the GUIX core and host display PAL sources are in-tree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bound the GUIX core build (hundreds of TUs) the same way the firmware
  # workflow does; the gate script also passes an explicit -j as a fallback.
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ui-render:
    name: Bedroom UI render gate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Render the bedroom UI at every panel size and assert it fills
        run: bash scripts/ui_render_check.sh

# SCHEDULING ONLY -- the gate bodies live in scripts/ci.sh.
#
# Every step below is a thin `bash scripts/ci.sh --gate <name>` driver. This
# file decides WHICH gates run, on WHICH runner, and in parallel with WHAT; it
# never decides what a gate DOES. That inversion is why "local green, CI red"
# cannot happen any more: a developer running `bash scripts/ci.sh --native`
# executes the exact same functions these jobs execute.
#
# Adding a check here as a raw `run:` block would re-create the drift this
# design removed, so scripts/ci/check_ci_parity.py (the `ci-parity` gate)
# rejects any step that is neither a registered gate nor tagged
# `# ci-parity: infra -- <reason>`. Infra steps may not invoke project checks.
#
# SECURITY (public-repo hardening): every job below runs on SELF-HOSTED
# runners and this workflow triggers on `pull_request`. To stop a fork PR
# from executing untrusted code on the owner's runners, every job carries:
#
#   if: github.event_name != 'pull_request'
#       || github.event.pull_request.head.repo.full_name == github.repository
#
# so a job runs on push / schedule / workflow_dispatch, and on PRs ONLY when
# the PR head branch lives in THIS repo (a collaborator branch, never a fork).
# Fork PRs skip every self-hosted job -- untrusted code never reaches the
# runner, independent of any approval setting. Do NOT add `pull_request_target`
# with a checkout of PR head code; that would re-open the hole with secrets in
# scope. Workflow files alone cannot fully close this: see SECURITY.md for the
# GitHub UI / runner-group / ephemeral-VM settings the owner MUST also set
# before making the repo public.
---
name: firmware

on:
  push:
    branches: [main, dev]
  # PRs targeting dev run the same gate set as PRs targeting main (#357). dev
  # is this repo's working branch, so the review path -- not just post-merge --
  # must exercise every gate that decides branch health. A PR to dev was
  # previously blind to copyright, format, tidy, cppcheck, misra, ci-parity,
  # pre-commit-checks, unit-tests and all the lint-* gates.
  pull_request:
    branches: [main, dev]

# Per-commit isolation on push (#366). Keying the group on the commit SHA for
# push events means a burst of dev pushes never cancels an in-flight run:
# every landed commit gets its own complete gate run, so a cancelled run can
# no longer masquerade as a passing one when judging branch health, and each
# commit is individually validated (bisectability). PR and dispatch events
# still key on the ref, so a fresh push to a PR cancels its now-superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MCDC_BASELINE_FILE: .github/mcdc-baseline.txt
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # The parity guard runs first and cheapest: if the workflows and the gate
  # registry have drifted apart, every other job's result is suspect.
  # ---------------------------------------------------------------------------
  ci-parity:
    name: CI parity (workflows <-> ci.sh)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PyYAML is available
        run: |
          # ci-parity: infra -- provisions the YAML parser the parity gate reads
          # the workflows with; runs no project check. The gate probes the
          # import and FAILS when it is still missing, so a runner without
          # PyYAML can never make the guard silently pass.
          set -euo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --user --break-system-packages --quiet pyyaml \
              || python3 -m pip install --user --quiet pyyaml
          fi
      - run: bash scripts/ci.sh --gate ci-parity

  ascii:
    name: ASCII-only source files
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate ascii

  copyright:
    name: Copyright header check
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate copyright

  since:
    name: Doxygen @since tags
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate since

  # ---------------------------------------------------------------------------
  # SIM==HIL parity -- every HIL app is also exercised in the simulator (SIL).
  # Cheap, hardware-free structural gate; guarantees an added HIL app cannot
  # escape SIM coverage.
  # ---------------------------------------------------------------------------
  hil-sil-parity:
    name: SIM==HIL parity
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate hil-sil-parity

  format:
    name: clang-format check
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate format

  # ---------------------------------------------------------------------------
  # clang-tidy over EVERY first-party root: libs/, src/, examples/*/*/main.c,
  # tests/ and tools/ (#296). Only vendored SOUP (libs/third_party/) and the
  # generated font data (libs/fonts/) are exempt. scripts/checks/clang_tidy.sh owns
  # the scope and hard-fails if any of those roots collects zero files, so a
  # future narrowing cannot silently shrink what this job checks.
  #
  # The tools/ pass needs the Unicorn + Capstone headers that tools/board_sim
  # includes (libunicorn-dev + libcapstone-dev on the runner, and in
  # .devcontainer/Dockerfile for `make ci`).
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # ci-parity: infra -- installs clang-tidy TU dependencies; runs no project check.
      # The tools/ pass needs the headers tools/board_sim (Unicorn, Capstone) and
      # tools/media_dl (libcurl) include. A MISSING header does not fail loudly --
      # clang-tidy reports clang-diagnostic-error for that TU and never lints it,
      # which is the same silent hole #296 closed. Install them here rather than
      # assuming runner state. Idempotent: the probes skip apt once present.
      - name: Install clang-tidy tool dependencies
        run: |
          # ci-parity: infra -- installs headers; runs no project check
          missing=""
          [ -f /usr/include/unicorn/unicorn.h ] || missing="$missing libunicorn-dev"
          [ -f /usr/include/capstone/capstone.h ] || missing="$missing libcapstone-dev"
          pkg-config --exists libcurl || missing="$missing libcurl4-openssl-dev"
          if [ -n "$missing" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y --no-install-recommends $missing
          fi

      - run: bash scripts/ci.sh --gate tidy

  # ---------------------------------------------------------------------------
  # NSC veneers must stay -mcmse-clean so the TrustZone HIL path keeps building
  # (#54). No app links the comms/eth veneers yet, so only this gate would catch
  # an over-4-arg cmse_nonsecure_entry veneer regression.
  # ---------------------------------------------------------------------------
  nsc-cmse:
    name: NSC veneers (-mcmse)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate nsc-cmse

  unit-tests:
    name: Unit tests (host)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate unit-tests

  # ---------------------------------------------------------------------------
  # UBSan gate (#239) -- the whole host suite rebuilt under
  # -fsanitize=undefined in its own tree, with UBSAN_OPTIONS=halt_on_error=1 so
  # any undefined behaviour is a hard test failure. This was a local-only tool
  # while ~8 tests injected register events via a SIGALRM/setitimer wall-clock
  # race that flaked under sanitizer slowdown; the injection now goes through
  # the deterministic ra8_sim_mmio poll-hook, so the suite is load-stable and
  # the gate can block PRs.
  # ---------------------------------------------------------------------------
  ubsan:
    name: UBSan (host tests)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate ubsan

  # ---------------------------------------------------------------------------
  # #147/#160 cache-benchmark toolchain -- #160's "cache_bench builds in CI"
  # gate, re-confirming SLRU on the captured reader trace on every push.
  # ---------------------------------------------------------------------------
  cache-bench:
    name: Cache benchmarks (#147/#160)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate cache-bench

  # ---------------------------------------------------------------------------
  # #335/#309 host-tool build gate -- media_dl, ra8_viewer, ra8_fmt, mkbookimg
  # and mkfontimg were linted but never compiled or linked by any job, and
  # media_dl could not build on Linux at all. This job builds and links all
  # five, runs media_dl's CTest suite, drives the viewer's headless render, and
  # enforces -Wall -Wextra -Werror on every first-party TU they pull in.
  #
  # #356: the build runs under BOTH pinned compilers, clang-18 AND gcc-14, so
  # the warning families each catches but the other misses are both held --
  # gcc-14's -Wformat-truncation caught a silent path-join truncation clang-18
  # did not. Both arms must be present (self-hosted runners provision gcc-14,
  # the devcontainer installs it); a missing arm fails loudly, never skips.
  # ---------------------------------------------------------------------------
  tools-build:
    name: Host tools (build + link + test, clang-18 + gcc-14)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ci-parity: infra -- installs the second-arm compiler; runs no project check.
      # The gate compiles the host tools under clang-18 AND gcc-14 (#356). gcc-14
      # is the one dep not already on a generic runner; install it here rather
      # than assuming runner state, the same way the tidy job provisions its
      # headers. Idempotent: the probe skips apt once gcc-14 is present. The gate
      # still require_cmd/require_tool_versions it, so a failed install fails loud.
      - name: Install the gcc-14 warning arm
        run: |
          # ci-parity: infra -- installs gcc-14; runs no project check
          command -v gcc-14 >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-14
          }

      - run: bash scripts/ci.sh --gate tools-build

  coverage:
    name: Coverage (gcovr 90/80)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gcovr on PATH
        run: |
          # ci-parity: infra -- runner PATH plumbing for a pip --user install of
          # gcovr; runs no project check. The gate hard-fails when gcovr is
          # still missing after this, so it can never silently skip.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci.sh --gate coverage
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # MC/DC report (clang-18 source-based coverage with -fcoverage-mcdc), gated
  # against .github/mcdc-baseline.txt -- never let coverage regress.
  # ---------------------------------------------------------------------------
  mcdc:
    name: MC/DC coverage gate
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate mcdc
      # Freshness of the committed MC/DC + doxygen gap docs (#380). Runs in THIS
      # job because it reuses the mcdc step's build/mcdc-report/mcdc.txt instead
      # of re-running the coverage build; the checker fails loudly if that report
      # is absent, so it can never silently pass out of this job's context.
      - run: bash scripts/ci.sh --gate artefact-freshness
      - name: Upload MC/DC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcdc-report
          path: build/mcdc-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Pre-commit gate suite -- mirrors scripts/git/pre-commit so PRs surface what
  # the local hook would have caught. Grouped into one job because each of
  # these gates is seconds long: a job apiece would cost more in runner
  # scheduling than in checking.
  # ---------------------------------------------------------------------------
  pre-commit-checks:
    name: Pre-commit gate suite
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/ci.sh --gate pre-commit-checks
      - name: Install libclang for the annotation gate
        run: |
          # ci-parity: infra -- installs the libclang Python binding the
          # annotation gate needs; runs no project check itself. The gate probes
          # the import and FAILS when it is absent, because check_annotations.py
          # exits 0 with no binding and would otherwise pass silently.
          set -euo pipefail
          if python3 -m venv "$RUNNER_TEMP/clangenv" 2>/dev/null \
             && "$RUNNER_TEMP/clangenv/bin/pip" install --quiet libclang==18.1.1; then
            echo "$RUNNER_TEMP/clangenv/bin" >> "$GITHUB_PATH"
          else
            echo "venv unavailable; installing libclang via pip --user --break-system-packages"
            python3 -m pip install --user --break-system-packages --quiet libclang==18.1.1
          fi
      - run: bash scripts/ci.sh --gate annotations
      - run: bash scripts/ci.sh --gate doc-attachment
      - name: Install ruff, shellcheck and shfmt
        run: |
          # ci-parity: infra -- provisions pinned lint binaries on the runner;
          # runs no project check. The lint-py-shell gate passes --require so a
          # still-missing tool fails the gate instead of skipping it.
          set -euo pipefail
          # ruff in an isolated venv (PEP 668-safe across runner images). Some
          # self-hosted runners lack python3-venv; fall back to --user.
          if python3 -m venv "$RUNNER_TEMP/lintenv" 2>/dev/null \
             && "$RUNNER_TEMP/lintenv/bin/pip" install --quiet ruff==0.15.19; then
            echo "$RUNNER_TEMP/lintenv/bin" >> "$GITHUB_PATH"
          else
            echo "venv unavailable; installing ruff via pip --user --break-system-packages"
            python3 -m pip install --user --break-system-packages --quiet ruff==0.15.19
            echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          fi
          # pinned static binaries for the X64 runner (no sudo, no apt)
          mkdir -p "$RUNNER_TEMP/lintbin"
          sc_url=https://github.com/koalaman/shellcheck/releases/download
          sc_tar=shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSL "$sc_url/v0.11.0/$sc_tar" \
            | tar -xJ -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/lintbin/"
          curl -fsSL -o "$RUNNER_TEMP/lintbin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x "$RUNNER_TEMP/lintbin/shfmt"
          echo "$RUNNER_TEMP/lintbin" >> "$GITHUB_PATH"
      - run: bash scripts/ci.sh --gate lint-py-shell
      - name: Install the config-as-code linters
        run: |
          # ci-parity: infra -- provisions pinned cmake-format / cmake-lint /
          # yamllint / actionlint on the runner; runs no project check. The
          # lint-cmake and lint-yaml gates call require_cmd, so a tool still
          # missing after this FAILS the gate rather than skipping it.
          set -euo pipefail
          if python3 -m venv "$RUNNER_TEMP/cfgenv" 2>/dev/null \
             && "$RUNNER_TEMP/cfgenv/bin/pip" install --quiet \
                  cmakelang==0.6.13 yamllint==1.37.1; then
            echo "$RUNNER_TEMP/cfgenv/bin" >> "$GITHUB_PATH"
          else
            echo "venv unavailable; installing via pip --user --break-system-packages"
            python3 -m pip install --user --break-system-packages --quiet \
              cmakelang==0.6.13 yamllint==1.37.1
            echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p "$RUNNER_TEMP/cfgbin"
          al_url=https://github.com/rhysd/actionlint/releases/download
          al_tar=actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSL "$al_url/v1.7.7/$al_tar" \
            | tar -xz -C "$RUNNER_TEMP/cfgbin" actionlint
          chmod +x "$RUNNER_TEMP/cfgbin/actionlint"
          echo "$RUNNER_TEMP/cfgbin" >> "$GITHUB_PATH"
      - run: bash scripts/ci.sh --gate lint-cmake
      - run: bash scripts/ci.sh --gate lint-yaml
      - run: bash scripts/ci.sh --gate lint-make
      - run: bash scripts/ci.sh --gate lint-ld
      - run: bash scripts/ci.sh --gate lint-asm
      - name: Install hadolint and zsh
        run: |
          # ci-parity: infra -- provisions the pinned hadolint binary and zsh
          # on the runner; runs no project check. The lint-devcontainer gate
          # calls require_cmd for both, so a still-missing tool FAILS the gate
          # rather than skipping it.
          #
          # zsh is NOT preinstalled: this step used to assert it was, and the
          # gate went red the moment anything upstream of it stopped failing
          # first. The gate needs `zsh -n` to syntax-check the devcontainer
          # zshrc, which is the only real option -- ShellCheck refuses zsh.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
          mkdir -p "$RUNNER_TEMP/dockerbin"
          curl -fsSL -o "$RUNNER_TEMP/dockerbin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x "$RUNNER_TEMP/dockerbin/hadolint"
          echo "$RUNNER_TEMP/dockerbin" >> "$GITHUB_PATH"
      - run: bash scripts/ci.sh --gate lint-devcontainer
      # Runs after every other lint gate in this job: it asks each of them what
      # they scan and proves nothing in the tree falls between them.
      - run: bash scripts/ci.sh --gate lint-coverage
      - run: bash scripts/ci.sh --gate cite-check
      - run: bash scripts/ci.sh --gate sbom
      - run: bash scripts/ci.sh --gate roadmap-stats

  # ---------------------------------------------------------------------------
  # Cross-compile all examples, then the two gates that read the build output.
  # They share a job because sg-offsets needs the linked secure ELF and
  # stack-usage needs the per-object .su files -- both artefacts of the build
  # above, which a separate runner would not have.
  # ---------------------------------------------------------------------------
  build-cross:
    name: Cross-build all apps
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate build-cross
      - run: bash scripts/ci.sh --gate sg-offsets
      - run: bash scripts/ci.sh --gate stack-usage

  docs:
    name: Doxygen warnings
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install graphviz
        run: |
          # ci-parity: infra -- runner package provisioning only; runs no
          # project check. Idempotent: skip apt entirely once `dot` is present
          # on this long-lived runner. The docs gate hard-requires graphviz,
          # because without it doxygen silently drops every authored diagram
          # instead of rendering it.
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi
      - run: bash scripts/ci.sh --gate docs

  # ---------------------------------------------------------------------------
  # MISRA-C 2012 ratchet (#240). The baseline records the cppcheck version it
  # was generated with -- keep the runner's cppcheck in step with it, and
  # regenerate via `make misra-baseline` (never to absorb new findings; see
  # docs/MISRA.md).
  # ---------------------------------------------------------------------------
  misra:
    name: MISRA-C 2012 ratchet
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate misra

  cppcheck:
    name: cppcheck
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh --gate cppcheck

  # ---------------------------------------------------------------------------
  # PR-only: post a per-file MC/DC delta comment vs the base branch.
  # Limited to the first 50 rows so the comment stays readable.
  # ---------------------------------------------------------------------------
  coverage-comment:
    name: MC/DC delta comment
    runs-on: [self-hosted, Linux, X64]
    needs: mcdc
    # PR-only job, and self-hosted: also require the PR head to live in THIS
    # repo so a fork PR can never reach the runner (defence in depth -- `needs:
    # mcdc` already skips it when the guarded mcdc job is skipped on a fork PR).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download PR MC/DC report
        uses: actions/download-artifact@v4
        with:
          name: mcdc-report
          path: pr-mcdc
      - name: Build base-branch MC/DC report (best-effort)
        env:
          RA8_MCDC_BASE_REF: ${{ github.event.pull_request.base.ref }}
        continue-on-error: true
        run: bash scripts/ci.sh --gate mcdc-delta-base
      - name: Render delta comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function loadSummary(path) {
              if (!fs.existsSync(path)) return new Map();
              const m = new Map();
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              for (const line of lines) {
                // A typical llvm-cov report row looks like:
                //   path/to/file.c   1   2   50.00%   3   4   75.00%   ...   12.34%
                // We take the first whitespace-delimited token as the
                // file path and the last %-suffixed token as MC/DC %.
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('---') ||
                    trimmed.startsWith('Filename') ||
                    trimmed.startsWith('TOTAL')) continue;
                const cols = trimmed.split(/\s+/);
                if (cols.length < 2) continue;
                const pcts = cols.filter(c => /^[0-9]+(\.[0-9]+)?%$/.test(c));
                if (!pcts.length) continue;
                const file = cols[0];
                const pct = parseFloat(pcts[pcts.length - 1]);
                m.set(file, pct);
              }
              return m;
            }
            const pr = loadSummary('pr-mcdc/summary.txt');
            const base = loadSummary('base-summary.txt');
            const files = new Set([...pr.keys(), ...base.keys()]);
            const rows = [];
            for (const f of files) {
              const a = base.has(f) ? base.get(f) : null;
              const b = pr.has(f) ? pr.get(f) : null;
              const delta = (a !== null && b !== null) ? (b - a) : null;
              rows.push({ file: f, base: a, pr: b, delta });
            }
            rows.sort((x, y) => {
              const dx = x.delta === null ? -Infinity : x.delta;
              const dy = y.delta === null ? -Infinity : y.delta;
              return dx - dy;
            });
            const top = rows.slice(0, 50);
            const fmt = v => v === null ? "n/a" : v.toFixed(2) + "%";
            const sign = v => v === null ? "" : (v > 0 ? "+" : "");
            let body = "## MC/DC delta (PR vs base)\n\n";
            body += "Showing up to 50 files sorted by delta (regressions first).\n\n";
            body += "| file | base | PR | delta |\n|---|---|---|---|\n";
            for (const r of top) {
              const delta = `${sign(r.delta)}${fmt(r.delta)}`;
              body +=
                `| \`${r.file}\` | ${fmt(r.base)} | ${fmt(r.pr)} | ${delta} |\n`;
            }
            if (!top.length) {
              body += "| _no rows_ | | | |\n";
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- mcdc-delta-comment -->";
            body = marker + "\n" + body;
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.data.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

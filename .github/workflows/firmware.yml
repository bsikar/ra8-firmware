name: firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ---------------------------------------------------------------------------
  # ASCII-only check
  # ---------------------------------------------------------------------------
  ascii:
    name: ASCII-only source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: python3 scripts/utils/fix-encoding.py --check src libs tests

  # ---------------------------------------------------------------------------
  # Copyright header check
  # ---------------------------------------------------------------------------
  copyright:
    name: Copyright header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -e
          files=$(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.cmake' '*.sh' '*.py' 'CMakeLists.txt')
          python3 scripts/utils/check-copyright.py $files

  # ---------------------------------------------------------------------------
  # clang-format (dry-run, Werror)
  # ---------------------------------------------------------------------------
  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run format check
        run: bash scripts/format_code.sh --check --verbose

  # ---------------------------------------------------------------------------
  # clang-tidy on the host compile_commands.json
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build gcc
      - name: Run clang-tidy
        run: bash scripts/clang_tidy.sh --check --verbose

  # ---------------------------------------------------------------------------
  # Host unit tests (ctest)
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc
      - name: Configure
        run: |
          cmake -B build/tidy -S tests \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Wno-dev -G Ninja
      - name: Build
        run: cmake --build build/tidy
      - name: Run ctest
        run: ctest --test-dir build/tidy --output-on-failure

  # ---------------------------------------------------------------------------
  # cppcheck static analysis
  # ---------------------------------------------------------------------------
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --suppressions-list=.cppcheck-suppressions \
                   --inline-suppr \
                   --std=c23 \
                   src libs

  # ---------------------------------------------------------------------------
  # Cross-compile with arm-none-eabi-gcc
  # ---------------------------------------------------------------------------
  build:
    name: Cross-build (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi \
                                   cmake ninja-build
      - name: Print toolchain version
        run: arm-none-eabi-gcc --version | head -1
      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-ra8d2.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja
      - name: Build
        run: cmake --build build --verbose
        continue-on-error: true  # drop once the blink main actually links

  # ---------------------------------------------------------------------------
  # Doxygen warning gate
  # ---------------------------------------------------------------------------
  docs:
    name: Doxygen warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Run doxygen
        run: doxygen Doxyfile.main 2>&1 | tee doxygen.log
      - name: Fail on warnings
        run: |
          if grep -q "warning:" doxygen.log; then
            echo "Doxygen reported warnings:"
            grep "warning:" doxygen.log
            exit 0   # TODO: flip to exit 1 once @since pass is complete
          fi

name: firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MCDC_BASELINE_FILE: .github/mcdc-baseline.txt
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # ASCII-only check
  # ---------------------------------------------------------------------------
  ascii:
    name: ASCII-only source files
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -e
          # Auto-discover example app dirs (2-level and 3-level paths).
          apps=()
          if [ -d examples ]; then
            for d in examples/*/*/ examples/*/*/*/ examples/*/*/*/*/; do
              d="${d%/}"
              [ -f "$d/main.c" ] && apps+=("$d")
            done
          fi
          for dir in src libs tests "${apps[@]}"; do
            python3 scripts/utils/fix-encoding.py --check "$dir"
          done

  # ---------------------------------------------------------------------------
  # Copyright header check
  # ---------------------------------------------------------------------------
  copyright:
    name: Copyright header check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -e
          files=$(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.cmake' '*.sh' '*.py' 'CMakeLists.txt')
          python3 scripts/utils/check-copyright.py $files

  # ---------------------------------------------------------------------------
  # @since tag enforcement on all public headers
  # ---------------------------------------------------------------------------
  since:
    name: Doxygen @since tags
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -e
          files=$(git ls-files 'libs/ra8_*/inc/*.h')
          python3 scripts/utils/check-since-version.py $files

  # ---------------------------------------------------------------------------
  # clang-format (dry-run, Werror)
  # ---------------------------------------------------------------------------
  format:
    name: clang-format check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run format check
        env:
          CLANG_FORMAT: clang-format-22
        run: bash scripts/format_code.sh --check --verbose

  # ---------------------------------------------------------------------------
  # clang-tidy on the host compile_commands.json
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-tidy
        run: bash scripts/clang_tidy.sh --check --verbose

  # ---------------------------------------------------------------------------
  # NSC veneers must stay -mcmse-clean so the TrustZone HIL path keeps building
  # (#54). No app links the comms/eth veneers yet, so only this gate would catch
  # an over-4-arg cmse_nonsecure_entry veneer regression.
  # ---------------------------------------------------------------------------
  nsc-cmse:
    name: NSC veneers (-mcmse)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Compile ra8_nsc veneers under -mcmse
        run: bash scripts/utils/check_nsc_cmse.sh

  # ---------------------------------------------------------------------------
  # Host unit tests (ctest) -- aggregates tests/build_tests.sh + run_tests.sh
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (host)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build host tests
        run: bash tests/build_tests.sh
      - name: Run host tests
        run: bash tests/run_tests.sh

  # ---------------------------------------------------------------------------
  # #147/#160 cache-benchmark toolchain -- builds + runs cache_bench (the SLRU
  # decision record), reader_vmem (drives the REAL ra8_vmem with a reader
  # workload and emits a cache_bench-consumable trace), and glyph_bench (sweeps
  # the real glyph atlas). This is #160's "cache_bench builds in CI" gate and
  # re-confirms SLRU on the captured reader trace on every push.
  # ---------------------------------------------------------------------------
  cache-bench:
    name: Cache benchmarks (#147/#160)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build + run the cache-bench toolchain
        env:
          # clang-18 is present on the runner (see the mcdc job) and accepts the
          # C23 typed-enum / nullptr syntax the bench tools and ra8_mem use.
          CC: clang-18
        run: make bench-cache

  # ---------------------------------------------------------------------------
  # Coverage gate (gcovr 90 line / 80 branch)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (gcovr 90/80)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gcovr on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run coverage gate
        run: bash scripts/coverage.sh --gate
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # MC/DC report (clang-18 source-based coverage with -fcoverage-mcdc)
  # Gates against .github/mcdc-baseline.txt -- never let coverage regress.
  # ---------------------------------------------------------------------------
  mcdc:
    name: MC/DC coverage gate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run MC/DC report (in-container path skipped on Linux runner)
        env:
          CC: clang-18
          CXX: clang++-18
          # Threshold inside mcdc_report.sh defaults to 100% (full per-file
          # gate); we let it run, then we apply the project-wide baseline
          # gate ourselves below, which is the actual CI quality bar.
          RA8_MCDC_THRESHOLD: "0"
        run: |
          set -o pipefail
          bash scripts/utils/mcdc_report.sh --in-container | tee mcdc-output.log
      - name: Compare against baseline
        id: baseline
        run: |
          set -e
          summary="build/mcdc-report/summary.txt"
          baseline_file="${MCDC_BASELINE_FILE}"
          if [ ! -f "$summary" ]; then
            echo "FAIL: MC/DC summary not produced at $summary" >&2
            exit 1
          fi
          if [ ! -f "$baseline_file" ]; then
            echo "FAIL: baseline file $baseline_file missing" >&2
            exit 1
          fi
          baseline=$(tr -d '[:space:]' < "$baseline_file")
          total_line=$(grep -E '^TOTAL' "$summary" | tail -1 || true)
          if [ -z "$total_line" ]; then
            echo "FAIL: no TOTAL row in $summary" >&2
            tail -40 "$summary" || true
            exit 1
          fi
          # Last percentage column on the TOTAL row is the MC/DC %.
          measured=$(echo "$total_line" | grep -oE '[0-9]+\.[0-9]+%' | tail -1 | tr -d '%')
          if [ -z "$measured" ]; then
            echo "FAIL: could not parse MC/DC % from TOTAL row: $total_line" >&2
            exit 1
          fi
          echo "measured=$measured" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          printf "Measured MC/DC: %s%%   Baseline: %s%%\n" "$measured" "$baseline"
          drop=$(awk -v m="$measured" -v b="$baseline" 'BEGIN{print (m+0 < b+0) ? 1 : 0}')
          if [ "$drop" -eq 1 ]; then
            echo "FAIL: MC/DC coverage ${measured}% dropped below baseline ${baseline}%"
            echo ""
            echo "      MC/DC dropped below baseline. Either add MC/DC test"
            echo "      vectors for the new compound decisions OR reduce the"
            echo "      decision count. Do NOT lower the baseline file to make"
            echo "      this pass."
            echo ""
            echo "      The pre-commit gate scripts/utils/check_new_compound_has_mcdc.py"
            echo "      is supposed to catch this locally; if a regression reached CI,"
            echo "      it means either the hook was bypassed or a citation in an"
            echo "      existing test drifted out of the +/- 25-line tolerance window."
            echo "      See docs/MCDC.md for the worked example of adding vectors."
            exit 1
          fi
          echo "PASS: MC/DC coverage holds the baseline."
      - name: Upload MC/DC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcdc-report
          path: build/mcdc-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Pre-commit gate suite -- mirrors scripts/git/pre-commit so PRs
  # surface what the local hook would have caught.
  # ---------------------------------------------------------------------------
  pre-commit-checks:
    name: Pre-commit gate suite
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute base ref for diff
        id: baseref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            # On push to main, diff against the previous commit so we still
            # have something the per-file checkers can iterate over.
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Run all check_*.py scripts
        env:
          BASE: ${{ steps.baseref.outputs.base }}
        run: |
          set -e
          # Best-effort: not every check_*.py honours --warn or accepts a
          # diff range, so we run them in their default modes (which match
          # how the pre-commit hook invokes them).
          python3 scripts/utils/check_obsolete_standards.py
          python3 scripts/utils/check_world_tags.py --warn
          python3 scripts/utils/check_mcdc_block.py
          # check_no_dynamic_alloc.py scans the production tree (--all
          # asks it to enumerate src/ + libs/ rather than read a list
          # of staged files via argv).
          python3 scripts/utils/check_no_dynamic_alloc.py --all
          python3 scripts/utils/check_no_ai_attribution.py
          # check_no_null.py: enforce C23 nullptr-only in first-party
          # code (libs/, src/, port/, examples/<app>/). Vendor macros
          # UX_NULL / TX_NULL / FX_NULL / NX_NULL are exempted.
          python3 scripts/utils/check_no_null.py --all
          # check_function_size.py: NASA P10 Rule 4 -- every function
          # must fit in <=60 lines.  Independent of the clang-tidy
          # compile-db, so it covers cross-compiled TUs the host tidy
          # build never sees (ThreadX/USBX/NetX/HAL register code).
          python3 scripts/utils/check_function_size.py
          # check_file_size.py: maintainability cap -- no single .c/.h
          # over 1000 lines.  Complements the per-function Rule 4 gate,
          # which a multi-thousand-line god-file or copy-pasted sibling
          # bodies can pass while still being unreviewable.
          python3 scripts/utils/check_file_size.py
          # check_final_newline.py: every first-party source file (C/C++,
          # Python, shell, CMake, YAML, ...) must end in a trailing
          # newline.  Complements .clang-format InsertNewlineAtEOF (C/C++
          # only) by covering scripts and config-as-code.
          python3 scripts/utils/check_final_newline.py
          # check_magic_numbers.py: no magic numbers.  clang-tidy's
          # readability-magic-numbers only sees files in the host
          # compile-db (no example main.c, no ARM-only #ifdef paths),
          # which is how ra8_delay_ms(500U) slipped past CI.  This
          # source-level backstop scans the whole tree (honouring
          # clang-tidy NOLINT waivers) -- the backlog is cleared so it
          # runs full-tree like check_function_size.py.
          python3 scripts/utils/check_magic_numbers.py
          # check_no_gnu_attribute.py: enforce the C23 [[...]] attribute
          # syntax tree-wide (GNU __attribute__((...)) is rejected except
          # for interrupt / cmse_nonsecure_entry / cmse_nonsecure_call,
          # which clang has no portable [[gnu::]] spelling for).
          python3 scripts/utils/check_no_gnu_attribute.py
          # check_no_wave_references.py: ban "Wave N" session-bookkeeping
          # references (the numbered recon-era tags) from comments and docs.
          # Ran only in the bypassable local pre-commit hook until now; it is
          # a strict full-tree scan that passes clean on the current tree, so
          # it belongs in CI alongside the other always-on gates.
          python3 scripts/utils/check_no_wave_references.py
          # check_nsc_veneer_defs.py: every RA8_NSC_VENEER declared in
          # ra8_nsc.h must have a definition -- a decl with no def advertises
          # an NS->S trust-boundary entry point that does not exist.
          python3 scripts/utils/check_nsc_veneer_defs.py
          # check_stub_crypto_guarded.py: every insecure placeholder-crypto body
          # (deterministic TRNG, forgeable key-import MAC, plain-SRAM key vault,
          # non-cryptographic RSIP key-wrap) must be wrapped in the
          # RA8_INSECURE_STUB_CRYPTO / RA8_SIMULATOR_MODE guard with a fail-closed
          # #else, so a release/HIL image that forgot to swap in real crypto
          # fails closed instead of silently shipping the stub (#180).
          python3 scripts/utils/check_stub_crypto_guarded.py
          # check_line_citations.py: the in-tree line-number citation ban
          # (CLAUDE.md -- reference a symbol, never file:line, since line
          # numbers rot). Ran only in the bypassable local pre-commit hook
          # until now; a stale + banned batch had already slipped into
          # test_ra8_book_cov.c (fixed in the same commit that wires this gate).
          python3 scripts/utils/check_line_citations.py
          # audit_init_order.py: per-app SystemInit boot init-order audit --
          # local-hook-only until now.
          python3 scripts/utils/audit_init_order.py
          # check_inclusive_terminology.py: OSHWA inclusive-terminology gate
          # (Controller/Peripheral, COPI/CIPO, Chip-Select naming) over
          # first-party sources -- a local-hook-only gate promoted to always-on CI.
          python3 scripts/utils/check_inclusive_terminology.py
          # doxy_audit.py --check: MAXIMUM-documentation gate (every function --
          # including statics -- carries the full Doxygen tag set). Ran only in the
          # bypassable local pre-commit hook until now; three doc gaps had already
          # accumulated (two undocumented ra8_xspi_flash statics + a missing @retval)
          # and are fixed in the same commit that wires this gate.
          python3 scripts/utils/doxy_audit.py --check
          # check_hil_alive_policy.py: every hw_validated/hil app must be
          # instrumented (a probed counter + HIL_MODE=jlink_memprobe) or explicitly
          # HIL_FAULT_EXPECTED -- a bare HIL_MODE=alive proves nothing. Local-hook-only
          # until now; ereader_ui was the lone offender (now probes g_er_loop_ticks).
          python3 scripts/utils/check_hil_alive_policy.py
          # check_assert_casts.py: reject explicit integer casts inside
          # TEST_ASSERT_EQ arguments across the whole host-test suite. The macro
          # widens both args to int64_t, so an outer (int)/(uint32_t) cast is
          # redundant and latently buggy (a (int) cast on a uint32_t enum
          # truncates before the widening). Ran only in the bypassable local hook
          # (staged files) until now; the tree was cleaned (redundant casts
          # stripped, the handful of load-bearing ones hoisted into typed locals)
          # so it now runs full-tree over tests/*.c like the other always-on gates.
          python3 scripts/utils/check_assert_casts.py tests/*.c
          # gen_sbom.py --check: supply-chain provenance gate (T5-09 / T5-14).
          # Fails if the committed CycloneDX SBOM (docs/sbom/ra8-firmware.cdx.json)
          # is stale or the vendored libs/third_party/ tree drifted from the
          # registry -- an uncatalogued SOUP directory or a version macro that
          # disagrees with the recorded version. Keeps the SBOM +
          # THIRD_PARTY_LICENSES.md inventory honest as components are bumped.
          python3 scripts/utils/gen_sbom.py --check
      - name: Annotation-attribute gate (libclang)
        run: |
          set -euo pipefail
          # check_annotations.py walks the AST via the libclang Python
          # bindings and enforces the 19 ra8_* annotation rules
          # (docs/ANNOTATIONS.md). Local-hook-only until now because the
          # pre-commit-gate runner ships no python-clang. Install a pinned
          # wheel (bundles libclang.so) into a venv, PEP 668-safe, mirroring
          # the ruff setup below; fall back to a --user install when
          # python3-venv is unavailable. The tree clears the gate, so it runs
          # in --check (strict) mode; the import probe fails the step loudly if
          # the binding is missing so the strict gate can never silently no-op.
          PY=python3
          if python3 -m venv "$RUNNER_TEMP/clangenv" 2>/dev/null \
             && "$RUNNER_TEMP/clangenv/bin/pip" install --quiet libclang==18.1.1; then
            PY="$RUNNER_TEMP/clangenv/bin/python"
          else
            echo "venv unavailable; installing libclang via pip --user --break-system-packages"
            python3 -m pip install --user --break-system-packages --quiet libclang==18.1.1
          fi
          "$PY" -c "import clang.cindex"
          "$PY" scripts/utils/check_annotations.py --check
      - name: clang-format dry run
        env:
          CLANG_FORMAT: clang-format-22
        run: bash scripts/format_code.sh --check
      - name: Set up Python/shell lint tools (ruff, shellcheck, shfmt)
        run: |
          set -euo pipefail
          # ruff in an isolated venv (PEP 668-safe across runner images).
          # Some self-hosted runners lack the python3-venv module; fall back to
          # a --user --break-system-packages install so the gate still runs.
          if python3 -m venv "$RUNNER_TEMP/lintenv" 2>/dev/null \
             && "$RUNNER_TEMP/lintenv/bin/pip" install --quiet ruff==0.15.19; then
            echo "$RUNNER_TEMP/lintenv/bin" >> "$GITHUB_PATH"
          else
            echo "venv unavailable; installing ruff via pip --user --break-system-packages"
            python3 -m pip install --user --break-system-packages --quiet ruff==0.15.19
            echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          fi
          # pinned static binaries for the X64 runner (no sudo, no apt)
          mkdir -p "$RUNNER_TEMP/lintbin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/lintbin/"
          curl -fsSL -o "$RUNNER_TEMP/lintbin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x "$RUNNER_TEMP/lintbin/shfmt"
          echo "$RUNNER_TEMP/lintbin" >> "$GITHUB_PATH"
      - name: Python + shell lint gates (ruff / shellcheck + shfmt)
        run: |
          # --require: fail (don't skip) if a tool is missing on the runner.
          # These gates fail on ANY finding -- there is no grandfathering.
          python3 scripts/utils/check_ruff.py --require
          python3 scripts/utils/check_shell.py --require
      - name: clang-tidy
        run: bash scripts/clang_tidy.sh --check
      - name: HUM citation validator (strict)
        # cite-VALIDATION pass: every existing HUM cite must parse and point at
        # a real chapter/page (clean tree-wide, so --strict blocks regressions).
        # Recursive discovery reaches all ~197 example apps, not just the ~10
        # one-level dirs the old two-level walk saw. The complementary
        # cite-COVERAGE pass (cite_check.py --require-cites: does every MMIO
        # access HAVE a cite?) surfaces a large libs/ra8_hal citation backlog and
        # is not yet gate-clean, so it is not wired blocking here.
        run: python3 scripts/utils/cite_check.py --strict
      - name: ROADMAP summary stats
        run: |
          if [ -f docs/ROADMAP.md ]; then
            python3 scripts/utils/roadmap_stats.py --check
          else
            echo "no docs/ROADMAP.md -- skipping roadmap_stats"
          fi

  # ---------------------------------------------------------------------------
  # Cross-compile all examples in one job.
  # ---------------------------------------------------------------------------
  build-cross:
    name: Cross-build all apps
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Prefer the official ARM toolchain (bundles libstdc++)
        # The apt `gcc-arm-none-eabi` package ships no C++ standard library, so
        # C++ apps (ereader_shelf -> ra8_epub + tinyxml2) fail to cross-compile
        # with "fatal error: cstddef: No such file or directory". The official
        # ARM GNU toolchain installed under /opt bundles libstdc++; prepend it
        # to PATH so cmake's find_program(arm-none-eabi-g++) resolves to it.
        run: |
          if [ -x /opt/arm-gnu-toolchain-13.3/bin/arm-none-eabi-g++ ]; then
            echo "/opt/arm-gnu-toolchain-13.3/bin" >> "$GITHUB_PATH"
          fi
      - name: Build all apps
        # #178: enforce the pinned arm-gcc major on the release cross-build path.
        # The runner provides Arm GNU Toolchain 13.x (/opt/arm-gnu-toolchain-13.3);
        # RA8_STRICT_TOOLCHAIN=1 promotes toolchain-ra8d2.cmake's version-mismatch
        # warning to a hard error, so a runner with a skewed arm-gcc fails loudly
        # instead of silently shipping version-divergent miniz codegen.
        env:
          RA8_STRICT_TOOLCHAIN: "1"
        run: bash scripts/build_all_examples.sh
      - name: NSC SG-veneer slot-offset guard (TrustZone boundary)
        # check_sg_offsets is the only automated guard that the NSC
        # Secure-Gateway veneer slot offsets in the linked SECURE ELF still
        # match the k_sg_off_* enum ns_main.c reaches them by (ld emits the
        # 8-byte stubs in ascending symbol order, so a rename/reorder silently
        # shifts the slots). It was wired into no workflow, hook, or Makefile
        # target, so an SG-veneer offset regression in the TrustZone boundary
        # would ship unnoticed. build_all_examples.sh above links
        # tz_nsc_cgc_usb -- the app that binds all three ra8_nsc_cgc_* veneers --
        # so run the guard on its secure image here where the ELF exists. Its
        # NS image and every non-TZ app carry no veneers and are skipped by the
        # checker itself (exit 0).
        run: |
          elf="$(find examples -type f -name 'tz_nsc_cgc_usb.elf' | head -n 1)"
          if [ -z "$elf" ]; then
            echo "check_sg_offsets: tz_nsc_cgc_usb secure ELF not found after build-cross" >&2
            exit 1
          fi
          echo "check_sg_offsets: inspecting $elf"
          python3 scripts/utils/check_sg_offsets.py "$elf"
      - name: Stack-usage gate (aggregate -fstack-usage .su files)
        # Every app is compiled with -fstack-usage (cmake/ra8_warnings.cmake),
        # so the build above left a <app>/build/**/*.su next to each object.
        # Aggregate them project-wide and fail on any first-party function
        # frame > 2048 B, any `dynamic` (VLA/alloca) frame -- NASA P10 Rule 3 --
        # or any critical-path module (ra8_isr/ra8_check/ra8_err/ra8_mpu/ra8_cgc/
        # ra8_pfs) over 256 B. Local-hook-only until now: the source-scan
        # pre-commit step has no build to read .su files from, so this belongs
        # after build-cross where the .su files actually exist.
        run: python3 scripts/utils/stack_usage_check.py --strict

  # ---------------------------------------------------------------------------
  # Doxygen warning gate
  # ---------------------------------------------------------------------------
  docs:
    name: Doxygen warnings
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run doxygen
        run: doxygen Doxyfile.main 2>&1 | tee doxygen.log
      - name: Fail on warnings
        run: |
          # Filter known-benign Doxygen warnings:
          #   - "for \ref command" -- Doxygen treats Markdown links in
          #     README.md ([text](path)) as \ref directives; targets
          #     outside INPUT (CHANGELOG.md, docs/*.md, examples/*/README)
          #     "fail" to resolve but render fine.
          #   - "multiple documentation sections" / "from the argument
          #     list of" -- triggered when @retval / @param appear in
          #     both the public header (canonical) and the .c
          #     definition. Cosmetic, no output impact.
          relevant_warnings=$(grep "warning:" doxygen.log \
            | grep -v "for .ref command" \
            | grep -v "multiple documentation sections" \
            | grep -v "from the argument list of " \
            | grep -v "multiple @param documentation sections" \
            | grep -v "has multiple documentation sections" \
            | grep -v "tag INCLUDE_PATH:" \
            | grep -v "is not a readable file or directory" \
            | grep -v "found more than one .mainpage comment block" \
            | grep -v "ignoring .startuml command because PLANTUML_JAR_PATH is not set" \
            | grep -v "End of list marker found without any preceding list items" \
            | grep -v "Invalid list item found" \
            | grep -v "Found unknown command" \
            | grep -v "explicit link request to" \
            | grep -v "argument '.*' of command @param is not found" \
            | grep -v "found documented return type for .* that does not return anything" \
            | grep -v "Problems running latex" || true)
          if [ -n "$relevant_warnings" ]; then
            echo "Doxygen reported warnings:"
            echo "$relevant_warnings"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # cppcheck static analysis
  # ---------------------------------------------------------------------------
  cppcheck:
    name: cppcheck
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run cppcheck
        run: |
          set -e
          apps=()
          if [ -d examples ]; then
            for d in examples/*/*/ examples/*/*/*/ examples/*/*/*/*/; do
              d="${d%/}"
              # examples/host/* are macOS-only dev tools (C23 nullptr + AppKit),
              # not cross-compiled firmware -- skip like the other host gates.
              case "$d" in examples/host/*) continue ;; esac
              [ -f "$d/main.c" ] && apps+=("$d")
            done
          fi
          # cppcheck 2.13 (Ubuntu 24.04) is finicky about the
          # --suppressions-list parser; convert each non-comment,
          # non-blank line into an explicit --suppress= flag. This
          # matches the syntax cppcheck accepts on every version.
          suppress_args=()
          while IFS= read -r line; do
            # Strip CRLF, trim leading/trailing whitespace
            line="${line%$'\r'}"
            line="${line## }"
            line="${line%% }"
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue ;;
            esac
            suppress_args+=("--suppress=$line")
          done < .cppcheck-suppressions
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   "${suppress_args[@]}" \
                   --inline-suppr \
                   -i libs/third_party \
                   --std=c23 \
                   src libs "${apps[@]}"

  # ---------------------------------------------------------------------------
  # PR-only: post a per-file MC/DC delta comment vs the main branch.
  # Limited to the first 50 rows so the comment stays readable.
  # ---------------------------------------------------------------------------
  coverage-comment:
    name: MC/DC delta comment
    runs-on: [self-hosted, Linux, X64]
    needs: mcdc
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download PR MC/DC report
        uses: actions/download-artifact@v4
        with:
          name: mcdc-report
          path: pr-mcdc
      - name: Build main MC/DC report (best-effort)
        id: main_run
        env:
          CC: clang-18
          CXX: clang++-18
          RA8_MCDC_THRESHOLD: "0"
        continue-on-error: true
        run: |
          set -e
          git worktree add /tmp/main-tree origin/${{ github.event.pull_request.base.ref }}
          (cd /tmp/main-tree && bash scripts/utils/mcdc_report.sh --in-container) || \
            echo "main MC/DC build failed -- delta will be PR-only"
          if [ -f /tmp/main-tree/build/mcdc-report/summary.txt ]; then
            cp /tmp/main-tree/build/mcdc-report/summary.txt main-summary.txt
          else
            echo "" > main-summary.txt
          fi
      - name: Render delta comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function loadSummary(path) {
              if (!fs.existsSync(path)) return new Map();
              const m = new Map();
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              for (const line of lines) {
                // A typical llvm-cov report row looks like:
                //   path/to/file.c   1   2   50.00%   3   4   75.00%   ...   12.34%
                // We take the first whitespace-delimited token as the
                // file path and the last %-suffixed token as MC/DC %.
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('---') ||
                    trimmed.startsWith('Filename') ||
                    trimmed.startsWith('TOTAL')) continue;
                const cols = trimmed.split(/\s+/);
                if (cols.length < 2) continue;
                const pcts = cols.filter(c => /^[0-9]+(\.[0-9]+)?%$/.test(c));
                if (!pcts.length) continue;
                const file = cols[0];
                const pct = parseFloat(pcts[pcts.length - 1]);
                m.set(file, pct);
              }
              return m;
            }
            const pr = loadSummary('pr-mcdc/summary.txt');
            const main = loadSummary('main-summary.txt');
            const files = new Set([...pr.keys(), ...main.keys()]);
            const rows = [];
            for (const f of files) {
              const a = main.has(f) ? main.get(f) : null;
              const b = pr.has(f) ? pr.get(f) : null;
              const delta = (a !== null && b !== null) ? (b - a) : null;
              rows.push({ file: f, main: a, pr: b, delta });
            }
            rows.sort((x, y) => {
              const dx = x.delta === null ? -Infinity : x.delta;
              const dy = y.delta === null ? -Infinity : y.delta;
              return dx - dy;
            });
            const top = rows.slice(0, 50);
            const fmt = v => v === null ? "n/a" : v.toFixed(2) + "%";
            const sign = v => v === null ? "" : (v > 0 ? "+" : "");
            let body = "## MC/DC delta (PR vs main)\n\n";
            body += "Showing up to 50 files sorted by delta (regressions first).\n\n";
            body += "| file | main | PR | delta |\n|---|---|---|---|\n";
            for (const r of top) {
              body += `| \`${r.file}\` | ${fmt(r.main)} | ${fmt(r.pr)} | ${sign(r.delta)}${fmt(r.delta)} |\n`;
            }
            if (!top.length) {
              body += "| _no rows_ | | | |\n";
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- mcdc-delta-comment -->";
            body = marker + "\n" + body;
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.data.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

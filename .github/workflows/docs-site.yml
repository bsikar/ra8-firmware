# SCHEDULING ONLY -- the body lives in scripts/ci.sh (gate: docs-site).
# See .github/workflows/firmware.yml for the design note.
#
# #900 / ADR-0005: the documentation site is assembled from one generator per
# slot -- Markdown hub, C ABI Doxygen, Zig autodoc, rustdoc. Each generator
# can break on its own, and none of them ran in CI before this job: the only
# documentation workflow is docs-publish, which builds the legacy wide Doxygen
# site on push to main and says nothing about the assembled one.
#
# The gate reuses scripts/builders/docs_site.sh instead of re-encoding the
# layout in YAML, so the site CI builds is the same site `just docs::site`
# gives a developer, and the slot manifest stays the single source of truth.
---
name: docs-site

on:
  # dev is the working branch: docs generators land there first, so the gate
  # runs where the commits actually land, not just on main.
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Per-commit isolation on push: key the group on the commit SHA so a burst of
# dev pushes never cancels an in-flight run. A cancelled run marks its
# remaining steps skipped-not-failed, so an uncancelled run per commit is what
# keeps a green here from meaning "the gate never executed".
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-site:
    name: Assembled documentation site
    runs-on: ra8-ci
    # SECURITY: self-hosted + pull_request trigger. Run on push / dispatch and
    # on PRs ONLY from this same repo (never a fork). See SECURITY.md.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: just quality::local::gate docs-site

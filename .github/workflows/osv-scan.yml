# SCHEDULING ONLY -- the gate body lives in scripts/ci.sh (gate: osv-scan).
# See .github/workflows/firmware.yml for the design note.
name: osv-scan

on:
  schedule:
    # Weekly CVE sweep of the vendored SOUP, Mondays 06:17 UTC. New
    # advisories are published continuously against pinned (unchanging)
    # components, so this must run on a clock, not on pushes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Version-pinned scanner release + its published sha256 (from the
  # osv-scanner_SHA256SUMS asset of the release). Bump both together.
  OSV_SCANNER_VERSION: 2.4.0
  OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0

jobs:
  osv-scan:
    name: OSV CVE scan (SBOM purls + pinned upstream commits)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # The gate downloads the pinned + sha256-verified scanner, refuses to run
      # against a stale SBOM, then runs both legs (SBOM purls and the GIT-range
      # advisories for git-vendored SOUP). Exits 1 on any finding.
      - run: bash scripts/ci.sh --gate osv-scan
      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-report
          path: osv-report/
          if-no-files-found: ignore

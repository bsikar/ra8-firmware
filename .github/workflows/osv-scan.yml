# SCHEDULING ONLY -- the gate body lives in scripts/ci.sh (gate: osv-scan).
# See .github/workflows/firmware.yml for the design note.
---
name: osv-scan

on:
  schedule:
    # Weekly CVE sweep of the vendored SOUP, Mondays 06:17 UTC. New
    # advisories are published continuously against pinned (unchanging)
    # components, so this must run on a clock, not on pushes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Version-pinned scanner release + its published sha256 (from the
  # osv-scanner_SHA256SUMS asset of the release). Bump both together.
  OSV_SCANNER_VERSION: 2.4.0
  OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0

jobs:
  osv-scan:
    name: OSV CVE scan (SBOM purls + pinned upstream commits)
    runs-on: ra8-ci
    steps:
      - uses: actions/checkout@v4
      # The gate downloads the pinned + sha256-verified scanner, refuses to run
      # against a stale SBOM, then runs both legs (SBOM purls and the GIT-range
      # advisories for git-vendored SOUP). Exits 1 on any finding.
      #
      # The scanner stays a job-time fetch rather than a baked-in image layer:
      # it is a single-use binary this one weekly workflow runs, pinned by
      # version AND sha256 in the env block above, so fetching it here keeps
      # the pin and the check that enforces it in the same file. Baking it in
      # would put the pin two rebuilds away from the workflow that asserts it.
      - run: just quality::local::gate osv-scan
      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-report
          path: osv-report/
          # A preflight/download failure occurs before osv_scan.sh creates the
          # report directory; keep the gate's original diagnosis as the job
          # failure instead of replacing it with an upload-action failure.
          if-no-files-found: ignore

  soup-upstream-refresh:
    name: SOUP upstream re-fetch (pinned refs still publish what we recorded)
    runs-on: ra8-ci
    steps:
      - uses: actions/checkout@v4
      # Same clock, same reason as the CVE sweep above: the committed upstream
      # manifests are a snapshot of what twenty-odd projects published on the
      # day they were fetched, and a moved tag or a rewritten history changes
      # that without touching this repository. The per-push soup-upstream gate
      # cannot see any of it. This also applies and reverses the C6 patch
      # against its exact fetched pin without building or contacting hardware.
      # Writes nothing -- it reports, it does not adopt.
      - run: just quality::local::gate soup-upstream-refresh

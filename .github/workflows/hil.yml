name: hil

# Hardware-in-the-loop CI.  Runs on the Raspberry Pi 5 self-hosted runner
# (labels: self-hosted, hil, pi5, ra8d2) that has the EK-RA8D2 board wired
# to it: J-Link OB on /dev/ttyACM0 (SWD + VCOM, 115200 baud), USBFS on
# J11 -> hub port 4, USBHS on J7 -> hub port 1.
#
# Drives scripts/hil_all.sh, which auto-discovers every app under
# examples/ek_ra8d2/hw_validated/hil/ and verifies each via its hil.conf
# manifest (uart_scrape, usb_cdc, or alive). Adding a new app to that
# directory automatically pulls it into CI as soon as it has a hil.conf.
#
# One board, one runner: the hil-board concurrency group ensures jobs never
# race on the attached hardware.

on:
  push:
    branches: [main]
    paths:
      - 'examples/ek_ra8d2/hw_validated/**'
      - 'libs/ra_hal/**'
      - 'port/usbx/**'
      - 'scripts/hil_*.sh'
      - 'scripts/usb_*.py'
      - '.github/workflows/hil.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/ek_ra8d2/hw_validated/**'
      - 'libs/ra_hal/**'
      - 'port/usbx/**'
      - 'scripts/hil_*.sh'
      - 'scripts/usb_*.py'
      - '.github/workflows/hil.yml'
  workflow_dispatch:

concurrency:
  group: hil-board
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hil-all:
    name: HIL all (auto-discover hil/)
    runs-on: [self-hosted, hil, ra8d2]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (idempotent)
        run: |
          if ! command -v arm-none-eabi-gcc >/dev/null 2>&1 \
              || ! dpkg -s libnewlib-arm-none-eabi >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
          fi
          arm-none-eabi-gcc --version
          cmake --version

      - name: List apps discovered under hil/
        run: bash scripts/hil_all.sh --list

      - name: Build every app under hil/
        # hil_all.sh builds them itself, but doing it explicitly in a
        # separate step gives clearer logs if a build (not a flash) fails.
        run: |
          apps=$(ls examples/ek_ra8d2/hw_validated/hil/ | grep -v README.md)
          make -j$(nproc) $apps

      - name: Run HIL across every app (auto-discovered)
        run: bash scripts/hil_all.sh --skip-build

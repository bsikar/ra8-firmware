name: hil

# Hardware-in-the-loop CI.  Runs on the Raspberry Pi 5 self-hosted runner
# (labels: self-hosted, hil, pi5, ra8d2) that has the EK-RA8D2 board wired
# to it: J-Link OB on /dev/ttyACM0 (SWD + VCOM, 115200 baud).
#
# Covers all 20 apps in examples/ek_ra8d2/hw_validated/uart/:
#   - Build each app cross-compiled on the Pi (arm-none-eabi-gcc from apt).
#   - Flash via JLinkExe (local, no SSH).
#   - Assert expected UART string appears on /dev/ttyACM0 within timeout.
#
# One board, one runner: the hil-board concurrency group ensures jobs never
# race on the attached hardware.

on:
  push:
    branches: [main]
    paths:
      - 'examples/ek_ra8d2/hw_validated/**'
      - 'libs/ra_hal/**'
      - 'port/usbx/**'
      - 'scripts/hil_run_direct.sh'
      - 'scripts/hil_suite.sh'
      - 'scripts/hil_usb_test.sh'
      - 'scripts/hil_recover.sh'
      - 'scripts/hil_flash.sh'
      - 'scripts/hil_ppps.sh'
      - 'scripts/hil_tapo.sh'
      - 'scripts/usb_benchmark.py'
      - '.github/workflows/hil.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/ek_ra8d2/hw_validated/**'
      - 'libs/ra_hal/**'
      - 'port/usbx/**'
      - 'scripts/hil_run_direct.sh'
      - 'scripts/hil_suite.sh'
      - 'scripts/hil_usb_test.sh'
      - 'scripts/hil_recover.sh'
      - 'scripts/hil_flash.sh'
      - 'scripts/hil_ppps.sh'
      - 'scripts/hil_tapo.sh'
      - 'scripts/usb_benchmark.py'
      - '.github/workflows/hil.yml'
  workflow_dispatch:

concurrency:
  group: hil-board
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hil-uart-suite:
    name: HIL uart suite (20 apps)
    runs-on: [self-hosted, hil, ra8d2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (idempotent)
        run: |
          if ! command -v arm-none-eabi-gcc >/dev/null 2>&1 \
              || ! dpkg -s libnewlib-arm-none-eabi >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
          fi
          arm-none-eabi-gcc --version
          cmake --version

      - name: Build all uart apps
        run: |
          make -j$(nproc) \
            uart_hello crc_demo dma_memcopy_demo i2c_loopback \
            adc_b_demo agt_periodic elc_event_demo rng_demo \
            iwdt_demo ulpt_demo timer_capture_demo threadx_ipc_demo \
            power_profiler lpm_idle_demo crypto_aes_demo \
            watchdog_demo eth_loopback sdram_benchmark rtc_alarm \
            threadx_filex_levelx_demo

      - name: Run HIL uart suite
        run: bash scripts/hil_suite.sh --uart /dev/ttyACM0

  hil-usb-suite:
    name: HIL usb suite (FS + HS echo)
    runs-on: [self-hosted, hil, ra8d2]
    timeout-minutes: 30
    needs: hil-uart-suite
    steps:
      - uses: actions/checkout@v4

      - name: Build both USB apps
        run: |
          make -j$(nproc) tz_secure_only_usb tz_secure_only_usb_hs

      - name: Run HIL USB suite
        run: bash scripts/hil_usb_test.sh

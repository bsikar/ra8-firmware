---
name: hil

# Hardware-in-the-loop CI.  Runs on the Raspberry Pi 5 self-hosted runner
# (labels: self-hosted, hil, pi5, ra8d2) that has the EK-RA8D2 board wired
# to it: J-Link OB on /dev/ttyACM0 (SWD + VCOM, 115200 baud), USBFS on
# J11 -> hub port 4, USBHS on J7 -> hub port 1.
#
# The hil-all gate drives scripts/hil/all.sh, which auto-discovers every app
# under examples/ek_ra8d2/hw_validated/hil/ and verifies each via its hil.conf
# manifest (uart_scrape, usb_cdc, or alive). Adding a new app to that
# directory automatically pulls it into CI as soon as it has a hil.conf.
#
# One board, one runner: the hil-board concurrency group ensures jobs never
# race on the attached hardware.

# TEMP (2026-06-22): HIL auto-triggers are disabled until the Raspberry Pi 5
# self-hosted runner (labels: self-hosted, hil, ra8d2) with the EK-RA8D2 board
# attached is wired back up. Without that runner the HIL job has nowhere to
# execute and would block merges to main. Re-enable by uncommenting the
# `push:` and `pull_request:` blocks below. The job can still be launched by
# hand at any time via `workflow_dispatch` (Actions tab -> Run workflow).
on:
  #  push:
  #    branches: [main]
  #    paths:
  #      - 'examples/ek_ra8d2/hw_validated/**'
  #      - 'libs/ra8_board_ek_ra8d2/**'
  #      - 'libs/ra8_core/**'
  #      - 'libs/ra8_hal/**'
  #      - 'libs/ra8_net_pal/**'
  #      - 'libs/ra8_nsc/**'
  #      - 'libs/ra8_usb_pal/**'
  #      - 'port/threadx/**'
  #      - 'port/usbx/**'
  #      - 'src/**'
  #      - 'cmake/**'
  #      - 'scripts/hil/**'
  #      - 'scripts/hil/usb/**'
  #      - '.github/workflows/hil.yml'
  #  pull_request:
  #    branches: [main]
  #    paths:
  #      - 'examples/ek_ra8d2/hw_validated/**'
  #      - 'libs/ra8_board_ek_ra8d2/**'
  #      - 'libs/ra8_core/**'
  #      - 'libs/ra8_hal/**'
  #      - 'libs/ra8_net_pal/**'
  #      - 'libs/ra8_nsc/**'
  #      - 'libs/ra8_usb_pal/**'
  #      - 'port/threadx/**'
  #      - 'port/usbx/**'
  #      - 'src/**'
  #      - 'cmake/**'
  #      - 'scripts/hil/**'
  #      - 'scripts/hil/usb/**'
  #      - '.github/workflows/hil.yml'
  workflow_dispatch:

concurrency:
  group: hil-board
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hil-all:
    name: HIL all (auto-discover hil/)
    runs-on: [self-hosted, hil, ra8d2]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (idempotent)
        run: |
          # ci-parity: infra -- runner package provisioning only; runs no
          # project check. The hil-all gate hard-fails when arm-none-eabi-gcc
          # is still absent afterwards.
          if ! command -v arm-none-eabi-gcc >/dev/null 2>&1 \
              || ! dpkg -s libnewlib-arm-none-eabi >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
          fi
          arm-none-eabi-gcc --version
          cmake --version

      # Ahead of the suite, deliberately. It runs against a throwaway state
      # directory and takes no instrument, so it cannot disturb the run that
      # follows -- and if the bench lock is broken, that is worth knowing
      # BEFORE 151 apps are flashed under a lock that is not holding.
      - run: bash scripts/ci.sh --gate bench-lock-selftest

      - run: bash scripts/ci.sh --gate hil-all

name: inclusive-terminology

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inclusive-terminology:
    name: Inclusive terminology
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run inclusive-terminology gate (source files)
        run: python3 scripts/utils/check_inclusive_terminology.py

      - name: Check commit messages for non-inclusive terminology
        run: |
          # Only check commits reachable from HEAD that are NOT ancestors of
          # FLOOR_SHA.  FLOOR_SHA is the commit that introduced this check;
          # commits before it are grandfathered (they pre-date the gate).
          FLOOR_SHA="036fdb661f08d9dcae45a3d912bafdff2bc173e0"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            HEAD="${{ github.sha }}"
          fi
          git log "${FLOOR_SHA}..${HEAD}" --format=%B | \
            python3 scripts/utils/check_inclusive_terminology_commits.py

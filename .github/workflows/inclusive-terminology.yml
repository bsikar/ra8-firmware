name: inclusive-terminology

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inclusive-terminology:
    name: Inclusive terminology
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run inclusive-terminology gate (source files)
        run: python3 scripts/utils/check_inclusive_terminology.py

      - name: Check commit messages for non-inclusive terminology
        run: |
          # On push: check all commits added by this push.
          # On PR: check all commits in the PR branch relative to base.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # git log between base and head; --format=%B gives full body.
          git log "${BASE}..${HEAD}" --format=%B | \
          python3 - <<'PYEOF'
import sys, re

BANNED = [
    (re.compile(r'\bmaster(s|ed|ing|ship)?\b', re.IGNORECASE), "master -- use Primary/Controller"),
    (re.compile(r'\bslave(s|d)?\b',            re.IGNORECASE), "slave -- use Peripheral"),
    (re.compile(r'\bMOSI\b'),                                  "MOSI -- use COPI"),
    (re.compile(r'\bMISO\b'),                                  "MISO -- use CIPO"),
    (re.compile(r'\bSlave[ _-]Select\b',        re.IGNORECASE), "Slave Select -- use CS"),
    (re.compile(r'\bSS\b'),                                    "SS (Slave Select) -- use CS"),
]
LEGACY_OK = re.compile(r'LEGACY-OK\s*:', re.IGNORECASE)

text = sys.stdin.read()
violations = []
for lineno, line in enumerate(text.splitlines(), 1):
    if LEGACY_OK.search(line):
        continue
    for pattern, msg in BANNED:
        if pattern.search(line):
            violations.append(f"  line {lineno}: {msg}\n    > {line.strip()}")
if violations:
    print("[FAIL] Non-inclusive terminology in commit message(s):")
    for v in violations:
        print(v)
    sys.exit(1)
print("[PASS] Commit message terminology clean.")
PYEOF

name: no-ai-attribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  no-ai-attribution:
    name: No AI attribution
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run AI-attribution gate
        run: python3 scripts/utils/check_no_ai_attribution.py

  commit-messages:
    name: No AI attribution (commit messages)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages with the commit-msg hook
        # Secondary enforcement: the file scanner above cannot see commit
        # messages (Co-Authored-By / "Generated by" trailers live in git
        # metadata, not tracked files). Run the real scripts/git/commit-msg
        # gate -- the single source of truth for the brand list -- on every
        # commit in the PR/push range so CI catches what a missing local hook
        # would let slip.
        run: |
          set -uo pipefail
          head="${{ github.sha }}"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            head="${{ github.event.pull_request.head.sha }}"
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}~1" 2>/dev/null || true)"
          fi
          range="$head"
          [ -n "$base" ] && range="${base}..${head}"
          echo "Scanning commit messages in: $range"
          rc=0
          for sha in $(git rev-list "$range"); do
            f="$(mktemp)"
            git log -1 --format=%B "$sha" >"$f"
            # scripts/git/commit-msg enforces TWO policies -- AI attribution
            # AND inclusive terminology -- and prints which one tripped. Capture
            # its own [FAIL] output and echo it, then derive an accurate
            # ::error:: line from it, instead of hard-coding "AI attribution"
            # (which mislabels an inclusive-terminology failure).
            if hook_out="$(bash scripts/git/commit-msg "$f" 2>&1)"; then
              :
            else
              echo "$hook_out"
              if echo "$hook_out" | grep -qi 'non-inclusive terminology'; then
                reason="uses non-inclusive terminology"
              else
                reason="contains AI attribution"
              fi
              echo "::error::Commit $sha $reason in its message"
              rc=1
            fi
            rm -f "$f"
          done
          exit $rc

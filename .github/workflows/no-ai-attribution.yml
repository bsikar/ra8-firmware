name: no-ai-attribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  no-ai-attribution:
    name: No AI attribution
    runs-on: self-hosted
    # SECURITY: self-hosted + pull_request trigger. Run on push / dispatch and
    # on PRs ONLY from this same repo (never a fork). See SECURITY.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run AI-attribution gate
        run: python3 scripts/utils/check_no_ai_attribution.py

  commit-messages:
    name: No AI attribution (commit messages)
    runs-on: self-hosted
    # SECURITY: self-hosted + pull_request trigger. Run on push / dispatch and
    # on PRs ONLY from this same repo (never a fork). See SECURITY.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages with the commit-msg hook
        # Secondary enforcement: the file scanner above cannot see commit
        # messages (Co-Authored-By / "Generated by" trailers live in git
        # metadata, not tracked files). Run the real scripts/git/commit-msg
        # gate -- the single source of truth for the brand list -- on every
        # commit in the PR/push range so CI catches what a missing local hook
        # would let slip.
        run: |
          set -uo pipefail
          head="${{ github.sha }}"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            head="${{ github.event.pull_request.head.sha }}"
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}~1" 2>/dev/null || true)"
          fi
          range="$head"
          [ -n "$base" ] && range="${base}..${head}"
          echo "Scanning commit messages in: $range"
          rc=0
          for sha in $(git rev-list "$range"); do
            f="$(mktemp)"
            git log -1 --format=%B "$sha" >"$f"
            # AI-attribution ONLY. scripts/git/commit-msg enforces two policies
            # (AI attribution AND inclusive terminology); CHECK_ONLY=ai runs just
            # the AI half here so an inclusive-terminology violation is attributed
            # to -- and fails -- the inclusive-terminology workflow instead of
            # this one. Previously the whole hook ran here, so a stray legacy
            # term in a commit body failed THIS "no AI attribution" job, which
            # was misleading.
            if hook_out="$(CHECK_ONLY=ai bash scripts/git/commit-msg "$f" 2>&1)"; then
              :
            else
              echo "$hook_out"
              echo "::error::Commit $sha contains AI attribution in its message"
              rc=1
            fi
            rm -f "$f"
          done
          exit $rc

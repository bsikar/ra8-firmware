#
# Descriptor for the creator-operated Pepper&Carrot webcomic archive.
# Browse is supported; the site does not expose a descriptor-compatible search.

name = Pepper&Carrot
host = www.peppercarrot.com
kind = webcomic
contact = https://github.com/bsikar/ra8-firmware

# The archive is /en/webcomics/peppercarrot.html while episodes are siblings
# under /en/webcomic/epNN_*. The explicit prefix prevents cross-series links.
chapter_url_contains = /en/webcomic/ep
chapter_url_prefix = https://www.peppercarrot.com/en/webcomic/ep
chapter_order = asc

# Archive/browse support. search_url is intentionally absent.
search_result_contains = /en/webcomics/peppercarrot.html
browse_url = https://www.peppercarrot.com/en/webcomics/index.html

# Episode pages use ordinary src attributes; only low-resolution translated
# source pages under /0_sources/ are reader pages (not navigation/site images).
page_img_attr = src
page_img_url_contains = /0_sources/

series_title_selector = meta:og:title
series_summary_selector = meta:og:description
series_author_selector = literal:David Revoy
series_artist_selector = literal:David Revoy
series_cover_selector = meta:og:image
chapter_title_selector = meta:og:title
language = en
reading_direction = ltr

img_delay_min = 750
img_delay_max = 1500
chapter_delay_min = 2000
chapter_delay_max = 4000
rate_per_min = 20
burst = 1
max_inflight = 1

#
# Site descriptor for manhwaus.net (manhwa aggregator).
# Series page URL shape: https://manhwaus.net/webtoon/<slug>/
# Pass the series URL with --series; this file supplies the scraping rules.

name = ManhwaUS
host = manhwaus.net
kind = manhwa

# --- chapter list (on a series page) ---
# Chapter links look like .../webtoon/<slug>/chapter-<N>/ ; keep anchors whose
# href contains this. main additionally restricts to the given series' prefix.
chapter_url_contains = /chapter-
# Site lists newest-first; "asc" sorts by the number in the URL so --chapters N
# from --start 0 gives chapter 1, 2, ...
chapter_order = asc

# --- page images (on a chapter page) ---
# Reader images are <img class='loading pN' data-src='https://iiNNN.manhwaus.net
# /uploads/.../N-108.jpg'>. Prefer data-src; keep only /uploads/ URLs so the
# search-loading.gif spinner and nav icons are dropped.
page_img_attr = data-src
page_img_url_contains = /uploads/

# --- politeness (milliseconds; jittered in [min,max]) ---
img_delay_min = 500
img_delay_max = 1200
chapter_delay_min = 1500
chapter_delay_max = 3000

# A mid-size 7" 800x480 RGB565 LCD (a very common bare panel size).
# Exists to prove the bedroom UI is resolution-adaptive: the same source that
# fills the 1024x600 EK-RA8D2 panel and fits the 480x272 sample lays out
# cleanly here too -- tab bar, heading, and the 2x2 card grid all on-screen.
#   just apps::emulator::run <app> sample_800x480
name   = "Generic 7in 800x480"
width  = 800
height = 480
format = "rgb565"
ppi    = 133

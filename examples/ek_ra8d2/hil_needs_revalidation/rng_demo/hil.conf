HIL_MODE=uart_scrape
# rng_demo emits the dynamic "rng: <64 hex chars>" data line and then, only
# after a non-stuck sample is dumped, the fixed verdict
# "rng: PRNG stub OK (deterministic, NOT entropy)" -- the success-only line the
# gate keys on. It deliberately does NOT claim entropy: ra8_psa_crypto_random
# returns a deterministic software stub on this silicon (no working RSIP TRNG,
# see ra8_rsip_trng_read), so a green here proves only that the API path runs and
# the stub is not stuck, not that the output is secure random. The failure path
# emits "rng_demo: FAIL stuck"; the negative regex catches it plus the PSA / CGC
# bring-up failures.
HIL_EXPECT="rng: PRNG stub OK"
HIL_EXPECT_NEGATIVE="hw_init_failed|psa.*fail|rng.*fail|cgc_init failed|HardFault|rng_demo: FAIL"
HIL_TIMEOUT_S=10

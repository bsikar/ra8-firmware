# cpu1_pingpong_ipc -- TrustZone-side IPC ping-pong. The S-side
# trustzone_init programmes SAU + IPCSAR + CPSCU bus-manager attribution
# + PRC1 unlock around ra8_cpu1_release, then BLXNS-es into the NS
# image at 0x02080000. The NS reset handler (ns_main.c) runs the
# CPU0 -> CPU1 -> CPU0 ping-pong loop using the NS alias 0x50020000
# of the IPC peripheral. The S-side main() never runs on the happy
# path; the original g_cpu1_pingpong_match / _mismatch counters live
# there but stay at 0. The working counters are in the NS image:
#   - g_ns_pingpong_match: bumps once per CPU0->CPU1->CPU0 round-trip
#                          (got pong 0x4321 in response to ping 0x1234).
#   - g_ns_pingpong_mismatch: bumps on TX fail, RX timeout, or wrong
#                             magic. Stays at 0 on a healthy bench.
#
# Bench measures >~17 kHz round-trips; HIL_PROBE_MIN_ADVANCE = 500 is
# well below that and tolerates a slower bench without false PASS.
# Post-Initialize is enabled because the BLXNS path leaves the chip
# in a TrustZone-locked state the next flash cannot halt without
# rfp-cli -erase-chip. See PR #25 + memory/project_pr25_tz_state.md.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_ns_pingpong_match"
HIL_PROBE_MIN_ADVANCE=500
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_ns_pingpong_mismatch"
HIL_PROBE_MAX_FAILURE=0
HIL_POST_INITIALIZE=1

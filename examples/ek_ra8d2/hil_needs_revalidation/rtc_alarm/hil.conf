HIL_MODE=uart_scrape
# rtc_alarm prints "rtc: boot" on entry, then "rtc: alarm fired" each
# time the +5 s RTC alarm matches. The alarm line (16 chars) is the only
# success-only banner -- "rtc: boot" prints unconditionally -- so the HIL
# gate keys on the alarm. Needs the SOSC sub-clock ticking; the negative
# regex catches the RTC/CGC init-failure banners.
HIL_EXPECT="rtc: alarm fired"
HIL_EXPECT_NEGATIVE="hw_init_failed|rtc.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=30

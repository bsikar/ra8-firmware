# HIL gate (#60): validate the NSC CGC veneer wall from GENUINE Non-Secure state.
#
# Boot path (all on CPU0): SystemInit -> ra8_cgc_init -> ra8_trustzone_init
# programs SRAMSABAR (SRAM2 Non-secure) + the bit[28] SAU layout (NSC over the
# .gnu.sgstubs veneers, NS for 0x1./0x3./0x5. IDAU-NS ranges), copies the NS
# image into the SRAM NS alias 0x32100000, then BLXNS into ns_reset_handler.
#
# In real NS state the NS image calls the three NSC CGC veneers by SG-stub
# address (ld redirects the cmse symbols, so ns_main.c reaches them via
# g_ra8_ls_sgstubs_start + offset). Each SG-traps into Secure, runs the real
# ra8_cgc_* driver, and returns OK -- advancing g_tz_nsc_cgc_usb_match forever.
#
# The probe samples g_tz_nsc_cgc_usb_match twice across the window and requires
# a large advance, which is ONLY reachable if: BLXNS switched to NS state
# (DSCSR.CDS=0), the NSC SG transition worked (no INVEP), and all three veneers
# returned k_ra8_ok. No option-byte programming and no brick risk are involved.
#
# Triage when the probe fails (J-Link halt + read these .ns_bss globals):
#   - g_tz_nsc_cgc_usb_s_fallback_count != 0: secure boot bailed before BLXNS
#     (TZ bring-up regression, NS code never ran).
#   - g_tz_nsc_cgc_usb_init_step < 4 with mismatch == 0: a veneer SG faulted
#     (INVEP) -- check the SAU NSC region / .gnu.sgstubs slot offsets.
#   - g_tz_nsc_cgc_usb_mismatch != 0: a veneer reached Secure but returned
#     non-OK (secure CGC driver error).
HIL_MODE=jlink_memprobe
# The gate now proves the FULL USB CDC self-loop running inside the NS image:
# the NS HS host (USBHS/J7) enumerates the NS FS CDC device (USBFS/J11) over the
# loop cable and bulk-echoes a deterministic pattern, byte-checking every round.
# g_tz_usb_host_rounds_ok advances (~550/s) ONLY after the host read the device
# descriptor (pid 0x000A), SET_ADDRESS, SET_CONFIGURATION, opened the bulk pipes,
# and verified an OUT->device-auto-echo->IN round-trip -- end-to-end proof. A
# boot dwell lets enumeration finish before the probe window opens.
#
# Triage when it fails (J-Link halt + read these globals):
#   - g_tz_usb_state < 5 / g_tz_usb_host_phase < 4: device or host bring-up stuck
#     (read g_tz_usb_host_err, g_tz_usb_pins_err, g_tz_usb_psarb_readback=0x1800).
#   - g_tz_usb_host_pid != 0x000A: host enumerated something unexpected.
#   - g_tz_nsc_cgc_usb_mismatch != 0: an NSC CGC veneer returned non-OK.
HIL_PROBE_SYMBOL="g_tz_usb_host_rounds_ok"
HIL_PROBE_MIN_ADVANCE=50
HIL_PROBE_SECONDS=3
HIL_PROBE_BOOT_S=6
HIL_PROBE_FAILURE_SYMBOL="g_tz_nsc_cgc_usb_mismatch"
HIL_PROBE_MAX_FAILURE=0

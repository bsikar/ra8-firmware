# ra8_emulator HIL gate for ereader_shelf.
#
# The hybrid baked+SD e-reader boots, decodes the baked books' cover art, lays
# out the shelf, and prints a banner digesting the rendered framebuffer. The
# uart_scrape gate matches that banner exactly, so a cover-decode or layout
# regression (not just a failure to boot) trips it. Run without --sd, so only
# the three MRAM-baked books are present (sd=0); the SD path is exercised
# separately (see README).
#
# The banner also pins the CBZ/CBR comic reader (#236): the boot self-check
# decodes page 0 of the baked CBZ + CBR fixtures through the shelf's own
# comic + ra8_img_decode_blit pipeline into an off-screen scratch and hashes
# it -- `cbz=<pages>:<w>x<h>:<crc> cbr=<...>`. Unlike the fb hash, that render is
# an INTEGER pipeline (no float AA), so the comic digest is toolchain-INDEPENDENT
# and identical on host / ra8_emulator / silicon -- the exact value the standalone
# ereader_comic gate produces (733D076C). `rtl=OK` confirms the manga (RTL) edge
# mapping mirrors LTR. The comic self-check decodes into a scratch buffer, so the
# shelf render (and its fb hash) is untouched.
#
# GOLDEN PROVENANCE -- pinned toolchain only for the `fb=` field. The fb hash is
# TOOLCHAIN-BOUND: the shelf's text rasterization (float AA coverage) legitimately
# differs by arm-gcc codegen, confirmed on real silicon (same board, SD inserted:
# 13.3-built prints fb=A1A1CB11, 14.3-built prints fb=CDCAA33F). This is the
# same reproducible-codegen reality that pins Arm GNU 13.3 repo-wide (#178).
# 0ADB62C6 below is the sd=0 render of a 13.3.rel1 build (the pinned CI
# toolchain); the previous golden FA3AB5B5 was minted from an unpinned 14.3
# build and could never pass on a pinned runner. Re-mint the fb value ONLY from
# a 13.3 build (and update it together with any deliberate re-bake of the
# committed library.h fixture). The cbz/cbr/rtl fields are toolchain-independent.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-shelf: books=3 sd=0 fb=0ADB62C6 cbz=2:160x106:733D076C cbr=2:160x106:733D076C rtl=OK ok"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

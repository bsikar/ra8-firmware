# pagecache HIL gate.
#
# Exercises the reflow import-time pagination cache (reflow_cache, #79)
# end to end against a real microSD volume through ra8_fs: lay a fixed chapter
# out live with an SD-loaded font, serialize the paginated result to a blob,
# persist it to the card, read it back, reload it into a fresh engine, and
# assert the reloaded blob is byte-for-byte equal to the live one; then load the
# same blob at a different font size and assert it invalidates (key mismatch,
# no stale page); g_pc_hit reflects whether the cache file already existed at
# boot (reset-survival).
#
# The gate is memprobe, not uart_scrape: an SD app drives the SCI0 Simple-SPI
# bus and ra8_emulator folds every SCI channel into one console line, so a SCI8
# banner is interleaved with SPI bytes there (the same reason sd_font_render /
# epub_open gate on SWD globals). g_pc_heartbeat advances once per ~100 ms
# and ONLY after every assertion (round-trip CRC match + invalidation) passes;
# any failure parks in WFI without bumping it and stamps g_pc_err. So a steadily
# advancing g_pc_heartbeat with g_pc_err == 0 proves the whole
# SD -> ra8_fs -> reflow_cache round-trip ran clean.
#
# Bring-up (SD card init + FAT mount + font read + stb_truetype layout) takes a
# while before the idle loop starts, so the probe dwells first, then asserts
# g_pc_heartbeat advances at least 10 times in a 5 s window (~10 Hz). A reset
# drops the counter to 0, so a backwards / frozen counter fails the check.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_pc_heartbeat"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=5
HIL_PROBE_BOOT_S=15
HIL_PROBE_FAILURE_SYMBOL="g_pc_err"
HIL_PROBE_MAX_FAILURE=0

# epub_open HIL gate (#114).
#
# Opens a real .epub off a microSD card through ra8_fs and runs the epub parse
# stack on it: brings up the Pmod2 SD over ra8_sdmmc_spi, mounts an ra8_fs volume
# (formatting FAT32 first if the card is blank), self-provisions a known
# 2-chapter .epub (the seed_two_chapters seed) if absent, then the streamed
# epub_open_streamed_fs (#230)
# + chapter-count + chapter-0 DEFLATE load + byte-exact CRC + metadata.
#
# An SD app drives the SCI0 Simple-SPI bus, and ra8_emulator folds every SCI channel
# into one console line, so the SCI8 banner is interleaved with SPI traffic there
# -- the same reason the sibling SD HIL apps (sd_font_render, fs_format_mount)
# gate on SWD globals rather than the console. So this gate is memprobe:
#   - g_eoh_heartbeat advances (~10 Hz) ONLY on the success idle loop, which is
#     reached only after every assertion passed (chapters == 2, chapter-0 CRC ==
#     0xCF23AEEE, non-empty title); the failure path parks without bumping it.
#   - g_eoh_err stays 0 (any failing stage stamps a non-zero code there).
# A steadily-advancing heartbeat with g_eoh_err == 0 therefore proves the whole
# SD -> ra8_fs -> epub open/parse pipeline ran and the bytes were correct.
#
# Validated headless on ra8_emulator: --sd-new 64:fat32 (blank, provision path) and
# a persisted --sd image (already-present path) both leave g_eoh_heartbeat
# advancing, g_eoh_err 0, g_eoh_chapters 2, g_eoh_crc 0xCF23AEEE.
#
# SD bring-up (CMD0/CMD8/ACMD41 at the slow init clock) + provision + parse takes
# a few seconds, so the probe dwells before asserting the advance.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_eoh_heartbeat"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=5
HIL_PROBE_BOOT_S=12
HIL_PROBE_FAILURE_SYMBOL="g_eoh_err"
HIL_PROBE_MAX_FAILURE=0

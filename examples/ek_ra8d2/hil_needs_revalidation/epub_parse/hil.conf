HIL_MODE=uart_scrape
# epub_parse opens a baked 2-chapter .epub entirely in memory and runs the
# ra8_epub parse stack on-target. It exercises BOTH miniz allocation paths through
# the zero-heap ra8_epub_miniz_alloc static arena -- mz_zip_reader_init_mem (the
# ZIP central directory) and mz_zip_reader_extract_to_mem (the DEFLATE
# decompressor) -- plus caller-workspace XML parsing of container.xml + the OPF
# spine. The probe then CRC-32s chapter 0's
# decompressed XHTML and prints a deterministic banner.
#
# The CRC is byte-exact for the baked seed (0xCF23AEEE == zlib.crc32 of
# OEBPS/chapter1.xhtml), so pinning the full banner gates the entire decompress
# path, not merely "it booted". The parse is a fixed blob through a deterministic
# parser, so the banner is identical on ra8_emulator and silicon.
HIL_EXPECT="epub: chapters=2 ch0_crc=CF23AEEE PASS"
HIL_EXPECT_NEGATIVE="epub: FAIL|HardFault|hw_init_failed|cgc_init"
HIL_TIMEOUT_S=15

# ra8_io compression layer round-trip (#155/#156). The demo compresses a 4096-byte
# payload through the ra8_io miniz seam, stores the blob across the RAM (`ram:`)
# and SDRAM (`dr:`) backends, then inflates it and asserts a byte-exact 4096-byte
# round-trip, reporting the compressed length over the SCI8 / J-Link OB VCOM
# console. The on-chip SRAM plus the on-board 64 MB SDRAM are all that is needed,
# so this is bench-runnable on a stock EK-RA8D2 (no SD / panel). The compressed
# length is data-dependent, so the gate scrapes the deterministic trailing literal
# printed only on the success path; a miscompare prints "compress_demo:
# FAIL", which the negative regex catches.
HIL_MODE=uart_scrape
HIL_EXPECT="bytes -> 4096 round-trip PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

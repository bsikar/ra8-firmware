# Periodic-app deep-idle loop (#153): each period does a unit of work, prints
# "lpm_periodic_idle: work" over the SCI8 / J-Link OB VCOM console, arms ULPT0
# (confirming ULPTCR.TCSTF = 1), drops into Software Standby (LPSCR.LPMD = 0x5),
# and is self-woken by the ULPT0 underflow through the two-halves ICU path.
# After k_lpi_period_count = 8 periods it emits the PASS banner and parks.
# Crystal-free (ULPTLCLK/LOCO), so it runs on a stock EK-RA8D2.
#
# SILICON-VALIDATED. It previously emitted NO UART at all on the bench and the
# failure was read as "ULPT periodic wake not firing". The wake path was never
# broken: ra8_isr_dispatch cleared the ICU interrupt-status flag by ORing a 1
# into IELSRn.IR, but HUM Ch 14.2.17 p 547 states the IR flag "is cleared to 0
# by writing 0" -- writing a 1 can never clear it. The flag stayed set, the ICU
# re-asserted the request the moment the handler returned, and the core
# live-locked in an interrupt storm that starved the main loop before it could
# print. Bench proof: the CPU sat in IRQ0_Handler with IELSR0 = 0x00010080 (IR
# set); writing IR = 0 over J-Link released it and the app printed immediately.
# ra8_isr_dispatch now masks the IR bit off instead.
#
# ra8_emulator reproduces it: its ICU model had the IR polarity inverted (RW1C),
# which silently satisfied the driver's write-1. board_periph.c now models the
# real W0C behaviour, so the storm shows up in the emulator too.
#
# RECOVERY NOTE: the app cycles through Software Standby 8 times. A J-Link halt
# issued mid-Standby can be refused; the timer self-wakes every ~0.5 s so the
# PASS still appears, and the app parks in a normal loop (not Standby) after
# PASS, so the next flash halts cleanly.
HIL_MODE=uart_scrape
HIL_EXPECT="lpm_periodic_idle PASS"
HIL_EXPECT_NEGATIVE="hw_init_failed|cgc_init failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

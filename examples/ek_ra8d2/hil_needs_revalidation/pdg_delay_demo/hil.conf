# PDG bring-up gate. Validated on a real EK-RA8D2 (2026-06-28): the PDG
# DLL locks and channel 0 reads back powered + un-bypassed (cfg=ok). The
# delay code register GTDLYRnA is write-staged but is NOT read-exposed on
# silicon (it returns its 0x0000 reset value to both firmware and a J-Link
# debugger; FSP never reads it back), so this gate validates the bring-up
# state, not a delay read-back. The PDG's actual effect -- shifting a GPT
# output edge in time -- has no software-readable status and needs a
# running GPT32_0 PWM source + a scope / logic analyzer to measure (out of
# scope; see README). tools/board_sim shadows GTDLYRnA as plain R/W, so the
# emulator sees the same cfg=ok.
HIL_MODE=uart_scrape
HIL_EXPECT="pdg: dll=on ch0=on delay=0x40 cfg=ok"
HIL_EXPECT_NEGATIVE="cfg=BAD|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

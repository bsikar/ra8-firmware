HIL_MODE=uart_scrape
# Demo walks the WUPEN0 / WUPEN1 wake-source enable bits via
# ra8_lpm_arm_wupen0_bits / ra8_lpm_arm_wupen1_bits and prints two
# banner lines (boot + done). The HIL gates on the longer of the two
# to confirm the walk completed.
HIL_EXPECT="lpm_wake_matrix: done"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|lpm.*failed|cgc_init failed"
HIL_TIMEOUT_S=15

# After this test the chip is in a deep-LPM state that gates the
# AHB-AP; hil_all.sh runs rfp-cli -erase-chip (Initialize) before
# the next app's flash. See docs/RECOVERY_OEM_PL0_BRICK.md.
HIL_POST_INITIALIZE=1

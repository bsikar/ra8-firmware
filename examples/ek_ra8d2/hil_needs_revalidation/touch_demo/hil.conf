# Standalone GoodIX GT911 touch bring-up gate (#122). The app brings up the
# real ra8_touch -> IIC_B -> GT911 path (I2C probe + product-id wake), then polls
# for a touch frame. The deterministic, finger-free assertion is the bring-up
# line "touch: open=OK" -- it proves the driver reached the GT911 product-id
# check on silicon. (ra8_emulator additionally injects a tap via --click and the
# banner then carries a real decoded x/y; on a bare bench with no finger the
# poll loop reports pts=0 but open=OK still holds.) A bring-up failure prints
# "touch: FAIL open" and halts on a BKPT before this line.
HIL_MODE=uart_scrape
HIL_EXPECT="touch: open=OK"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|hw_init"
HIL_TIMEOUT_S=15

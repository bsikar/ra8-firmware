HIL_MODE=uart_scrape
# Drives each ra8_mem (#147) memory-hierarchy layer in isolation (#263) and
# prints one deterministic banner of the observables:
#
#   mem: slab_free=8 arena_free=4096 tile_evict=5 vmem_crc=D1E67963 PASS
#
# - slab_free=8   : after alloc-to-exhaustion + free-3, a slab reset (re-init)
#                   returns every one of the 8 cells to the freelist.
# - arena_free=4096: after two aligned carves + an over-subscribed carve that
#                   fails, an arena reset (re-init) frees the whole 4 KiB region.
# - tile_evict=5  : 8 distinct tiles faulted through a 4-cell tile cache force
#                   LRU eviction (4 during the overfill + 1 re-fault of the
#                   first, long-evicted tile). hits=4, misses=9 are asserted too.
# - vmem_crc=D1E67963: CRC-32 of the byte windows read back through a 4-frame
#                   (2 KiB-resident) page cache fronting a 1 MiB synthetic
#                   backing object -- proving paging, not residency. Windows
#                   cross frame boundaries, clamp at EOF, and read past EOF.
#
# Every value is computed by the deterministic ra8_mem library with no MMIO, so
# the banner is byte-identical on the host unit test, board_sim, and silicon --
# pinning the full banner gates the whole memory subsystem, not merely "it
# booted". Any layer failing prints a "mem: FAIL <layer>" banner and traps on a
# BKPT before PASS, which the negative regex (plus a HardFault guard for a bad
# bring-up) catches fast instead of waiting out the timeout.
HIL_EXPECT="mem: slab_free=8 arena_free=4096 tile_evict=5 vmem_crc=D1E67963 PASS"
HIL_EXPECT_NEGATIVE="mem: FAIL|HardFault|hw_init_failed|cgc_init"
HIL_TIMEOUT_S=15

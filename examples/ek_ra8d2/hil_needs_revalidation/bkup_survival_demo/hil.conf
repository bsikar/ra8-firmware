# VBATT backup-register read/write + reset-survival gate (#131).
#
# SILICON-VALIDATED. The demo writes a pattern to VBTBKR0..29, reads it
# back, and reports "rw=ok"; it also plants a sentinel so a later boot
# reports "survived=Y", proving the VBATT domain retained state across a
# CPU reset (bench-confirmed: boot after flash prints survived=N, a
# following reset prints survived=Y).
#
# ROOT CAUSE of the long-standing rw=BAD: every VBT* register is listed
# under PRCR.PRC1 in HUM Ch 13.1 Table 13.1 p 520-521, and ra8_bkup.c
# issued its writes with PRCR locked. A write to a protected register
# while its group is locked is discarded silently -- no bus fault, no
# status bit -- so VBTBKRn stayed all-zero. Bench proof: writing VBTBKR0
# over J-Link with PRCR locked reads back 0x00000000; after PRCR = 0xA502
# the identical write reads back intact. The driver now wraps every write
# in RA8_PROTECTED_WRITE with the group HUM Table 13.1 assigns (PRC1 for
# the VBT* file, PRC3 for VBATTMNSELR, PRC4 for the attribution
# registers). The OFS1.PVDAS option byte, previously blamed for this, is
# NOT involved: PVDAS governs the battery power-supply switch, and on the
# EK-RA8D2 VBATT is tied to VCC with the switch stopped.
#
# ra8_emulator reproduces the failure: board_periph_prcr.c snoops PRCR and
# board_periph_bkup.c drops VBTBKRn writes while PRC1 is locked, so the
# pre-fix firmware reports rw=BAD in the emulator exactly as on the bench.
HIL_MODE=uart_scrape
HIL_EXPECT="bkup: rw=ok"
HIL_EXPECT_NEGATIVE="rw=BAD|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

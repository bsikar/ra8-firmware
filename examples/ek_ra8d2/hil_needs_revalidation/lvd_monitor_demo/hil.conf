# LVD / PVD VCC-monitor gate. Validated on a real EK-RA8D2 (2026-06-28):
# a healthy 3.3 V rail sits above the 2.80 V threshold, so PVD1SR.MON reads
# "above" and the success banner below appears once a second. tools/board_sim
# models the PVD via board_periph_lvd.c, so the headless smoke gate sees the
# same ok=Y banner.
HIL_MODE=uart_scrape
HIL_EXPECT="lvd: pvd1 thr=2.80V mon=above det=0 ok=Y"
HIL_EXPECT_NEGATIVE="mon=below ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

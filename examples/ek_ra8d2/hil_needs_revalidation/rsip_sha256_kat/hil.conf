HIL_MODE=uart_scrape
# Emits "rsip sha256: KAT OK" once per second when the RSIP hardware HASH
# engine matches all three FIPS 180-4 vectors, or "rsip sha256: KAT FAIL" on
# any miscompare / engine error. The negative regex (plus a HardFault guard for
# a bad RSIP bring-up) fails the probe fast instead of waiting the timeout.
HIL_EXPECT="rsip sha256: KAT OK"
HIL_EXPECT_NEGATIVE="rsip sha256: KAT FAIL|HardFault|hw_init_failed"
HIL_TIMEOUT_S=15

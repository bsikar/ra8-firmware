HIL_MODE=uart_scrape
# Emits "rsip sha256: backend=software KAT OK" once per second when the
# observable software backend matches all FIPS 180-4 vectors and confirms
# hardware backend remains honestly reported as unsupported.
HIL_EXPECT="rsip sha256: backend=software KAT OK"
HIL_EXPECT_NEGATIVE="rsip sha256: backend=software KAT FAIL|rsip sha256: backend=hardware|HardFault|hw_init_failed"
HIL_TIMEOUT_S=15

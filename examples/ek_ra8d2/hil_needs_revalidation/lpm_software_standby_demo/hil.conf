HIL_MODE=uart_scrape
# Firmware emits "lpm_swstd: boot" right before it enters Software
# Standby. The wake path (RTC alarm via WUPEN0.RTCALM) only works
# when the EK-RA8D2 sub-clock crystal (SOSC) is actually ticking; on
# this EVM the crystal is known to be intermittent, so we gate on
# the boot banner only. The 15-char banner clears the 12-char short-
# string sanity check.
HIL_EXPECT="lpm_swstd: boot"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|lpm.*failed|cgc_init failed|rtc.*failed"
HIL_TIMEOUT_S=15

# After this test the chip is in a deep-LPM state that gates the
# AHB-AP; hil_all.sh runs rfp-cli -erase-chip (Initialize) before
# the next app's flash. See docs/RECOVERY_OEM_PL0_BRICK.md.
HIL_POST_INITIALIZE=1

# POEG (Port Output Enable for GPT) safe-shutoff gate. The demo drives GPT0 in
# saw-PWM, then every second asserts the software output-disable request
# (POEGG.SSF), confirms the derived output-disable STATE flag POEGG.ST latched
# (GPT outputs high-impedance), clears the request, and confirms ST fell back to
# 0 (outputs re-enabled) while the GPT counter kept advancing. It reports the
# ok=Y banner once a cycle.
#
# tools/ra8_emulator models the POEG register file (board_periph_poeg.c): a SSF
# write latches ST and clearing every request flag clears it, so the headless
# smoke gate observes the same assert -> high-Z -> clear -> re-enable transition
# a real POEG STATE latch produces -- with no board attached. HIL_EXPECT_NEGATIVE
# catches the fault banner (ok=N) and any HardFault / init failure.
HIL_MODE=uart_scrape
HIL_EXPECT="poeg: pwm=run shutoff=highZ reenable=on ok=Y"
HIL_EXPECT_NEGATIVE="ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

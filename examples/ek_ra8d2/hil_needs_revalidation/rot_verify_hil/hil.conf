HIL_MODE=uart_scrape
# Prints "rot verify: PASS" once per second when the genuine signed fixture
# verifies AND a tampered copy is rejected, via the real ra8_rot ECDSA-P256
# chain on tf-psa-crypto. Any "(bug)" line or "FAIL" or HardFault fails.
HIL_EXPECT="rot verify: PASS"
HIL_EXPECT_NEGATIVE="rot verify: FAIL|(bug)|HardFault"
HIL_TIMEOUT_S=20

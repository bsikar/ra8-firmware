# ra8_cache_store_demo: the ra8_cache_store on-media render/glyph cache exercised
# directly (#257). The whole persistent-cache path -- LevelX standalone + the
# ra8_cache_store key->blob index on top of it -- runs over a RAM-backed NOR
# driver (src/lx_nor_ram.c) that lives entirely in SRAM. No peripheral register
# is touched by the cache path, so the ra8_emulator (EIL) run executes byte-identical
# instructions to on-silicon: SIM equals HIL by construction.
#
# uart_scrape on the success-only banner main() prints after the demo runs once:
# format + mount, put/get four keyed blobs, pin one, force an eviction, verify the
# survivors, re-put into the reclaimed sectors, checkpoint-close, then re-mount
# over the same media and confirm the survivors + pin persisted and the evicted
# key stayed gone. A PASS banner proves the entire round-tripped end to end.
#
# survivors=4 (cover atlas + tiles A, C, and the re-put tile D); tile B was the
# forced eviction. evicted_gone=1 and pin=1 assert the on-media persistence of the
# eviction and the pin across the remount.
HIL_MODE=uart_scrape
HIL_EXPECT="[rcs] cache_store demo PASS survivors=4 evicted_gone=1 pin=1"
HIL_EXPECT_NEGATIVE="\[rcs\] cache_store demo FAIL|hw_init_failed|HardFault"
HIL_TIMEOUT_S=20

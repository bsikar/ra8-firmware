# epub_toc HIL gate (#116).
#
# Runs the epub table-of-contents path on the M85 against real .epub files on
# microSD (building on epub_open, #114). It self-provisions three baked books
# and parses each TOC:
#   - TOCNCX.EPB (EPUB2 NCX):  toc_kind == ncx(1), toc_count == 2,
#     crc32(entry0 label "Intro") == 0xDBC4EA24, entry0 -> spine index 0.
#   - TOCNAV.EPB (EPUB3 nav):  toc_kind == nav(2), toc_count == 3,
#     crc32(entry0 label "Cover") == 0x4CC9A9C1, entry0 -> spine index 0.
#   - TOCBAD.EPB (no TOC doc):  toc_kind == none(0), spine still readable
#     (chapter_count == 2) -- graceful degradation, no HardFault.
#
# An SD app drives the SCI0 Simple-SPI bus, and ra8_emulator folds every SCI channel
# into one console line, so the SCI8 banner is interleaved with SPI traffic there
# -- the same reason the sibling SD HIL apps (epub_open, sd_font_render,
# fs_format_mount) gate on SWD globals rather than the console. So this gate is
# memprobe:
#   - g_etoc_heartbeat advances (~10 Hz) ONLY on the success idle loop, reached
#     only after all three books' assertions pass; every failure path parks
#     without bumping it.
#   - g_etoc_err stays 0 (any failing stage stamps a non-zero code there).
# A steadily-advancing heartbeat with g_etoc_err == 0 therefore proves both the
# NCX and nav TOC code paths plus the malformed-TOC fallback ran on real SD bytes.
#
# Validated headless on ra8_emulator (--sd-new 64:fat32), deterministic across runs:
# g_etoc_err 0, ncx (1/2/0xDBC4EA24/0), nav (2/3/0x4CC9A9C1/0), bad (0/2),
# g_etoc_heartbeat advancing.
#
# SD bring-up + provision (three writes) + three parses takes a few seconds, so
# the probe dwells before asserting the advance.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_etoc_heartbeat"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=5
HIL_PROBE_BOOT_S=12
HIL_PROBE_FAILURE_SYMBOL="g_etoc_err"
HIL_PROBE_MAX_FAILURE=0

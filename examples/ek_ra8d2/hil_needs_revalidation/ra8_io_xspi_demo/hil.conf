# ra8_io block-device backend over the on-board 64 MB Octo-SPI (xSPI) flash
# (#155/#156). The demo mounts the `xs:` backend, writes then reads back a
# 256-byte file at xs:/CFG/SET.BIN against the EK-RA8D2's external OSPI flash, and
# reports the verdict over the SCI8 / J-Link OB VCOM console. The OSPI flash is
# fitted on the stock EK-RA8D2, so this is bench-runnable with no add-on hardware.
# The banner below is emitted only on a byte-exact round-trip; a failure prints
# "ra8_io_xspi_demo: FAIL", which the negative regex catches. NOTE: this programs
# the on-board OSPI flash (non-volatile).
#
# PROMOTED (#170). The demo used to fail on silicon with `mount Error=1281`
# (0x501): it called ra8_xspi_init(), which programs CGC/MSTP and the OSPI
# controller registers only, but never routed the 12 OCTA bus pins to their
# peripheral function or strobed the IS25LX512M RESET_L. No clock, CS or data
# reached the flash, so the mount read a floating bus. demo_run() now calls
# ra8_board_xspi_pins_init() first -- the same helper, in the same order, that
# the already-validated threadx_levelx_demo uses. Bench: PASS.
#
# The promotion had previously been reverted because that helper strobes RESET_L
# with a 16 ms ra8_delay_ms (tRLRH + tPUW) and board_sim was believed unable to
# simulate the busy-wait cheaply. That is no longer true, and the fix needed no
# firmware change: board_sim models DWT_CYCCNT as a real free-running counter
# (dwt_cyccnt_advance in sim_exc_scs.c, 500000 cycles charged per outer chunk at
# ~1 IPC), so the spin's exit condition is satisfied by a modelled counter
# advancing rather than by the firmware taking a different path under
# simulation. This demo never clears PRIMASK, so ra8_delay_ms takes exactly that
# CYCCNT path: 16 ms x 1e6 cycles/ms / 5e5 cycles per chunk = 32 chunks. Measured
# end to end, the app reaches its PASS banner in 44 chunks / 0.7 s of wall time.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_xspi_demo: xs:/CFG/SET.BIN 256 bytes PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

# Headless on-silicon gate for reflow book-content render + pagination (#115):
# paginate a multi-paragraph chapter into a 160x192 RGB565 framebuffer, render
# every page + FNV-hash the output, then reflow_set_font_size() to re-flow at
# a larger size and render again. The banner reports the page count + render
# hash at each size. Ahem's fixed metrics make it deterministic; the same banner
# appears on host, ra8_emulator, and silicon (and is stable across resets). No
# panel/SD/touch needed.
HIL_MODE=uart_scrape
HIL_EXPECT="reflow-content-hil: pages=14 crc=D211DBC5 rpages=33 crc=62C68DC5"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

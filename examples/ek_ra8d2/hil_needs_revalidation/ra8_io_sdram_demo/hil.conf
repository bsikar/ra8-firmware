# ra8_io block-device backend over the on-board 64 MB SDRAM (#155/#156). The demo
# mounts the `dr:` (SDRAM) backend at 0x68000000, writes/reads 128 bytes at
# dr:/HELLO.TXT, then exercises mkdir + a nested write at dr:/SUB/NOTE.TXT, and
# reports each stage over the SCI8 / J-Link OB VCOM console. The SDRAM is part of
# the stock EK-RA8D2 (no add-on board), so this is bench-runnable. The final
# banner below is emitted only once the mkdir + nested round-trip passed; a
# failing stage prints "ra8_io_sdram_demo: ... FAIL", which the negative regex
# catches.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_sdram_demo: mkdir+nested dr:/SUB/NOTE.TXT PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

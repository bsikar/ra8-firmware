HIL_MODE=uart_scrape
# c6_fw_version completes an esp-hosted RPC round-trip against the ESP32-C6 on
# Pmod1/J26 and checks the ANSWER, not merely that bytes moved: the response's
# UID must be the request's, its result code zero, its firmware version equal
# to the vendored host driver's own (esp_hosted_host_fw_ver.h, 2.12.11) and its
# chip id ESP_PRIV_FIRMWARE_CHIP_ESP32C6. The PASS banner below is printed only
# after all four hold, so it is the success-only line this gate keys on.
#
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF -- see the tier
# README. SW4-3 ON is what connects J26-1..J26-4 to the MCU at all. This app is
# therefore in the `c6` tier, run by `make hil-c6`, and NOT in the default HIL
# pass, whose apps need SW4-4 ON for Arduino / mikroBUS.
#
# The negative regex catches every FAIL branch the app can print plus a port
# that never came up. It deliberately does NOT trip on `ifnum_defect=1`: that
# counter reports a co-processor-side checksum defect on its bootup
# ESP_PRIV_IF INIT event (#529), which the app diagnoses by name and which does
# not affect the RPC path this gate is about.
HIL_EXPECT="c6_fwver: PASS esp-hosted RPC round-trip"
HIL_EXPECT_NEGATIVE="c6_fwver: FAIL|port init failed|HardFault"
HIL_TIMEOUT_S=30

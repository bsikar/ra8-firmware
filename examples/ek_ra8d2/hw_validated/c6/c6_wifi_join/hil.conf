HIL_MODE=uart_scrape
# c6_wifi_join is #492: it drives the ESP32-C6 on Pmod1/J26 through
# libs/ra8_c6link, associates the Wi-Fi station with the bench access point,
# runs a NetX Duo DHCP client over the nx_ether_driver_c6 link driver to obtain
# a lease, and pings the leased gateway. The PASS banner below is printed only
# after the association completed AND DHCP bound an address, so it is the
# success-only line this gate keys on. (A DHCP lease is itself proof the link
# passes traffic both ways -- DISCOVER/OFFER/REQUEST/ACK is a full round trip --
# so the gateway ping is reported as an extra "reachability" line, not gated on.)
#
# TWO bench preconditions beyond the c6 harness:
#   1. The image must be built WITH credentials -- RA8_C6_WIFI_SSID and
#      RA8_C6_WIFI_PSK in the environment or coprocessor/esp32c6/wifi.env (the
#      PSK is in OpenBao at secret/ra8d2/bench-network). Built without them the
#      firmware prints "no Wi-Fi credentials compiled in" and this gate fails by
#      design -- a committed image never carries a credential.
#   2. The bench access point must be in RF range of the C6.
#
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF -- see the tier
# README. SW4-3 ON is what connects J26-1..J26-4 to the MCU at all. This app is
# in the `c6` tier, run by `make hil-c6`, and NOT in the default HIL pass.
#
# Repeatable from any co-processor state: readiness is established with an RPC
# round-trip (ra8_c6link_await_ready), not the once-per-boot Event_ESPInit.
HIL_EXPECT="c6_join: PASS ra8_c6link joined the bench Wi-Fi and DHCP leased an address"
HIL_EXPECT_NEGATIVE="c6_join: FAIL|no Wi-Fi credentials|port init failed|HardFault"
HIL_TIMEOUT_S=75

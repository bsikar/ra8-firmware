HIL_MODE=uart_scrape
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF -- see the tier
# README. SW4-3 ON connects J26 to the MCU. Repeatable across host resets:
# ble_hci_c6link enables the co-processor BT controller cleanly via
# Req_FeatureControl (recovering from stale INITED/ENABLED state if needed).
HIL_EXPECT="c6_ble: PASS ble_hci_c6link"
HIL_EXPECT_NEGATIVE="c6_ble: FAIL|port init failed|HardFault"
HIL_TIMEOUT_S=45

HIL_MODE=uart_scrape
# wifi_hal_join is the HAL-way twin of c6_wifi_join (#492): it drives the same
# ESP32-C6 on Pmod1/J26, but every Wi-Fi operation goes through the ra8_wifi
# facade (ra8_wifi_init / connect / wait_ip) instead of ra8_c6link directly. It
# associates the station with the bench access point and runs a NetX Duo DHCP
# client -- supplied to the facade as the ip_bind provider -- to obtain a lease.
# The PASS banner below is printed only after association completed AND DHCP
# bound an address, so it is the success-only line this gate keys on. (A DHCP
# lease is itself proof the link passes traffic both ways.)
#
# TWO bench preconditions beyond the c6 harness:
#   1. The image must be built WITH credentials -- RA8_C6_WIFI_SSID and
#      RA8_C6_WIFI_PSK in the environment or coprocessor/esp32c6/wifi.env (the
#      PSK is in OpenBao at secret/ra8d2/bench-network). Built without them the
#      firmware prints "no Wi-Fi credentials compiled in" and this gate fails by
#      design -- a committed image never carries a credential.
#   2. The bench access point must be in RF range of the C6.
#
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF -- see the tier
# README. SW4-3 ON is what connects J26-1..J26-4 to the MCU at all. This app is
# in the `c6` tier, run by `make hil-c6`, and NOT in the default HIL pass.
#
# Repeatable from any co-processor state: readiness is established with an RPC
# round-trip (inside ra8_wifi_init), not the once-per-boot Event_ESPInit.
HIL_EXPECT="wifi_hal: PASS ra8_wifi joined the bench Wi-Fi and DHCP leased an address"
HIL_EXPECT_NEGATIVE="wifi_hal: FAIL|no Wi-Fi credentials|port init failed|HardFault"
HIL_TIMEOUT_S=75

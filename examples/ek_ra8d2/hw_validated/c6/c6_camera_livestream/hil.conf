# Dedicated verifier builds in a temporary tree so the firmware's Wi-Fi
# credentials never persist under the source tree. It then cold-starts the C6,
# verifies the SPI link, boots this app, probes /health and requires two
# decodable, changing JPEG frames.
HIL_MODE=c6_camera_livestream
HIL_SELF_BUILD=1
HIL_FRAME_WIDTH=320
HIL_FRAME_HEIGHT=240

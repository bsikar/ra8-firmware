# Dedicated verifier builds a credential-free image in a temporary tree, then
# provisions Wi-Fi over UART after the READY prompt. It cold-starts the C6,
# verifies the SPI link, probes /health, and requires two decodable, changing
# JPEG frames.
HIL_MODE=c6_camera_livestream
HIL_SELF_BUILD=1
HIL_FRAME_WIDTH=320
HIL_FRAME_HEIGHT=240

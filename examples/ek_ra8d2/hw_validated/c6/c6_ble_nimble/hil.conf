HIL_MODE=uart_scrape
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF -- see the tier
# README. SW4-3 ON connects J26 to the MCU. Repeatable across host resets:
# ble_hci_c6link initializes the C6 BLE controller, NimBLE runs HCI sync and
# GAP/GATT Battery Service setup, starts connectable advertising as EK-RA8D2,
# and logs incoming central connections (conn_handle=...).
HIL_EXPECT="c6_nimble: PASS nimble_c6_peripheral ready"
HIL_EXPECT_NEGATIVE="c6_nimble: FAIL|port init failed|HardFault"
HIL_TIMEOUT_S=45

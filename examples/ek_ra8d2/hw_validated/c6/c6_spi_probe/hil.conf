HIL_MODE=uart_scrape
# c6_spi_probe drives the SCI2 Simple-SPI bus directly -- no port, no vendored
# driver -- to qualify the physical link: it characterises every J26 hole,
# hunts for the pin the co-processor answers chip-select on, then clocks
# esp-hosted transactions at a deliberately slow 1 MHz and classifies what
# comes back. It is the bench's negative control: when a higher app fails,
# this one separates "the wire is wrong" from "the firmware is wrong".
#
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF; see the tier
# README. Run by `make hil-c6`, and run it FIRST when triaging.
HIL_EXPECT="c6_probe: PASS esp-hosted link up"
HIL_EXPECT_NEGATIVE="c6_probe: FAIL|HardFault"
HIL_TIMEOUT_S=45

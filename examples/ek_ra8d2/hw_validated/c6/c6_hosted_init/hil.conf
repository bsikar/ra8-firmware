HIL_MODE=uart_scrape
# c6_hosted_init brings port/esp-hosted/ up under ThreadX, prints the pin map
# and interrupt routing it resolved, samples both side-band lines through the
# OS-abstraction vtable and clocks exactly one full-duplex transaction. The
# PASS banner is printed only when the transfer returned RET_OK, the receive
# buffer was actually driven, and the frame that came back was either a
# verified data frame or the co-processor's idle filler -- the answer a healthy
# co-processor with nothing queued gives.
#
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF; see the tier
# README. Run by `just hil::c6`.
HIL_EXPECT="c6_hosted_init: PASS link up"
HIL_EXPECT_NEGATIVE="c6_hosted_init: FAIL|port init failed|HardFault"
HIL_TIMEOUT_S=20

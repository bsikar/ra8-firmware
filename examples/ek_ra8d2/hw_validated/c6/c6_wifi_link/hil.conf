HIL_MODE=uart_scrape
# c6_wifi_link drives the ESP32-C6 on Pmod1/J26 through libs/ra8_c6link, the
# facade every consumer is meant to use, and takes the co-processor's Wi-Fi
# station all the way up: Req_WifiInit, Req_SetWifiMode, Req_WifiStart, then
# Req_GetMACAddress, then the teardown pair. The PASS banner below is printed
# only after every one of those was accepted AND the identity check against
# esp_hosted_host_fw_ver.h passed, so it is the success-only line this gate
# keys on.
#
# The reason this app exists on the bench rather than only in host tests: the
# twenty scalars Req_WifiInit carries (magic word, buffer counts, aggregation
# flags) are validated by the co-processor's own esp_wifi_init(), which no host
# test can stand in for. A FAIL here prints the co-processor's esp_err_t
# verbatim, which is the number a fix would be based on.
#
# No network is joined: association needs an AP in range and belongs to #492.
#
# REQUIRES the C6 harness on J26 and SW4 1=OFF 2=OFF 3=ON 4=OFF -- see the tier
# README. SW4-3 ON is what connects J26-1..J26-4 to the MCU at all. This app is
# therefore in the `c6` tier, run by `make hil-c6`, and NOT in the default HIL
# pass, whose apps need SW4-4 ON for Arduino / mikroBUS.
#
# The negative regex catches every FAIL branch the app can print plus a port
# that never came up.
#
# This app does NOT need the C6 to have been power-cycled. An earlier revision
# waited for the `Event_ESPInit` boot announcement, which the co-processor
# emits once when IT boots -- and the C6 has its own supply, so resetting this
# board does not reboot it. That made the run pass exactly once, on a
# freshly-flashed co-processor, and time out on every run after.
# `ra8_c6link_await_ready()` asks the co-processor a question instead, so this
# app is repeatable from any co-processor state and a red here is a real red.
HIL_EXPECT="c6_wifi: PASS ra8_c6link drove the coprocessor station up"
HIL_EXPECT_NEGATIVE="c6_wifi: FAIL|port init failed|HardFault"
HIL_TIMEOUT_S=45

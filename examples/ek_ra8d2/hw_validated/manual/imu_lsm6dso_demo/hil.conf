# REQUIRES the IMU 12 Click (MikroE, ST LSM6DSO) to be soldered to the
# EVM. The EK-RA8D2 does not carry a native MikroBUS socket; this app
# assumes the LSM6DSO's SDA/SCL pads are wired to the Pmod1 I2C side
# (P511/SDA1 + P512/SCL1, UM Table 17 p 26). Until the part is soldered
# and powered, the firmware will probe and report:
#
#     lsm6dso: I2C NAK
#
# and this HIL test will fail.
HIL_MODE=uart_scrape
HIL_EXPECT="lsm6dso: who_am_i=0x6c"
HIL_TIMEOUT_S=10

# threadx_canfd_demo runs two ThreadX threads (TX heartbeat @ 500 ms,
# RX poll @ 50 ms) that currently only toggle LEDs -- the CAN-FD path
# is stubbed -- so the counter proves scheduler liveness, not CAN
# throughput. Combined cadence is ~22 increments/s. The probe asserts:
#   - g_threadx_canfd_match advances at least 40 times in a 5 s window
# When the stub is replaced with real CANFD TX/RX, add a
# g_threadx_canfd_mismatch failure-symbol probe (cf. canfd_loopback).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_threadx_canfd_match"
HIL_PROBE_MIN_ADVANCE=40
HIL_PROBE_SECONDS=5

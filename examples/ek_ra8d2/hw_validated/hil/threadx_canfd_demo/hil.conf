# threadx_canfd_demo runs two ThreadX threads against CANFD0 in
# internal-loopback mode: a TX thread that sends an 8-byte frame
# every 500 ms (~2 frames/s), and an RX thread that polls every
# 50 ms and consumes the loopback-mirrored frame. Each successful
# TX bumps g_threadx_canfd_match; each successful RX bumps it again
# (so the combined rate is ~4 increments/s). The probe asserts:
#   - g_threadx_canfd_match advances at least 12 in 5 s
#     (3+ TX-only frames * 2 counters = 6 minimum; 12 leaves
#     headroom for the ~1 s flash dwell + ThreadX boot lag)
#   - g_threadx_canfd_mismatch stays at 0 (any TX/RX failure trips it).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_threadx_canfd_match"
HIL_PROBE_MIN_ADVANCE=12
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_threadx_canfd_mismatch"
HIL_PROBE_MAX_FAILURE=0

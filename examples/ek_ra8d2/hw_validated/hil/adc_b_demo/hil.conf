HIL_MODE=uart_scrape
# adc_b_demo emits "adc: raw=NNNN mv=NNNN" -- no literal substring of
# >= 12 chars exists in .rodata because the numbers are dynamic. The
# success banner is unique to this app though, so the short EXPECT is
# safe here even without a longer literal. The negative regex catches
# any HAL init failure that would otherwise let the test silently pass.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="adc: raw="
HIL_EXPECT_NEGATIVE="hw_init_failed|adc.*failed|cgc_init failed|peripheral claim failed|HardFault"
HIL_TIMEOUT_S=10

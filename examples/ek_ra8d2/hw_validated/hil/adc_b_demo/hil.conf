HIL_MODE=uart_scrape
# adc_b_demo emits the dynamic "adc: raw=NNNN mv=NNNN" data line and then,
# only after a successful channel read, the fixed verdict "adc: read PASS"
# (14 chars). That verdict is the success-only line the gate keys on; a
# read failure breaks out of the loop before it prints. The negative regex
# catches any HAL init failure that would otherwise let the test pass.
HIL_EXPECT="adc: read PASS"
HIL_EXPECT_NEGATIVE="hw_init_failed|adc.*failed|cgc_init failed|peripheral claim failed|HardFault"
HIL_TIMEOUT_S=10

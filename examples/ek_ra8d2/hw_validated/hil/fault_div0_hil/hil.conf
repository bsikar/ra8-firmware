# The guarded divide must raise UsageFault (DIV_0_TRP) and the shared
# decoder must print its dump on the SCI8 console:
#   [EXC] ERROR: exception=6         (UsageFault, true class)
#   [EXC] ERROR: cfsr =33554432      (0x02000000 = CFSR.DIVBYZERO)
# Both hardware and ra8_emulator exercise this. ra8_emulator models the trap
# in its CPU-model seam: it scans the image for every UDIV/SDIV site and
# -- only after the firmware sets CCR.DIV_0_TRP (watched via the SCB
# control-register write hook) -- overwrites those sites with a UDF,
# then services the trap as a UsageFault latching CFSR.DIVBYZERO, so a
# EIL run reaches the same DIVBYZERO decode the bench does.
# The positive gate is the DIVBYZERO decode; the negative gate rejects
# a boot failure, an unarmed trap, or ARM-default divide semantics
# (the silent quotient-0 "survived divide" this trap exists to abolish).
HIL_MODE=uart_scrape
HIL_EXPECT="cfsr =33554432"
HIL_EXPECT_NEGATIVE="fault-div0: FAIL|survived divide"

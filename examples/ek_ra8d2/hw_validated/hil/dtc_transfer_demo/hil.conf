# DTC SRAM-to-SRAM block-copy gate. Validated on a real EK-RA8D2
# (2026-06-28): the DTC performs the block copy and the success banner
# below appears once a second. Two silicon-specific fixes were needed
# (both board_sim-masked): the HAL programs DTCVBR_SEC (the secure DTC's
# vector base, not the NS DTCVBR), and the demo leaves the DTC-complete
# IRQ masked so its ISR cannot race the in-flight transfer. tools/ra8_emulator
# (board_periph_dtc.c) runs the transfer synchronously on the ELSEGR write,
# so the headless smoke gate sees the same match=Y banner.
HIL_MODE=uart_scrape
HIL_EXPECT="dtc: copied 1024B match=Y"
HIL_EXPECT_NEGATIVE="dtc: copied 1024B match=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

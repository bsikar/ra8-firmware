# HIL gate for dfu_selftest_fs_host (USB self-loop Config B: J11 FS host drives the
# J7 HS DFU device; one image runs both roles, cabled J7<->J11). The host
# DFU_DNLOADs a pattern that the device programs into the inactive MRAM slot,
# then DFU_UPLOADs it back and byte-verifies. Pass banner on SCI8 at 115200.
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST DFU CONFIG B PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|mismatch at|TIMEOUT|FAILED"
HIL_TIMEOUT_S=60
# ra8_emulator (EIL) only: model the on-chip USBHS host controller (0x40351000) and
# bridge it to the modelled USBFS device, so the same chip's HS-host -> FS-device
# self-loop round-trips headless. Ignored by the real-hardware HIL harness.
HIL_EMU_ARGS="--usbhs-loop"

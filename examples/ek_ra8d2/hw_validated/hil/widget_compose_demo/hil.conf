# Nested ra8_widget tree composited on the live GLCDC panel (#145). Brings the
# GLCDC up through the display PAL, composes a 4-widget tree (status / a nested
# row panel of two tiles / footer) into a 512x512 SRAM framebuffer the panel
# scans, then runs a deterministic self-check: a full compose (3 dirty children,
# full-frame quality, both nested tiles rendered) and a partial compose (status
# bar only -> 1 dirty child, 512x44 damage, fast hint, tiles untouched) that
# yields a distinct composite CRC. The banner's two CRCs are the ra8_emulator
# baseline -- drift in the ra8_widget_panel compositor or the renderers trips the
# gate. No SDRAM / touch / SD / buttons.
#
# Golden provenance: the CRCs hash the software-rasterised framebuffer, which
# includes the footer string literal -- so any change to the rendered TEXT
# re-mints them. The #249 ra_ -> ra8_ namespace rename changed that footer
# ("ra_widget_panel: ..." -> "ra8_widget_panel: ..."), shifting the composited
# pixels. Re-minted from the post-rename render, cross-checked bit-exact
# between ra8_emulator and a native-host build of the same libs/ra8_gfx +
# libs/ra8_widget code (the pre-rename footer reproduces the old golden
# CE4C8CDF/5065003D on both, proving the rasteriser itself never drifted).
HIL_MODE=uart_scrape
HIL_EXPECT="widget-compose-demo: dirty0=3 crc0=FFE5F375 dirty1=1 crc1=606B5F6B flush=512x44 hint=fast PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

# E-reader device chrome on the live GLCDC panel (#80). At boot the app brings up
# the on-board external SDRAM + the 1024x600 RGB565 GLCDC panel, lays out the
# application shell with libs/ra8_box, paints it through libs/ra8_gfx, renders the
# opening Library/Reading chrome, then enters a fast input-poll loop (touch +
# SW1/SW2 page switches + ~1 Hz battery nag) with a ~1 Hz blue heartbeat LED. All
# hardware (SDRAM + TFT) is part of the stock EK-RA8D2; the SD font is best-effort
# (NAKs gracefully when no card is fitted), so it is bench-runnable with no
# external hardware.
#
# This is a MANUAL / VISUAL demo: the page-turn proof requires a human pressing
# SW1/SW2, and g_er_turns / g_er_cur_page only advance on a button press, so there
# is no button-driven counter (g_er_turns / g_er_cur_page) to scrape. The
# automatable signal is liveness: the main loop is a busy poll (ra8_delay_ms, never
# WFI), so the free-running g_er_loop_ticks counter keeps advancing. The
# jlink_memprobe gate reads it twice across a window and asserts the render/poll
# loop advanced, proving the app booted, brought up SDRAM + GLCDC, and runs without
# faulting. Full validation (chrome layout + SW1/SW2 page turns) is visual on the panel.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_er_loop_ticks"
HIL_BOOT_S=4

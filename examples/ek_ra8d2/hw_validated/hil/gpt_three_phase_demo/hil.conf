# gpt_three_phase_demo arms GPT0/1/2 as a phase-synchronised
# three-phase PWM bank (motor-control mode). The probe asserts
# g_gpt_three_phase_match advances -- catches "three-phase arm
# rejected", "GTSTR didn't latch", or "PCLKD gate closed".
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpt_three_phase_match"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=4
HIL_PROBE_FAILURE_SYMBOL="g_gpt_three_phase_mismatch"
HIL_PROBE_MAX_FAILURE=0

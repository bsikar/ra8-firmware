# gpt_one_shot_demo arms GPT0 in saw-wave one-shot mode (HUM
# Ch 25.2.1 GTCR.MD = 001b) and fires it on a 50 ms cadence. Each
# completed one-shot increments g_gpt_one_shot_match from the GPT
# overflow IRQ handler.
#
# The probe asserts the counter advances >= 10 inside a 4 s window
# -- one-shots arrive ~once every 60 ms so 10 in 4 s leaves wide
# margin. Catches: GPT MSTP gate closed, GTCR.MD wrong, IRQ masked,
# attach_handler rejected.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpt_one_shot_match"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=4
HIL_PROBE_FAILURE_SYMBOL="g_gpt_one_shot_mismatch"
HIL_PROBE_MAX_FAILURE=0

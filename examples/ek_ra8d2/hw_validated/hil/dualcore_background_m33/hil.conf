# Dual-core autonomous-counter demo (#152): the Cortex-M85 releases the M33,
# which counts independently to k_bg_target_count and sets `done` in shared SRAM;
# the M85 yields, then reads the final count back. The VCOM banner is emitted
# only when the count matched the target -- a result only the M33 executing can
# produce. Mirrors the ITM "dualcore_background_m33 PASS" verdict to the SCI8 /
# J-Link OB VCOM console so the Pi rig (which has no SWO / ITM capture) can gate
# the producer/consumer shared-SRAM handshake. A wrong count logs FAIL over ITM
# and parks WITHOUT the VCOM banner. Stock EK-RA8D2, no add-on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="dualcore_background_m33: count PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

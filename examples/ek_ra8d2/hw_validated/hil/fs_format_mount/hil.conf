# Format + mount + file-ops across every FAT type ra8_fs can write (FAT12, FAT16,
# FAT32) on a real microSD over SCI0 Simple-SPI -> ra8_sdmmc_spi -> ra8_fs_format.
# For each type: format, mount, assert detected type, create+write+read-back,
# rename, unlink, unmount, print "FS <TYPE> FORMAT+MOUNT PASS", then the overall
# "FS FORMAT+MOUNT ALL PASS". THIS ERASES THE CARD. Needs any microSD in Pmod2
# (J25); under ra8_emulator attach a blank card with --sd-new 64:fat32.
HIL_MODE=uart_scrape
HIL_EXPECT="FS FORMAT+MOUNT ALL PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|mismatch"
# A small card formats in seconds; a large one (e.g. 128 GB FAT32 -> ~30 MB of
# FAT to zero over SPI) takes ~2 min on real hardware. ra8_emulator's 64 MB card
# exits the moment it matches, so the larger ceiling only bounds the HW run.
HIL_TIMEOUT_S=240

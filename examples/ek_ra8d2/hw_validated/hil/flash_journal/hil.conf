# flash_journal erases + programs + reads back a 16-byte record on the
# on-board Octo-SPI flash once per second (k_journal_period_ms = 1000)
# and compares read != write. The probe asserts:
#   - g_fj_match advances at least 3 times in a 5 s window
#     (3-4 expected after the ~1 s flash dwell + boot)
#   - g_fj_mismatch stays at 0 (any erase/program/read failure or
#     read-back miscompare trips this).
# Real proof that Octo-SPI flash actually round-tripped data, not just
# that the firmware looped.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_fj_match"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_fj_mismatch"
HIL_PROBE_MAX_FAILURE=0

# USB host MSC browse over the on-board self-loop (J7 HS host <-> J11 FS device,
# board emulates the peripheral). Host enumerates, mounts the FAT16 volume,
# browses the root directory, then read-verifies. Pass banner on SCI8 @115200.
HIL_MODE=uart_scrape
HIL_EXPECT="USB HOST MSC BROWSE PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|content mismatch|READ\(10\)"
HIL_TIMEOUT_S=75

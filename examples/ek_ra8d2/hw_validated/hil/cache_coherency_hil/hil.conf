# cache_coherency_hil releases CPU1 (Cortex-M33) and round-trips a data-carrying
# payload through a shared SRAM2 struct at 0x22100000 (see
# cache_coherency_shared.h) WITH the M85 D-cache enabled. The shared bytes sit in
# the boot's non-cacheable MPU region 4, so the hand-off stays coherent with the
# cacheless M33 without any software cache maintenance -- that is the property
# under test. The IPC peripheral is intentionally NOT used (CPU1 has SECEXT
# disabled and IPC channel attribution is mutually exclusive S xor NS; see
# cpu1_pingpong).
#
# memprobe is the robust gate for a dual-core counter app (no UART round-trip in
# the loop): the M85 keeps round-tripping forever and bumps g_cache_coherency_match
# once per verified round, while g_cache_coherency_mismatch bumps on a pong-wait
# timeout or a wrong echo. With the cache on and a (wrongly) cacheable shared
# region the M85 would read stale pong values and the mismatch counter would
# climb; the non-cacheable region keeps it at 0.
#   - g_cache_coherency_match advances at least 8 times in a 5 s window
#     (catches "CPU1 never came out of reset" / SRAM wedged / cache-stale reads)
#   - g_cache_coherency_mismatch stays at 0.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_cache_coherency_match"
HIL_PROBE_MIN_ADVANCE=8
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_cache_coherency_mismatch"
HIL_PROBE_MAX_FAILURE=0

# ra8_widget compositor + ra8_app framework gate (#145/#146). Proves the
# widget/app foundation works on-target: two apps register into an ra8_app
# registry (each a widget tree of a status-bar widget over a content widget),
# ra8_app_launch fires the focus lifecycle (on_leave -> on_enter), ra8_app_render
# composites each app's widgets into a 160x120 RGB565 framebuffer via ra8_gfx,
# and the two composites FNV-1a-hash to distinct CRCs. The banner also pins the
# #145 partial-flush acceptance: invalidating only the status bar yields a
# 160x16 damage rect with the fast (A2) refresh hint -- the minimal e-ink flush.
#
# Deterministic (fixed composition through deterministic ra8_box layout + fills),
# so the ra8_emulator banner is the regression net: any drift in the widget layout,
# the app lifecycle/launch routing, the damage union, or the toolchain trips it.
HIL_MODE=uart_scrape
HIL_EXPECT="widget-app-hil: apps=2 lib=D3FB85C5 rdr=E9E475C5 flush=160x16 hint=fast PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

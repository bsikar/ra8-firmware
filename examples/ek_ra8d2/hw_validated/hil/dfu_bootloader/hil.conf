# HIL gate for dfu_bootloader (alive mode). Flashed standalone, the bootloader
# reads the trigger + both slots and either copies-to-run a valid slot (PC ends
# in the SRAM run window) or brings up the DFU device -- both are healthy,
# busy-spinning states, so the slot contents (which the flash does not control)
# do not make the outcome flaky. Alive mode asserts the bootloader boots and runs
# without faulting (PC in code, CycleCnt advancing, CFSR/HFSR clean). DFU
# program/commit is validated by dfu_selftest_boot; copy-to-run from either slot
# by dfu_copy_to_run + the J-Link sentinel in README.
HIL_MODE=alive
HIL_BOOT_S=3

# HIL gate for dfu_bootloader (jlink_memprobe). Flashed standalone, neither
# application slot is valid, so blc_decide deterministically returns
# k_ra8_dfu_action_dfu: the bootloader boots, decides "no bootable slot", and
# brings up the USBX DFU device, then services it in blc_device_worker's loop.
# g_blc_dfu_tick advances once per pass of that loop, so a double-halt mem32 read
# proves the bootloader reached and is servicing the DFU device -- an honest
# feature signal, not just "PC happens to be in MRAM". A copy-to-run jump to a
# valid slot (not this standalone-flash scenario) would freeze the counter; that
# path is gated by dfu_copy_to_run. DFU program/commit is validated by
# dfu_selftest_boot.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_blc_dfu_tick"
HIL_PROBE_MIN_ADVANCE=4
HIL_PROBE_SECONDS=4

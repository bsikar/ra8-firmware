HIL_MODE=uart_scrape
# The demo emits "aes: round-trip OK" on success or "aes: round-trip
# FAIL" on miscompare / underlying PSA error. Positive match is the
# full OK string (so FAIL never matches by accident); the negative
# regex causes the probe to fail fast instead of waiting the timeout.
HIL_EXPECT="aes: round-trip OK"
HIL_EXPECT_NEGATIVE="aes: round-trip FAIL|hw_init_failed|psa.*fail|HardFault"
HIL_TIMEOUT_S=15

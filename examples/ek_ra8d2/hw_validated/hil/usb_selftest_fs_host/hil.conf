# HIL gate for usb_selftest_fs_host (USB self-loop config B: FS host, HS device).
# The two USB jacks (J7 HS, J11 FS) are cabled to each other; one image runs both
# roles. The FS host enumerates the HS device (which falls back to full speed),
# mounts its read-only FAT16 MRAM volume, verifies 1 MiB byte-for-byte, and
# confirms a WRITE(10) into the RO LUN is rejected. Pass banner on SCI8 / J-Link
# OB CDC at 115200. The 1 MiB verify over the polled FS host runs ~17 s, plus
# enumeration + boot wait, so the timeout is generous.
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST CONFIG B PASS"
HIL_EXPECT_NEGATIVE="HardFault|CONFIG B FAIL|hw_init_failed|mismatch at"
HIL_TIMEOUT_S=75

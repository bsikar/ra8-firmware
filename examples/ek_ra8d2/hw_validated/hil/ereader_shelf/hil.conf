# board_sim HIL gate for ereader_shelf.
#
# The hybrid baked+SD e-reader boots, decodes the baked books' cover art, lays
# out the shelf, and prints a banner digesting the rendered framebuffer. The
# uart_scrape gate matches that banner exactly, so a cover-decode or layout
# regression (not just a failure to boot) trips it. Run without --sd, so only
# the three MRAM-baked books are present (sd=0); the SD path is exercised
# separately (see README).
#
# GOLDEN PROVENANCE -- pinned toolchain only. The fb hash is TOOLCHAIN-BOUND:
# the shelf's text rasterization (float AA coverage) legitimately differs by
# arm-gcc codegen, confirmed on real silicon (same board, SD inserted:
# 13.3-built prints fb=A1A1CB11, 14.3-built prints fb=CDCAA33F). This is the
# same reproducible-codegen reality that pins Arm GNU 13.3 repo-wide (#178).
# 0ADB62C6 below is the sd=0 render of a 13.3.rel1 build (the pinned CI
# toolchain); the previous golden FA3AB5B5 was minted from an unpinned 14.3
# build and could never pass on a pinned runner. Re-mint this value ONLY from
# a 13.3 build (and update it together with any deliberate re-bake of the
# committed library.h fixture).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-shelf: books=3 sd=0 fb=0ADB62C6 ok"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

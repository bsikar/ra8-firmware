# Concrete ereader chrome widgets (#145 Phase 2) composited on the live GLCDC
# panel. Brings the GLCDC up through the display PAL, composes a 5-band column
# panel of the reusable chrome leaves now in libs/ra8_widget -- status bar,
# toolbar (search field + count chip), a 2-column book grid, an overall progress
# bar, and a nav strip -- into a 512x512 SRAM framebuffer the panel scans, then
# runs a deterministic self-check:
#   - full compose  -> 5 dirty children, full-frame 512x512 quality flush;
#   - partial compose (advance the status-bar clock, invalidate ONLY the status
#     bar) -> 1 dirty child, 512x44 damage rect, fast hint, distinct composite
#     CRC.
# The banner's two CRCs are the ra8_emulator baseline: drift in any chrome-widget
# renderer or the ra8_widget_panel compositor trips the gate. No SDRAM / touch /
# SD / buttons.
#
# Golden provenance: the CRCs hash the software-rasterised framebuffer, which
# includes the rendered TEXT (title, search hint, book titles, nav labels, the
# live clock) -- so any change to the rendered strings or the widget geometry
# re-mints them. Minted from the post-Phase-2 render and cross-checked bit-exact
# across two ra8_emulator runs (same crc0=5D5C1F5E / crc1=200D1857).
HIL_MODE=uart_scrape
HIL_EXPECT="widget-chrome-demo: dirty0=5 crc0=5D5C1F5E dirty1=1 crc1=200D1857 flush=512x44 hint=fast PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

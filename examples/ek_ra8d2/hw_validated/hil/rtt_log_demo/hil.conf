HIL_MODE=rtt_scrape
# rtt_log_demo emits its banner over SEGGER RTT (not UART). The
# hil_rtt_scrape.sh runner reads the s_rtt_up_buf region directly via
# J-Link mem dumps and asserts the expected string appears. The
# negative regex catches any panic / fault path that should not be
# in the buffer.
HIL_EXPECT="rtt_log_demo: 3"
HIL_EXPECT_NEGATIVE="HardFault|panic|FAIL"
HIL_RTT_BUF_SYMBOL=s_rtt_up_buf
HIL_RTT_BUF_BYTES=128
HIL_TIMEOUT_S=8

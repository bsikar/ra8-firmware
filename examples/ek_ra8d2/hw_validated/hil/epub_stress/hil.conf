# Large-structure EPUB open gate (#144 bug 1 regression net). On the firmware
# target, miniz's ZIP central directory AND tinyxml2's OPF DOM both allocate
# from the same 96 KiB static arena. A big real book stresses that shared pool.
# This gate opens a synthetic 125-entry / 60-chapter / ~10 KB-OPF EPUB in memory
# (more files than the 108-file, 41-chapter real Boox book that triggered #144)
# and asserts ra8_epub_open succeeds, the full spine parses (60 chapters), every
# NCX navPoint extracts (toc=60, #144 bug 2), and the cover resolves.
#
# The fixture is synthetic (not the copyrighted novel), so it is committable and
# CI-able. Deterministic, so the board_sim banner is the regression net: any
# regression that shrinks the shared arena, re-breaks NCX parsing, or drops the
# cover trips the gate. The original #144 no_mem was the 16 KiB OPF/NCX scratch
# buffer (since fixed to 48 KiB), not the arena -- this gate pins that.
HIL_MODE=uart_scrape
HIL_EXPECT="epub-stress-hil: files=125 chapters=60 toc=60 cover=ok PASS"
HIL_EXPECT_NEGATIVE="FAIL|no_mem|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

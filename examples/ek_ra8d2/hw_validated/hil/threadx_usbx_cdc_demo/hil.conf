# threadx_usbx_cdc_demo is the ThreadX + USBX class layer CDC ACM
# echo on USB-FS. Same wire-level test as usb_cdc_echo but using
# the USBX class-stack abstraction. The Pi-side host probe asserts
# the chip enumerates as VID 1209:000a and round-trips bytes
# through the bulk CDC pipe via scripts/usb_benchmark.py.
HIL_MODE=usb_cdc
HIL_VIDPID="1209:000a"
HIL_HUB_PORT=4
HIL_PPPS_MODE=soft
HIL_MPS_CHUNK=64
HIL_STREAM_BYTES=65536
HIL_STREAM_FLOOR_KBS=250

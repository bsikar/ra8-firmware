# CAC clock-accuracy gate. Validated on a real EK-RA8D2 (2026-06-28): the
# 24 MHz main oscillator measured against LOCO/32 yields a count near 23437
# inside the +/-6% window (ferr=0, ovf=0) and the success banner below
# appears once a second. tools/ra8_emulator models the CAC edge counter via
# board_periph_cac.c, so the headless smoke gate sees the same ok=Y banner.
HIL_MODE=uart_scrape
HIL_EXPECT="cac: meas=ok ferr=0 ovf=0 ok=Y"
HIL_EXPECT_NEGATIVE="meas=TIMEOUT-or-err|ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

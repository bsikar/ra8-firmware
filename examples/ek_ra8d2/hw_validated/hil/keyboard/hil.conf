# On-silicon HIL for the on-screen keyboard widget ra8_keyboard (#105). Drives
# the real layout -> hit-test -> text-buffer model with synthetic key-centre
# taps (the ereader_input #118 injection pattern, for text entry): types
# "Hi 9" -- one-shot SHIFT (caps), SPACE, and the 123 layer toggle to reach a
# digit -- then RETURN, and asserts the query + commit.
# Pure logic -- no panel/SD/touch -- so the banner is identical on host,
# ra8_emulator, and silicon. A mismatch halts on a BKPT before the PASS line.
HIL_MODE=uart_scrape
HIL_EXPECT="kbd: q=Hi 9 commit=1 taps=7 PASS"
HIL_EXPECT_NEGATIVE="FAIL|mismatch|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

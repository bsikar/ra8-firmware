# Concrete ra8_widget leaf widgets (label + button) composited through the
# ra8_widget_panel compositor (#145 Phase 2). Brings the GLCDC up through the
# display PAL, composes a column tree -- a centred title LABEL, a nested row
# panel of two BUTTONs, and a footer LABEL -- into a 512x512 SRAM framebuffer
# the panel scans, then runs a deterministic self-check: a full compose (3 dirty
# root children, full-frame quality), a routed touch that latches button A
# (press=1) and, via its on_press callback, dirties only the body band, then a
# partial compose (1 dirty child, 512x440 body damage, fast hint) whose CRC
# differs because button A now shows its pressed face. The banner's two CRCs are
# the ra8_emulator baseline -- drift in the leaf renderers or the panel compositor
# trips the gate. No SDRAM / SD; touches are synthesised in firmware.
#
# Golden provenance: the CRCs hash the software-rasterised framebuffer, which
# includes the footer label text -- so any change to the rendered TEXT re-mints
# them. The #249 ra_ -> ra8_ namespace rename changed that label ("... on
# ra_widget_panel" -> "... on ra8_widget_panel"), shifting the composited
# pixels. Re-minted from the post-rename render, cross-checked bit-exact
# between ra8_emulator and a native-host build of the same libs/ra8_gfx +
# libs/ra8_widget code (the pre-rename label reproduces the old golden
# 875467C7/5AE93FDF on both, proving the rasteriser itself never drifted).
HIL_MODE=uart_scrape
HIL_EXPECT="widget-kit-demo: dirty0=3 crc0=4081E954 press=1 dirty1=1 crc1=25D673DC flush=512x440 hint=fast PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

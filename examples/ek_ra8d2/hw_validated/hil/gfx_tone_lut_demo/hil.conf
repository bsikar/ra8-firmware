# On-silicon / emulator headless verification for per-panel tone LUT calibration (#479).
# Validates strictly monotonic 16-knot LUT mapping and blue-noise dither quantization.
HIL_MODE=uart_scrape
HIL_EXPECT="gfx-tone-lut-demo: lut=strictly_monotonic PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

HIL_MODE=uart_scrape
# sdram_benchmark emits "sdram: w=NN MB/s r=NN MB/s\r\n" (split
# printf, dynamic throughput). No >= 12 char success literal exists.
# Negative regex catches the SDRAMC init-failure banners.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="sdram: w="
HIL_EXPECT_NEGATIVE="hw_init_failed|sdramc.*fail|cgc_init failed|HardFault|sdram: FAIL"
HIL_TIMEOUT_S=20

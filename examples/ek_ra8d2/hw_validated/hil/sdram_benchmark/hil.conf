HIL_MODE=uart_scrape
# sdram_benchmark emits the dynamic "sdram: w=NN MB/s r=NN MB/s" data line
# and then, only on a clean read-back pass, the fixed verdict
# "sdram: bench OK" (15 chars) -- the success-only line the gate keys on
# (never printed on a "sdram: FAIL idx=" path). The negative regex catches
# the read-back mismatch and the SDRAMC init-failure banners.
HIL_EXPECT="sdram: bench OK"
HIL_EXPECT_NEGATIVE="hw_init_failed|sdramc.*fail|cgc_init failed|HardFault|sdram: FAIL"
HIL_TIMEOUT_S=20

# blink_hal runs on reset MOCO without CGC/UART bring-up (it's a
# HAL-layer HIL test of GPIO drive + ra_delay_ms). The jlink_memprobe
# mode reads g_blink_hal_tick via SWD twice across a 3 s window and
# asserts the LED-toggle loop iterated at least 5 times. Real
# assertion of main-loop progress, not just "chip didn't crash".
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_blink_hal_tick"
HIL_PROBE_MIN_ADVANCE=5
HIL_PROBE_SECONDS=3

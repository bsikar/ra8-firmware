# doc_demo chains seven 16-bit DOC add operations and compares the
# accumulator against a portable software reference, one comparison
# per second (k_doc_demo_period_ms = 1000). The probe asserts:
#   - g_doc_match advances at least 3 times in a 5 s window
#     (3-4 expected after the ~1 s flash dwell + boot)
#   - g_doc_mismatch stays at 0 (any HW != SW or driver error trips it).
# Real proof that the DOC peripheral computed the right answer, not
# just that the firmware looped.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_doc_match"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_doc_mismatch"
HIL_PROBE_MAX_FAILURE=0

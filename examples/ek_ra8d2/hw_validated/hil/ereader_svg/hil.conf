# SVG vector-art render-at-size gate (#143). Binds a 160x120 RGB565 framebuffer,
# reads the baked SVG's intrinsic viewBox size (ra8_svg_size), maps the viewBox
# onto the framebuffer box and rasterizes the supported shapes (rect / circle /
# polygon fills) through the ra8_reflow SVG renderer (#112/#141, no allocation),
# then FNV-1a hashes the framebuffer.
#
# The SVG counterpart to ereader_image (PNG) / ereader_jpeg (JPEG): the
# vector path instead of the stb_image raster path. Deterministic (a fixed SVG
# document through a deterministic rasterizer), so the banner CRC is identical
# on host, ra8_emulator, and silicon. Any drift in the SVG parser, the shape
# rasterizer, the viewBox->box transform, or the toolchain trips the gate.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-svg-hil: svg 100x100 crc=A6450BE6 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

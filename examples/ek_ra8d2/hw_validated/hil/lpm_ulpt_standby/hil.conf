HIL_MODE=uart_scrape
# Firmware emits "lpm_ulpt: boot" once, then prints "lpm_ulpt: wake"
# after every ULPT0-underflow wake from Software Standby. Unlike the
# RTC standby demo, the ULPT counts from LOCO (ULPTLCLK, internal
# 32.768 kHz), which keeps running in Software Standby with no
# dependence on the intermittent SOSC crystal -- so the wake banner is
# a real, gatable signal. Period ~0.5 s, so the first wake lands well
# inside the timeout.
HIL_EXPECT="lpm_ulpt: wake"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|lpm.*failed|cgc_init failed|ulpt.*failed"
HIL_TIMEOUT_S=15

# After this test the chip is in a deep-LPM state that gates the
# AHB-AP; hil_all.sh runs rfp-cli -erase-chip (Initialize) before
# the next app's flash. See docs/RECOVERY_OEM_PL0_BRICK.md.
HIL_POST_INITIALIZE=1

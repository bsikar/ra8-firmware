# acmphs_compare polls ACMPHS channel 0 once per second and toggles
# LED1/LED2 based on CMPMON. No UART -- the jlink_memprobe mode reads
# g_acmphs_compare_tick via SWD twice across a 3 s window and asserts
# the loop iterated at least once (1 s cadence -> ~3 ticks in 3 s;
# floor of 1 absorbs the case where the first poll lands right after
# the second halt).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_acmphs_compare_tick"
HIL_PROBE_MIN_ADVANCE=1
HIL_PROBE_SECONDS=3

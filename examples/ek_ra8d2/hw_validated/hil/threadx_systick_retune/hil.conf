# threadx_systick_retune runs one LED-toggle thread under ThreadX after
# calling ra8_threadx_systick_retune() from tx_application_define (issue
# #287). The jlink_memprobe mode samples two symbols:
#
#   - g_threadx_retune_tick (primary): bumped each time the worker wakes
#     from tx_thread_sleep. Must advance >= 3 across the window -- proves
#     the scheduler is alive AND the retuned SysTick still ticks.
#
#   - g_threadx_retune_bad (failure): set to 1 by tx_application_define if
#     ra8_threadx_systick_retune() failed or SYST_RVR did not match the
#     reload independently computed from the live CPUCLK0. Must stay 0.
#
# The worker toggles LED1 every k_retune_loop_ticks = 250 ms, so a 4 s
# window sees >= 10 wakes (after the ~250 ms scheduler bring-up). ra8_emulator
# runs the identical ARM retune path (SYST_RVR write lands in the emulated
# System Control Space and reads back), so EIL == HIL.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_threadx_retune_tick"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=4
HIL_PROBE_FAILURE_SYMBOL="g_threadx_retune_bad"
HIL_PROBE_MAX_FAILURE=0

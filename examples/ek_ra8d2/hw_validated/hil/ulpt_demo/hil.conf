HIL_MODE=uart_scrape
# ulpt_demo emits "ulpt: wake ok\r\n" (13 printable chars) on every ULPT
# underflow -- a success-only line, since a broken wake path breaks out
# of the loop and parks silently. The negative regex catches HAL init
# failures and the ULPT-specific bring-up failures.
HIL_EXPECT="ulpt: wake ok"
HIL_EXPECT_NEGATIVE="hw_init_failed|ulpt.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=15

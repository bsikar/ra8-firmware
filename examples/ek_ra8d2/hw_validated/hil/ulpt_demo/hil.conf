HIL_MODE=uart_scrape
# ulpt_demo emits "ulpt: wake\r\n" (10 printable chars). No longer
# success literal in .rodata. Negative regex catches HAL init
# failures and the ULPT-specific bring-up failures.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="ulpt: wake"
HIL_EXPECT_NEGATIVE="hw_init_failed|ulpt.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=15

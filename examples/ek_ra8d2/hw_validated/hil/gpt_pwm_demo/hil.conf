# gpt_pwm_demo programs GPT0 in saw-PWM mode at ~61 Hz and walks the
# duty cycle every k_gpt_pwm_demo_step_ms = 20 ms. Each iteration
# samples GTCNT via ra_gpt_read; g_gpt_pwm_match advances iff GTCNT
# moved relative to the previous sample (proves the timer is really
# counting, not just configured). g_gpt_pwm_mismatch latches if GTCNT
# is frozen or set_duty / read returns non-ok. Steady-state rate is
# ~50 matches/s, so:
#   - g_gpt_pwm_match advances at least 100 times in a 3 s window
#   - g_gpt_pwm_mismatch stays at 0.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpt_pwm_match"
HIL_PROBE_MIN_ADVANCE=100
HIL_PROBE_SECONDS=3
HIL_PROBE_FAILURE_SYMBOL="g_gpt_pwm_mismatch"
HIL_PROBE_MAX_FAILURE=0

# Headless on-silicon gate for e-reader interaction / hit-test (#118): build a
# chrome target set (a 2x2 book grid + a toolbar button), inject synthetic taps
# at known coordinates, and assert each resolves to the expected ra8_ui action id
# (off-target taps miss); then drive the screen stack (open book -> reading,
# back -> library, root never popped) and assert each transition. Pure logic, so
# the banner is deterministic and matches host / ra8_emulator. No touch/panel/SD.
HIL_MODE=uart_scrape
HIL_EXPECT="ui-hil: taps=7 hits=5 nav_ok=1 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

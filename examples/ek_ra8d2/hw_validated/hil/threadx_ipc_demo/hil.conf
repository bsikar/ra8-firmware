HIL_MODE=uart_scrape
# Tight banner: "[ipc_demo] <- pong" is 18 chars and only emitted
# after the receive thread gets a reply (full IPC round-trip done).
# Failure paths: "[ipc_demo] <no reply>" (timeout), "send err"
# (queue_send failed). Both caught by the negative regex.
# (HIL_EXPECT uses grep -F, so brackets are taken literally.)
HIL_EXPECT="[ipc_demo] <- pong"
HIL_EXPECT_NEGATIVE="\[ipc_demo\] (<no reply>|send err)|hw_init_failed|HardFault"
HIL_TIMEOUT_S=15

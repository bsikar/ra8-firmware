HIL_MODE=uart_scrape
# elc_event_demo emits "elc: en=N trig=NN" with N values dynamic. No
# >= 12 char success literal exists in .rodata (split printf). The
# negative regex catches HAL init failures and the "elc: en=0" form
# (which means the ELC link never armed -- a real failure path).
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="elc: en="
HIL_EXPECT_NEGATIVE="elc: en=0 |hw_init_failed|elc.*failed|HardFault|elc: FAIL"
HIL_TIMEOUT_S=10

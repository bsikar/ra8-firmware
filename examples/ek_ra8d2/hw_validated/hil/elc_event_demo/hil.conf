HIL_MODE=uart_scrape
# elc_event_demo emits "elc: en=N trig=NN" each cycle. On success the
# ELC link is enabled, so the line reads "elc: en=1 trig=<count>" -- the
# fixed "elc: en=1 trig=" prefix (15 chars) is success-only because a
# disabled link prints "elc: en=0 ...". The negative regex catches that
# "elc: en=0" form, the "elc: FAIL ..." banners, and HAL init failures.
HIL_EXPECT="elc: en=1 trig="
HIL_EXPECT_NEGATIVE="elc: en=0 |hw_init_failed|elc.*failed|HardFault|elc: FAIL"
HIL_TIMEOUT_S=10

# threadx_mpu_partition_demo installs a 3-region static MPU partition
# table (MRAM RO/X, SRAM RW/no-exec, peripheral RW-priv-only) and then
# runs a single ThreadX worker that toggles LED1 at 1 Hz to prove the
# partition did not break ordinary code execution. Unlike
# mpu_partition_simple, this app does NOT deliberately trigger a fault
# -- it is a positive-path "MPU on, scheduler still works" HIL test.
#
# The worker thread increments g_threadx_mpu_partition_match every
# k_mpu_blink_ticks = 1000 ms. The probe asserts:
#   - g_threadx_mpu_partition_match advances at least 3 times in a 5 s
#     window (3-4 expected after the ~1 s flash dwell + boot).
# No mismatch counter -- there is no failure path in the worker that
# would cleanly distinguish "MPU partition broke X" from "scheduler
# wedged"; both surface as the match counter not advancing.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_threadx_mpu_partition_match"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=5

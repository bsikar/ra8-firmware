# dac_waveform drives DAC_B channel 0 with a 64-step up/down triangle
# at 1 ms per sample (128 ms full period). No UART -- the
# jlink_memprobe mode reads g_dac_waveform_tick via SWD twice across
# a 3 s window and asserts the outer loop completed at least 10 full
# triangles (128 ms cadence -> ~23 ticks in 3 s; floor of 10 absorbs
# boot slack).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_dac_waveform_tick"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=3

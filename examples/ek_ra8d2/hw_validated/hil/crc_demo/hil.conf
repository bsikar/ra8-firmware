HIL_MODE=uart_scrape
# crc_demo emits the dynamic "crc: hw=XXXX sw=XXXX match=Y" data line and
# then, only on a hw==sw match, the fixed verdict "crc: selftest PASS"
# (18 chars). That verdict is the success-only line the gate keys on; it
# is never printed on the match=N path. The negative regex catches
# " match=N" (the only failure-path banner this app emits) and the HAL
# init-failure banners.
HIL_EXPECT="crc: selftest PASS"
HIL_EXPECT_NEGATIVE=" match=N|hw_init_failed|crc.*failed|HardFault"
HIL_TIMEOUT_S=10

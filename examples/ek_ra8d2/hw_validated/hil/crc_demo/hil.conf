HIL_MODE=uart_scrape
# crc_demo emits "crc: hw=XXXX sw=XXXX match=Y" -- the XXXX values are
# dynamic so the literal in .rodata is only "crc: hw=" / " sw=" /
# " match=Y" / " match=N". None is >= 12 chars. The negative regex
# catches " match=N" (the only failure-path banner this app emits)
# and the HAL init-failure banners.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="crc: hw="
HIL_EXPECT_NEGATIVE=" match=N|hw_init_failed|crc.*failed|HardFault"
HIL_TIMEOUT_S=10

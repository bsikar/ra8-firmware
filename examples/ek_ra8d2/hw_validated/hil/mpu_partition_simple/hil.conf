# mpu_partition_simple installs a 32-byte RO MPU region over a SRAM
# scratch buffer and deliberately writes to it from privileged code.
# The probe-write traps into a *recovering* MemManage handler that
# advances the stacked PC past the offending store and returns. The
# handler deliberately LEAVES CFSR.MMFSR latched so the
# HIL_FAULT_EXPECTED=1 probe still sees the non-zero CFSR it needs
# as positive proof the fault fired. After return-from-exception the
# main loop then prints
#   "mpu: fault handled, recovered\r\n"
# over the SCI8 / J-Link OB VCOM bridge and enters a 1 Hz heartbeat
# that increments g_mpu_simple_match and toggles LED1.
#
# HIL mode stays at `alive` (with HIL_FAULT_EXPECTED=1) because the
# probe genuinely raises a MemManage fault on silicon; the success
# signal is the combination of:
#   1. CycleCnt advances (alive PC + cycle check),
#   2. The UART scrape sees the positive "mpu: fault handled" banner
#      and does not match the negative regex (FAIL|HardFault|...),
#   3. CFSR latches a non-zero MMFSR at boot dwell (the handler is
#      called within the dwell, and HIL_FAULT_EXPECTED=1 requires a
#      latched configurable fault).
#
# No jlink_memprobe HIL_PROBE_SYMBOL here -- alive+UART scrape is the
# canonical mode for this app per the user's instructions. The match
# counter g_mpu_simple_match is still exported for ad-hoc inspection
# via the J-Link `mem32` command; the fault-count companion symbol is
# g_mpu_simple_fault_count (expected steady-state value 1).
HIL_MODE=alive
HIL_BOOT_S=3
# This demo intentionally triggers an MPU MemFault to validate the
# MPU partition is denying access to a protected region. The
# resulting CFSR.MMARVALID/IACCVIOL bits are the expected outcome,
# NOT a regression. hil_check_alive.sh skips its CFSR==0 assertion
# when this flag is set; the PC+CycleCnt progress check still runs
# and the UART negative-regex scan still runs (the "mpu: fault
# handled, recovered" banner is outside the negative-regex set).
HIL_FAULT_EXPECTED=1

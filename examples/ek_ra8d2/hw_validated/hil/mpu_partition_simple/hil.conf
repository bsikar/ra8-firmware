HIL_MODE=alive
HIL_BOOT_S=2
# This demo intentionally triggers an MPU MemFault to validate the
# MPU partition is denying access to a protected region. The
# resulting CFSR.MMARVALID/IACCVIOL bits are the expected outcome,
# NOT a regression. hil_check_alive.sh skips its CFSR==0 assertion
# when this flag is set; the PC+CycleCnt progress check still runs.
HIL_FAULT_EXPECTED=1

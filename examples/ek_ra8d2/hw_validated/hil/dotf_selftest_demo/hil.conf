# DOTF bring-up + AES self-test gate. This gate covers the headless half:
# that the DOTF block can be clock-ungated (MSTPB16/17, shared with OSPI0/1),
# both channels reset to bypass, and the AES built-in self-test (REG00 bit 20)
# triggered + polled + read back on both channels without faulting. The demo
# never installs a key, stages an IV, programs a region, or arms a channel, so
# it has no persistent side effects.
#
# tools/ra8_emulator does NOT model the DOTF APB window (0x4026_8800/0x4026_8900),
# so the self-test register reads are not a real AES core -- this passes the
# bring-up plumbing but cannot exercise the genuine AES BIST result, which the
# demo reports via g_dotf_st0_snap / g_dotf_st1_snap for on-silicon probing.
# The on-silicon AES self-test result is the real promotion gate (see README);
# this app stays in hw_pending until it is confirmed on the bench.
HIL_MODE=uart_scrape
HIL_EXPECT="dotf: ch0/1 init=ok selftest=run ok=Y"
HIL_EXPECT_NEGATIVE="selftest=FAIL|ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# eth_loopback exercises the per-port ETHA descriptor-ring lifecycle in
# MAC-only loopback (no PHY, no peer node). The "etha: loopback ok" line
# is printed only after init -> set_mode CONFIG -> ring_init -> set_mode
# OPERATION -> account_traffic -> get_stats succeed. A strict UART scrape
# is the right verifier -- there is no wire traffic to probe.
HIL_MODE=uart_scrape
HIL_EXPECT="etha: loopback ok"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|etha.*failed"
HIL_TIMEOUT_S=10

HIL_MODE=uart_scrape
# power_profiler emits "pp: a=NNN s=NNN d=NNN st=NNN us\r\n" (split
# printf, dynamic numbers). No >= 12 char success literal in .rodata.
# The negative regex catches the LPM bring-up failure path.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="pp: a="
HIL_EXPECT_NEGATIVE="hw_init_failed|lpm_enter_sleep: bad mode|cgc_init failed|HardFault"
HIL_TIMEOUT_S=15

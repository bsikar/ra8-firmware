HIL_MODE=uart_scrape
# power_profiler emits the dynamic "pp: a=NNN s=NNN d=NNN st=NNN us" data
# line and then, only when the full mode cycle and the stats read both
# return ok, the fixed verdict "pp: profile OK" (14 chars) -- the
# success-only line the gate keys on (never printed on a "pp: FAIL ..."
# path). The negative regex catches the LPM bring-up failure paths.
HIL_EXPECT="pp: profile OK"
HIL_EXPECT_NEGATIVE="hw_init_failed|lpm_enter_sleep: bad mode|cgc_init failed|HardFault|pp: FAIL"
HIL_TIMEOUT_S=15

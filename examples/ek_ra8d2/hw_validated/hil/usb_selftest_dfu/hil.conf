# HIL gate for usb_selftest_cdc (USB self-loop: J7 HS <-> J11 FS cabled together, one image
# runs both roles). Pass banner on SCI8 / J-Link OB CDC at 115200.
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST DFU PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|mismatch at|TIMEOUT|FAILED"
HIL_TIMEOUT_S=60

# ra8_io fabric round-trip over the on-chip RAM-backed VFS (#155/#156). The demo
# mounts the `ram:` block-device backend, writes then reads back 128 bytes at
# ram:/HELLO.TXT, then exercises mkdir + a nested write at ram:/SUB/NOTE.TXT, and
# reports each stage over the SCI8 / J-Link OB VCOM console. No external memory,
# panel, or SD is touched -- the whole round-trip lives in on-chip SRAM, so it is
# bench-runnable on a stock EK-RA8D2. The final banner below is emitted only once
# the mkdir + nested round-trip has passed; any failing stage prints
# "ra8_io_demo: ... FAIL" instead, which the negative regex catches.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_demo: mkdir+nested ram:/SUB/NOTE.TXT PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

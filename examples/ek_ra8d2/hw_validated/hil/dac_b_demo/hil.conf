# dac_b_demo ramps DAC_B channel 0 from 0..4095 and back in 16-code
# steps with 20 ms between steps. No UART -- the jlink_memprobe mode
# reads g_dac_b_demo_tick via SWD twice across a 3 s window and
# asserts the write loop iterated at least 75 times (20 ms cadence ->
# ~150 ticks in 3 s; half-floor = 75 absorbs any boot-time slack).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_dac_b_demo_tick"
HIL_PROBE_MIN_ADVANCE=75
HIL_PROBE_SECONDS=3

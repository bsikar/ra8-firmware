# cache_mpu_hil boots the Cortex-M85 with the L1 I-cache + D-cache and the
# 5-region MPU enabled (RA_BOOT_ENABLE_CACHE_MPU) and self-tests that the core
# still computes correctly in that posture:
#   1. cacheable RW in M85-private SRAM (MPU region 1) -- write a 4 KiB pattern,
#      clean+invalidate, read it back through the refill path;
#   2. RO MRAM const + MRAM code execution (MPU region 0, I-cache);
#   3. Device-nGnRE peripheral MMIO read (MPU region 3) -- live SCKDIVCR readback.
# On all-pass it prints the deterministic banner below over the J-Link OB VCOM
# console (SCI8, PD02/PD03 @ 115200 8N1); any step failure prints a distinct
# "... FAIL" line instead.
HIL_MODE=uart_scrape
HIL_EXPECT="cache_mpu_hil: cache+mpu PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|panic"
HIL_TIMEOUT_S=15

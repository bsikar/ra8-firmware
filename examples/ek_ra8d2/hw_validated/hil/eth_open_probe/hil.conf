# eth_open_probe is the smallest program that reaches ra8_eth_open() on
# silicon: clocks, MSTP, SysTick, SCI8 console, ra8_board_ethernet_init,
# then one ra8_eth_open() on channel 1. No RTOS, no IP stack, no packet
# pool. It is the bare-metal reproducer for tracker issue #524, where
# that call was reported to HardFault inside the GWCA TX-ring init.
#
# A UART scrape is the right verifier: there is no wire traffic to probe
# and the whole question is whether the open path returns at all. The
# negative regex catches the #524 signature directly. Match ANY decoded
# fault, not the exception number: the fault this app exists to catch
# arrived as a HardFault (exception=3) when it was first reported and as
# a BusFault (exception=5) once SHCSR.BUSFAULTENA was set, and a gate
# keyed on either number would have gone quiet at the other. The app's
# own hw_init_failed / FAIL banners cover the non-fault refusals.
HIL_MODE=uart_scrape
HIL_EXPECT="eth-open-probe: PASS"
HIL_EXPECT_NEGATIVE="eth-open-probe: FAIL|hw_init_failed|ERROR: exception="
HIL_TIMEOUT_S=20

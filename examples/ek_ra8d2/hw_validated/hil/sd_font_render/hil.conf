# sd_font_render HIL gate.
#
# The app brings up the Pmod2 SD card via ra8_sdfont (self-provisioning FONT.OTF
# from a baked Latin-1 font if the card is blank), reads the font back, reflows
# a paragraph with reflow, and rasterises it into the GLCDC framebuffer.
#
# There is no UART console; progress is exposed through SWD-readable globals
# (g_sfr_stage / g_sfr_font_len / g_sfr_pages / g_sfr_ink / g_sfr_source /
# g_sfr_err). The idle loop bumps g_sfr_heartbeat once per ~100 ms, but ONLY on
# the success path: every failure stage drops into sfr_panic_halt()'s own
# `wfi` spin, which never touches the counter. So a steadily-advancing
# g_sfr_heartbeat proves the whole SD -> ra8_fs -> reflow -> framebuffer
# pipeline ran end to end (card mounted, font loaded, page rendered).
#
# Bring-up (SDRAM settle + GLCDC + SD card read of the ~400 KB font + reflow)
# takes ~6 s before the idle loop starts, so the probe dwells 12 s first; then it
# asserts g_sfr_heartbeat advances at least 10 times in a 5 s window (~10 Hz
# cadence; generous lower bound). A reset would drop the counter back to 0, so a
# backwards / frozen counter fails the advance check.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_sfr_heartbeat"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=5
HIL_PROBE_BOOT_S=12

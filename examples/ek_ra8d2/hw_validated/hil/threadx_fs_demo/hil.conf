# ra8_fs FAT file-operations on the on-board OSPI flash (LevelX): format, create
# two files, list root, read+verify one, delete the other + confirm. Prints
# "[fs] ospi FAT roundtrip ok" on success. No SD card -- the flash is soldered.
HIL_MODE=uart_scrape
HIL_EXPECT="ospi FAT roundtrip ok"
HIL_EXPECT_NEGATIVE="failed|mismatch|HardFault|did not remove"
HIL_TIMEOUT_S=20

# lpm_deep_sleep_demo configures Cortex-M85 Deep Sleep (LPSCR.LPMD=0 +
# SCR.SLEEPDEEP=1) and attempts a WFI. The HIL gate scrapes the boot
# banner emitted just before the LPM entry -- this proves the chip
# loaded the firmware, brought up the CGC + SCI + LPM subsystems, and
# reached the WFI without faulting.
#
# This gate does NOT verify wake. SysTick does not wake from
# Deep-Sleep on RA8D2 under the default LPM config (bench-verified
# 2026-05-27), so once the chip enters WFI it stays there until the
# next Initialize. Wake verification would require a sub-clock-sourced
# wake (RTC/AGT) or external IRQ pin -- both outside this demo's
# scope.
#
# Operational note: after this demo runs the chip is stuck in Deep-Sleep with
# the AHB-AP gated. The suite performs a true power-on reset, immediately halts
# the core, and installs the known-safe blink recovery image in that same
# connection. The suite builds that image even when this is the only selected
# application.
HIL_MODE=uart_scrape
HIL_EXPECT="lpm_deep: boot"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|lpm.*failed|cgc_init failed"
HIL_TIMEOUT_S=10

# A direct rfp-cli Initialize cannot connect once the AHB-AP is gated; it
# returns E100000E. Require the suite's bounded atomic POR recovery instead.
HIL_POST_POWER_CYCLE_HALT=1

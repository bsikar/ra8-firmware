# lpm_deep_sleep_demo enters Cortex-M85 Deep Sleep (LPSCR.LPMD=0 +
# SCR.SLEEPDEEP=1) and is woken by SysTick every ~1 ms. Each completed
# Deep-Sleep -> wake -> main-loop cycle bumps g_lpm_deep_wake_count.
# With a 100 ms inner delay the symbol should advance ~10x/s, so a
# 3 s window easily clears MIN_ADVANCE=5 even if SWD halt lands in
# the middle of a WFI.
#
# Why jlink_memprobe and not uart_scrape: an earlier attempt at this
# demo printed wake_count lines over SCI8. Bench-truth on EK-RA8D2 is
# that the SCI module clock (PCLKA) is gated under the default LPM
# init when SLEEPDEEP is asserted, and the post-wake TDR write
# either drops on the floor or mis-frames the first byte. Reading the
# wake-count symbol over SWD bypasses that entirely.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_lpm_deep_wake_count"
HIL_PROBE_MIN_ADVANCE=5
HIL_PROBE_SECONDS=3

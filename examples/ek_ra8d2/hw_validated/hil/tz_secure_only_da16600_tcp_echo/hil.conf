# HIL configuration for tz_secure_only_da16600_tcp_echo.
#
# Mode: alive
#
# The TCP-echo app needs a Wi-Fi access point that the DA16600 can
# associate to before any echo traffic is meaningful. Until the
# Pi-as-AP lab fixture lands (see scripts/hil_da16600_setup.md), we
# only assert the firmware boots and stays alive long enough for the
# DA16600 init / Wi-Fi association attempt to run. Once the Pi-AP
# is operational, swap this to:
#
#   HIL_MODE=uart_scrape
#   HIL_EXPECT="wifi: ip="
#   HIL_TIMEOUT_S=20
#
# and add a separate netcat-based round-trip check.
HIL_MODE=alive
HIL_BOOT_S=5

# BMP + GIF decode format-coverage gate (#143). The firmware links four
# stb_image decoders (STBI_ONLY_JPEG/PNG/GIF/BMP); PNG (ereader_image) and
# JPEG (ereader_jpeg) already had a gate. This app decodes the remaining
# two -- a baked BMP and a baked GIF -- through the same zero-heap
# ra8_img_decode_blit pipeline (decode + scale-to-fit + blit into a 160x120
# RGB565 framebuffer, 128 KiB SRAM arena), FNV-1a hashing each.
#
# The BMP is a four-quadrant image, the GIF a horizontal-band image, so the two
# decode paths pin two distinct CRCs. Deterministic, so the ra8_emulator CRC gate
# is the regression net: any drift in the BMP or GIF decoder, the scale math, or
# the toolchain trips the gate.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-imgfmt-hil: bmp=D53617C5 gif=350551C5 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=25

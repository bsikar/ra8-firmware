HIL_MODE=uart_scrape
# Coexistence self-test: RIIC ch1 (ra8_i2c) -> U15 real ACK AND I3C ch0
# (ra8_i3c, I2C-compat mode) controller bring-up, both in one firmware.
# The pass banner "combo: i2c ack=1 i3c initok" is emitted only when RIIC
# ACKed U15 AND the I3C controller initialised (init failure panic-halts
# before the loop). A RIIC bus error or a fault fails the gate.
HIL_EXPECT="combo: i2c ack=1 i3c initok"
HIL_EXPECT_NEGATIVE="combo: i2c ERROR|hw_init_failed|HardFault"
HIL_TIMEOUT_S=10

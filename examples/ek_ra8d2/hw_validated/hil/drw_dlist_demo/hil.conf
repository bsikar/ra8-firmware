# DRW 2D-engine DISPLAY-LIST clear+fill gate (issue #247).
#
# The demo builds ONE display list in SRAM that clears a 32x32 ARGB8888
# framebuffer to 0x00000000 and fills a 16x16 green box (0xFF00FF00) at (8,8),
# then loops: kick DLISTSTART, wait for the display-list reader to go idle,
# hash the whole framebuffer FNV-1a-32, and print the result. The DRW owns the
# framebuffer end to end -- the CPU never writes it inside the loop -- so there
# is no CPU/engine write race to latch STATUS.BUSERRMFB. This is the
# loop-stable path that closes #247.
#
# GOLDEN: E6B215C5 is a real EK-RA8D2 capture, FNV-1a-32 over the 4096 rendered
# bytes (16x16 green box on a zero background). It is byte-identical to the
# register-mode ra8_drw_fill_rect result (same framebuffer, CRC32 0x84EDFC3A),
# and board_sim reproduces it: its DLR model (board_periph_drw.c) executes the
# same display list the firmware built, ORIGIN triggering the same render, so
# this app is SIM == HIL.
#
# Bench evidence (issue #247, EK-RA8D2 over J-Link, VTref 3.3V):
#   - HWREVISION 0x0FBE0107 (graphics power domain up).
#   - Display list = 19 words built by ra8_drw_dlist_begin/add_fill/end.
#   - Framebuffer byte-clean every pass; PERFCOUNT2 (framebuffer writes) climbs
#     ~1280 per iteration, so the DLR actively rasterizes each loop.
#   - Hundreds of clear+fill iterations: STATUS.BUSERRMFB never latched, no
#     wait-idle timeout -- loop-stable.
#
# If this CRC ever changes, re-derive it from a bench capture -- never from the
# simulator, and never by writing down whatever the demo happens to print.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: dlist crc=E6B215C5 PASS"
HIL_EXPECT_NEGATIVE="dlist crc=[0-9A-F]+ FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

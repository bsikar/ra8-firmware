# HIL gate for dfu_copy_to_run (alive mode). This app ALWAYS copies-to-run: it
# embeds one image, hands it to ra_dfu_launch (the bootloader's launcher), which
# copies it to the SRAM run base (k_ra_dfu_run_base = 0x22020000) and branches
# there. After the hand-off the PC lives in the SRAM run window -- a region only
# reachable BY copying-to-run and branching, since this app's own code is in
# MRAM. So alive (PC in code, CycleCnt advancing, CFSR/HFSR clean, not in a
# fault spinner) is a specific proof that copy-to-run executed; the alive gate's
# in_code range includes the SRAM run window. A failed run-target check parks in
# dcr_panic_halt, which the fault-spinner check flags.
HIL_MODE=alive
HIL_BOOT_S=3

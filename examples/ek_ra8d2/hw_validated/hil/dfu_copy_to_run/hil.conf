# HIL gate for dfu_copy_to_run (jlink_memprobe). This app ALWAYS copies-to-run:
# it embeds one image and hands it to ra_dfu_launch, which copies it to the SRAM
# run base (k_ra_dfu_run_base = 0x22020000) and branches there. The copied
# payload then advances a heartbeat counter forever at a fixed SRAM word
# (0x22010004), which is reachable ONLY by copying-to-run and branching, since
# this app's own code is in MRAM and never writes that word. g_dcr_run_heartbeat
# is the linker-pinned name for that word, so a double-halt mem32 read seeing it
# advance is a specific proof that copy-to-run executed. A failed run-target
# check parks in dcr_panic_halt (heartbeat frozen), which the gate flags.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_dcr_run_heartbeat"
HIL_PROBE_MIN_ADVANCE=1000
HIL_PROBE_SECONDS=3

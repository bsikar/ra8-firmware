# Headless on-silicon gate for the GLCDC layer-1 render path (#121): paint a
# deterministic RGB565 pattern into an SRAM framebuffer, bring the GLCDC up via
# the display PAL (real GR1 programming + start + layer1_show), assert the layer
# is bound to that buffer, FNV-1a-hash the framebuffer, and print the hash over
# SCI8. The `layer1=ok ... PASS` tail is emitted only once the GLCDC-programmed
# asserts hold; any bring-up failure prints `FAIL glcdc`. The expected hash is
# the bench/ra8_emulator baseline -- drift in the render or GLCDC path trips the
# gate. No SDRAM/touch/SD needed.
HIL_MODE=uart_scrape
HIL_EXPECT="glcdc-hil: layer1=ok dim=512x512 crc=B21B8D3D PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

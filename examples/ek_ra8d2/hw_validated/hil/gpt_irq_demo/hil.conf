# gpt_irq_demo links the GPT0 counter-overflow event through the ICU
# IELSR table to an NVIC line and services it with an application ISR
# (ra8_isr_register), starting GPT0 in saw-wave PWM mode. Each overflow
# fires the ISR, which bumps g_gpt_irq_count and toggles LED1. The main
# loop never touches the LED, so the counter only advances if the real
# NVIC interrupt path works end to end.
#
# The probe asserts the counter advances >= 10 inside a 4 s window.
# Catches: GPT MSTP gate closed, IELSR event link wrong, NVIC line not
# enabled, or the vector not dispatching to ra8_isr_dispatch.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpt_irq_count"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=4

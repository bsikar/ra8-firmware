# gpio_input_demo polls SW1 (P009) at 100 ms cadence and mirrors the
# state to LED1. No UART -- the jlink_memprobe mode reads
# g_gpio_input_tick via SWD twice across a 3 s window and asserts the
# poll loop iterated at least 15 times (100 ms cadence -> ~30 ticks
# in 3 s; half-floor = 15 absorbs any boot-time slack).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpio_input_tick"
HIL_PROBE_MIN_ADVANCE=15
HIL_PROBE_SECONDS=3

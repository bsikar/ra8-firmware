# App-shell chrome (#146 Phase 2): the ra8_app launcher lists the registered apps
# and launches one by index, navigates library -> reader -> settings with the
# back-stack unwinding, and exercises the run-time "core uninstallable" rule --
# all on the real Cortex-M85 image with a deterministic self-check (no display,
# no widgets). On success the app mirrors its ITM "app_shell_demo PASS" verdict
# to the SCI8 / J-Link OB VCOM console so the Pi rig (which has no SWO / ITM
# capture) can gate it; any self-check failure logs over ITM and parks in WFI
# WITHOUT emitting the VCOM banner. Single-core, bare-metal. Stock EK-RA8D2.
HIL_MODE=uart_scrape
HIL_EXPECT="app_shell_demo: demo PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

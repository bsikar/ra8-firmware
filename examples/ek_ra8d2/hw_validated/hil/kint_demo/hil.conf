# kint_demo exercises the IRQ13-DS pin as a key-input source: SW1
# (P009) edge-detected via IRQCR13.IRQMD=falling + digital filter,
# polled in the main loop. Press banners only emit when SW1 is
# manually pressed; the HIL gate scrapes the post-arm boot banner
# instead to assert CGC + SCI + ICU bring-up.
HIL_MODE=uart_scrape
HIL_EXPECT="kint_demo: boot"
HIL_EXPECT_NEGATIVE="HardFault|panic|fault|hw_init_failed|cgc_init failed"
HIL_TIMEOUT_S=10

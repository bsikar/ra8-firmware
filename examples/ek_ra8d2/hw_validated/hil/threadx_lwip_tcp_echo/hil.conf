# threadx_lwip_tcp_echo listens on 192.168.1.50:7 (RFC 862 TCP echo)
# under ThreadX + lwIP. Real Pi-as-peer assertion via hil_eth_tcp.sh.
# This is the ThreadX/lwIP-stack counterpart of the bare-metal
# ethernet_tcp_echo at 192.168.1.42.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.50"
HIL_PORT=7
HIL_PROTO=tcp
HIL_PAYLOAD_BYTES=1024
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=10

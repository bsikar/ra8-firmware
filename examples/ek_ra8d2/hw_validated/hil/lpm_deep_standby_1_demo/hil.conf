HIL_MODE=uart_scrape
# Firmware emits "lpm_dpsby1: boot" before it enters Deep Software
# Standby 1 (LPMD=0x8). On hardware the wake path resets the CPU and
# the banner re-emits on each cycle. The HIL gate is intentionally
# boot-only because the deep-standby wake path depends on the
# sub-clock crystal (SOSC), which is intermittent on this EVM.
HIL_EXPECT="lpm_dpsby1: boot"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|lpm.*failed|cgc_init failed|rtc.*failed"
HIL_TIMEOUT_S=15

# After this test the chip is in a deep-LPM state that gates the
# AHB-AP; hil_all.sh runs rfp-cli -erase-chip (Initialize) before
# the next app's flash. See docs/RECOVERY_OEM_PL0_BRICK.md.
HIL_POST_INITIALIZE=1

# Interactive ra8_widget + ra8_app launcher on the live GLCDC panel (#145/#146).
# Brings the GLCDC up through the display PAL, composites three apps (Library /
# Reader / Settings) into a 512x512 SRAM framebuffer the panel scans, then runs
# a deterministic self-check (register, launch + focus lifecycle, distinct
# composites, touch dispatch, button routing, status-bar-only damage) and emits
# the banner below before entering the SW1/SW2-driven interactive loop. The
# `PASS` tail is printed only once every self-check assertion holds; any failure
# prints a `FAIL ...` banner. The composite CRCs are the ra8_emulator baseline --
# drift in the widget/app render or routing trips the gate. No SDRAM/touch/SD.
HIL_MODE=uart_scrape
HIL_EXPECT="widget-app-demo: apps=3 lib=26CE7CD0 rdr=22B7E671 route=ok flush=512x44 hint=fast PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

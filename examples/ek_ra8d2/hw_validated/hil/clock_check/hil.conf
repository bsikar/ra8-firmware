# clock_check brings up the full CGC (HOCO + PLL1) and then, every
# k_clock_check_half_period_ms = 500 ms, queries every clock-tree
# domain (CPUCLK0..MRICLK) and compares against the constants in
# ra8_time_constants.h. g_clock_check_match advances only when ALL
# clocks read back their post-PLL target; g_clock_check_mismatch
# latches on any disagreement or readback error. Steady-state rate
# is 2 match/s, so the probe asserts:
#   - g_clock_check_match advances at least 6 times in a 5 s window
#   - g_clock_check_mismatch stays at 0.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_clock_check_match"
HIL_PROBE_MIN_ADVANCE=6
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_clock_check_mismatch"
HIL_PROBE_MAX_FAILURE=0

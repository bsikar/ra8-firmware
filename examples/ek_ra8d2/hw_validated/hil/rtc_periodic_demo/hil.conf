# rtc_periodic_demo extends rtc_alarm by enabling BOTH the alarm
# (RCR1.AIE) and periodic (RCR1.PIE) IRQ flags after setting a +5 s
# alarm. The demo polls ra8_rtc_get_status for either bit and logs
# 'rtc_per: tick' on fire.
#
# Like rtc_alarm, the actual periodic/alarm fire depends on the
# sub-clock crystal (SOSC), which is intermittently populated on
# this EVM. The HIL gate therefore scrapes only for the boot banner
# -- success proves the firmware booted and ra8_rtc_init +
# ra8_rtc_set_irq_enable(alarm|periodic) accepted the dual-flag mask.
# When SOSC is running on the bench, 'rtc_per: tick' also fires
# but is not gated on.
HIL_MODE=uart_scrape
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="rtc_per: boot"
HIL_EXPECT_NEGATIVE="HardFault|rtc.*failed|cgc_init failed"
HIL_TIMEOUT_S=10

HIL_MODE=uart_scrape
# Tight success banner (25 chars, unique success path -- the firmware
# also emits "dma: copied 1024B match=N" on miscompare, caught below).
HIL_EXPECT="dma: copied 1024B match=Y"
HIL_EXPECT_NEGATIVE="dma: copied 1024B match=N|hw_init_failed|dmac.*failed|HardFault"
HIL_TIMEOUT_S=10

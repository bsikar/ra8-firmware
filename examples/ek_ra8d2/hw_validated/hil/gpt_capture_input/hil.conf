# gpt_capture_input arms GPT0 as a free-running counter and polls it
# for SW1-press input-capture deltas. SW1 is never pressed on the
# unattended HIL bench, so the gate doesn't try to assert
# capture-period readings -- it just confirms the GPT counter is
# alive via g_gpt_capture_tick (bumped each iteration GTCNT advanced
# between samples).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpt_capture_tick"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=4

# wdt_window_demo exercises the Window Watchdog Timer (WWDT) via
# ra8_wdt.h -- the runtime-configurable companion to the IWDT covered
# by iwdt_demo. The demo programs a 1024-cycle period with a
# 25..75 % refresh window, then polls the counter and refreshes only
# when it sits inside that window. Every successful refresh emits a
# UART banner; the HIL probe asserts the banner appears at least 1
# time inside the boot timeout (catches "window math wrong" / "WDT
# stuck" / "WDT not counting").
HIL_MODE=uart_scrape
HIL_EXPECT="wdt: window_tick=ok"
HIL_EXPECT_NEGATIVE="HardFault|wdt:.*failed|cgc_init failed"
HIL_TIMEOUT_S=30

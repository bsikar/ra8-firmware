# N-point affine touch-calibration gate (#262). The app brings up the real
# GLCDC layer-1 panel (ra8_display_pal -> ra8_glcdc) and the real GT911 touch
# driver (ra8_touch -> IIC_B), then runs ra8_touch_cal's five-point calibration:
# for each of four inset-corner targets + the panel centre it paints a cross-hair
# and blocks on one settled raw GT911 sample, solves the affine transform,
# round-trips it through ra8_touch_cal_save/load, and re-applies it to every
# captured raw to prove the corrected coordinate lands on its target.
#
# SIM==HIL: the solve is only reachable once five distinct raw samples arrive. On
# silicon a human taps the five cross-hairs; board_sim reproduces that by feeding
# five synthetic raw points through the modelled GT911 (HIL_SIM_ARGS below), which
# return through the genuine ra8_touch_read decode -- so under SIL the banner
# carries a real "cal=OK verify=OK maxerr=0" result and any solver regression
# prints "verify=FAIL" (caught by the negative set). On a bare automated bench
# with no finger the read shim times out and the app prints "cal=SKIP", so this
# gate asserts only the finger-free "touchcal: ready" sentinel, which prints in
# every environment (mirroring touch_demo, which likewise gates the finger-free
# bring-up and lets the simulator inject the touch).
HIL_MODE=uart_scrape
HIL_EXPECT="touchcal: ready dim=512x512"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|hw_init"
HIL_SIM_ARGS="--touch-seq 420:520,3868:520,3868:3968,420:3968,2148:2248"
HIL_TIMEOUT_S=30

HIL_MODE=uart_scrape
# timer_capture_demo emits "gpt: period=NNNNNNNN" where NNNNNNNN is the
# GPT GTCNT delta over a 100 ms window (8 hex chars). The prefix alone
# is too weak -- it matches even when the GPT counter never moves (a
# real bug we hit on this chip: 12-character "gpt: period=" still
# passed when actual output was "gpt: period=00000000"). The negative
# regex rejects period=00000000 since 100ms of GPT counting at PCLKA/4
# = 31.25 MHz must produce a non-zero delta.
HIL_EXPECT="gpt: period="
HIL_EXPECT_NEGATIVE="gpt: period=00000000|hw_init_failed|gpt.*failed|HardFault"
HIL_TIMEOUT_S=15

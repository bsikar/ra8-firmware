# PDM MEMS microphone capture demo (EK-RA8D2 on-board SPH0690).
#
# The EK-RA8D2 carries two SPH0690 PDM MEMS microphones (MIC1/MIC2) on
# the underside of the PCB, wired to PDMCLK2 (P812) and PDMDAT2 (P502)
# -- i.e. PDM-IF channel 2 (UM Table 31 p 37). No external hardware is
# needed. The firmware brings up the PDM filter chain, captures PCM and
# prints a plausibility verdict:
#
#     pdm: rms=NNN peak=NNN active=Y
#
# active=Y means the captured audio is non-degenerate (not a stuck DC
# constant / not all-zero) and carries plausible acoustic energy. Tap
# near the underside mics or make noise to watch rms/peak track it.
HIL_MODE=uart_scrape
HIL_EXPECT="pdm: verdict=PASS active=Y"
HIL_EXPECT_NEGATIVE="pdm: verdict=FAIL|no data|init FAIL|HardFault"
HIL_TIMEOUT_S=12

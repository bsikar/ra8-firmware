# Bare-metal UDP echo responder on 192.168.1.43:7. The HIL helper sends
# a 512-byte random UDP datagram from the Pi (which gets temporarily
# addressed as 192.168.1.1/24 on its USB-Ethernet adapter) and asserts
# the firmware mirrors it back byte-exact.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.43"
HIL_PORT=7
HIL_PROTO=udp
HIL_PAYLOAD_BYTES=512
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=10

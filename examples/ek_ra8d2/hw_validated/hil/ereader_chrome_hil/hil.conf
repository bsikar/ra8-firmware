# Headless on-silicon gate for the e-reader chrome render pipeline (#76/#80):
# build the real ra_box layout + ra_gfx render of a status-bar-over-grid screen
# into an SRAM framebuffer, FNV-1a-hash it, and print the hash over SCI8. The
# expected hash is the bench-captured baseline -- any drift in the box math,
# rasteriser, or toolchain output trips the gate. No panel/SD/touch needed.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-hil: chrome boxes=7 crc=0DCB740F"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

# ethernet_tcp_echo listens on 192.168.1.42:7 (RFC 862 Echo Protocol
# over TCP). hil_eth_tcp.sh opens a TCP socket from the Pi, sends a
# random payload, reads the echo back, and asserts byte-equality.
# Real Pi-as-peer assertion that the chip's TCP stack actually works,
# not just that it booted.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.42"
HIL_PORT=7
HIL_PROTO=tcp
HIL_PAYLOAD_BYTES=1024
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=10

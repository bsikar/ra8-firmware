HIL_MODE=uart_scrape
# Tight banner: "[fxlx] booting xSPI flash" (25 chars) is the first
# unique success-path line. The negative regex catches every failure
# banner the app might print: LevelX format/open, FileX adapter bind,
# FileX media format/open, FileX file create/open/write, xSPI init.
# The Octo-SPI flash bring-up that blocked this app is fixed (#44): the
# on-board ISSI IS25LX512M is on xSPI CS1 and ra8_xspi drives it. The
# LevelX format failure (#87) is also fixed (2026-06-10): the LevelX NOR
# driver owns bus bring-up, so the app must NOT also route the xSPI pins
# (the second PFS route was rejected, the driver bailed before wiring the
# sector buffer, and format returned LX_NO_MEMORY).
#
# Positive expect is the late read-back line: the app formats + opens
# LevelX, binds FileX, formats + mounts a FAT volume, writes
# /levelx_test.txt, and reads it back. Matching the exact read-back
# content proves the full FAT-on-LevelX-on-xSPI stack round-tripped real
# data.
#
# The fx_media_open failure that once blocked this app (#88) is fixed: the
# ra8_xspi HAL only moved the first 8 bytes (one manual-command slot) per
# read/program call, so FileX's 512-byte boot/FAT sectors came back
# corrupt; ra8_xspi_flash_read/_program now chunk arbitrary lengths into
# <=8-byte, page-aligned transfers. Verified live (writes + reads back
# "Hello from wear-leveled FAT!") via scripts/hil/run_local.sh 2026-06-10.
HIL_EXPECT="[fxlx] readback: Hello from wear-leveled FAT!"
HIL_EXPECT_NEGATIVE="\[fxlx\] (lx_nor_flash_(format|open)|lx_filex_adapter_bind|fx_media_(format|open)|fx_file_(create|open\(read\)|open\(write\)|write)|ra8_xspi_init) failed|\[fxlx\] adapter reports zero sectors|HardFault"
HIL_TIMEOUT_S=30

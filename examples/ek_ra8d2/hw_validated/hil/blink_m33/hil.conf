# Canonical Cortex-M33 secondary-core template (#152): the Cortex-M85 releases
# the M33, which then blinks LED1 (BLUE, P600); the M85 idles in WFI. This
# template has NO shared-SRAM mailbox, so the M33's authoritative proof-of-life
# is the blinking LED -- confirm it VISUALLY on the bench. The strongest verdict
# the M85 itself can report over VCOM is that ra_cpu1_release succeeded, so it
# mirrors that to the SCI8 / J-Link OB VCOM console on the success path only (a
# release failure logs over ITM and parks, no banner). The uart_scrape gate
# proves the boot + clock + console + M33-release path; the LED confirms the M33
# actually runs. Stock EK-RA8D2, no add-on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="blink_m33: m33 released PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# USB Mass Storage Class device demo. Exposes a 512 KiB FAT12 RAM disk
# (USBX storage class). On the bench, the Linux host attaches the
# device as a SCSI block device after the BOT INQUIRY + READ_CAPACITY
# handshake completes. The hil_msc_test.sh probe greps the host
# kernel log for "[sdX] Attached SCSI" which only prints once that
# handshake lands.
#
# History: this app was in hw_pending/ between 2026-05-18 and
# 2026-05-23 while the BOT bulk-transport defect (issue #6) was
# being fixed; the fix landed across caf50aa2 (EP0 race),
# 01f0bad3 (orphan bulk-OUT hold), and e541af93 (DBLB asymmetry on
# IN). Bench-validated 2026-05-23 via mkfs.vfat + mount + 128 KiB
# roundtrip; the HIL probe was added in PR #10 and bench-confirmed
# attach end-to-end (kernel log shows "RA8D2 USBX RAM Disk", sda
# created, no SCSI errors).
HIL_MODE=usb_msc
HIL_VIDPID="1209:000b"

# threadx_levelx_demo: ThreadX + LevelX wear-levelling over the on-board
# ISSI IS25LX512M xSPI NOR. The LevelX NOR driver owns bus bring-up
# (pins + 8D/1S reset recovery + ra8_xspi_init + RDID) exactly once; the
# app must NOT also call ra8_board_xspi_pins_init / ra8_xspi_init or the
# second PFS route is rejected and lx_nor_flash_format returns
# LX_NO_MEMORY (fixed 2026-06-10, see port/levelx/src/lx_nor_driver_ra8_xspi.c).
#
# uart_scrape on the success-only banner the worker prints after the
# FIRST heartbeat: it formats + opens LevelX, writes the counter into
# logical sector 0, and reads it back. A matching read-back proves the
# whole stack round-tripped real data on hardware. Verified live via
# scripts/hil/run_local.sh on 2026-06-10.
HIL_MODE=uart_scrape
HIL_EXPECT="[lx] sector rw verified readback=1"
HIL_EXPECT_NEGATIVE="\[lx\] (format|open) failed|\[lx\] sector rw MISMATCH|\[lx\] heartbeat I/O error|HardFault"
HIL_TIMEOUT_S=20

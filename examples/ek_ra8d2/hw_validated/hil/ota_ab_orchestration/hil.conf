# A/B OTA orchestration gate (issue #260). The demo drives the libs/ra8_ota A/B
# slot state machine end to end, twice, over the on-chip extra-MRAM (data-flash)
# bank at 0x27000000:
#
#   COMMIT   -- a good image is staged into the inactive bank, re-hashed +
#               signature-checked, and the inactive bank is latched as the next
#               boot bank (the boot-select record flips A -> B).
#   ROLLBACK -- a corrupted image is staged; the re-hash no longer matches the
#               manifest digest, verification fails (k_ra8_err_crc_mismatch), the
#               machine parks in error, commit is skipped, and the boot-select
#               record is left on the still-good active bank A.
#
# tools/board_sim models the MRAM MACI program/erase sequencer
# (board_periph_mram.c), so the stage / re-hash / boot-select persistence run the
# exact register path a bench build drives -- the headless SIL run observes the
# same commit and rollback the silicon does, with no board attached. SHA-256 is
# the real software backend (identical on host, sim and silicon), so the update
# INTEGRITY check that triggers the rollback is genuine. HIL_EXPECT_NEGATIVE
# catches either A/B path deviating (ok=N) plus any init failure / HardFault.
HIL_MODE=uart_scrape
HIL_EXPECT="ota_ab: stage=ok commit=Y rollback=Y ok=Y"
HIL_EXPECT_NEGATIVE="ok=N|commit=N|rollback=N|stage=fail|HardFault|hw_init_failed|TIMEOUT"
HIL_TIMEOUT_S=15

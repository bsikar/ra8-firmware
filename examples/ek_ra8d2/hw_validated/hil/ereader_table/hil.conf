# Headless on-silicon gate for <table> grid layout (#107): lay out a chapter
# with a 2-column table (heading row + data rows) plus surrounding text, then
# FNV-hash every laid-out glyph's (x, y). The banner reports the glyph count +
# the geometry hash. Ahem's fixed metrics make the grid deterministic; the same
# banner appears on host, ra8_emulator, and silicon. No panel/SD/touch needed.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-table-hil: glyphs=172 geom=E3181EE6"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

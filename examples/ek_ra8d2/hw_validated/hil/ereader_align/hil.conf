# Headless on-silicon gate for text alignment + justification (#108): lay out a
# chapter with right / centre / justified / default-left paragraphs (from inline
# style="text-align:..."), then FNV-hash every laid-out glyph's (x, y). The
# banner reports the glyph count + the geometry hash. Ahem's fixed metrics make
# it deterministic; the same banner appears on host, ra8_emulator, and silicon.
# No panel/SD/touch needed.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-align-hil: glyphs=210 geom=D4C9657E"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

HIL_MODE=uart_scrape
# ssie_audio_loop drives SSIE0 in I2S controller mode with the TX
# FIFO routed back into the RX FIFO internally -- no external audio
# codec or speaker required. "ssie: loop ok" prints after a
# successful 16-sample sine round-trip; the negative regex catches
# any HAL init failure or HardFault path.
HIL_EXPECT="ssie: loop ok"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|ssie.*failed|panic|FAIL"
HIL_TIMEOUT_S=10

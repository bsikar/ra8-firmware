# On-silicon / emulator headless verification for inline WebP image decoding (#637).
# Lays out and renders an embedded 96x96 lossless WebP illustration with zero heap allocation.
HIL_MODE=uart_scrape
HIL_EXPECT="reflow-webp-demo: decode=96x96 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=25

# DRW 2D-engine fill-rect gate.
#
# PROMOTED (#170). The demo asks for a 16x16 rect at (8,8) in 0xFF00FF00 and
# an EK-RA8D2 now paints exactly that: pixels (8,8)..(23,23), every one of them
# 0xFF00FF00, verified by a J-Link savebin of g_drw_fb. ra8_emulator reproduces
# it, so this app is EIL == HIL.
#
# History, because two separate defects stacked here.
#
# 1. The engine was never POWERED (#247). The DRW sits in the graphics power
#    domain, which PDCTRGD gates OFF at reset (HUM Ch 11.2.14 p 452, reset
#    value 0x81: PDPGSF=1, PDDE=1); HUM Ch 11.5.1 Table 11.7 p 480 places DRW,
#    GLCDC, MIPI DSI/CSI and VIN in it. Cancelling the module-stop bit is not
#    sufficient. ra8_drw_init now calls ra8_lpm_graphics_power_on() first.
#    Bench: HWREVISION 0x00000000 -> 0x0FBE0107.
#
# 2. The render was then still wrong: a 16x16 request painted 8x8 at
#    (8,8)-(15,15) and the alpha byte arrived as 0x00. Both root-caused on the
#    bench under #170:
#      - Geometry. The engine scans the bounding box (HUM Ch 62.6.2 p 3716)
#        that SIZE sizes (Ch 62.2.29 p 3704) and ORIGIN anchors (Ch 62.2.31
#        p 3705). The driver left ORIGIN at the framebuffer base and tried to
#        place the rect with the spatial limiters, feeding LnSTART absolute
#        pixel coordinates -- but LnSTART is the decision value at the bounding
#        box's top-left corner, not a coordinate. The painted region was the
#        requested rect intersected with a 16x16 box at (0,0): the observed
#        8x8. An axis-aligned rect needs no limiter, so the fill now anchors
#        ORIGIN at the rect's own top-left pixel and clears CONTROL.
#      - Alpha. CONTROL2.WRITEALPHA (bits 23:22, HUM Ch 62.2.2 p 3694) reset
#        value 00 means "use alpha from COLOR2", and COLOR2 is 0 for a solid
#        fill. Now set to 01, source alpha.
#
# Bench sweep behind those conclusions (single limiter, XADD=+16, SIZE 32x32):
# START=+128 selected x>=8, START=-128 selected x>=24, and the coverage
# reached the framebuffer as alpha 0x01-0x02 rather than 0xFF -- which is why
# the limiters are not used for box fills and are left unmodelled in ra8_emulator.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: fill match=Y"
HIL_EXPECT_NEGATIVE="hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

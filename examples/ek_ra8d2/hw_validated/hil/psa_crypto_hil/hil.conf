HIL_MODE=uart_scrape
# The app prints "psa crypto: KAT OK" once per second when the tf-psa-crypto
# software backend matches the SHA-256 / AES-128-GCM / ECDSA-P256 vectors on
# silicon, or "psa crypto: KAT FAIL" on any miscompare. HardFault fails fast.
HIL_EXPECT="psa crypto: KAT OK"
HIL_EXPECT_NEGATIVE="psa crypto: KAT FAIL|HardFault"
HIL_TIMEOUT_S=20

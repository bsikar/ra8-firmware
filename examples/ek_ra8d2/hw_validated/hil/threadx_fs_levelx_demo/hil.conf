HIL_MODE=uart_scrape
# Positive expect is the late read-back line: the app formats + opens
# LevelX, binds the ra8_fs block-device backend (lx_fs_backend_bind),
# formats + mounts a FAT volume with ra8_fs, writes /levelx_test.txt,
# and reads it back. Matching the exact read-back content proves the
# full FAT-on-LevelX-on-xSPI stack round-tripped real data.
#
# The negative regex catches every failure banner the app might print:
# LevelX format/open, backend bind, ra8_fs format/mount/write_file/
# open(read). The Octo-SPI flash bring-up that blocked this app is
# fixed (#44): the on-board ISSI IS25LX512M is on xSPI CS1 and ra8_xspi
# drives it. The LevelX format failure (#87) is also fixed (2026-06-10):
# the LevelX NOR driver owns bus bring-up, so the app must NOT also
# route the xSPI pins (the second PFS route was rejected, the driver
# bailed before wiring the sector buffer, and format returned
# LX_NO_MEMORY).
HIL_EXPECT="[fslx] readback: Hello from wear-leveled FAT!"
HIL_EXPECT_NEGATIVE="\[fslx\] (lx_nor_flash_(format|open)|lx_fs_backend_bind|ra8_fs_(format|mount|write_file|open\(read\)|set_lock)) failed|HardFault"
HIL_TIMEOUT_S=30

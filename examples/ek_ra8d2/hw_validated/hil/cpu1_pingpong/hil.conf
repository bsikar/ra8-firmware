# cpu1_pingpong releases CPU1 (Cortex-M33) and exchanges 0x1234 ->
# 0x4321 through a shared SRAM2 message struct at 0x22100000 (see
# shared_pingpong.h). The IPC peripheral is intentionally NOT used:
# CPU1 on this chip has SECEXT disabled (HUM Ch 2) and the IPC
# channel security attribution (SAIPCIRn) is mutually exclusive S
# xor NS, so a single channel can't bridge CPU0(S) <-> CPU1(NS).
# Shared SRAM sidesteps the security problem while still validating
# CPU1 release + boot + responder loop.
#
# g_cpu1_pingpong_match advances once per completed round-trip;
# g_cpu1_pingpong_mismatch advances on payload mismatch or pong-wait
# timeout. Bench measures ~36 k round-trips per second so the
# 5-in-5s threshold has enormous margin.
#   - g_cpu1_pingpong_match advances at least 5 times in a 5 s window
#     (catches "CPU1 never came out of reset" / SRAM wedged)
#   - g_cpu1_pingpong_mismatch stays at 0.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_cpu1_pingpong_match"
HIL_PROBE_MIN_ADVANCE=5
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_cpu1_pingpong_mismatch"
HIL_PROBE_MAX_FAILURE=0

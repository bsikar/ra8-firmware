# canfd_loopback runs CAN-FD frames through the CAN_FD peripheral's
# internal loopback at 500 kbit/s, one frame per second
# (k_canfd_demo_period_ms = 1000). The probe asserts:
#   - g_canfd_match advances at least 3 times in a 5 s window
#     (3-4 expected after the ~1 s flash dwell + boot)
#   - g_canfd_mismatch stays at 0 (any TX/RX failure trips this).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_canfd_match"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_canfd_mismatch"
HIL_PROBE_MAX_FAILURE=0

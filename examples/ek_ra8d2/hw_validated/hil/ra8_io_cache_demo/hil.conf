# ra8_io cache layer over the on-chip RAM-backed VFS (#155/#156). The demo mounts
# the `ram:` backend, primes a file, then re-reads ram:/HELLO.TXT eight times to
# exercise the page cache and reports the hit/miss tally over the SCI8 / J-Link
# OB VCOM console. The cache and its backing store are entirely on-chip SRAM, so
# this is bench-runnable on a stock EK-RA8D2 with no external memory or SD. The
# hit/miss counts in the banner are dynamic, so the gate scrapes the deterministic
# trailing literal that is printed only on the k_ra8_ok success path; a failing run
# prints "ra8_io_cache_demo: FAIL", which the negative regex catches.
HIL_MODE=uart_scrape
HIL_EXPECT="ram:/HELLO.TXT PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

HIL_MODE=uart_scrape
# Tight banner: "i2c: scan 0x43 ack=1" is 22 chars, only emitted on
# successful ack from the U15 PI4IOE5V6408 I/O expander at I2C
# address 0x43 (board UM Section 4.3.4 p 24). Failure paths emit
# "i2c: scan 0x43 ack=0" (NAK) or "i2c: scan ERROR" (bus fault).
HIL_EXPECT="i2c: scan 0x43 ack=1"
HIL_EXPECT_NEGATIVE="i2c: scan 0x43 ack=0|i2c: scan ERROR|hw_init_failed|i2c.*failed|HardFault"
HIL_TIMEOUT_S=10

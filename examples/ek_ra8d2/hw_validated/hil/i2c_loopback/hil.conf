HIL_MODE=uart_scrape
# Tight banner: "iic_b: scan 0x77 ack=1" is 22 chars, only emitted on
# successful ack from the loopback target. The failure path emits
# "iic_b: scan 0x77 ack=0" (NAK) or "iic_b: scan ERROR" (bus fault).
HIL_EXPECT="iic_b: scan 0x77 ack=1"
HIL_EXPECT_NEGATIVE="iic_b: scan 0x77 ack=0|iic_b: scan ERROR|hw_init_failed|iic_b.*failed|HardFault"
HIL_TIMEOUT_S=10

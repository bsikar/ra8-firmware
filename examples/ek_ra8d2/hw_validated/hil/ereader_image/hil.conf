# Headless on-silicon gate for the zero-heap raster image pipeline (#106):
# decode a baked 120x90 PNG cover through ra8_img_decode_blit() (allocating only
# from a fixed SRAM bump arena -- no malloc), nearest-neighbour scale it to fill
# a 160x120 RGB565 framebuffer, FNV-1a-hash the framebuffer, and print the hash
# over SCI8. The expected hash is the host/ra8_emulator-captured baseline -- any
# drift in the decoder, the scale math, the RGB565 pack, or the toolchain output
# trips the gate. No panel/SD/touch needed. The same hash is produced on host,
# ra8_emulator, and silicon (deterministic integer render).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-img-hil: img 160x120 crc=BDC56EC5"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

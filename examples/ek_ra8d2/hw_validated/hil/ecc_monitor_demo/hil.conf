# SRAM ECC bring-up gate. This gate covers the headless half: that full
# ECC ("with-check") + zero-init can be brought up on a spare SRAM bank
# (bank 2) and an ECC-protected read/write round-trips without faulting.
# tools/ra8_emulator shadows the SRAM ECC control window (SRAMCRn/SRAMESR) so
# this passes -- but board_sim does NOT model ECC, so the actual
# error-detection path (a real 1-bit/2-bit flip setting SRAMESR) cannot be
# exercised here; the demo reports those via g_ecc_1bit / g_ecc_2bit for
# on-silicon probing. The error-injection check is the real promotion gate
# (see README); this app stays in hw_pending until it is confirmed on the
# bench.
HIL_MODE=uart_scrape
HIL_EXPECT="ecc: sram2 ecc=on rw=ok ok=Y"
HIL_EXPECT_NEGATIVE="rw=BAD|ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

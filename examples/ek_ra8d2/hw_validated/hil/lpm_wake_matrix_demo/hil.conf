HIL_MODE=uart_scrape
# Demo walks the WUPEN0 / WUPEN1 wake-source enable bits via
# ra_lpm_arm_wupen0_bits / ra_lpm_arm_wupen1_bits and prints two
# banner lines (boot + done). The HIL gates on the longer of the two
# to confirm the walk completed.
HIL_EXPECT="lpm_wake_matrix: done"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|lpm.*failed|cgc_init failed"
HIL_TIMEOUT_S=15

# can_classic_loopback runs CAN-Classic frames through the CAN_FD
# peripheral's internal loopback at 250 kbit/s, one frame per second
# (k_can_demo_period_ms = 1000). The probe asserts:
#   - g_can_match advances at least 3 times in a 5 s window
#     (3-4 expected after the ~1 s flash dwell + boot)
#   - g_can_mismatch stays at 0 (any TX/RX failure trips this).
# Real proof that the CAN peripheral actually moved frames, not just
# that the firmware looped.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_can_match"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_can_mismatch"
HIL_PROBE_MAX_FAILURE=0

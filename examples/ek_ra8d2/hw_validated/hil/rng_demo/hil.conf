HIL_MODE=uart_scrape
# rng_demo emits the dynamic "trng: <64 hex chars>" data line and then,
# only after a non-stuck sample is dumped, the fixed verdict
# "trng: entropy OK" (16 chars) -- the success-only line the gate keys on.
# The failure path emits "rng_demo: FAIL stuck" (not prefixed "trng: ")
# so the verdict cannot overlap a failure banner; the negative regex
# catches it plus the PSA/TRNG/CGC bring-up failures.
HIL_EXPECT="trng: entropy OK"
HIL_EXPECT_NEGATIVE="hw_init_failed|psa.*fail|trng.*fail|cgc_init failed|HardFault|rng_demo: FAIL"
HIL_TIMEOUT_S=10

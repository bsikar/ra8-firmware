HIL_MODE=uart_scrape
# rng_demo emits "trng: <64 hex chars>\r\n" on success; the hex is
# dynamic so the longest fixed success string is "trng: " (6 chars).
# The failure path emits "rng_demo: FAIL stuck" -- deliberately not
# prefixed "trng: " so HIL_EXPECT cannot overlap a failure banner.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="trng:"
HIL_EXPECT_NEGATIVE="hw_init_failed|psa.*fail|trng.*fail|cgc_init failed|HardFault|rng_demo: FAIL"
HIL_TIMEOUT_S=10

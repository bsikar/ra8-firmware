HIL_MODE=uart_scrape
# rng_demo emits "trng: <64 hex chars>\r\n" -- the hex is dynamic, so
# the longest fixed-string is just "trng: " (6 chars). Negative regex
# catches the psa_crypto/TRNG init-failure banners.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="trng:"
HIL_EXPECT_NEGATIVE="hw_init_failed|psa.*fail|trng.*fail|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

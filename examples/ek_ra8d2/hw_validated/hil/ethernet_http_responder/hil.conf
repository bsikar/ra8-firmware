# Minimal HTTP/1.1 GET responder on 192.168.1.44:80. The HIL helper
# issues an HTTP GET / from the Pi (which gets temporarily addressed as
# 192.168.1.1/24 on its USB-Ethernet adapter) and asserts the response
# contains both "200 OK" and the marker "Hello from RA8D2".
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.44"
HIL_PORT=80
HIL_PROTO=http
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=10

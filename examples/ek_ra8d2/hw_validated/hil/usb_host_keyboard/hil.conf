# USB host HID boot-keyboard over the self-loop (J7 HS host <-> J11 FS device,
# board emulates the keyboard). Host enumerates, reads boot reports, and decodes
# the keycodes back to "RA8D2". Pass banner on SCI8 @115200.
HIL_MODE=uart_scrape
HIL_EXPECT="USB HOST KEYBOARD PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|mismatch|report read"
HIL_TIMEOUT_S=60

# wdt_reset_recovery_demo deliberately trips the WWDT and verifies the
# chip recovers cleanly on the next boot.
#
# Boot 1 (power-on): banner 'wdt_rr: boot reason=power_on', arms WWDT
# with on_expiry=reset and stops refreshing -> WWDT underflow triggers
# an internal reset ~25 s after stage A ends.
#
# Boot 2 (post-WWDT-reset): ra_reset_get_cause returns
# k_ra_reset_cause_wdt0; banner becomes 'wdt: reset_by=watchdog' and
# the chip parks in WFI. The HIL probe scrapes for THAT banner, so a
# PASS requires both the reset to fire AND the next boot to read the
# RSTSR1.WDTRF cause flag correctly.
#
# The 60 s timeout covers: ~1.5 s stage A active refresh + ~25 s WWDT
# underflow countdown + boot time + slack.
HIL_MODE=uart_scrape
HIL_EXPECT="wdt: reset_by=watchdog"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|wdt_rr:.*failed|cgc_init failed"
HIL_TIMEOUT_S=60

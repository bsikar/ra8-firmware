# ra8_io pluggable filesystem-format layer (#155/#156). The demo probes the
# registered FAT format descriptor (name + capability fields such as the maximum
# name length) and walks the foreign-format stub seam, reporting the result over
# the SCI8 / J-Link OB VCOM console. It is a pure in-SRAM metadata/plumbing test
# -- no external memory or SD card is touched -- so it is bench-runnable on a
# stock EK-RA8D2. The probed format name + maxname are dynamic, so the gate
# scrapes the deterministic trailing literal printed only on the success path; a
# failing probe prints "ra8_io_fsfmt_demo: FAIL", which the negative regex catches.
HIL_MODE=uart_scrape
HIL_EXPECT="+ foreign stub seam PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

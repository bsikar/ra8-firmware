# threadx_blink runs two LED-toggle threads under ThreadX. The
# jlink_memprobe mode reads g_threadx_blink_tick (incremented each
# time thread A toggles LED1) twice across a 4 s window and asserts
# the counter advanced -- proves the scheduler is running and
# thread A actually woke up after tx_thread_sleep.
#
# Thread A toggles at 1 Hz (k_blink_a_ticks = 500 ms). 4 s window
# allows for >= 3 toggles realistically (after ~250ms scheduler
# bring-up).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_threadx_blink_tick"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=4

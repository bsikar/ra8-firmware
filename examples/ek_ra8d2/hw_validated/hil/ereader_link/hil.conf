# Headless on-silicon gate for in-content hyperlink navigation (#110): lay out a
# chapter with two <a href> links (one cross-chapter, one #fragment) and a
# <p id="foot"> anchor, then drive the nav API the way a touch tap would --
# ra8_reflow_hit_test_link() + ra8_reflow_href_split() + ra8_reflow_find_anchor().
# The banner reports the link count, that a cross-chapter + a fragment link were
# resolved, the anchor's page, and an FNV hash of the link-rect geometry. Ahem's
# fixed metrics make it deterministic; the same banner appears on host,
# ra8_emulator, and silicon. No panel/SD/touch needed.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-link-hil: links=2 cross=Y frag=Y apage=1 geom=5B90D1EE"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

# HIL gate for dfu_selftest_boot (USB self-loop: the board is its own dfu-util).
# The HS host (J7) DFU_DNLOADs a real bootable Slot-A image into the FS DFU
# device (J11) and sends a manifest; the device programs + COMMITS the slot
# header. The driver then confirms Slot A is bootable (CRC) and prints the pass
# banner on SCI8. This validates the program+commit path the dfu_bootloader
# uses, without an external USB host. (The bootloader then boots this committed
# slot -- verified separately via J-Link; see dfu_bootloader/README.)
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST DFU-BOOT COMMIT PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|FAIL |commit timeout|not bootable|TIMEOUT"
HIL_TIMEOUT_S=60
# ra8_emulator (EIL) only: model the on-chip USBHS host controller (0x40351000) and
# bridge it to the modelled USBFS device, so the same chip's HS-host -> FS-device
# self-loop round-trips headless. Ignored by the real-hardware HIL harness.
HIL_EMU_ARGS="--usbhs-loop"

# blink is intentionally a UART-less smoke test (runs on reset MOCO, no
# CGC bring-up), so we can't gate it on a UART banner. The
# jlink_memprobe mode reads the firmware's volatile g_blink_tick
# counter twice across a 3 s window via SWD and asserts the LED-toggle
# loop has iterated at least 5 times (1 Hz toggle * 3 s = 3 toggles
# minimum + 2 slack for halt-window jitter). This is a real assertion
# that the main loop is actually running, not just that PC happens to
# land in MRAM.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_blink_tick"
HIL_PROBE_MIN_ADVANCE=5
HIL_PROBE_SECONDS=3

HIL_MODE=uart_scrape
# spi_loopback exercises SPI internal loopback. Success path emits
# "spi: pass\r\n" every period; failure path emits "spi: FAIL\r\n".
# "spi: pass" is only 9 chars but the negative regex catches every
# false-success failure path (FAIL banner, HardFault, hw_init), so
# the short EXPECT is safe here.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="spi: pass"
HIL_EXPECT_NEGATIVE="spi: FAIL|hw_init_failed|spi.*failed|HardFault"
HIL_TIMEOUT_S=10

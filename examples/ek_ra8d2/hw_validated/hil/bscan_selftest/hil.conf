# Headless on-silicon self-test for the JTAG boundary-scan bookkeeping driver
# ra8_bscan (#138). The actual scan chain is driven by an external JTAG fixture
# (the four TAP registers are not CPU-reachable), so firmware validates its own
# contribution: the hardwired IDCODE constant (0x085D_A447, HUM Ch 50.2.2), the
# JTIR opcode validation, the clear-mask guard, and the NULL guards. Every
# positive and negative API path is checked; the app halts on a FAIL banner
# before the PASS line if any sub-check fails. The banner is identical on host,
# ra8_emulator, and silicon. No panel / SD / touch / JTAG fixture needed.
HIL_MODE=uart_scrape
HIL_EXPECT="bscan: idcode=085DA447 checks=17 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

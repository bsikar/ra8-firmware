# gpt_dma_demo exercises ra_gpt_write_dma -- the sample-streaming
# DMA TX path that copies a 4-entry period table into GPT0.GTPR
# via a DMAC channel. The completion callback bumps a counter, and
# the bench probe asserts that counter advances.
#
# Catches: DMA init failure, DMAC-channel-allocation refusal,
# write_dma reject, completion callback never firing (DMA wedged).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_gpt_dma_match"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=4
HIL_PROBE_FAILURE_SYMBOL="g_gpt_dma_mismatch"
HIL_PROBE_MAX_FAILURE=0

# HIL gate for usb_selftest_microsd (Pmod2 microSD exposed as a read-only USB
# drive over the self-loop cable). Requires a FAT microSD card in the Pmod2 slot.
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST MICROSD PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|no card|mismatch at|FAILED"
HIL_TIMEOUT_S=90
# ra8_emulator (EIL) only: model the on-chip USBHS host controller (0x40351000) and
# bridge it to the modelled USBFS device, so the same chip's HS-host -> FS-device
# self-loop round-trips headless. Ignored by the real-hardware HIL harness.
HIL_EMU_ARGS="--usbhs-loop"

# Headless gate for the JPEG cover decode pipeline (#143): decode a baked
# 120x90 JPEG cover through ra8_img_decode_blit() (the stb_image JPEG path,
# allocating only from a fixed SRAM bump arena -- no malloc), nearest-
# neighbour scale it to a 160x120 RGB565 framebuffer, FNV-1a-hash the
# framebuffer, and print the hash over SCI8. This exercises the JPEG
# decoder (the PNG path is covered by ereader_image). The expected
# hash is the ra8_emulator-captured baseline (stable across 3 runs); any
# drift in the JPEG decoder, the scale math, the RGB565 pack, or the
# toolchain output trips the gate. No panel/SD/touch needed. The same hash
# is produced on host, ra8_emulator, and silicon (deterministic integer
# render).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-jpeg-hil: img 160x120 crc=F71D21E8"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

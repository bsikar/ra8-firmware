# Promoted from hw_pending/ on 2026-05-22 after the EP0 enumeration
# race was fixed (commit caf50aa2, GitHub issue #3). usb_hid_device
# now enumerates reliably and the host binds it as a USB HID mouse.
#
# usb_hid mode: hil_hid_test.sh flashes the app, then confirms on the
# bench Pi (the USB host) that the kernel's hid-generic driver binds
# the device (hidraw + input node) -- which only happens once the HID
# Report Descriptor handshake over EP0 completes. A USB-class app
# cannot use jlink_memprobe: halting the core to read a counter stalls
# the SIE and breaks enumeration.
HIL_MODE=usb_hid
HIL_VIDPID="1209:0001"

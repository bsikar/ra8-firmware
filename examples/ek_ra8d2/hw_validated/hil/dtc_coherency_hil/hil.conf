# dtc_coherency_hil boots the Cortex-M85 with the L1 I-cache + D-cache and the
# 5-region MPU enabled (RA_BOOT_ENABLE_CACHE_MPU) and proves the DTC descriptor
# cache-coherency wiring keeps a software-triggered DTC mem-to-mem block copy
# correct with the D-cache ON:
#   - the CPU's writes to the DTC vector table + Transfer Information block are
#     dirty in cache; ra_dtc_enable() cleans the vector table back to RAM and the
#     app cleans the TI + source and invalidates the destination;
#   - a software-triggered 256-word block copy then verifies byte-for-byte.
# On pass it prints the deterministic banner below over the J-Link OB VCOM console
# (SCI8, PD02/PD03 @ 115200 8N1); a wrong/absent copy (stale descriptor) prints a
# distinct "... FAIL" line instead.
HIL_MODE=uart_scrape
HIL_EXPECT="dtc_coherency_hil: dtc coherent PASS"
HIL_EXPECT_NEGATIVE="dtc_coherency_hil: dtc coherent FAIL|FAIL|HardFault|TIMEOUT|panic"
HIL_TIMEOUT_S=15

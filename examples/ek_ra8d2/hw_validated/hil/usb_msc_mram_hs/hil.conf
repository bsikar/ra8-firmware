# USB-HS (480 Mbps) Mass Storage view of the onboard MRAM -- the J7
# high-speed port twin of usb_msc_mram. Exposes the same read-only
# synthesized FAT16 volume whose data clusters map onto the 1 MiB MRAM
# window at 0x02000000, surfaced as a single root file MRAM.BIN. On the
# bench the host attaches the device as a SCSI block device after the
# BOT INQUIRY + READ_CAPACITY handshake; the hil_msc_test.sh probe
# greps the host kernel log for "Attached SCSI" which only prints once
# that handshake lands. The LUN reports write-protected via MODE SENSE,
# so hosts mount it read-only -- the probe must not mkfs this device.
# Requires the USB cable on the J7 USB-HS port (not the FS port).
#
# Manual deep-verify (any host): mount the volume, then compare
# MRAM.BIN against a debugger dump of the same window:
#   JLinkExe: savebin /tmp/mram_ref.bin 0x02000000 0x100000
#   cmp /Volumes/RA8D2\ MRAM/MRAM.BIN /tmp/mram_ref.bin
HIL_MODE=usb_msc
HIL_VIDPID="1209:000d"

HIL_MODE=uart_scrape
# Unique success banner emitted once over VCOM (and additively over ITM). The
# only other terminal line is the FAIL banner below, which the negative regex
# catches; "dma coherent PASS" is not a substring of any failure string.
HIL_EXPECT="dma_coherency_hil: dma coherent PASS"
HIL_EXPECT_NEGATIVE="dma_coherency_hil: dma coherent FAIL|FAIL|HardFault|TIMEOUT|panic"
HIL_TIMEOUT_S=15

HIL_MODE=uart_scrape
# The firmware emits "rtc: boot" before the RTC poll loop so HIL can
# confirm the boot path works even when the sub-clock crystal isn't
# running (see main.c:172-174 comment in this app). The "rtc: alarm
# fired" line is only emitted if SOSC is actually ticking; on this
# EVM the crystal often is not, which the firmware author
# intentionally accommodates. So the HIL gate is the boot banner.
# 9 chars; no >= 12 char success literal exists.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="rtc: boot"
HIL_EXPECT_NEGATIVE="hw_init_failed|rtc.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

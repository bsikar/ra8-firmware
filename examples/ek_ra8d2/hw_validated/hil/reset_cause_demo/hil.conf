# reset_cause_demo validates the ra8_reset HAL end-to-end on the bench.
#
# Cold boot triggers ra8_reset_software_reset(); the post-reset boot
# observes cause == k_ra8_reset_cause_software and enters a 20 Hz loop
# incrementing g_reset_cause_loop. jlink_memprobe samples that counter
# twice over 5 s and asserts it advanced by at least 3 -- it can only
# advance after the software-cause boot, so a passing probe proves:
#
#   1. ra8_reset_software_reset() actually triggers AIRCR.SYSRESETREQ.
#   2. ra8_reset_init / get_cause decode RSTSR1.SWRF correctly after reboot.
#   3. The Reset_Handler / SystemInit / main path is alive post-SW-reset.
#
# A failing probe (advance == 0) means either the SW reset never fired
# (counter stuck because the firmware is still on the cold-boot branch)
# or the post-reset boot did not reach the loop -- g_reset_cause_initial
# is also probe-readable for triage.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_reset_cause_loop"
HIL_PROBE_MIN_ADVANCE=3
HIL_PROBE_SECONDS=5

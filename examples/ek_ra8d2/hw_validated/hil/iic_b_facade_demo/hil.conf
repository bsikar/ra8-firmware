HIL_MODE=uart_scrape
# IIC_B (I3C block in I2C-compat mode) facade controller + peripheral demo.
# The deterministic, device-independent assertion is the bring-up substring
# "iic_b facade: up" -- reaching the banner loop proves ra8_i3c_init +
# ra8_io_i2c_bus_bind_i3c_compat succeeded on silicon (a bring-up failure
# BKPT-halts on "iic_b facade: FAIL ..." before this line). The banner's
# controller outcome (ctrl=OK id0=0x39 against the on-board GT911 at 0x5D)
# and the peripheral round-trip count (periph=N) are informational: in
# ra8_emulator both the IIC_B controller bus and the external-controller
# stimulus for the target role are modelled, so periph is non-zero in EIL;
# on a bare bench the target role needs an external I2C controller the stock
# rig lacks, so periph=0 there -- neither is gated.
HIL_EXPECT="iic_b facade: up"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|SecureFault|hw_init"
HIL_TIMEOUT_S=15

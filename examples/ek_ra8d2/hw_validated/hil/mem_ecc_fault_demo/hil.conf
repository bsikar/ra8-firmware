# SRAM ECC fault-injection + detection gate (issue #130). The demo enables full
# SECDED ECC on spare SRAM bank 2, then runs the HUM Ch 58.3.4 ECC decoder
# self-test twice -- a 1-bit (correctable) and a 2-bit (uncorrectable) injection
# via ra8_sram_self_test -- and asserts each is latched in SRAMESR (out_caught),
# clearing the status between them. tools/ra8_emulator (board_periph_sram.c) models
# the decoder self-test: it latches SRAMESR on the bypass->verify CR sequence so
# the detection/reporting/clear plumbing is proven headlessly.
#
# PENDING SILICON: board_sim cannot observe the syndrome data write that tells a
# 1-bit fault from a 2-bit one (on-chip SRAM is host-backed RAM, not an MMIO
# hook), so it latches both ESR slots; the precise per-slot fidelity, the 1-bit
# *correction*, and the 2-bit *NMI* are silicon-only. On the bench the 2-bit
# injection raises a non-maskable ECC interrupt, so the bring-up must install an
# NMI handler (or mask faults around the 2-bit self-test). This app stays in
# hw_pending until confirmed on a real EK-RA8D2.
HIL_MODE=uart_scrape
HIL_EXPECT="ecc: sram2 1bit-inj=caught 2bit-inj=caught ok=Y"
HIL_EXPECT_NEGATIVE="fault-inject ok=N|ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

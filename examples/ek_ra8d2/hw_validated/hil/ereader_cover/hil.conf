# EPUB cover-art extraction + decode + render gate (#143). Opens a baked,
# cover-bearing EPUB3 in memory (ra_epub_open), resolves the cover-image
# manifest item and copies its raw PNG bytes (ra_epub_get_cover_image), then
# decode+scale-to-fit+blits them into a 160x120 RGB565 framebuffer via the
# zero-heap ra_img_decode_blit pipeline, and FNV-1a hashes the framebuffer.
#
# The 96x144 portrait cover fits the 160x120 box height-limited -> 80x120. The
# whole chain is deterministic (fixed blob -> deterministic parser + decoder +
# scaler), so the banner CRC is identical on host, board_sim, and silicon. Any
# drift in ra_epub cover resolution, the stb_image PNG decoder, the scale math,
# or the toolchain trips the gate.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-cover-hil: cover 80x120 crc=6E4E45C5 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

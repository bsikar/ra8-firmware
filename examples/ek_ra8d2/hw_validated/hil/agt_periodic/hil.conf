HIL_MODE=uart_scrape
# agt_periodic emits "agt: tick\r\n" every period. No literal of >= 12
# chars exists in .rodata; printf is only 9 printable chars. The
# negative regex catches any HAL init failure on the boot path.
HIL_EXPECT_SHORT_OK=1
HIL_EXPECT="agt: tick"
HIL_EXPECT_NEGATIVE="hw_init_failed|agt.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

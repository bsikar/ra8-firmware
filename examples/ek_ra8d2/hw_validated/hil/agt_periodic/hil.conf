HIL_MODE=uart_scrape
# agt_periodic emits "agt: tick OK\r\n" (12 printable chars) on every
# AGT underflow -- a success-only line, since a broken timer path breaks
# out of the loop and parks silently. The negative regex catches any HAL
# init failure on the boot path.
HIL_EXPECT="agt: tick OK"
HIL_EXPECT_NEGATIVE="hw_init_failed|agt.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

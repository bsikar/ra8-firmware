# icu_extint_demo routes SW1 (P009) through the ICU as an external IRQ
# and polls IRQCR13 with falling-edge + digital-filter enabled. The
# main loop only emits press banners when SW1 is pressed (manual on
# the bench), so we scrape the post-arm boot banner instead.
#
# Boot sequence: CGC -> SCI8 @ 115200 -> ICU -> arm IRQ13 -> emit
# "icu_extint_demo: boot" once -> enter poll loop.
HIL_MODE=uart_scrape
HIL_EXPECT="icu_extint_demo: boot"
HIL_EXPECT_NEGATIVE="HardFault|panic|fault|hw_init_failed|cgc_init failed"
HIL_TIMEOUT_S=10

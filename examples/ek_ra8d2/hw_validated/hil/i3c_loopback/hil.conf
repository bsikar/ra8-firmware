HIL_MODE=uart_scrape
# I3C (ra8_i3c) controller bring-up self-test in I2C-compat mode on ch0.
# Reaching the scan loop proves ra8_i3c_init powered + configured the I3C
# controller on real silicon (init failure panic-halts first), so the
# app emits "i3c: ctrl init ok" every iteration. The scan itself cannot
# complete on a bare EVM -- the ch0/J27 bus floats (no device, no
# pull-ups) -- so ack=0 / "bus idle" is EXPECTED and is NOT a failure.
# Attach an I2C device to J27 to upgrade the banner to ack=1.
HIL_EXPECT="i3c: ctrl init ok"
HIL_EXPECT_NEGATIVE="hw_init_failed|HardFault"
HIL_TIMEOUT_S=10

# Headless on-silicon gate for the compiled-book render path: load a small
# two-chapter book baked (inflated) in the ra8_book format, validate it, bridge
# each chapter's pre-parsed DOM to XHTML, lay it out through ra8_reflow into a
# 128x160 RGB565 framebuffer, render every page and FNV-hash the output. The
# banner reports per-chapter page count + render hash -- the short first chapter
# paginates to 7 pages, the longer second to 28 (small to large). Ahem's fixed
# metrics make it deterministic; the same banner appears on host, board_sim, and
# silicon (and is stable across resets). No panel/SD/touch needed.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-rabook-hil: chapters=2 ch0 p=7 crc=60BD27C5 ch1 p=28 crc=26512625 ok"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

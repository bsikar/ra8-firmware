# App framework Phase-1 (#146): the ra8_app registry + launcher + navigation
# back-stack, exercised end to end on the real Cortex-M85 image with a
# deterministic self-check (no display, no widgets). On success the app mirrors
# its ITM "demo PASS" verdict to the SCI8 / J-Link OB VCOM console so the Pi rig
# (which has no SWO / ITM capture) can gate it; any self-check failure logs over
# ITM and parks in WFI WITHOUT emitting the VCOM banner. Single-core, bare-metal.
# Stock EK-RA8D2, no add-on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="app_launch_demo: demo PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

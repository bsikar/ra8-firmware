# wdt_supervisor_demo exercises libs/ra_wdt_supervisor end-to-end on
# the bench. Two synthetic ThreadX worker threads (100 ms + 250 ms
# cadences) check in to the supervisor on every iteration; the
# supervisor thread (auto-spawned by ra_wdt_supervisor_start) ticks
# every 50 ms and refreshes the underlying WWDT only when both
# workers have checked in inside their deadlines.
#
# The probe asserts g_wdt_supervisor_demo_tick advances -- catches
# "ThreadX scheduler wedged", "supervisor failed to spawn",
# "ra_wdt_supervisor_checkin returned error" and "worker thread
# crashed before first iteration".
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_wdt_supervisor_demo_tick"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=4

# SPI-mode microSD round-trip (SCI0 Simple-SPI -> ra_sdmmc_spi -> ra_fs): init,
# mount, write+read+compare, then print "sd: roundtrip ok". Needs a FAT-formatted
# microSD card in the Pmod2 (J25) slot.
HIL_MODE=uart_scrape
HIL_EXPECT="sd: roundtrip ok"
HIL_EXPECT_NEGATIVE="sd: FAIL|HardFault"
HIL_TIMEOUT_S=20

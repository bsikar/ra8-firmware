HIL_MODE=uart_scrape
# secure_boot_hil proves the RoT enforces the boot: ra8_dfu_launch rejects a
# one-bit-tampered image (default-deny -> the launch returns -> "tampered
# REJECTED") and then verifies + anti-rollback-checks the genuine signed image
# and branches to it ("ENFORCING OK" prints right before the copy+branch; the
# launched payload advances a heartbeat at 0x22010004 for a mem-probe bonus).
HIL_EXPECT="secure-boot: ENFORCING OK"
HIL_EXPECT_NEGATIVE="tampered ACCEPTED|LAUNCH FAILED|psa_init FAIL|HardFault"
HIL_TIMEOUT_S=20

# ra8_io block-device backend over a micro-SD card on the SCI0 Simple-SPI bus
# (#155/#156) -- the same ra8_sdmmc_spi transport the already-validated SD gates
# (epub_open, fs_format_mount) drive on the bench. The demo brings up the card,
# mounts an ra8_fs volume (formatting if blank, so any card works), writes/reads a
# 512-byte file at sd:/LOGS/A.TXT, and reports over the SCI8 / J-Link OB VCOM
# console. The PASS banner is emitted only on a byte-exact round-trip; on init or
# I/O failure it prints "ra8_io_sd_demo: FAIL ...", caught by the negative regex.
#
# REQUIRES a Digilent Pmod MicroSD (part 410-380) in Pmod2 (J25) with any microSD
# card inserted -- the EK-RA8D2 has no native card socket. THIS APP ERASES THE
# CARD (it self-formats). The SD bring-up + format takes a few seconds, hence the
# wider timeout.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_sd_demo: sd:/LOGS/A.TXT 512 bytes PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

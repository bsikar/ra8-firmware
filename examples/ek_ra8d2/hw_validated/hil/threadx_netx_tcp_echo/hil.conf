# ThreadX + NetX Duo TCP echo responder on 192.168.1.42:7. The HIL
# helper opens a TCP socket from the Pi (which gets temporarily
# addressed as 192.168.1.1/24 on its USB-Ethernet adapter), sends 512
# random bytes, reads them back, and asserts byte-exact equality.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.42"
HIL_PORT=7
HIL_PROTO=tcp
HIL_PAYLOAD_BYTES=512
HIL_BOOT_TIMEOUT_S=30
HIL_PROBE_TIMEOUT_S=15

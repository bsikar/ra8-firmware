# threadx_netx_tcp_echo listens on 192.168.1.42:7 (RFC 862 TCP echo)
# under ThreadX + NetX Duo. Real Pi-as-peer assertion via
# hil_eth_tcp.sh.
#
# Payload sized at 1400 B to exercise the post-MAC large-frame TX
# path (issue #21). Pre-EATDQDC-fix the ETHA per-class TX descriptor
# queue depth register sits at its reset value of zero, so the GWCA
# kick succeeds and small frames (e.g. <= 512 B) trickle through the
# ETHA's internal MAC FIFO, but anything that exceeds the FIFO stalls
# silently. The earlier 256 B gate happily passed on a chip with
# EATDQDC[0] = 0 and therefore failed to catch the regression this
# app exists to lock in. 1400 B sits one MTU below 1500 to ride the
# common path while still forcing the queue to drain a descriptor
# bigger than the FIFO.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.42"
HIL_PORT=7
HIL_PROTO=tcp
HIL_PAYLOAD_BYTES=1400
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=15

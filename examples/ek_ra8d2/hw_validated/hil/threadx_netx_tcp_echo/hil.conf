# threadx_netx_tcp_echo listens on 192.168.1.42:7 (RFC 862 TCP echo)
# under ThreadX + NetX Duo. Real Pi-as-peer assertion via
# hil_eth_tcp.sh.
#
# Re-validated 2026-07-27 over the Pi's built-in eth0, with the Ethernet peer
# finally attached (#292). Bench sweep, all byte-exact:
#   8 B, 64 B, 256 B, 512 B, 1024 B TCP payloads round-trip byte-exact.
# 1024 B works because the MTU is capped at 128 and IP fragments above it, so
# no single frame approaches the >=~600 B ESWM egress wall of #21.
#
# 256 B is kept as the gate payload: it is the smallest size that still
# exercises a multi-fragment reassembly, and it was the historical gate value,
# so a regression compares against the same number it always did.
#
# THIS APP IS THE ONLY WIRE-SIDE GATE IN THE TREE -- the only hil.conf with
# HIL_MODE=hil_eth_tcp. While it sat in hil_needs_revalidation/ under the wrong
# blocker ("no peer attached"), a TX data-corruption regression rode on dev for
# a month unnoticed (#499): the board's own ARP reply carried a corrupted
# sender IP, so it was unreachable, and nothing in CI or the emulator could see
# it. Keep it here. If it starts failing, the wire is telling you something.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.42"
HIL_PORT=7
HIL_PROTO=tcp
HIL_PAYLOAD_BYTES=256
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=15
# EIL: ra8_emulator's in-process peer (board_net at 192.168.1.1) runs the same
# exchange -- ARP, ping, TCP connect to port 7, send its fixed 23-byte
# payload, byte-verify the echo. This banner is the firmware's served-echo
# log for that deterministic exchange; eil_all.sh asserts it on the emulated
# UART alongside the peer's own "echo MATCH" verdict. The hardware probe
# (hil_eth_tcp.sh) verifies the round-trip on the wire and ignores this.
#
# The 23 is the peer's payload length, pinned by a static_assert on
# k_net_tcp_payload_len in tools/ra8_emulator/src/io/board_net.c -- that assert
# names this file, so the two cannot drift apart silently again. They already
# did once: the payload string used to end in "board_sim" and the rename to
# "ra8_emulator" moved it from 21 to 24 bytes with nothing to catch it.
HIL_EXPECT="[netx] echoed 23 bytes from 192.168.1.1"

# DRW 2D-engine blit + alpha-blend headless CRC gate (issue #120).
#
# The demo programs three layers into a 32x32 ARGB8888 SRAM framebuffer, hashes
# it FNV-1a-32, and prints the banner once a second:
#   1. opaque 0xFF202060 background over the whole framebuffer
#   2. opaque 0xFF40C040 sprite, 16x16 at (8,8)
#   3. source-over 0x80E04040 foreground, 16x16 at (4,4), via ra8_drw_set_blend
#
# RE-PROMOTED (#170) with a REAL golden. F0AE5DC5 is a genuine three-layer
# composite captured from an EK-RA8D2 over J-Link and checked pixel by pixel:
#   0xFF202060 x656  background
#   0xFF40C040 x112  sprite where the foreground does not cover it
#   0xBF803050 x112  foreground over background
#   0xBF908040 x144  foreground over sprite
# The two composited values are exactly source-over at alpha 0x80:
# (0xE0*0x80 + 0x20*0x7F + 127)/255 = 0x80, and the alpha channel blends to
# (0x80*0x80 + 0xFF*0x7F + 127)/255 = 0xBF. board_sim renders the identical
# framebuffer, so this app is SIM == HIL.
#
# The previous golden 76EFDDC5 was FNV-1a-32 over 4096 ZERO bytes -- the demo
# hashing its own untouched BSS, because the D/AVE 2D engine had never
# rasterized a pixel on this silicon. It was recorded as a "silicon-confirmed
# 6/6" PASS and held that status for months. Two defects had to be fixed
# before a real render existed: the graphics power domain was gated off at
# reset (#247, PDCTRGD -- HUM Ch 11.2.14 p 452), and the driver then placed
# rectangles with the spatial limiters instead of the ORIGIN-anchored bounding
# box while leaving CONTROL2.WRITEALPHA at its reset value (#170). An
# intermediate capture, D44B3415, was the hash of the half-sized zero-alpha
# render and was deliberately pinned nowhere.
#
# If this CRC ever changes, re-derive it from a bench capture -- never from the
# simulator, and never by writing down whatever the demo happens to print.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: blit+blend crc=F0AE5DC5 PASS"
HIL_EXPECT_NEGATIVE="blit\+blend FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

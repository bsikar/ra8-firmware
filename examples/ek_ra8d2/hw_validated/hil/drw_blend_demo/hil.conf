# DRW 2D-engine blit + alpha-blend headless CRC gate (issue #120). The demo
# programs three layers (opaque background, opaque sprite, half-transparent
# foreground via ra8_drw_set_blend) into a 32x32 ARGB8888 SRAM framebuffer, then
# hashes it (FNV-1a-32) and prints the banner below once a second. No display
# panel is touched -- this is a pure compute + memory test, gateable headless.
#
# SILICON TRUTH: THE DRW IS INERT (#247). The CRC pinned below, 76EFDDC5, is
# exactly FNV-1a-32 over 4096 zero bytes: the D/AVE 2D engine never rasterizes on
# real hardware (#247) -- PERFCOUNT never advances, HWREVISION reads 0, and the
# J-Link-dumped framebuffer on a live board is all zeros -- so the demo hashes an
# untouched zero framebuffer and prints this banner both on the bench AND in SIL.
# board_sim models the engine INERT to match (tools/board_sim/board_periph_drw.c:
# writes accepted, STATUS idle, HWREVISION 0, ORIGIN triggers no pixel), so this
# gate now PASSES in SIL by reproducing the silicon result -- SIM == HIL. The
# board_sim smoke gate asserts the same 76EFDDC5 banner. When #247 finally brings
# the engine to life, re-baseline this CRC from a REAL bench-rendered framebuffer
# (and update the inert model + smoke expectation together); do NOT pin a
# simulator-derived render value here.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: blit+blend crc=76EFDDC5 PASS"
HIL_EXPECT_NEGATIVE="blit\+blend FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

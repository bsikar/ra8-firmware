# DRW 2D-engine blit + alpha-blend headless CRC gate (issue #120). The demo
# composites three layers (opaque background, opaque sprite, half-transparent
# foreground via ra8_drw_set_blend) into a 32x32 ARGB8888 SRAM framebuffer, then
# hashes it (FNV-1a-32) and prints the banner below once a second. No display
# panel is touched -- this is a pure compute + memory test, gateable headless.
#
# SILICON GOLDEN PENDING (#247). The CRC pinned below, 76EFDDC5, is exactly
# FNV-1a-32 over 4096 zero bytes: the DRW never rasterized on real hardware
# (the driver kicked primitives with the CONTROL write; per HUM Ch 62.2.31 the
# render trigger is the ORIGIN write), so the "confirmed 6/6" bench runs were
# hashing an untouched zero framebuffer. The J-Link-dumped framebuffer on a
# live board is all zeros. The driver-side trigger and write-only-register
# fixes are in, but the engine still does not rasterize on silicon -- the
# remaining enable condition is under investigation in #247. Until a REAL
# rendered framebuffer is captured on the bench, this gate intentionally FAILS
# in SIL (board_sim now composites a genuine a=0x80 source-over, F0AE5DC5,
# asserted by the board_sim smoke gate as the emulator self-test) and the
# silicon CRC below must NOT be replaced by a simulator-derived value.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: blit+blend crc=76EFDDC5 PASS"
HIL_EXPECT_NEGATIVE="blit\+blend FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# DRW 2D-engine blit + alpha-blend headless CRC gate (issue #120). The demo
# composites three layers (opaque background, opaque sprite, half-transparent
# foreground via ra_drw_set_blend) into a 32x32 ARGB8888 SRAM framebuffer, then
# hashes it (FNV-1a-32) and prints the banner below once a second. No display
# panel is touched -- this is a pure compute + memory test, gateable headless.
#
# tools/board_sim models BOTH the solid fill AND the global-alpha source-over
# blend (board_periph_drw.c), but its emulated framebuffer hash is NOT bit-exact
# to the real D/AVE 2D engine: board_sim hashes to 47F303C5, while the silicon
# D/AVE 2D engine deterministically produces 76EFDDC5 (confirmed 6/6 on a real
# EK-RA8D2 via the Pi rig, app self-PASS). The simulator proves the driver
# register sequence; the engine's exact pixels differ. This HIL gate pins the
# REAL silicon CRC; the board_sim gate keeps 47F303C5 (board_sim self-test). The
# board_sim D/AVE pixel mismatch is tracked as a board_sim-model accuracy gap.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: blit+blend crc=76EFDDC5 PASS"
HIL_EXPECT_NEGATIVE="blit\+blend FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

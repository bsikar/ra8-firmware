# PDG bring-up gate. This gate covers only the headless half: that the
# PDG DLL + channel + delay register accept and read back the
# configuration (cfg=ok). tools/board_sim shadows the PDG registers so
# this passes on the emulator, but the PDG's actual effect -- shifting a
# GPT output edge in time -- has no software-readable status and needs a
# running GPT32_0 PWM source + a scope / logic analyzer to measure. That
# delay measurement is the real promotion gate (see README); this app
# stays in hw_pending until the edge shift is confirmed on silicon.
HIL_MODE=uart_scrape
HIL_EXPECT="pdg: dll=on ch0=on delay=0x40 cfg=ok"
HIL_EXPECT_NEGATIVE="cfg=BAD|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# ra8_io block-device backend over the on-board 64 MB Octo-SPI (xSPI) flash
# (#155/#156). The demo mounts the `xs:` backend, writes then reads back a
# 256-byte file at xs:/CFG/SET.BIN against the EK-RA8D2's external OSPI flash, and
# reports the verdict over the SCI8 / J-Link OB VCOM console. The OSPI flash is
# fitted on the stock EK-RA8D2, so this is bench-runnable with no add-on hardware.
# The banner below is emitted only on a byte-exact round-trip; a failure prints
# "ra8_io_xspi_demo: FAIL", which the negative regex catches. NOTE: this programs
# the on-board OSPI flash (non-volatile).
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_xspi_demo: xs:/CFG/SET.BIN 256 bytes PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

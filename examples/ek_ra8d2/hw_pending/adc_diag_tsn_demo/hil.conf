HIL_MODE=uart_scrape
# adc_diag_tsn_demo runs the ADC_B built-in self-diagnosis (modes 1/2/3)
# and the close-the-loop on-die temperature read once per cycle. Each cycle
# logs every mode's raw code + PASS/FAIL, the die temperature in milli-degC,
# and the internal Vref raw code. The fixed verdict "diag: selftest PASS"
# prints only when every mode reported healthy and both internal reads
# returned k_ra8_ok -- that verdict is the success-only line the gate keys on.
# The negative regex trips on a self-test failure or any HAL init fault.
HIL_EXPECT="diag: selftest PASS"
HIL_EXPECT_NEGATIVE="selftest FAIL|hw_init_failed|adc.*failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

# ethernet_udp_echo listens on 192.168.1.43:7 (RFC 862 Echo Protocol
# over UDP). hil_eth_tcp.sh --proto udp sends a random datagram from
# the Pi and asserts byte-exact echo. Retries up to 3x to absorb the
# typical first-packet ARP-resolution drop.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.43"
HIL_PORT=7
HIL_PROTO=udp
HIL_PAYLOAD_BYTES=1024
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=10

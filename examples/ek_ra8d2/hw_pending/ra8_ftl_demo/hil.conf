# FTL wear-levelling + power-cycle survival over the on-chip extra MRAM (#258).
# The demo inits ra8_ftl over the RA8D2's non-volatile extra MRAM (the same
# data-MRAM the ra8_emulator MRAM model exercises), writes ONE logical block
# repeatedly so the backing physical block migrates (wear-levelling, reported
# through ra8_ftl_phys_of), checkpoints the mapping into a reserved MRAM block,
# then models a reset -- discarding the volatile FTL tables while the MRAM
# retains its bytes -- and reloads the checkpoint so the data + exact mapping
# reappear. The MRAM is on-die, so this is bench-runnable on a stock EK-RA8D2
# with no external hardware. The banner below is emitted only once every act
# passes; any failing act prints "ra8_ftl_demo: FAIL", caught by the negative
# regex. NOTE: this programs on-chip MRAM (non-volatile) -- the region used is
# the spare extra-MRAM block, not the code image.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_ftl_demo: wear-level + power-cycle-survive on extra MRAM PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# cache_hal_enable_demo boots the Cortex-M85 with the L1 I-cache + D-cache
# brought up through the ra8_cache HAL primitives (RA8_BOOT_ENABLE_CACHE_MPU +
# RA8_BOOT_CACHE_VIA_HAL) rather than the shared boot's hand-rolled register
# pokes, and self-tests that the core still computes correctly in that posture:
#   1. cacheable RW in M85-private SRAM (MPU region 1) -- write a 4 KiB pattern,
#      clean+invalidate via ra8_cache_dcache_clean_invalidate_by_addr(), read it
#      back through the refill path.
# On pass it prints the deterministic banner below over the J-Link OB VCOM
# console (SCI8, PD02/PD03 @ 115200 8N1); any failure prints a distinct
# "... FAIL" line instead.
HIL_MODE=uart_scrape
HIL_EXPECT="cache_hal_enable_demo: L1-cache-via-HAL PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|panic"
HIL_TIMEOUT_S=15

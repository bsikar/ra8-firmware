# E-reader device chrome on the live GLCDC panel (#80). At boot the app brings up
# the on-board external SDRAM + the 1024x600 RGB565 GLCDC panel, lays out the
# application shell with libs/ra_box, paints it through libs/ra_gfx, renders the
# opening Library/Reading chrome, then enters a fast input-poll loop (touch +
# SW1/SW2 page switches + ~1 Hz battery nag) with a ~1 Hz blue heartbeat LED. All
# hardware (SDRAM + TFT) is part of the stock EK-RA8D2; the SD font is best-effort
# (NAKs gracefully when no card is fitted), so it is bench-runnable with no
# external hardware.
#
# This is a MANUAL / VISUAL demo: the page-turn proof requires a human pressing
# SW1/SW2, and g_er_turns / g_er_cur_page only advance on a button press, so there
# is no autonomous deterministic counter or VCOM banner to scrape. The automatable
# signal is liveness: the main loop is a busy poll (ra_delay_ms, never WFI), so PC
# + CycleCnt keep advancing. The `alive` gate confirms the app booted, brought up
# SDRAM + GLCDC, and is running its render/poll loop without faulting. Full
# validation (chrome layout + SW1/SW2 page turns) is visual on the panel.
HIL_MODE=alive
HIL_BOOT_S=4

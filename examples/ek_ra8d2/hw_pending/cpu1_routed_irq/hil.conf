# CPU0 routes GPT0's overflow to CPU1 through INTSELR; CPU1's IRQ handler
# reports in shared SRAM and CPU0 prints the verdict on the SCI8 / J-Link OB
# VCOM console. Stock EK-RA8D2, no add-on hardware. Not yet run on the bench
# (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="cpu1_routed_irq: CPU1 handled GPT0 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# Headless board_sim gate for the viewable manga reader (Demo B): bring up the
# 1024x600 GLCDC panel, transcode the baked 1536x2048 grayscale PNG page through
# ra8_tileatlas_produce into a 48-tile JOF deflate atlas in an SDRAM memstore,
# then render the initial 1:1 top-left viewport by paging the covering tiles
# through a deliberately small 4-cell ra8_tile_cache (decode-on-demand with
# forced evictions), gray8 expanded to RGB565, plus the status bar + minimap.
# An FNV-1a-32 over the whole panel framebuffer is printed over the SCI console.
#
# Every stage is a deterministic integer pipeline (PNG inflate, tile DEFLATE,
# RGB565 pack, software gfx), so the banner is identical on host, board_sim, and
# silicon; tests/test_app_ereader_manga.c derives the same numbers from the same
# baked fixture through the same mg_reader render and is the golden this line was
# copied from.
#
# Interactive nav (not asserted here) is discrete tap-zones: the four screen
# edges pan the viewport, a centre tap toggles 1:1 <-> fit-page. Drive it with
# board_sim --touch-seq / --click.
#
# Status: sim-viewable (hw_pending). Not yet silicon-validated (no rig in this
# workflow).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-manga: page 1536x2048 tiles=48 atlas=20384 view=0,0 zoom=1:1 crc=5CBD900B ok"

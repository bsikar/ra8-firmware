# Headless board_sim gate for the #231 full-resolution image path: open the
# baked all-image EPUB through the production streamed reader, import-time
# transcode its 512x512 PNG page through ra8_tileatlas_produce (bounded
# stripes -> 16 deflate-coded 128x128 tiles in an SDRAM memstore; the decoded
# page is never resident), then render a 160x120 centre crop by paging the 4
# covering tiles through a deliberately tiny 2-cell tile cache (forced
# evictions), gray8 expanded to RGB565, FNV-1a-32 over the framebuffer,
# printed over SCI8.
#
# Every stage is a deterministic integer pipeline (PNG inflate, tile DEFLATE,
# RGB565 pack), so the banner is identical on host, board_sim, and silicon;
# tests/test_app_ereader_manga.c derives the same numbers from the same baked
# fixture and is the golden this line was copied from.
#
# Status: sim-only (hw_pending). Not yet silicon-validated (no rig in this
# workflow).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-manga-hil: import 512x512 tiles=16 atlas=67331 crc=4095FBB5 ok"

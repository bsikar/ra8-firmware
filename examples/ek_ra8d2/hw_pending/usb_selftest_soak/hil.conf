# HIL gate for usb_selftest_soak (USB self-loop endurance + throughput).
# HS host repeats the 1 MiB MRAM integrity sweep k_selftest_soak_iters times over
# the J7<->J11 loop, memcmp'ing every burst; a single bad transfer fails the run.
# Prints an aggregate volume/throughput line then the pass banner on SCI8 @115200.
# 16 x ~6 s sweeps + enumeration, so the timeout is generous.
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST SOAK PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|FAILED on iteration|content mismatch"
HIL_TIMEOUT_S=200

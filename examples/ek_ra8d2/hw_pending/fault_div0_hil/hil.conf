# The DIV_0_TRP trap only fires on real silicon: board_sim's Unicorn
# core does not model CCR.DIV_0_TRP (the firmware's CCR write lands in
# the sim's plain-memory SCS window, never in the emulated CPU state),
# so a sim run survives the divide with quotient 0 and prints the
# "survived divide" line after the boot-path proof ("trap armed").
# On the bench the divide must instead raise UsageFault and the shared
# decoder must print its dump on the SCI8 console:
#   [EXC] ERROR: exception=6         (UsageFault, true class)
#   [EXC] ERROR: cfsr =33554432      (0x02000000 = CFSR.DIVBYZERO)
# The positive gate is the DIVBYZERO decode; the negative gate rejects
# a boot failure, an unarmed trap, or ARM-default divide semantics
# (the silent quotient-0 this trap exists to abolish).
HIL_MODE=uart_scrape
HIL_EXPECT="cfsr =33554432"
HIL_EXPECT_NEGATIVE="fault-div0: FAIL|survived divide"

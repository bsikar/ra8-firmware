HIL_MODE=uart_scrape
# Tight banner: "[fxlx] booting xSPI flash" (25 chars) is the first
# unique success-path line. The negative regex catches every failure
# banner the app might print: LevelX format/open, FileX adapter bind,
# FileX media format/open, FileX file create/open/write, xSPI init.
# NOTE: the Octo-SPI flash bring-up that blocked this app is fixed (#44):
# the on-board ISSI IS25LX512M is on xSPI CS1 and ra_xspi now drives it
# (flash_journal verifies erase/program/read round-trips live). This gate
# should now PASS; the negative regex still catches any real LevelX/FileX
# failure. Pending a full HIL re-run to promote out of hw_pending.
HIL_EXPECT="[fxlx] booting xSPI flash"
HIL_EXPECT_NEGATIVE="\[fxlx\] (lx_nor_flash_(format|open)|lx_filex_adapter_bind|fx_media_(format|open)|fx_file_(create|open\(read\)|open\(write\)|write)|ra_xspi_init) failed|\[fxlx\] adapter reports zero sectors|HardFault"
HIL_TIMEOUT_S=30

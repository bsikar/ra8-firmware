# Raw-HAL SDHI block smoke test (#123): a 512-byte block round-trip through the
# native SDHI 4-bit host controller with NO ra8_io and NO ra8_fs -- it links the
# HAL SDHI driver directly. It brings the card up, writes then reads back one
# raw block, compares, and reports over the SCI8 / J-Link OB VCOM console. The
# PASS banner is emitted only on a byte-exact compare; on init or I/O failure it
# prints "ra8_sdhi_card_demo: FAIL ...".
#
# hw_pending: ra8_emulator answers the raw SDHI block transfers with its modelled
# card (smoke.sh attaches a blank card via --sd-new 64:fat16), so the banner is
# deterministic in the simulator. The native SDHI socket wiring is not yet
# bench-validated, which is why this app lives under hw_pending/.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_sdhi_card_demo: native SDHI block round-trip PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

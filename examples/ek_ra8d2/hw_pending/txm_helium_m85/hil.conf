# The Cortex-M85 runs the ThreadX Module Manager and starts txm_helium_m85, a
# module that spins checking its own Q0-Q7 and VPR. The manager's kernel
# thread holds a different pattern and checks it after every switch, then
# prints the verdict on the SCI8 / J-Link OB VCOM console. Zig throughout.
# Stock EK-RA8D2. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_helium_m85: Q0-Q7 and VPR kept across 10 switches PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

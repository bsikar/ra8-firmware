# Viewable board_sim demo of the continuous vertical-scroll (longstrip / manhwa)
# reading mode (#289). At boot the app brings up external SDRAM + the 1024x600
# RGB565 GLCDC panel through ra8_display_pal, builds a tall colourful strip as a
# metadata-only JOF band-tile atlas (ra8_tileatlas, one full-width band column),
# and scrolls it through the ra8_longstrip engine whose band-composite blit sink
# is bound to the LIVE panel framebuffer. Each visible band is painted on demand
# by a procedural decode-on-miss seam and paged through a deliberately small
# 6-cell ra8_tile_cache (16 bands -> forced evictions -> the bounded-memory
# property). Navigation is tap-zone only (GT911 via ra8_touch): bottom third =
# page down, top third = page up, centre = toggle chrome; SW1/SW2 page down/up.
#
# The full validation is VISUAL on the panel (board_sim --view, or a --ppm
# capture at several scroll positions); the automatable signal here is the
# deterministic boot banner, an FNV-1a-32 over the whole 1024x600 panel FB after
# the first render. The FB bytes are written identically regardless of whether a
# panel is attached, so the hash is the same on the unit-test host, in board_sim
# and on silicon (SIM == HIL).
#
# Status: sim-viewable (hw_pending). Not yet silicon-validated (no rig in this
# workflow); bench-runnable on a stock EK-RA8D2 with no external hardware (the SD
# font path is absent -- the strip is procedural -- so only the panel + SCI8 /
# J-Link OB VCOM are needed).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-longstrip: bands=16 view=1024x600 scroll=0 crc=795D27E6"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

# The Cortex-M85 runs the ThreadX Module Manager and starts txm_fault_m33,
# whose start thread stores outside its MPU regions. The MemManage fault must
# kill only the module: the manager reports it and ticks on 10 more times,
# then prints the verdict on the SCI8 / J-Link OB VCOM console. Zig throughout.
# Stock EK-RA8D2. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_fault_m85: module faulted, manager ran 10 more ticks PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

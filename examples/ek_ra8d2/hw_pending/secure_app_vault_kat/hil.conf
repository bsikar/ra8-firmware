HIL_MODE=uart_scrape
# secure_app_vault_kat drives the whole ra8_secure_app public API (key_vault.h
# + ota_commit.h) once from a real composition root, then repeats one verdict
# line. Every step logs "kat: step=N rc=E PASS|FAIL", where rc is the raw
# ra8_err_t the library returned, so a bench operator sees which entry point
# disagreed with its own header. The fixed verdict "kat: secure_app PASS"
# prints only when every step matched the contract for the crypto
# configuration this image was built in (fail-closed by default; the SHA-256
# known-answer test when RA8_INSECURE_STUB_CRYPTO is on). That verdict is the
# success-only line the gate keys on.
HIL_EXPECT="kat: secure_app PASS"
HIL_EXPECT_NEGATIVE="kat: secure_app FAIL|PASS=0|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

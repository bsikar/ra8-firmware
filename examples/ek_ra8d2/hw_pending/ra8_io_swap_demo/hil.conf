# ra8_io fabric capstone (#155/#264): one backend-agnostic engine runs the
# IDENTICAL FAT/VFS round-trip over TWO block-device backends -- an in-SRAM RAM
# disk (ram:) and the on-board Octo-SPI (xSPI) NOR flash (xs:) -- proving they are
# drop-in substitutable behind the ra8_io_blockdev_t vtable. Each round-trip does a
# VFS open/write/close then open/read/close/byte-compare. The engine's progress is
# captured into an in-RAM stdio sink and then replayed out of the SCI8 UART sink,
# proving the targetable-stream retarget (one writer, two destinations). ra8_emulator
# models both the RAM region and the OSPI NOR array, so the run is headless over
# the SCI8 / J-Link OB VCOM console. The banner below is emitted only after BOTH
# backends round-trip; any failing backend prints "ra8_io_swap_demo: backend <n>
# FAIL" (caught by the negative regex). The xSPI leg drives a 4 KiB-sector erase +
# reprogram read-modify-write on every 512-byte write, which is slow in the
# emulator, hence the raised instruction budget below and the wider timeout. This
# app programs the non-volatile on-board OSPI flash.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_swap_demo: two-backend swap (ram + xs) PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40
HIL_EMU_MAX_CHUNKS=6000000

# DTC SRAM-to-SRAM block-copy gate. PENDING SILICON: tools/board_sim
# shadows the DTC control window (DTCCR / DTCVBR / DTCST / DTCSTS) but
# does not execute the descriptor transfer (board_periph_dmac.c: "no
# example in the tree triggers a DTC"), so the destination stays zero
# and the banner reads "dtc: copied 1024B match=N" on the emulator. On a
# real EK-RA8D2 the DTC performs the copy and the success banner below
# appears once a second. Promote out of hw_pending once this gate is
# green on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="dtc: copied 1024B match=Y"
HIL_EXPECT_NEGATIVE="dtc: copied 1024B match=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

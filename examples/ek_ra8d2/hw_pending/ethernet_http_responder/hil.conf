# ethernet_http_responder listens at http://192.168.1.44/ -- a
# single-connection HTTP/1.1 server that returns a 200 OK with the
# "Hello from RA8D2" marker in the body. hil_eth_tcp.sh --proto http
# issues a GET / and asserts both 200 OK and that marker.
HIL_MODE=hil_eth_tcp
HIL_BOARD_IP="192.168.1.44"
HIL_PORT=80
HIL_PROTO=http
HIL_BOOT_TIMEOUT_S=25
HIL_PROBE_TIMEOUT_S=10

#
# DTC arm/disarm gate for the ra8_isr_set_dtc() HAL primitive (#579). Each
# pass arms the slot (DTCE=1) and copies a 1 KB block, then disarms it
# (DTCE=0) and confirms a second trigger leaves the destination untouched;
# the banner below is printed only when BOTH hold. tools/ra8_emulator
# (board_periph_dtc.c) models the DTCE gate, so the headless emulator runs
# the armed copy and skips the disarmed one -- matching silicon. Kept here
# for promotion to hw_validated/hil/ once a bench run confirms it; the DTC
# activation path is byte-identical to the validated dtc_transfer_demo.
HIL_MODE=uart_scrape
HIL_EXPECT="dtc-arm: armed+disarmed OK"
HIL_EXPECT_NEGATIVE="dtc-arm: FAILED|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

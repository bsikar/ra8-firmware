HIL_MODE=uart_scrape
# eth_gptp_timestamp_demo brings up the GPTP hardware-timestamp counter
# (ra8_eth_gptp) and the IEEE 1588 clock (ra8_ptp), then once per cycle captures
# the PTP time twice, runs one servo step + rate correction, queues a
# time-source Sync + Announce, and reads the GPTP status word. The fixed verdict
# "gptp: clock PASS" prints only when every driver call in the cycle returned
# k_ra8_ok -- that is the success-only line the gate keys on. The negative regex
# trips on a clock-path failure or any HAL init fault.
#
# A gPTP peer IS now on the wire (the HIL Pi's built-in port, PHC /dev/ptp0,
# linuxptp provisioned by the hil_bench role), and it does not unblock this app
# -- see the README. Short version: the RA8D2 GPTP block (HUM Ch 35 p 1925) is
# a timer with no PTP message engine, and the ra8_ptp driver this app calls
# addresses an invented register window at 0x403E_0100 that the HUM shows as
# reserved. So no bounded sync offset can be asserted here, and the PASS above
# is NOT evidence that the hardware clock runs. The fix is a driver rewrite
# onto the real Ch-35 registers, not a bench change.
HIL_EXPECT="gptp: clock PASS"
HIL_EXPECT_NEGATIVE="clock FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

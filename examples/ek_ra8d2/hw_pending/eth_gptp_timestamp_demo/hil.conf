HIL_MODE=uart_scrape
# eth_gptp_timestamp_demo brings up the GPTP hardware-timestamp counter
# (ra_eth_gptp) and the IEEE 1588 clock (ra_ptp), then once per cycle captures
# the PTP time twice, runs one servo step + rate correction, queues a
# time-source Sync + Announce, and reads the GPTP status word. The fixed verdict
# "gptp: clock PASS" prints only when every driver call in the cycle returned
# k_ra_ok -- that is the success-only line the gate keys on. The negative regex
# trips on a clock-path failure or any HAL init fault.
#
# A full sync-offset bound (a follower locked to the time source within N ns) needs a gPTP
# peer on the wire (bench wiring #89) and is asserted manually on the bench.
HIL_EXPECT="gptp: clock PASS"
HIL_EXPECT_NEGATIVE="clock FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

HIL_MODE=uart_scrape
# eth_gptp_timestamp_demo brings up the HUM Ch 35 Ethernet Generic PTP Timer --
# ESWCLK on, PTPTIVCt derived from the live clock, a known epoch loaded into
# the 78-bit offset, timer unit 0 enabled -- and then measures it. Per cycle it
# reads the read-only PTPIPV IP-version word (which must be nonzero: a reserved
# aperture reads back zero or whatever was last written) and samples the 78-bit
# GPTP time either side of a 500 ms SysTick-timed window, requiring the counter
# to have advanced by that interval to within 10 percent.
#
# "gptp: clock PASS" therefore asserts that the counter runs one second per
# second against an independent time base. Before #498 it asserted nothing: the
# driver addressed an invented register window at 0x403E_0100 that the HUM
# shows as reserved, and the PASS was a reserved aperture echoing back writes.
#
# It is still NOT a claim that this part speaks IEEE 1588 or 802.1AS. HUM Ch 35
# has no Sync/Announce generator, no domain and no BMCA, so the protocol layer
# is software above the HAL and no bounded sync offset against the bench's gPTP
# peer (the HIL Pi's built-in port, PHC /dev/ptp0, linuxptp provisioned by the
# hil_bench role) can be asserted from this app. Comparing this counter against
# that PHC over a long window is a manual bench measurement.
HIL_EXPECT="gptp: clock PASS"
HIL_EXPECT_NEGATIVE="clock FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=15

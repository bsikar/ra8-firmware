# canfd_filter_demo exercises two CAN-FD acceptance-filter slots at
# 500 kbit/s, running three sub-rounds per main-loop pass every 500 ms
# (k_canfd_filter_period_ms). Each sub-round increments match on
# expected behavior (two filter-pass + one filter-reject = 3/loop),
# so a working board produces ~6 match/s. The probe asserts:
#   - g_canfd_filter_match advances at least 10 times in a 5 s window
#   - g_canfd_filter_mismatch stays at 0.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_canfd_filter_match"
HIL_PROBE_MIN_ADVANCE=10
HIL_PROBE_SECONDS=5
HIL_PROBE_FAILURE_SYMBOL="g_canfd_filter_mismatch"
HIL_PROBE_MAX_FAILURE=0

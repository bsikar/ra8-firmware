HIL_MODE=uart_scrape
# scb_diag_demo drives the ra8_scb System Control Block HAL (issue #583): it
# queries VTOR, powers the trace block up via DEMCR.TRCENA and reads it back,
# and dumps the fault-status snapshot (CFSR/HFSR/DFSR/MMFAR/BFAR/AFSR + the
# Secure SFSR/SFAR pair) once per cycle. On a clean boot with no fault injected
# every fault-status register reads zero, so the fixed verdict "scb: probe PASS"
# prints only when the snapshot read returned k_ra8_ok and CFSR + HFSR are both
# zero -- that verdict is the success-only line the gate keys on. The negative
# regex trips on a latched fault or any bring-up failure.
HIL_EXPECT="scb: probe PASS"
HIL_EXPECT_NEGATIVE="probe FAIL|hw_init_failed|cgc_init failed|mstp.*failed|HardFault"
HIL_TIMEOUT_S=10

HIL_MODE=uart_scrape
# Boot + arm liveness only. The "armed" banner prints unconditionally once the
# RIIC1 target is armed, so the rig confirms the firmware boots and arms even
# though the RIIC RX/TX servicing needs an EXTERNAL I2C controller wired to
# RIIC1 (SDA1/SCL1) that the standard rig does not provide -- see README
# "Bench setup". This app is hw_pending: the on-wire target role is UNVERIFIED
# on silicon (ra8_emulator models RIIC as a controller only).
HIL_EXPECT="riic-target: armed 0x42 poll-dispatch"
HIL_EXPECT_NEGATIVE="hw_init_failed|HardFault|riic.*failed|SecureFault"
HIL_TIMEOUT_S=10

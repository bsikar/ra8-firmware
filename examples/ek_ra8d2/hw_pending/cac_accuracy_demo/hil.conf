# CAC clock-accuracy gate. PENDING SILICON: tools/board_sim shadows the
# CAC control registers but models no edge counter, so CASTR.MENDF never
# asserts and ra_cac_measure() returns k_ra_err_hw_timeout -- the banner
# reads "cac: meas=TIMEOUT-or-err ok=N" on the emulator. On a real
# EK-RA8D2 the 24 MHz main oscillator measured against LOCO/32 yields a
# count near 23437 inside the +/-6% window and the success banner below
# appears once a second. Promote out of hw_pending once this gate is green
# on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="cac: meas=ok ferr=0 ovf=0 ok=Y"
HIL_EXPECT_NEGATIVE="meas=TIMEOUT-or-err|ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

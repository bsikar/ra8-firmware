# EPUB cover-art extraction + decode + render gate (#143). Opens a baked,
# cover-bearing EPUB3 in memory (epub_open), resolves the cover-image
# manifest item and copies its raw PNG bytes (epub_get_cover_image), then
# decode+scale-to-fit+blits them into a 160x120 RGB565 framebuffer via the
# zero-heap ra8_img_decode_blit pipeline, and FNV-1a hashes the framebuffer.
#
# The 96x144 portrait cover fits the 160x120 box height-limited -> 80x120. The
# whole chain is deterministic (fixed blob -> deterministic parser + decoder +
# scaler), so the banner CRC is identical on host, ra8_emulator, and silicon. Any
# drift in epub cover resolution, the stb_image PNG decoder, the scale math,
# or the toolchain trips the gate.
#
# DEMOTED FROM hw_validated (#170 audit). It does NOT pass on silicon.
#
# Bench capture, EK-RA8D2 via the Pi rig, UART reader attached BEFORE the reset
# so the print-once-and-park race (#390) cannot explain it. Reproduced twice:
#   ereader-cover-hil: boot
#   ereader-cover-hil: FAIL open
# epub_open() fails outright on the real part against the SAME baked
# in-memory fixture that the host tests and the sibling epub_parse gate use.
# There is no SD card, no external hardware and no provisioning step in this
# app's path, so this is a firmware defect, not a rig gap.
#
# Note the claim this gate makes in the paragraph above -- "identical on host,
# ra8_emulator, and silicon" -- was never true on the third of those. ra8_emulator
# cannot arbitrate it either: the app stops at
# `INVALID INSN @ 0x0200DD12: bytes 80 ED 31 7F`, an Armv8.1-M encoding the
# Unicorn M33 core model has no seam for.
#
# Re-promote only from a bench capture showing the PASS banner and its CRC.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-cover-hil: cover 80x120 crc=6E4E45C5 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

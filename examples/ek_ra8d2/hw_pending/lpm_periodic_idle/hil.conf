# Periodic-app deep-idle loop (#153). Each period the app does a unit of work,
# prints "lpm_periodic_idle: work" over the SCI8 / J-Link OB VCOM console, arms
# ULPT0 (confirming ULPTCR.TCSTF = 1), drops the CPU into Software Standby
# (LPSCR.LPMD = 0x5), and is self-woken by the ULPT0 underflow through the
# two-halves ICU path. After k_lpi_period_count = 8 periods (~0.5 s each) it emits
# the PASS banner below and parks. No new wake mechanism beyond the bench-proven
# lpm_ulpt_standby twin (crystal-free ULPTLCLK/LOCO), so it is bench-runnable on a
# stock EK-RA8D2 with no external hardware.
#
# RECOVERY NOTE: the app cycles through Software Standby 8 times. A J-Link halt
# issued while the CPU is mid-Standby can be refused; the timer self-wakes every
# ~0.5 s so the VCOM PASS still appears, and the app parks in a normal loop (not
# Standby) after PASS, so the next flash halts cleanly. If a flash ever catches it
# mid-Standby, a board reset (or hil-recover) clears it. Order this after the
# always-running class-A apps.
HIL_MODE=uart_scrape
HIL_EXPECT="lpm_periodic_idle PASS"
HIL_EXPECT_NEGATIVE="hw_init_failed|cgc_init failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=20

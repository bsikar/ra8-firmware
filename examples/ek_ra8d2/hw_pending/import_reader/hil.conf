# EPUB-import -> .rabook cache reader over a micro-SD card on the SCI0 Simple-SPI
# bus (ra8_sdmmc_spi -- the same proven bench transport as epub_open). The demo
# mounts a FAT volume, opens BOOK.EPB: the first open is a cache MISS that streams
# the importer/compiler and writes the cached .rabook, the second open is a HIT
# (no recompile). It then asserts title/chapters/cache-bytes and reads chapter
# text, reporting over the SCI8 / J-Link OB VCOM console. The PASS banner below is
# emitted only after miss->compile->cache->hit->read all succeed; any failing
# stage prints "import_reader: FAIL ...", caught by the negative regex.
#
# REQUIRES a Pmod MicroSD in Pmod2 (J25) with a microSD card PRE-LOADED with a
# BOOK.EPB text-EPUB fixture (the app does NOT self-provision it; build the card
# with `tools/mkfontimg <book.epub> card.img BOOK.EPB` per the README). Without
# the fixture file the open fails. SD bring-up + first-open compile takes several
# seconds, hence the wider timeout. Order this with the other SD-card apps.
HIL_MODE=uart_scrape
HIL_EXPECT="import_reader: miss->compile->cache->hit->read PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=60

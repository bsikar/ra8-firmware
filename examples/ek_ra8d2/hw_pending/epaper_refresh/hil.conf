# IT8951 e-paper full + partial refresh via the display PAL (#256). The demo
# drives an IT8951-compatible e-paper panel entirely through the display-PAL
# e-ink backend over the ra8_io SPI bus: init (GET_DEV_INFO), a full refresh,
# then a partial refresh, reporting each stage over the SCI8 / J-Link OB VCOM
# console. The PASS banner is emitted only after both refreshes complete; on any
# stage failure it prints "epaper: FAIL".
#
# hw_pending: ra8_emulator attaches a modelled IT8951 controller with --eink
# (board_periph_eink.c answers HRDY, GET_DEV_INFO and the LUTAFSR idle poll), so
# the banner is deterministic in the simulator. Without --eink HRDY never
# asserts and the app honestly reports FAIL -- EIL == HIL for the e-ink path.
# The physical panel is on order, which is why this app lives under hw_pending/.
HIL_MODE=uart_scrape
HIL_EXPECT="epaper: PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

HIL_MODE=uart_scrape
# eth_tsn_tas_demo programs the ETHA time-sensitive-networking shapers on port
# 0: a 2-entry 802.1Qbv gate list on descriptor queue 7 (ra8_etha_tas_ram_reset
# + ra8_etha_set_tas_schedule + ra8_etha_enable_tas), read back entry by entry
# through ra8_etha_read_tas_entry, and an 802.1Qav credit-based shaper on
# traffic class 2 (ra8_etha_configure_cbs + ra8_etha_get_cbs_state), then reads
# the TAS cycle-time monitor (ra8_etha_get_status).
#
# The gPTP time base is the schedule reference, so the app now starts it for
# real (ESWCLK -> PTPTIVCt -> timer enable) and asserts it: per cycle the
# 78-bit GPTP counter is sampled either side of a 200 ms SysTick-timed window
# and must have advanced by that interval to within 10 percent. That closes the
# second of the two blockers #292 recorded here -- ra8_eth_gptp_init used to
# write an invented GPTP_CTRL/STS/IE window instead of the real HUM Ch 35
# PTPTMEC / PTPTIVCt registers, so the timer was never enabled (#498).
#
# The FIRST blocker is still open: the app never transmits. ra8_etha_init
# leaves port 0 in CONFIG mode (the only mode in which the shaper registers are
# writable) and nothing moves it to OPERATION, so there is no egress for the
# bench's gPTP-locked measurement peer (linuxptp on the Pi's PHC-capable
# built-in port) to measure.
#
# So "tsn: schedule PASS" means the time base is running AND every shaper call
# returned k_ra8_ok. The shaper half proves only that the writes were accepted;
# shaped egress is NOT measured.
HIL_EXPECT="tsn: schedule PASS"
HIL_EXPECT_NEGATIVE="schedule FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=15

HIL_MODE=uart_scrape
# eth_tsn_tas_demo programs the ETHA time-sensitive-networking shapers on port
# 0: a 2-entry 802.1Qbv gate-control list (ra8_etha_set_tas_schedule +
# ra8_etha_enable_tas) and an 802.1Qav credit-based shaper on traffic class 2
# (ra8_etha_configure_cbs + ra8_etha_get_cbs_state), then reads the TAS
# cycle-time monitor (ra8_etha_get_status). The gPTP time base (ra8_eth_gptp)
# is the schedule reference. The fixed verdict "tsn: schedule PASS" prints only
# when every shaper call returned k_ra8_ok -- that is the success-only line the
# gate keys on. The negative regex trips on a shaper-program failure or any HAL
# init fault.
#
# Asserting shaped egress against the schedule is blocked on the firmware, not
# on the bench (#292). Two reasons, both visible in this app's own main.c:
#   1. It never transmits. ra8_etha_init leaves port 0 in CONFIG mode (the only
#      mode in which the shaper registers are writable) and nothing moves it to
#      OPERATION, so there is no egress for any peer to measure.
#   2. Its schedule reference is not running. The TAS cycle is referenced to the
#      gPTP timer, but ra8_eth_gptp_init writes an invented GPTP_CTRL/STS/IE
#      window rather than the real HUM Ch 35 PTPTMEC/PTPTIVCt registers, so the
#      timer is never enabled. See eth_gptp_timestamp_demo's README.
# A measurement peer on a gPTP-locked timebase was provisioned on the bench for
# this (linuxptp on the Pi's PHC-capable built-in port) and cannot help until
# the two items above are fixed.
HIL_EXPECT="tsn: schedule PASS"
HIL_EXPECT_NEGATIVE="schedule FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

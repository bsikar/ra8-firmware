HIL_MODE=uart_scrape
# eth_tsn_tas_demo programs the ETHA time-sensitive-networking shapers on port
# 0: a 2-entry 802.1Qbv gate-control list (ra_etha_set_tas_schedule +
# ra_etha_enable_tas) and an 802.1Qav credit-based shaper on traffic class 2
# (ra_etha_configure_cbs + ra_etha_get_cbs_state), then reads the TAS
# cycle-time monitor (ra_etha_get_status). The gPTP time base (ra_eth_gptp)
# is the schedule reference. The fixed verdict "tsn: schedule PASS" prints only
# when every shaper call returned k_ra_ok -- that is the success-only line the
# gate keys on. The negative regex trips on a shaper-program failure or any HAL
# init fault.
#
# Asserting shaped egress against the schedule needs a multi-node measurement
# rig plus a gPTP peer (bench wiring #89) and is done manually on the bench.
HIL_EXPECT="tsn: schedule PASS"
HIL_EXPECT_NEGATIVE="schedule FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

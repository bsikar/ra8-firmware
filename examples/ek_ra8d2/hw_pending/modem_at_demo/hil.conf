# Cellular AT modem bring-up over the MikroBUS UART (#259). The demo drives the
# libs/ra8_modem_at AT command/response driver against a 3GPP AT-command modem
# (SIM7600 / Quectel BG95 class) on SCI7: sync (AT / ATE0 / CMEE), SIM (CPIN?),
# signal (CSQ), registration (CREG=1 + a +CREG URC, CREG?), PS attach (CGATT?),
# and an unsupported-command +CME ERROR path. It reports over the SCI8 / J-Link
# OB VCOM console; the PASS banner is emitted only after the whole sequence
# succeeds; on any step it prints "modem: ... FAIL".
#
# hw_pending: board_sim attaches a modelled AT modem with --modem
# (board_periph_modem.c answers the AT script), so the banner is deterministic
# in the simulator. Without --modem the modem never answers and the app reports
# "modem: sync FAIL" -- SIM == HIL for the AT protocol. A physical modem is not
# yet on the bench, which is why this app lives under hw_pending/.
HIL_MODE=uart_scrape
HIL_EXPECT="modem: rssi=17 reg=1 attach=1 cme=ok PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

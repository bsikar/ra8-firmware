# Headless ra8_emulator gate for the tap-to-zoom image viewer (#478): bring up the
# 1024x600 GLCDC panel, bind a 4096x3072 gray8 page (12 MiB -- an order of
# magnitude past what this part can hold) through an ra8_tile_cache sized
# (k_ez_cells = 35) to the 1:1 viewport tile demand plus a one-tile pan margin,
# then run the scripted boot self-check through four viewport states and print an
# FNV-1a-32 of the whole panel framebuffer for each:
#
#   z1    the opening 1:1 render        -- full source resolution, no downscale
#   pan   one right-pan step at 1:1     -- exercises the anchor clamp + read-ahead
#   z2    2x about panel point (700,400)-- tap-to-zoom keeps that point fixed
#   lens  the 4x loupe opened over it   -- the partial-update presentation
#
# Every stage is a deterministic integer pipeline: the page sampler is shifts and
# masks, the composite is nearest-neighbour magnification plus a `const`
# blue-noise threshold mask (#477) phased on the magnified image plane, and the
# chrome is filled rectangles rather than antialiased glyphs. So the four hashes
# are identical on the unit-test host, in ra8_emulator, and on silicon --
# deliberately unlike the glyph-bearing reader banners, which are toolchain-bound.
# apps/board/stand_alone/ereader/tests/src/test_app_ereader_zoom.c derives the same four numbers
# ez_scene_selftest() over a host framebuffer and is the golden this line was
# copied from.
#
# The three counters are the residency evidence, not decoration. 27 tile decodes
# (miss) covers the whole four-state sequence -- 1.7 MiB of a 12 MiB page -- and
# evict=0 proves no tile still on screen was ever thrown away, which is the
# thrash #338 describes. warm=3 is the pan read-ahead's lead-edge column.
#
# Interactive nav (not asserted here) is discrete tap-zones: the four content
# edges pan, the centre cycles the page magnification about the tapped point, the
# status bar opens/closes the loupe, and a tap inside the loupe cycles its own
# magnification (which dirties only the lens box -- 102400 pixels instead of
# 565248). Drive it with ra8_emulator --touch-seq / --click; see README.md.
#
# Status: emulator-viewable (hw_pending). Not yet silicon-validated (no rig in
# this workflow), so it is deliberately NOT under examples/ek_ra8d2/hw_validated/
# -- the EIL==HIL parity gate enforces a hil.conf for that tier only, and
# claiming the tier without a bench run would be the claim the gate exists to
# stop. The conf ships now so promotion is a `git mv` with nothing to write.
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-zoom: page 4096x3072 tile 256 cells 35 z1=EA5CD9B4 pan=D5BD08D3 z2=6C68D8BF lens=8B3C5733 hit=6680 miss=27 evict=0 warm=3 ok"

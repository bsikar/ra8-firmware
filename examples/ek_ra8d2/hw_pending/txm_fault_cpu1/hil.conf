# CPU1 (the Cortex-M33) runs the ThreadX Module Manager and starts a module
# that stores outside its MPU regions; the manager must terminate only that
# module and keep running. The Cortex-M85 prints the verdict on the SCI8 /
# J-Link OB VCOM console. Both halves and the module are Zig. Stock EK-RA8D2,
# no add-on hardware. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_fault_cpu1: module faulted, manager ran 10 more ticks PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# Cross-reset crash-log + reset-loop guard (T2-03, #191).
#
# On a single cold-boot bench run the app reads no prior record, then
# synthesises a decoded fault, pushes it through the installed write path
# (ra_crashlog_record_fault), and reads it back from the .noinit record:
#   crashlog: no prior record (cold/first boot)
#   crashlog: recorded+readback exc=6 pc=0x02001234 boot_loops=1
# The positive gate is the recorded+readback line (the in-process write+
# decode proof). The negative gate rejects a bring-up failure or a failed
# read-back.
#
# The cross-reset leg -- a WARM/watchdog reset re-reading the surviving
# record and the boot_loops count climbing toward safe mode -- needs a
# reset that keeps SRAM powered and is exercised manually on the bench (see
# README.md); a cold power-cycle randomises SRAM and the record reads empty
# by design.
HIL_MODE=uart_scrape
HIL_EXPECT="crashlog: recorded+readback exc=6"
HIL_EXPECT_NEGATIVE="crashlog: FAIL"

# E-reader-on-M33 (#150): the Cortex-M85 releases the M33 into the reader, which
# renders a held page into external SDRAM (RGB565 256x64), folds a CRC-32 over
# the pixels, and publishes base + geometry + CRC through the shared mailbox; the
# M85 validates the descriptor and emits the VCOM banner on the verified page-0
# render -- BEFORE the #150 park/wake mode-switch and flushed, so the bytes are
# on the wire before the M85 sleeps. (The existing board_sim CRC gates assert the
# unchanged ITM banners + golden CRC; this VCOM banner is purely additive.)
# Mirrors the page-0 verdict to the SCI8 / J-Link OB VCOM console for the Pi rig
# (no SWO / ITM capture). Stock EK-RA8D2; uses the on-board SDRAM (no add-on HW).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader_m33: page render PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=25

# Alive mode until the bench SW4 DIP is flipped for Pmod1 UART: the probe
# proved (u15: latch=00F2 pins=0000) that the mechanical SW4 overpowers the
# U15 expander override, so the DA16600's UART cannot reach SCI2 until
# SW4-1=ON (Pmod1 UART) + SW4-3=ON (Octo-SPI inactive) are set by hand.
# Once flipped, promote to uart_scrape with:
#   HIL_EXPECT="da16600: alive ok"
#   HIL_EXPECT_NEGATIVE="alive FAIL|HardFault"
HIL_MODE=alive
HIL_BOOT_S=3

# Alive mode while the DA16600's UART is electrically silent on every
# reachable pin (issue #86 evidence chain: SCI2 loopback ok, TXD2 toggles
# at the pin, 256/256 U15 routings silent, 0 edges on P801/P802/P808/P809
# across module resets and cold power-ons). The fix is module-side.
# Once a single edge appears, promote to uart_scrape with:
#   HIL_EXPECT="da16600: alive ok"
#   HIL_EXPECT_NEGATIVE="alive FAIL|loopback FAIL|STUCK HIGH|HardFault"
HIL_MODE=alive
HIL_BOOT_S=3

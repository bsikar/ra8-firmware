# CPU1 (the Cortex-M33) runs the ThreadX Module Manager and loads a module
# that keeps a table of function pointers in its data; the module computes
# through that table and reports each value. The Cortex-M85 releases CPU1,
# waits for ten right values and prints the first four on the SCI8 / J-Link
# OB VCOM console. Stock EK-RA8D2, no add-on hardware. Not yet run on the
# bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_table_cpu1: table returned 10 100 200 40000 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

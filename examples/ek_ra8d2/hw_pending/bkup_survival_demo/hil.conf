# VBATT backup-register reset-survival gate. PENDING SILICON: the gate
# keys on the post-reset "survived=Y" banner, which proves the VBATT
# domain retained the sentinel across a CPU reset. tools/board_sim shadows
# VBTBKRn as ordinary memory (the read/write half passes, rw=ok) but
# models no reset-retained power domain and clears memory each run, so it
# only ever reports "survived=N boot=1". Confirming reset survival needs a
# real EK-RA8D2 and a reset cycle (flash -> boot1 survived=N -> reset ->
# boot2 survived=Y). Promote out of hw_pending once this gate is green on
# hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="bkup: rw=ok survived=Y"
HIL_EXPECT_NEGATIVE="rw=BAD|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# Dual-core shared-SRAM mailbox demo (#152): the Cortex-M85 releases the M33 and
# runs 6 request/reply rounds; each round the M33 returns operand*3+1 -- a value
# only the second core executing can produce. The M85 emits the VCOM banner only
# when ALL 6 rounds verified, then drops into an idle heartbeat (which keeps the
# ITM "heartbeat: both cores alive" line going). Mirrors the verdict to the SCI8
# / J-Link OB VCOM console so the Pi rig (which has no SWO / ITM capture) can gate
# the full dual-core release + cross-core mailbox handshake. A missing or wrong
# M33 reply skips the banner. Stock EK-RA8D2, no add-on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="dualcore_mailbox: 6 rounds PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

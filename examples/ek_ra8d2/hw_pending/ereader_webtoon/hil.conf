# Headless board_sim gate for the continuous vertical-scroll (webtoon / manhwa)
# reading mode (#289). The app builds a tall synthetic strip as a raw RTA1
# band-tile atlas (ra8_tileatlas, one full-width band column), then scrolls the
# WHOLE strip top -> bottom through the ra8_webtoon engine: each visible band is
# paged decode-on-demand through a deliberately tiny 4-cell ra8_tile_cache (20
# bands -> forced evictions -> the bounded-memory property) and composited into
# an RGB565 framebuffer via ra8_gfx_blit. An FNV-1a-32 hash is folded over every
# rendered frame.
#
# The banner reports the band count, the number of scroll steps, the total
# SKIPPED band count across the whole traversal -- which must be 0 (the #289
# 0-skip / seamless contract) -- and the framebuffer CRC. Every stage is a
# deterministic integer pipeline (RTA1 raw read, RGB888 -> RGB565 pack, FNV),
# so the banner is identical on the unit-test host, in board_sim and on silicon
# (SIM == HIL); the engine's host twin (tests/test_ra8_webtoon.c) proves the
# same 0-skip + seamless-render property per pixel over the same strip.
#
# Status: sim-only (hw_pending). Not yet silicon-validated (no rig in this
# workflow); the deterministic banner is bench-runnable on a stock EK-RA8D2 with
# no external hardware (SCI8 / J-Link OB VCOM only).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-webtoon: bands=20 steps=29 skipped=0 crc=482C6145"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|skipped=[1-9]"
HIL_TIMEOUT_S=20

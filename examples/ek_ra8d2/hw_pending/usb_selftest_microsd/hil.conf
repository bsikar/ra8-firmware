# HIL gate for usb_selftest_microsd (Pmod2 microSD exposed as a read-only USB
# drive over the self-loop cable). Requires a FAT microSD card in the Pmod2 slot.
HIL_MODE=uart_scrape
HIL_EXPECT="USB SELFTEST MICROSD PASS"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|no card|mismatch at|FAILED"
HIL_TIMEOUT_S=90

# SMBus 3.2 protocol-layer gate (#128). Drives real SMBus byte transactions
# (Read Byte Data, Send Byte + Receive Byte) through ra8_smbus -> ra8_i3c ->
# IIC_B against the ST LSM6DSO's WHO_AM_I register (0x0F, fixed 0x6C) and
# asserts both reads return 0x6C. PEC is disabled (the IMU is a plain I2C
# register-file device, not an SMBus PEC device), so the frames are plain I2C.
#
# REQUIRES the IMU 12 Click (MikroE, ST LSM6DSO) fitted to the Pmod1 I2C side
# (P511/SDA1 + P512/SCL1) -- the same prerequisite as imu_lsm6dso_demo. Without
# the part the bring-up NAKs and the firmware prints "smbus: NAK (no LSM6DSO)".
# Under ra8_emulator the modelled LSM6DSO answers, so the banner is deterministic.
HIL_MODE=uart_scrape
HIL_EXPECT="smbus: whoami=6C sendrecv=6C PASS"
HIL_EXPECT_NEGATIVE="FAIL|NAK|mismatch|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

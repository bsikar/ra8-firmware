# Both cores run the ThreadX Module Manager with a module of their own. The
# Cortex-M85's module (txm_rpc_m33) calls add once a tick; each call crosses
# the shared mailbox block to an ra8_rpc server on CPU1 (the Cortex-M33),
# whose own module (txm_hello_m33) runs beside it, and the answer comes back
# the same way. The M85 prints the verdict on the SCI8 / J-Link OB VCOM
# console once 10 checked sums came back. Zig throughout. Stock EK-RA8D2.
# Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_dual_mailbox: 10 requests crossed the mailbox PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

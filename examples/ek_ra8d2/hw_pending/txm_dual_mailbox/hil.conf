# Both cores run the ThreadX Module Manager with a module of their own: the
# Cortex-M85 loads txm_hello_m33 from its MRAM, CPU1 (the Cortex-M33) loads
# its own copy from MRAM_CPU1 and reports its run count in the shared mailbox
# block. The M85 prints the verdict on the SCI8 / J-Link OB VCOM console once
# both modules have run 10 times. Zig throughout. Stock EK-RA8D2. Not yet run
# on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_dual_mailbox: modules ran 10 times on both cores PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

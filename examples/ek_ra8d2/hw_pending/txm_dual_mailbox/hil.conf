# Both cores run the ThreadX Module Manager with a module of their own. The
# Cortex-M85's module (txm_dual_client_m33) calls add once a tick; each call
# crosses the shared mailbox block to the ra8_rpc server module on CPU1 (the
# Cortex-M33, txm_dual_server_m33), and the answer comes back the same way.
# After 10 checked sums it asks CPU1's module to store outside its MPU
# regions; CPU1's manager kills it and refuses the call in its place, and
# the M85 runs on. The verdict is the last line on the SCI8 / J-Link OB VCOM
# console. Zig throughout. Stock EK-RA8D2.
# Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_dual_mailbox: CPU1 module faulted, M85 ran on PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

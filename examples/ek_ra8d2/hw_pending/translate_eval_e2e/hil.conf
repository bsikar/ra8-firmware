# Headless ra8_emulator gate for the end-to-end manga translation runner:
# exercises full on-target C ABI detector -> CTC OCR -> Marian NMT -> overlay fit
# -> TRJC checkpoint reset/restore -> TRN1 sidecar parity on Cortex-M85.
# When SD card /TPAK.BIN is present (--sd-dir), also executes every corpus page
# and emits EMU_TRACE_BEGIN..EMU_TRACE_END JSON for tools/translate_eval.
#
# Status: emulator-validated (hw_pending). Not yet silicon-validated (no rig in
# this workflow).
HIL_MODE=uart_scrape
HIL_EXPECT="translate_eval_e2e: PASS"

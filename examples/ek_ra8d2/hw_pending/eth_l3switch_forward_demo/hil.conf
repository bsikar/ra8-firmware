HIL_MODE=uart_scrape
# eth_l3switch_forward_demo configures the real MFWD forwarding engine
# (ra8_eth_mfwd_set_forwarding_masks + ra8_eth_mfwd_route_queue +
# ra8_eth_mfwd_get_status) and exercises the FSP-shaped L3-switch facade
# lifecycle (ra8_layer3_switch open / status_get / close). The facade's
# route_add is a documented not-supported placeholder on this silicon; its code
# is logged ("l3sw: route_add=263 (placeholder)") but never fails the verdict.
# The fixed verdict "l3sw: forward PASS" prints only when every real operation
# returned k_ra8_ok -- that is the success-only line the gate keys on. The
# negative regex trips on a forwarding-config failure or any HAL init fault.
#
# Proving a frame reaches the correct egress port can NOT be done on this
# board at any price, and the blocker is the board, not the bench. The RA8D2
# has two ETHA/RMAC ports, but the EK-RA8D2 breaks out a single RJ45 with one
# populated PHY -- there is no second jack to observe an egress on, so no
# amount of cabling makes forwarding assertable end to end. It needs the
# carrier PCB (#318) or a second board. (This previously read "bench wiring
# #89", which was wrong: #89 is a bench task and this is a board limitation.)
HIL_EXPECT="l3sw: forward PASS"
HIL_EXPECT_NEGATIVE="forward FAIL|hw_init_failed|cgc_init failed|HardFault"
HIL_TIMEOUT_S=10

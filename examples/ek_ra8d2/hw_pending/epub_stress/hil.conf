# Large-structure EPUB open gate (#144 bug 1 regression net). On the firmware
# target, miniz's ZIP central directory AND tinyxml2's OPF DOM both allocate
# from the same 96 KiB static arena. A big real book stresses that shared pool.
# This gate opens a synthetic 125-entry / 60-chapter / ~10 KB-OPF EPUB in memory
# (more files than the 108-file, 41-chapter real Boox book that triggered #144)
# and asserts ra8_epub_open succeeds, the full spine parses (60 chapters), every
# NCX navPoint extracts (toc=60, #144 bug 2), and the cover resolves.
#
# The fixture is synthetic (not the copyrighted novel), so it is committable and
# CI-able. Deterministic, so the board_sim banner is the regression net: any
# regression that shrinks the shared arena, re-breaks NCX parsing, or drops the
# cover trips the gate. The original #144 no_mem was the 16 KiB OPF/NCX scratch
# buffer (since fixed to 48 KiB), not the arena -- this gate pins that.
#
# DEMOTED FROM hw_validated (#170 audit). It does NOT pass on silicon.
#
# Bench capture, EK-RA8D2 via the Pi rig, UART reader attached BEFORE the reset
# so the print-once-and-park race (#390) cannot explain it. Reproduced twice:
#   epub-stress-hil: boot
#   epub-stress-hil: FAIL toc
# So ra8_epub_open succeeds and the spine parses, but the NCX navPoint
# extraction -- the #144 bug-2 regression net this gate exists to hold -- comes
# back short of 60 on the real part. The fixture is baked in memory, so there is
# no SD card, no external hardware and no provisioning step involved: this is a
# firmware defect the emulator does not reproduce.
#
# board_sim cannot arbitrate it either: this app stops at
# `INVALID INSN @ 0x02007BBE: bytes 80 ED 31 7F`, an Armv8.1-M encoding the
# Unicorn M33 core model has no seam for. So the app has been green on neither
# side, and its hw_validated status rested on a HIL run that was never actually
# reading the UART when the verdict line went past.
#
# Re-promote only from a bench capture showing the PASS banner.
HIL_MODE=uart_scrape
HIL_EXPECT="epub-stress-hil: files=125 chapters=60 toc=60 cover=ok PASS"
HIL_EXPECT_NEGATIVE="FAIL|no_mem|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

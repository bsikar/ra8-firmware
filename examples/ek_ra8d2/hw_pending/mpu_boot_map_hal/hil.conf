# mpu_boot_map_hal boots the Cortex-M85 with the L1 caches and the 5-region MPU
# enabled (RA8_BOOT_ENABLE_CACHE_MPU), but its per-app system_init.c installs the
# MPU memory-attribute map through the ra8_mpu HAL (ra8_mpu_apply_boot_map())
# instead of raw MAIR/RBAR/RLAR/CTRL pokes -- the HAL-path twin of cache_mpu_hil.
# It then self-tests:
#   1. ra8_mpu_is_enabled() -- the HAL enabled the MPU during boot;
#   2. ra8_mpu_boot_map() -- the canonical 5-region map, incl. the 640 KiB
#      (non-power-of-two) non-cacheable shared bank at 0x22100000;
#   3. Device-nGnRE peripheral MMIO read (MPU region 3) -- live SCKDIVCR readback.
# On all-pass it prints the deterministic banner below over the J-Link OB VCOM
# console (SCI8, PD02/PD03 @ 115200 8N1); any step failure prints a distinct
# "... FAIL" line instead.
HIL_MODE=uart_scrape
HIL_EXPECT="mpu_boot_map_hal: mpu-via-hal PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT|panic"
HIL_TIMEOUT_S=15

# board_sim gate for the viewable page-turn comic reader (Demo A). The app
# brings up SDRAM + the 1024x600 GLCDC panel through ra8_display_pal, opens a
# baked multi-page CBZ (scripts/gen/gen_comic_fixture.py) once through
# ra8_comic_open, and decodes the current page on demand with ra8_comic_page_read
# + ra8_img_decode_blit (aspect-fit into the content region). It draws a top
# status bar (title, page N of M, battery) and a bottom progress bar, and turns
# pages on tap zones (right third = next, left third = prev, center-top = toggle
# chrome). See main.c for the full contract.
#
# After the first render the app FNV-1a-hashes the whole 1024x600 panel
# framebuffer and prints one deterministic banner over SCI8, so this headless
# gate still asserts a fixed page-1 hash even though the demo is viewable
# (--ppm / --view show the real reader screen; --touch-seq drives page turns).
# The render is an integer pipeline, so the hash is identical on host, board_sim,
# and silicon.
#
# Status: sim-only (hw_pending). Sim-viewable; not yet silicon-validated (no rig
# in this workflow).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-comic: pages=5 1024x600 page=1 crc=74B9BA64 ok"

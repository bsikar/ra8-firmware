# Headless board_sim gate for the comic-archive reader (libs/ra_comic): open a
# baked CBZ (ZIP of images) and a baked CBR (RAR of images), decode page 0 of
# each through the zero-heap ra_img_decode_blit pipeline into a 160x120 RGB565
# framebuffer, and FNV-1a-hash the framebuffer, printed over SCI8.
#
# Both fixtures carry the same first page image, so the two CRCs are identical --
# the CBZ (streaming miniz ZIP) and CBR (first-party clean-room RAR) backends
# extract byte-for-byte the same page and render interchangeably. The render is a
# deterministic integer pipeline, so the banner is identical on host and
# board_sim. No SD / panel / touch needed.
#
# Status: sim-only (hw_pending). Not yet silicon-validated (no rig in this
# workflow); the RAR walk uses only 32-bit shifts so it also runs under
# board_sim's Unicorn-M33 (whose 64-bit variable-shift emulation is lossy).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-comic-hil: cbz pages=2 160x106 crc=733D076C cbr pages=2 160x106 crc=733D076C ok"

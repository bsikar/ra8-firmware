# ra8_emulator gate for the viewable page-turn comic reader (Demo A). The app
# brings up SDRAM + the 1024x600 GLCDC panel through ra8_display_pal, opens a
# baked multi-page CBZ (scripts/gen/gen_comic_fixture.py) once through
# ra8_comic_open, and decodes the current page on demand with ra8_comic_page_read
# + ra8_img_decode_blit (aspect-fit into the content region). It draws a top
# status bar (title, page N of M, battery) and a bottom progress bar, and turns
# pages on tap zones (right third = next, left third = prev, center-top = toggle
# chrome). See main.c for the full contract.
#
# After the first render the app FNV-1a-hashes the whole 1024x600 panel
# framebuffer and prints one deterministic banner over SCI8, so this headless
# gate still asserts a fixed page-1 hash even though the demo is viewable
# (--ppm / --view show the real reader screen; --touch-seq drives page turns).
# The render is an integer pipeline, so the hash is identical on host, ra8_emulator,
# and silicon.
#
# The banner also pins the #344 oversized-page tile path: at boot the app opens a
# baked 1024x1400 single-page CBZ (comic_large_fixture.h) that is far too large
# for the whole-decode arena, routes it through ra8_comic_tiles (import-time JOF
# transcode + ra8_tile_cache paging), decodes every tile in bounded RAM, and
# FNV-hashes the pixels -- `tiled=<W>x<H>:<tiles>:<crc>`. That render is a pure
# integer tile pipeline, so the digest is toolchain-independent like the comic
# self-check in ereader_shelf. The page-1 framebuffer hash is unchanged
# (crc=74B9BA64), confirming the whole-decode reader still renders identically.
#
# Status: emulator-only (hw_pending). Emulator-viewable; not yet silicon-validated (no rig
# in this workflow).
HIL_MODE=uart_scrape
HIL_EXPECT="ereader-comic: pages=5 1024x600 page=1 crc=74B9BA64 tiled=1024x1400:24:85752EC5 ok"

# The Cortex-M85 brings up the micro-SD card on the native SDHI0 bus, mounts
# its FAT volume, reads txm_tour_m33.ra8app (copy zig-out/arm's file to the
# card root), admits it, and runs the syscall tour: the module drives every
# ra8_app_api_t request through the image's application-request hook, one
# logged line each, then exits and the image unloads it. Slice 1 of the
# syscall-tour PoC. Zig throughout. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_sd_tour_m85: tour PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

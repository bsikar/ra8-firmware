# A/B OTA orchestration gate (issue #260). The demo drives the libs/ra8_ota A/B
# slot state machine end to end, twice, over what it believes is an on-chip
# extra-MRAM (data-flash) bank at 0x27000000:
#
#   COMMIT   -- a good image is staged into the inactive bank, re-hashed +
#               signature-checked, and the inactive bank is latched as the next
#               boot bank (the boot-select record flips A -> B).
#   ROLLBACK -- a corrupted image is staged; the re-hash no longer matches the
#               manifest digest, verification fails (k_ra8_err_crc_mismatch), the
#               machine parks in error, commit is skipped, and the boot-select
#               record is left on the still-good active bank A.
#
# DEMOTED FROM hw_validated -- IT DOES NOT PASS ON SILICON (#170).
#
# Bench, EK-RA8D2: "ota_ab: stage=ok commit=N rollback=N ok=N", repeatedly.
# J-Link on the running board reads MSTATR = 0x0080C000 (ILGCOMERR | ILGLERR)
# and MASTAT = 0x18 (CMDLK | MREAE) -- the MACI sequencer rejected the extra-MRAM
# Program commands as ILLEGAL and sat command-locked. That is the identical
# signature ra8_io_mram_demo produces, and the identical signature a by-hand
# J-Link Program sequence to 0x27000000 produces from a clean reset.
#
# The bank does not exist. HUM Ch 5 Figure 5.2 p 237 labels the region "Extra
# MRAM (option-setting memory)"; HUM Ch 59.7.4.5 Table 59.15 p 3592 enumerates
# every legal MACI Program target and they all lie in 0x02E0_7600..0x02E1_79F0
# (FSBL, measurement report, code certificate, general-purpose OTP, PBPS,
# POFSPS, REVOKE, HUK-zeroize enable, anti-rollback counter); 0x2700_0000
# appears nowhere in the manual. The RA8D2 has no user data-flash array, so the
# A/B banks this demo persists into have never actually been written.
#
# It reached hw_validated because ra8_emulator's MRAM model wrote MACI Program
# payloads straight into mapped RAM regardless of MSADDR, so the whole A/B cycle
# round-tripped in the emulator and the app printed ok=Y. board_periph_mram.c now
# rejects out-of-window Programs and latches the command-locked state, so EIL
# reports the bench result instead of masking it.
#
# To fix: repoint libs/ra8_ota's slot storage at storage the board actually has
# -- the 64 MB OSPI NOR (ra8_xspi, already driven by ra8_io_xspi_demo) or the
# code-MRAM banks the dfu_bootloader programs via MRCPC (which is a different,
# working path) -- then re-validate on the bench and promote.
HIL_MODE=uart_scrape
HIL_EXPECT="ota_ab: stage=ok commit=Y rollback=Y ok=Y"
HIL_EXPECT_NEGATIVE="ok=N|commit=N|rollback=N|stage=fail|HardFault|hw_init_failed|TIMEOUT"
HIL_TIMEOUT_S=15

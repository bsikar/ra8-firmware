# DRW 2D-engine fill-rect gate. PENDING SILICON: tools/board_sim shadows
# the DRW control registers but models no rasterizer, so ra8_drw_fill_rect
# never touches the framebuffer and the centre pixel stays clear -- the
# banner reads "drw: fill match=N" on the emulator. On a real EK-RA8D2 the
# DRW fills the rectangle and the success banner below appears once a
# second. Promote out of hw_pending once this gate is green on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: fill match=Y"
HIL_EXPECT_NEGATIVE="fill match=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# DRW 2D-engine fill-rect gate.
#
# PENDING SILICON -- but the engine is no longer dead (#247). The DRW sits in
# the graphics power domain, which PDCTRGD gates OFF at reset (HUM Ch 11.2.14
# p 452, reset value 0x81: PDPGSF=1, PDDE=1); nothing had ever powered it on,
# so every DRW register read 0 and every write was lost. HUM Ch 11.5.1
# Table 11.7 p 480 places DRW, GLCDC, MIPI DSI/CSI and VIN in that domain.
# ra8_drw_init now calls ra8_lpm_graphics_power_on() before touching the block.
#
# Bench evidence after the fix: HWREVISION 0x00000000 -> 0x0FBE0107, and this
# demo's framebuffer went from ALL ZERO to a real rasterized rectangle.
#
# REMAINING GAP (why this is still match=N): the geometry and colour are wrong.
# The demo asks for a 16x16 rect at (8,8) in 0xFF00FF00 (opaque green); the
# engine paints a clean 8x8 rect at (8,8)-(15,15) in 0x0000FF00. So the size
# comes out HALVED and the alpha byte never reaches the framebuffer. The
# limiter programming in internal_program_rect_limiters (L1..L4 START/XADD/
# YADD, HUM Ch 62.2.10-62.2.12 p 3698-3699) and the COLOR1 alpha path are the
# places to look; the subpixel unit itself is correct (16 = 1 px, 4-bit
# fraction, HUM Ch 62.4).
#
# board_sim still models the engine inert and now gates HWREVISION on the power
# domain, so a firmware that skips the bring-up sees the dead register in the
# emulator exactly as on the bench. Promote once fill geometry + alpha match.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: fill match=Y"
HIL_EXPECT_NEGATIVE="hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# ra8_io block-device backend over the on-chip "extra" MRAM region (#155/#156).
#
# BLOCKED -- THE TARGET MEMORY DOES NOT EXIST ON THIS SILICON (#170).
#
# The demo drives a 512-byte block erase/program/read round-trip at
# 0x27000000 through ra8_flash_extra_mram_write. On the bench that returns
# Error=516 (k_ra8_err_hw_error) at the erase stage, with MSTATR = 0x0080C000
# (ILGCOMERR | ILGLERR) and MASTAT = 0x18 (CMDLK | MREAE): the MACI sequencer
# rejects the command as ILLEGAL and enters the command-locked state.
#
# Reproduced by hand over J-Link from a clean reset -- MENTRYR = 0xAA80 (P/E
# mode entered, verified), MSADDR = 0x27000000, then 0xE8 / 0x08 / 8x 0xFFFF /
# 0xD0 per HUM Ch 59.7.4.5 Figure 59.13 p 3591-3592 -- giving exactly the same
# status. So the fault is not leftover state, a missing status-clear, or the
# N value (0x08 = 16-byte programming is correct).
#
# The address is the problem. HUM Ch 59.7.4.5 Table 59.15 p 3592 "Address used
# by Program command" enumerates EVERY legal Program target and they all lie in
# 0x02E0_7600..0x02E1_79F0: FSBL setting, measurement-report and code-
# certificate start addresses, general-purpose OTP, PBPS / PBPS_SEC, POFSPS,
# REVOKE, Zeroization HUK Enable, anti-rollback counter setting. There is no
# general-purpose data-flash target. HUM Ch 5 Figure 5.2 p 237 labels the
# region "Extra MRAM (OPTION-SETTING MEMORY)", and the address 0x2700_0000
# appears NOWHERE in the manual -- the RA8D2 has no user EEPROM / data-flash
# array. A 512-byte user round-trip against it is not a capability this part
# has, so this demo cannot pass as written.
#
# Do NOT "fix" this by pointing the demo at the real Program window: those are
# the security / OTP structures, several of them one-time-programmable, and
# writing them risks permanently altering or bricking the board.
#
# board_sim used to model 0x27000000 as ordinary RAM and let the write through,
# which is why it passed here while the bench failed. board_periph_mram.c now
# refuses any Program whose MSADDR is outside HUM Table 59.15's window and
# latches the command-locked state, so the emulator reports the bench result:
# "ra8_io_mram_demo: FAIL" with "64 REJECTED".
#
# Next step is a decision, not a debug: delete this demo and the
# ra8_flash_extra_mram_write API that advertises a nonexistent region (the
# no-stubs policy's "genuinely dead -> delete it"), or repoint ra8_io's
# non-volatile backend at storage the board actually has (the 64 MB OSPI NOR).
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_mram_demo: 512-byte block erase/program/read on extra MRAM PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

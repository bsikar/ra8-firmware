# ra8_io block-device backend over the on-chip "extra" MRAM region (#155/#156).
# The demo binds the MRAM block device and runs a 512-byte block
# erase/program/read round-trip directly against the RA8D2's non-volatile MRAM
# (the same data-MRAM the board_sim MRAM model exercises, which earlier caught a
# real ra8_flash_extra_mram_write half-program HAL bug), reporting the verdict over
# the SCI8 / J-Link OB VCOM console. The MRAM is on-die, so this is bench-runnable
# on a stock EK-RA8D2 with no external hardware. The banner below is emitted only
# on a byte-exact round-trip; a miscompare prints "ra8_io_mram_demo: FAIL", caught
# by the negative regex. NOTE: this programs on-chip MRAM (non-volatile) -- the
# region used is the spare extra-MRAM block, not the code image.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_mram_demo: 512-byte block erase/program/read on extra MRAM PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

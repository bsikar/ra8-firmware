# CPU1 (the Cortex-M33) runs the ThreadX Module Manager, loads the
# hello-world module in place and starts it; the Cortex-M85 releases CPU1,
# waits for the module's start thread to run 10 times and prints the verdict
# on the SCI8 / J-Link OB VCOM console. Both halves and the module are Zig.
# Stock EK-RA8D2, no add-on hardware. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_manager_cpu1: module ran 10 times PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

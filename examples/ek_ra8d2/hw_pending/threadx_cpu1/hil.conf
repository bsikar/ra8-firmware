# CPU1 (the Cortex-M33) runs one ThreadX thread that copies the kernel tick
# count into shared SRAM; the Cortex-M85 releases CPU1, waits for 10 ticks and
# prints the verdict on the SCI8 / J-Link OB VCOM console. Both halves are Zig.
# Stock EK-RA8D2, no add-on hardware. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="threadx_cpu1: 10 ticks PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

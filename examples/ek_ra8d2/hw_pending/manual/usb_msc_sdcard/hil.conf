# HIL gate for usb_msc_sdcard (the live Pmod2 SD card exposed as a WRITABLE
# USB drive on J11). Requires a FAT microSD card in the Pmod2 slot.
#
# The rig-scrapable verdict is the device-side bring-up: card enumerated at
# its real CSD capacity + USBX MSC class up + DPRPU attach. The READY banner
# prints only after all of it succeeded; a missing card or any bring-up
# failure prints "usb_msc_sdcard: FAIL ..." instead (and the device
# deliberately never attaches without a card). The actual host-side file copy
# (mount, write, unmount, re-mount, verify) needs a real PC on J11 and stays
# a manual bench step -- see README.md "Bench procedure". The no-hardware
# transport proof (enumeration + a sector-0 read through the USB pipe against
# an --sd card image) runs in ra8_emulator via
# `scripts/emu/smoke.sh usb_msc_sdcard`.
HIL_MODE=uart_scrape
HIL_EXPECT="USB MSC SDCARD READY"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|hw_init_failed"
HIL_TIMEOUT_S=60

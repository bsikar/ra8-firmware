# HIL gate for usb_printer_vendor (native bare-metal USB composite device on
# J11: IF0 = Printer 7/1/2, IF1 = Vendor 0xFF). No external hardware beyond a
# USB host on J11.
#
# The rig-scrapable verdict is the device-side bring-up banner: both native
# class layers up (ra8_usb_pprn + ra8_usb_pvnd), descriptors cached, and the
# D+ pull-up raised. "USB PRINTER+VENDOR READY" prints only after all of that
# succeeded; any bring-up failure prints "usb_printer_vendor: FAIL ..."
# instead. Once a real host enumerates the device the app additionally prints
# "USB PRINTER+VENDOR CONFIGURED".
#
# The host-side data path (a print job driven through CUPS / usblp on the
# printer interface, and a libusb bulk loopback on the vendor interface) needs
# a real PC on J11 and stays a manual bench step -- see README.md. The
# no-hardware enumeration proof (device reaches CONFIGURED against the emulated
# chapter-9 host) runs headless in ra8_emulator via
# `scripts/emu/smoke.sh usb_printer_vendor`.
HIL_MODE=uart_scrape
HIL_EXPECT="USB PRINTER+VENDOR READY"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|hw_init_failed"
HIL_TIMEOUT_S=60

# HIL gate (#172): prove the TrustZone BLXNS root-of-trust gate on silicon.
#
# Boot path (all on CPU0): SystemInit -> ra_cgc_init -> ra_trustzone_init programs
# SRAMSABAR (SRAM2 Non-secure) + the bit[28] SAU (0x1./0x3./0x5. IDAU-NS ranges NS,
# ALLNS=0), and copies the (separately flashed, SIGNED) NS image MRAM->SRAM alias
# 0x32100000. Then main() brings up tf-psa-crypto and calls
# ra_tz_secure_boot_jump_ns: the RA_ENABLE_ROOT_OF_TRUST gate reads the NS image's
# .ns_rot_header (ns_base + 0x40) for the signed-body length, locates the
# ra_rot_trailer_t at ns_base + body_len, verifies SHA-256 + ECDSA-P256, and only
# then arms VTOR_NS + BLXNS. On success the NS reset handler advances
# g_sbns_ns_alive forever.
#
# This gate flashes the GENUINE merged hex (secure_boot_ns_hil.hex) and requires
# g_sbns_ns_alive to ADVANCE -- reachable ONLY if the RoT gate authenticated the
# signed NS image and BLXNS switched to Non-Secure state. No option-byte
# programming, no brick risk (the NS split is the runtime SRAMSABAR).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_sbns_ns_alive"
HIL_PROBE_MIN_ADVANCE=50
HIL_PROBE_SECONDS=3
HIL_PROBE_BOOT_S=3
# A denial (g_sbns_denied) on the GENUINE image would mean the RoT rejected an
# authentic NS image (a bug) -- fail the gate if it is ever set here.
HIL_PROBE_FAILURE_SYMBOL="g_sbns_denied"
HIL_PROBE_MAX_FAILURE=0
#
# TAMPERED negative case (separate flash -- secure_boot_ns_hil_tampered.hex, one
# body byte flipped after signing): the RoT gate MUST default-deny.
#   - g_sbns_ns_alive stays 0 (the NS world never ran), AND
#   - g_sbns_denied == 1 with g_sbns_jump_err == 0x... (k_ra_err_checksum_mismatch).
# Bench probe for the tampered artifact:
#   jlink_memprobe g_sbns_denied  -> expect 1
#   jlink_memprobe g_sbns_ns_alive -> expect 0 (no advance)
#
# Triage when the genuine gate fails (J-Link halt + read these globals):
#   - g_sbns_step == 9: PSA/crypto init failed (heap/tf-psa problem).
#   - g_sbns_step == 3 / g_sbns_denied == 1: the RoT gate denied the genuine image
#     (check the NS image was SIGNED + merged -- read g_sbns_jump_err for the code).
#   - g_sbns_step == 2 with g_sbns_ns_alive == 0: BLXNS armed but NS never ran
#     (SAU / SRAMSABAR / NS-copy problem).

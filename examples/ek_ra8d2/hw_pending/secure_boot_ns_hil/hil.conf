# HIL gate (#172): prove the TrustZone BLXNS root-of-trust gate on silicon.
#
# Boot path (all on CPU0): SystemInit -> ra8_cgc_init -> ra8_trustzone_init programs
# SRAMSABAR (SRAM2 Non-secure) + the bit[28] SAU (0x1./0x3./0x5. IDAU-NS ranges NS,
# ALLNS=0), and copies the (separately flashed, SIGNED) NS image MRAM->SRAM alias
# 0x32100000. Then main() brings up tf-psa-crypto and the Secure SCI8 VCOM console,
# and calls ra8_tz_secure_boot_jump_ns: the RA8_ENABLE_ROOT_OF_TRUST gate reads the
# NS image's .ns_rot_header (ns_base + 0x40) for the signed-body length, locates the
# ra8_rot_trailer_t at ns_base + body_len, verifies SHA-256 + ECDSA-P256, and only
# then arms VTOR_NS + BLXNS. On success the NS reset handler advances g_sbns_ns_alive
# forever.
#
# ---- PRIMARY GATE: uart_scrape ----------------------------------------------
# The security-critical verify decision is Secure-side, so the Secure world prints
# its verdict on the J-Link OB VCOM console (SCI8, 115200 8N1) for uart_scrape.
# A J-Link memprobe is UNRELIABLE for this TrustZone app: a debugger `connect`
# forces VC_CORERESET, which re-runs and faults the secure-boot re-verify, so the
# diag globals read back garbage / PC=0xEFFFFFFE for BOTH genuine and tampered
# images. Scraping the free-running UART avoids halting the core entirely.
#
# This gate flashes the GENUINE merged hex (secure_boot_ns_hil.hex). Expected UART:
#   sbns: crypto ready
#   sbns: verify+enter NS      <- HIL_EXPECT (verify passed, BLXNS taken; NS runs)
# and NO "REJECTED" (a genuine image must never be denied). BLXNS leaves Secure
# state, so nothing more prints on the Secure console after "verify+enter NS".
HIL_MODE=uart_scrape
HIL_EXPECT="sbns: verify+enter NS"
HIL_EXPECT_NEGATIVE="REJECTED|panic|FAIL|HardFault"
#
# TAMPERED negative case (separate flash -- secure_boot_ns_hil_tampered.hex, one
# body byte flipped after signing): the RoT gate MUST default-deny. Expected UART:
#   sbns: crypto ready
#   sbns: verify+enter NS
#   sbns: NS REJECTED err=0x502   <- k_ra8_err_checksum_mismatch (digest pre-check)
# i.e. the tampered artifact DOES print "REJECTED" (that is its pass condition) and
# the NS world never runs.
#
# ---- SECONDARY / belt-and-suspenders: J-Link memprobe symbols ---------------
# Kept for MANUAL triage only (inert under HIL_MODE=uart_scrape). If a bench run
# can connect without disturbing the boot, these Secure .bss globals still hold the
# outcome: g_sbns_ns_alive (advances on genuine), g_sbns_denied (1 on tampered),
# g_sbns_jump_err (the denial code), g_sbns_step (progress breadcrumb).
HIL_PROBE_SYMBOL="g_sbns_ns_alive"
HIL_PROBE_MIN_ADVANCE=50
HIL_PROBE_SECONDS=3
HIL_PROBE_BOOT_S=3
HIL_PROBE_FAILURE_SYMBOL="g_sbns_denied"
HIL_PROBE_MAX_FAILURE=0
#
# Triage when the genuine gate fails (UART, or a non-disturbing J-Link halt):
#   - no "crypto ready" / g_sbns_step == 9: PSA/crypto init failed (heap/tf-psa).
#   - "NS REJECTED" / g_sbns_step == 3 / g_sbns_denied == 1: the RoT gate denied the
#     genuine image (check the NS image was SIGNED + merged -- err code is the why).
#   - "verify+enter NS" but g_sbns_ns_alive == 0: BLXNS armed but NS never ran
#     (SAU / SRAMSABAR / NS-copy problem).

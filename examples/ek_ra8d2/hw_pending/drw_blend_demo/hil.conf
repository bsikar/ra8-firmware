# DRW 2D-engine blit + alpha-blend headless CRC gate (issue #120). The demo
# composites three layers (opaque background, opaque sprite, half-transparent
# foreground via ra_drw_set_blend) into a 32x32 ARGB8888 SRAM framebuffer, then
# hashes it (FNV-1a-32) and prints the banner below once a second. No display
# panel is touched -- this is a pure compute + memory test, gateable headless.
#
# tools/board_sim models BOTH the solid fill AND the global-alpha source-over
# blend (board_periph_drw.c), so the emulated framebuffer hash equals the
# baked-in expected CRC and this gate is green on the emulator today. PENDING
# SILICON: promote out of hw_pending once the same CRC is confirmed on a real
# EK-RA8D2 (the simulator proves the driver register sequence, not the real
# D/AVE 2D engine).
HIL_MODE=uart_scrape
HIL_EXPECT="drw: blit+blend crc=47F303C5 PASS"
HIL_EXPECT_NEGATIVE="blit\+blend FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

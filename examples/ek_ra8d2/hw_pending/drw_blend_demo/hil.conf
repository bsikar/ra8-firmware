# DRW 2D-engine blit + alpha-blend headless CRC gate (issue #120). The demo
# programs three layers (opaque background, opaque sprite, half-transparent
# foreground via ra8_drw_set_blend) into a 32x32 ARGB8888 SRAM framebuffer,
# then hashes it (FNV-1a-32) and prints the banner once a second.
#
# DEMOTED FROM hw_validated -- THE ENGINE IS NOW ALIVE (#247).
#
# The old golden 76EFDDC5 was FNV-1a-32 over 4096 ZERO bytes: the D/AVE 2D
# engine had never rasterized a pixel on this silicon, so the demo hashed its
# own untouched BSS and called it PASS. Root cause found and fixed: the DRW
# lives in the graphics power domain, which PDCTRGD (HUM Ch 11.2.14 p 452)
# gates OFF at reset (value 0x81 -- PDPGSF=1, PDDE=1), and nothing had ever
# powered it on. Cancelling the DRW module-stop bit is not sufficient. HUM
# Ch 11.5.1 Table 11.7 p 480 puts DRW, GLCDC, MIPI DSI/CSI and VIN in that
# domain. ra8_drw_init now calls ra8_lpm_graphics_power_on() first.
#
# Bench evidence: DRW HWREVISION reads 0x00000000 with PDCTRGD at its 0x81
# reset value and 0x0FBE0107 once PDDE is cleared; this demo's CRC moved from
# the zero-hash 76EFDDC5 to a real rendered D44B3415.
#
# WHY STILL hw_pending: the render is not yet CORRECT. drw_fill_demo shows the
# residual precisely -- a requested 16x16 rect paints 8x8, and the requested
# 0xFF alpha reaches the framebuffer as 0x00 -- so D44B3415 is the hash of a
# known-wrong render and must NOT be pinned as a golden. board_sim also still
# models the engine inert (it cannot reproduce a render whose geometry rules
# are not yet characterised), so this app is no longer SIM == HIL and cannot
# be a green gate. Re-baseline the CRC from a real bench capture, re-enable the
# board_sim rasterizer, and promote only once fill geometry + alpha are right.
HIL_MODE=uart_scrape
HIL_EXPECT="drw: blit+blend crc="
HIL_EXPECT_NEGATIVE="blit\+blend FAIL|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=12

# Battery state-of-charge monitor over a MAX17048-class I2C fuel gauge, read
# through ra8_smbus on the IIC_B (I3C-in-I2C-mode) bus. The demo brings the
# gauge up, reads state-of-charge and charge status, and reports over the SCI8 /
# J-Link OB VCOM console. The PASS banner carries the decoded SoC and charge
# flag; without the part the bring-up NAKs and it prints
# "battery: NAK (no fuel gauge)" or "battery-monitor: FAIL init".
#
# hw_pending: ra8_emulator's modelled fuel gauge answers with a default 72% SoC (no
# CLI flag needed -- the medium is modelled internally), so the banner is
# deterministic in the simulator. The physical MAX17048 gauge is not yet on the
# bench, which is why this app lives under hw_pending/.
HIL_MODE=uart_scrape
HIL_EXPECT="battery: soc=72% chg=N PASS"
HIL_EXPECT_NEGATIVE="FAIL|NAK|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

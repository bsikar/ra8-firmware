# The Cortex-M85 brings up the micro-SD card on the native SDHI0 bus, mounts
# its FAT volume, reads txm_hello_m33.ra8app and txm_fault_m33.ra8app (copy
# zig-out/arm's files to the card root) and checks its .ra8app header, then prints the verdict on the
# SCI8 / J-Link OB VCOM console. Slice 1 of the SD hello-world PoC. Zig
# throughout. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="faulting module killed, firmware ran on PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# HIL gate for dfu_bootloader. Freshly flashed (both app slots erased), the
# boot decision finds no valid slot and enters the USB-FS DFU device. Scraping
# that banner on SCI8 validates the trigger read + slot validation + DFU
# bring-up. The jump path and the DFU-over-USB program path need a host
# (dfu-util) on a non-self-looped jack; see README "Validation".
HIL_MODE=uart_scrape
HIL_EXPECT="DFU device up on USB-FS, awaiting DFU_DNLOAD"
HIL_EXPECT_NEGATIVE="HardFault|hw_init_failed|FAIL device bring-up|TIMEOUT"
HIL_TIMEOUT_S=30

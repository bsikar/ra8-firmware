# The Cortex-M85 runs the ThreadX Module Manager, loads the hello-world module
# in place from its own MRAM and starts it, then prints the verdict on the
# SCI8 / J-Link OB VCOM console once the module's start thread has run 10
# times. Zig throughout. Stock EK-RA8D2. Not yet run on the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_manager_m85: module ran 10 times PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# Demoted from hw_validated/hil/ to hw_pending/ on 2026-05-18 because
# the firmware halts in ra_exception_halt_loop during init: under the
# previous loose alive-mode check the PC happened to land in MRAM with
# CycleCnt advancing at full clock, so the test silently passed. The
# tightened alive check (symbol-name resolution against the .elf,
# patterns panic_halt | halt_loop | exception_halt | *_Handler) now
# correctly flags it.
#
# Phase 4 commit will root-cause the halt, fix it, validate via the
# Pi-as-USB-host hil_usb_cdc_echo mode, and promote the app back.
# Until then this conf is here so `make threadx_usbx_cdc_demo` still
# builds (the build itself is fine; the firmware is broken).
HIL_MODE=alive
HIL_BOOT_S=2

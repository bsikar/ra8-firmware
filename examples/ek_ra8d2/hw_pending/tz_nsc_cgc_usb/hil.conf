# tz_nsc_cgc_usb runs the USBX CDC echo demo from the Non-Secure world,
# proving that the three NSC veneers (ra_nsc_cgc_pll2_enable,
# ra_nsc_cgc_usbfs_clock_enable, ra_nsc_cgc_get_clock_hz) in main()
# delivered correct return values from the Secure-side CGC driver
# (rather than the silent-drop failure mode that motivates this demo).
#
# The worker thread, after USBX + DCD bring-up, increments
# g_tz_nsc_cgc_usb_match on every iteration (with a k_demo_idle_ticks
# = 1 ms back-off when no host is attached, so the counter advances
# steadily even without a USB-FS host on J11).
#
# The probe asserts:
#   - g_tz_nsc_cgc_usb_match advances at least 100 times in a 3 s
#     window (~1 kHz cadence; very generous lower bound).
#   - g_tz_nsc_cgc_usb_mismatch stays at 0 (any USBX bring-up failure
#     or post-enumeration CDC read/write failure trips it).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_tz_nsc_cgc_usb_match"
HIL_PROBE_MIN_ADVANCE=100
HIL_PROBE_SECONDS=3
HIL_PROBE_FAILURE_SYMBOL="g_tz_nsc_cgc_usb_mismatch"
HIL_PROBE_MAX_FAILURE=0

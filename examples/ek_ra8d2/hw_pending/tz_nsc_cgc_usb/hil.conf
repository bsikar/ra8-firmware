# Phase A+B (#55): bench gate verifies the Secure -> Non-Secure BLXNS
# scaffold for this single-core TZ app.
#
# After the S side runs SystemInit -> ra_trustzone_init ->
# ra_tz_secure_boot_sau_init -> ra_tz_secure_boot_jump_ns, control
# lands in ns_reset_handler (NS_MRAM at 0x02080000). It zeros the
# .ns_bss region, then enters a tight loop incrementing
# g_tz_nsc_cgc_usb_ns_alive (placed in NS_SRAM via .ns_bss). The probe
# samples the counter twice across a 3 s window and asserts an advance
# of at least 100 -- only possible if the BLXNS landed and the NS code
# is executing from NS_MRAM with an NS-attributed stack.
#
# Triage when the probe fails:
#   - g_tz_nsc_cgc_usb_s_fallback_count != 0 means the S-side library
#     bailed before BLXNS (regression in TZ scaffolding, not NS code).
#   - g_tz_nsc_cgc_usb_s_fallback_count == 0 and ns_alive == 0 means
#     BLXNS faulted somewhere between launching and reaching the
#     counter loop (SAU programming bug, NS stack bug, or NS vector
#     table bug).
#
# Phase C extends this gate to exercise the original ThreadX + USBX
# app (preserved in ns_app_phase_c.c.disabled); for now we only prove
# the BLXNS scaffold.
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_tz_nsc_cgc_usb_ns_alive"
HIL_PROBE_MIN_ADVANCE=100
HIL_PROBE_SECONDS=3
HIL_PROBE_FAILURE_SYMBOL="g_tz_nsc_cgc_usb_s_fallback_count"
HIL_PROBE_MAX_FAILURE=0

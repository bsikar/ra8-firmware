HIL_MODE=uart_scrape
# eth_hal_bringup drives the two chip-generic ETH HAL primitives extracted in
# issue #581 -- ra8_eth_coma_bringup (COMA RRC/RCEC/CABPIRM out-of-reset) and
# ra8_eth_rgmii_select (ESWM MIICR1/MIIRR RGMII media-select on port 1) --
# after establishing their prerequisites (ra8_cgc_eswclk_init +
# ra8_mstp_enable(k_ra8_mstp_eswm)). Every step's ra8_err_t code is narrated;
# the fixed verdict "eth-hal: bringup PASS" prints only when all four returned
# k_ra8_ok. The negative regex trips on any step failing or a HAL init fault.
#
# hw_pending: eth is HW-blocked on this board -- the EK-RA8D2 Ethernet wire is
# marginal (#21) -- so this app is compile-gated and bench-only. It proves the
# extracted primitives compose (COMA out of reset -> media mux selects RGMII);
# it does NOT assert a link is up, which needs the corrected RGMII skew and a
# peer. The register accesses are host-tested in tests/misc/src/test_ra8_eth_coma.c and
# tests/misc/src/test_ra8_eth.c.
HIL_EXPECT="eth-hal: bringup PASS"
HIL_EXPECT_NEGATIVE="bringup FAIL|hw_init_failed|HardFault"
HIL_TIMEOUT_S=10

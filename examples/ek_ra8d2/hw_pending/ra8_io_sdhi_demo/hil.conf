# ra8_io block-device backend over the NATIVE SDHI 4-bit host controller
# (#123/#155) -- the ra8_io_blockdev_sdhi transport, distinct from the
# SD-over-SPI path its sibling ra8_io_sd_demo drives. The demo brings the card
# up on SDHI, mounts an ra8_fs volume (formatting if blank, so any card works),
# writes/reads a 512-byte file at sd:/LOGS/A.TXT, and reports over the SCI8 /
# J-Link OB VCOM console. The PASS banner is emitted only on a byte-exact
# round-trip; on init or I/O failure it prints "ra8_io_sdhi_demo: FAIL ...".
#
# hw_pending: ra8_emulator answers the SDHI block reads/writes with its modelled
# card (smoke.sh attaches a blank card via --sd-new 64:fat16), so the banner is
# deterministic in the emulator. The native SDHI socket wiring is not yet
# bench-validated, which is why this app lives under hw_pending/.
HIL_MODE=uart_scrape
HIL_EXPECT="ra8_io_sdhi_demo: sd:/LOGS/A.TXT 512 bytes PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=40

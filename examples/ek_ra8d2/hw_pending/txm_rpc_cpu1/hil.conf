# CPU1 (the Cortex-M33) runs the ThreadX Module Manager and loads a module
# that calls a service in the resident image through ra8_rpc over two ThreadX
# queues; the module checks each sum and reports it. The Cortex-M85 releases
# CPU1, waits for ten right sums and prints the first four on the SCI8 /
# J-Link OB VCOM console. Stock EK-RA8D2, no add-on hardware. Not yet run on
# the bench (hw_pending).
HIL_MODE=uart_scrape
HIL_EXPECT="txm_rpc_cpu1: add returned 101 202 303 404 PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

# Compiler offload (#149): the Cortex-M85 stages a parity .epub into shared SRAM
# and hands the full EPUB->.rabook conversion to the M33 @ 250 MHz; once the M33
# signals `done`, the M85 runs ra_book_validate over the blob AND byte-compares
# it to the desktop/M85 golden. The VCOM banner is emitted only when the
# M33-built blob is BYTE-IDENTICAL to the golden -- a blob that can only exist
# because the second core ran the compile. A mismatch traps (BKPT -> HardFault on
# silicon), so the negative regex catches it. Mirrors the verdict to the SCI8 /
# J-Link OB VCOM console for the Pi rig (no SWO / ITM capture). The M33 compile is
# the slow leg, so allow generous headroom. Stock EK-RA8D2, no add-on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="compile_on_m33: byte-identical PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=30

HIL_MODE=uart_scrape
# Tight banner: "iic_b: scan 0x43 ack=1" is 22 chars, only emitted on
# successful ack from the U15 PI4IOE5V6408 I/O expander at I2C
# address 0x43 (board UM Section 4.3.4 p 24). Failure paths emit
# "iic_b: scan 0x43 ack=0" (NAK) or "iic_b: scan ERROR" (bus fault).
HIL_EXPECT="iic_b: scan 0x43 ack=1"
HIL_EXPECT_NEGATIVE="iic_b: scan 0x43 ack=0|iic_b: scan ERROR|hw_init_failed|iic_b.*failed|HardFault"
HIL_TIMEOUT_S=10

# LVD / PVD VCC-monitor gate. PENDING SILICON: tools/board_sim shadows the
# PVD control window (PVD1CMPCR / PVD1CR0 / PVD1CR1 / PVD1SR) but does not
# model the analog voltage comparator, so PVD1SR.MON reads back 0 and the
# banner reads "lvd: pvd1 thr=2.80V mon=below ok=N" on the emulator. On a
# real EK-RA8D2 a healthy 3.3 V rail sits above the 2.80 V threshold and
# the success banner below appears once a second. Promote out of
# hw_pending once this gate is green on hardware.
HIL_MODE=uart_scrape
HIL_EXPECT="lvd: pvd1 thr=2.80V mon=above det=0 ok=Y"
HIL_EXPECT_NEGATIVE="mon=below ok=N|hw_init_failed|HardFault|TIMEOUT"
HIL_TIMEOUT_S=10

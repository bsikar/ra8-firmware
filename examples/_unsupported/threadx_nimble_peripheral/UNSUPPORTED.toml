evidence = "examples/_unsupported/threadx_nimble_peripheral/README.md"
detail = """
The RA8D2 has no on-chip BLE radio, so BLE on this board means the ESP32-C6 companion carrying the controller over the ra8_ble HCI transport seam. Only the software path (transport bridge, porting layer, GATT skeleton) is wired here; the transport underneath is itself unproven (#86, #91, #286).

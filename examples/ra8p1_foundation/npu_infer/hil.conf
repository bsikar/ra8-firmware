# npu_infer -- RA8P1 Ethos-U55 inference runtime (#228). Quantizes a float input,
# runs one NPU add-const operator awaited on the NPU completion IRQ, dequantizes
# the result, and asserts the real TFLite-micro Ethos-U operator is registered.
# Prints:
#   npu-infer: id=0x10060000 tflm=OK irq=OK out=0x........ verdict=PASS
# ra8_emulator only maps the Ethos-U55 window (0x40140000) and raises the NPU IRQ
# under --device ra8p1; on the default RA8D2 profile the NPU reads 0xFFFFFFFF and
# the app prints verdict=FAIL. So the EIL run selects the RA8P1 profile via
# HIL_EMU_ARGS. Judged by the UART verdict, not the final PC.
#
# EIL-only: there is no RA8P1 HIL rig, so this app is discovered by
# scripts/emu/eil_all.sh (ra8_emulator) but not by scripts/hil/all.sh (real board).
HIL_MODE=uart_scrape
HIL_EXPECT="verdict=PASS"
HIL_EXPECT_NEGATIVE="verdict=FAIL|tflm=FAIL|irq=FAIL|id=0xFFFFFFFF|HardFault"
HIL_TIMEOUT_S=30
HIL_EMU_ARGS="--device ra8p1"

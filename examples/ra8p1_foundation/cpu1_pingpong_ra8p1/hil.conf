# cpu1_pingpong_ra8p1 -- the RA8P1's first dual-core example (RA8FW-496). The
# Cortex-M85 releases CPU1 (the Cortex-M33), the cores trade 10 ping-pong round
# trips through shared SRAM, and the M85 prints the verdict on the console.
#
# EIL-only: there is no RA8P1 HIL rig, so this app is discovered by
# scripts/emu/eil_all.sh (ra8_emulator) but not by scripts/hil/all.sh (real board).
HIL_MODE=uart_scrape
HIL_EXPECT="cpu1_pingpong_ra8p1: 10 rounds PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15
HIL_EMU_ARGS="--device ra8p1"

# blink_ra8p1 -- RA8P1 GPIO liveness. Toggles LED1 and increments
# g_blink_ra8p1_tick on each toggle (no UART banner), so it is probed the same
# way blink is: the counter must advance. ra8_emulator emulates the RA8P1 via
# --device ra8p1 (passed through HIL_EMU_ARGS) so the run uses the RA8P1 memory
# map / option bytes rather than the RA8D2 default.
#
# EIL-only: there is no RA8P1 HIL rig, so this app is discovered by
# scripts/emu/eil_all.sh (ra8_emulator) but not by scripts/hil/all.sh (real board).
HIL_MODE=jlink_memprobe
HIL_PROBE_SYMBOL="g_blink_ra8p1_tick"
HIL_PROBE_MIN_ADVANCE=5
HIL_PROBE_SECONDS=3
HIL_EMU_ARGS="--device ra8p1"

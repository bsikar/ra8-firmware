# npu_vela -- RA8P1 Ethos-U55 Vela-blob loader end-to-end (#227). Loads a
# committed .npub model container (tools/vela/generated/ra8_npu_model_addk_sim.h)
# through ra8_npu_load(), runs it on the NPU, and prints:
#   npu-vela: id=0x........ load=OK run=OK out=0x........ verdict=PASS
# board_sim only maps the Ethos-U55 window (0x40140000) under --device ra8p1;
# on the default RA8D2 profile the NPU reads back 0xFFFFFFFF and the app prints
# verdict=FAIL. So the SIL run selects the RA8P1 profile via HIL_SIM_ARGS.
# Judged by the UART verdict, not the final PC.
#
# SIL-only: there is no RA8P1 HIL rig, so this app is discovered by
# scripts/sim/sil_all.sh (board_sim) but not by scripts/hil/all.sh (real board).
HIL_MODE=uart_scrape
HIL_EXPECT="verdict=PASS"
HIL_EXPECT_NEGATIVE="verdict=FAIL|id=0xFFFFFFFF|HardFault"
HIL_TIMEOUT_S=20
HIL_SIM_ARGS="--device ra8p1"

# npu_smoke -- RA8P1 Ethos-U55 NPU foundation (#226/#228). Runs one operator on
# the NPU and prints:
#   npu: id=0x10060000 run=OK out=0x........ verdict=PASS
# ra8_emulator only maps the Ethos-U55 window (0x40140000) under --device ra8p1;
# on the default RA8D2 profile the NPU reads back 0xFFFFFFFF and the app prints
# id=0xFFFFFFFF ... verdict=FAIL. So the EIL run selects the RA8P1 profile via
# HIL_EMU_ARGS. Judged by the UART verdict, not the final PC.
#
# EIL-only: there is no RA8P1 HIL rig, so this app is discovered by
# scripts/emu/eil_all.sh (ra8_emulator) but not by scripts/hil/all.sh (real board).
HIL_MODE=uart_scrape
HIL_EXPECT="verdict=PASS"
HIL_EXPECT_NEGATIVE="verdict=FAIL|id=0xFFFFFFFF|HardFault"
HIL_TIMEOUT_S=20
HIL_EMU_ARGS="--device ra8p1"

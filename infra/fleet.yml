---
# THE fleet declaration. One block per machine; everything else is derived.
#
# This file is the single registry of what hardware this project runs on and
# how much of each machine it is allowed to use. Adding a machine means adding
# a block here -- not writing a role, not editing an inventory, not touching a
# playbook. Retuning one means changing a number here and re-converging.
#
#   just infra::list                  what is declared, and how it is sized
#   just infra::check <name>          dry run: what would change
#   just infra::apply <name>          converge that host to this file
#   just infra::scale <name> <n>      live capacity change, drains first
#
# Everything downstream reads this file:
#   - scripts/dev/fleet.py           loader, validator, renderer, dispatcher
#   - infra/ansible/inventory/hosts.ini   GENERATED (git-ignored)
#   - ~/.ssh/ra8-fleet.config             GENERATED (`just infra::ssh_config`)
#   - the role variables each play runs with (see CLASSES in fleet.py)
#
# The full narrative -- add a host, retune a host, quiet hours, remove a host,
# and how the numbers below were arrived at -- is docs/CI_FLEET.md.
#
# Copyright (c) 2026 Brighton Sikarskie
# SPDX-License-Identifier: MIT

# --- How instance counts are decided ----------------------------------------
#
# Runner count per host is DERIVED, not guessed:
#
#     instances = min( budget.threads   / build_parallelism ,
#                      budget.memory_gb / memory_per_instance_gb )
#
# Both constants are measured properties of this tree, not preferences, and
# both are named here so a new machine is sized by plugging in two numbers
# rather than re-deriving anything:
#
#   build_parallelism      -- every heavy workflow pins its own fan-out with
#                             CMAKE_BUILD_PARALLEL_LEVEL (see
#                             scripts/ci/lib/parallelism.sh). A job therefore
#                             cannot use more than this many CPUs no matter
#                             how many it is given, so CPU beyond it per
#                             instance is bought and never spent.
#
#   memory_per_instance_gb -- clang-tidy is the memory ceiling in this tree and
#                             has been OOM-killed on an 8 GB machine. An
#                             instance that OOMs mid-job is worse than one that
#                             never existed: it presents as a flaky gate.
#
# The memory divisor is deliberately CONSERVATIVE. Container memory caps are
# ceilings, not reservations, so this protects the case where several heavy
# jobs coincide on one host rather than describing one job's typical draw --
# a full cross-build was measured peaking at 4.06 GiB RSS on win-ci, well
# inside it. If per-job peak RSS is ever measured properly and stays under the
# divisor across the whole gate set, drop the divisor and every host's
# recommended count rises with it. That is a measurement away, not a redesign.
#
# scripts/checks/check_fleet_declaration.py recomputes the formula for every
# host and FAILS when a declared count differs from it without a written
# `sizing_note:` saying why. A number nobody can re-derive is folklore.
sizing:
  build_parallelism: 4
  memory_per_instance_gb: 8

# --- The canonical runner image --------------------------------------------
#
# The ARC role builds this image once on the k3s node and atomically publishes
# its docker archive there. Plain-Docker and WSL runner hosts consume that
# exact archive; they never build an independent toolchain and never require a
# hand-copied tarball. `fleet.py apply` derives both the producer and artifact
# path from this block, and ci_runner_docker refreshes a target whenever its
# archive checksum or loaded image ID differs.
runner_image:
  source_host: k3s-pve
  image: "localhost/ra8-ci-runner:v2"
  archive: "/var/lib/rancher/k3s/agent/images/ra8-ci-runner.tar"

# --- The machines -----------------------------------------------------------
#
# `connect` is HOW TO REACH THE MACHINE, and it holds facts rather than names
# one computer happens to know:
#
#   address  an IP, or a DNS name a resolver can answer. NEVER an ~/.ssh/config
#            alias. Bare aliases are what this block used to carry, and they
#            resolved on exactly one laptop -- which had no ansible, while the
#            box that had ansible could not resolve a single fleet host. Nothing
#            was a working control node and a drained runner sat unconvergeable
#            (#526). check_fleet_declaration.py now rejects a bare label here.
#   user     the login account, if it is not the caller's own.
#   jump     an optional ProxyJump through ANOTHER HOST IN THIS FILE, named by
#            its fleet name -- so a bastion's address is also declared once.
#
# fleet.py builds every ssh and ansible invocation from these three, so all of
# it works on a machine with an empty ~/.ssh/config. `just infra::ssh_config`
# then GENERATES the friendly aliases from the same fields, which is what makes
# any machine a control node in one command instead of by hand-copying somebody
# else's private config.
#
# `class` selects the arithmetic, the plays and the variable mapping; the
# classes themselves live in CLASSES in scripts/dev/fleet.py.
#
#   arc_k8s       an ARC (Actions Runner Controller) scale set on a k8s cluster
#   docker_linux  long-lived runner containers on any plain Docker host
#   docker_wsl    the same, inside a Windows machine's WSL2 distro
#   dev_box       the shared verification box + dedicated HIL listener
#   hil_bench     the hardware-in-the-loop bench Pi (NOT a runner)
#
# A `dev_box` carrying `hil_runner:` declares its one repo-scoped native
# listener separately from scalable `runners:` capacity. The listener names
# its workflow and its `hil_bench` host so its registration labels, repository
# and remote instrument endpoint are derived rather than repeated in a role.
#
# `budget` is what CI may use of the machine, not what the machine has. Its
# `mode` picks which arithmetic applies:
#
#   reserved  the caps are real reservations the kernel enforces, so
#             instances * cpus and instances * memory_gb must FIT the budget.
#   burst     the caps are ceilings a scheduler may oversubscribe, so the
#             REQUESTS are what must fit. Only arc_k8s is honest as `burst`.
#
# `dev_slice` is the OTHER direction: what a runner host may lend back to
# agents doing verification work on it. A runner host is CI first, so the slice
# is declared as a CPU WEIGHT (it takes whatever CI is not using and yields the
# instant a job arrives) plus a HARD memory cap (memory does not yield, so it
# has to be reserved away from CI up front). It deliberately declares no thread
# count: a thread reservation would idle when CI is busy AND cap the slice when
# CI is idle, which is the opposite of what a weight buys. See docs/CI_FLEET.md
# section 9.
hosts:

  # --- VM 300 on pve1: the k3s cluster, the vault, and the ARC runner pool ---
  k3s-pve:
    class: arc_k8s
    summary: "k3s single node: ARC scale set + the OpenBao vault"
    connect:
      # The tailnet address, not the 192.168.1.221 LAN one: this VM IS the
      # tailnet's 100.64.0.1, so the tailnet address answers from every control
      # node while the LAN address answers only from inside the house.
      address: 100.64.0.1
      user: ubuntu
    # Two plays, in order: the cluster and vault first, the runner pool into
    # it. `just infra::apply HOST=k3s-pve` runs both; PLAY=<name> runs one.
    provisions: [k3s-node, ci-runner]
    runners:
      instances: 6
      cpus: 4
      memory_gb: 12
      cpu_request: 1
      memory_request_gb: 2
      labels: [ra8-ci]
    budget:
      mode: burst
      # 16 allocatable cores; the owner's homelab in the other namespaces sits
      # at ~6.8 requested cores steady-state, so ~9 is what CI may request
      # without running the node to its scheduling limit on every push.
      threads: 9
      memory_gb: 40
    sizing_note: >-
      The formula sizes an INSTANCE, and here an instance is a pod: 4 CPU and
      12 GiB per pod is exactly min(4/4, 12/8) = 1 job's worth, which is the
      shape the formula asks for. The COUNT is bounded by the node instead --
      6 pods request 6 of the ~9 schedulable cores. It is deliberately not
      raised toward the node's full 16: this is a guest on a 10-core/16-thread
      i5-12600K it shares with the dev box (28 vCPU committed on a 16-thread
      part before anything runs), so extra pods add contention rather than
      throughput. Real capacity comes from hosts that are not pve1.

  # --- The NAS: a plain Docker host that is otherwise idle -------------------
  truenas:
    class: docker_linux
    summary: "TrueNAS SCALE: runner containers on the stripe pool"
    connect:
      # The 10.10.10.0/29 link it shares with the k3s VM, verified reachable
      # from both the Mac and the dev box; its 192.168.1.95 LAN address is not.
      address: 10.10.10.1
      user: truenas_admin
    provisions: [ci-runner-docker]
    runners:
      # Base name for the GitHub registrations. One instance keeps the base
      # unsuffixed; above one they become <base>-1..<base>-N -- so this base
      # keeps instance 1 registered as `truenas-ci-1`, the name that was
      # already in the pool, and adds `truenas-ci-2` beside it.
      name: truenas-ci
      # TWO, from the formula rather than from the previous hand-written 1:
      # min(8/4, 16/8) = 2. The host's total CI footprint is unchanged -- the
      # same 8 threads and 16 GiB it always reserved -- but split into two
      # runners instead of one, because queue depth is the fleet's bottleneck
      # and a single runner leaves half of a reserved budget idle whenever one
      # job is all it can hold.
      instances: 2
      cpus: 4
      memory_gb: 8
      # Each instance sees only its own 4 threads, so Just's exported CMake job limit
      # it is right by construction instead of fanning out over the host.
      pin_cpus: true
      labels: [ra8-ci, ra8-nas]
    budget:
      mode: reserved
      # 6-core / 12-thread i5-10400 whose day job is serving files. 8 of 12
      # threads is 4 physical cores plus their SMT siblings; the remaining 4
      # stay free for SMB/NFS, the ZFS transaction groups and the middleware.
      threads: 8
      # 62 GiB installed, ~34 GiB of it ZFS ARC. The ARC shrinks under
      # pressure down to arc_min, so it yields to the runners and grows back;
      # leaving 46 GiB outside the cap keeps that yielding rare.
      memory_gb: 16

  # --- The Windows workstation: the fastest host in the fleet ----------------
  win-ci:
    class: docker_wsl
    summary: "Ryzen 9 7900X, Windows 11 + WSL2: the fleet's fastest host"
    connect:
      # No SSH daemon inside WSL, and giving a personal daily-driver machine
      # one (plus the inbound firewall hole to reach it) is not a reasonable
      # ask. fleet.py copies the play in over this path and runs it inside the
      # distro with --connection=local. See docs/CI_FLEET.md.
      #
      # 10.0.40.103 is on the isolated bench LAN, so the hop is the bench Pi --
      # named as the fleet host `star`, whose own address is declared once,
      # below, rather than repeated here.
      address: 10.0.40.103
      user: sikar
      jump: star
      distro: Ubuntu
      windows_user: sikar
    provisions: [wsl-ci-host]
    runners:
      # min(22/4, 26/8) = min(5, 3) = 3. Memory is the binding constraint;
      # cores would divide fine at four. Do not go to four until clang-tidy is
      # sharded and per-shard peak memory has been re-measured.
      instances: 3
      cpus: 7
      # 7, not the 8.7 the division allows, so that 5 GiB of the VM stays
      # outside the runners' reservation. That 5 GiB was originally held for
      # the CUDA co-tenant of the Ethos-U55 / NPU work (#228); the owner has
      # released it while that work is months out, and it is now the
      # `dev_slice` below. It returns to #228 by deleting that block.
      memory_gb: 7
      pin_cpus: true
      labels: [ra8-ci, ra8-win]
    budget:
      mode: reserved
      # These two ARE the WSL2 VM caps -- 22 of 24 threads and 26 of 31 GiB,
      # leaving ~2 threads and ~5 GiB for an idle Windows desktop. They are
      # declared once, here, and written into .wslconfig from this file.
      #
      # Changing either needs `wsl --shutdown` to take effect, which stops
      # every distro on the machine; the tooling reports that and refuses to
      # do it behind the owner's back. See docs/CI_FLEET.md.
      threads: 22
      memory_gb: 26
      swap_gb: 8
    # Quiet hours: the machine is the owner's gaming PC as well as the fleet's
    # fastest builder, so CI stands down on request rather than competing.
    #
    # Scaling down DRAINS: an instance is stopped only once it is idle, never
    # signalled while it holds a job. A `docker stop` on a busy runner cancels
    # that job (actions/runner cancels the in-flight job on SIGTERM), which is
    # the orphaned-job failure this fleet has already seen once.
    #
    # THESE HOURS ARE A PLACEHOLDER, and deliberately a live one: weekend
    # evenings are a guess at when this machine is wanted for something other
    # than CI. Change the two lines below and re-run
    # `just infra::apply win-ci "" capacity` -- that path
    # touches no container and costs the host no runner time. Delete the block
    # entirely and the same command removes the timer.
    quiet_hours:
      window: "18:00-23:59"
      days: "Fri,Sat,Sun"
      instances: 0
    # The other half of the machine's job: a SECOND verification host, so an
    # agent can get a workspace and run gates here the way they do on the dev
    # box, without CI ever noticing.
    #
    # CPU is a WEIGHT, not a quota or a cpuset. The runner containers are
    # Docker's default parent (system.slice, systemd's default CPUWeight=100);
    # this slice sits beside it at 10, so dev work gets ~1/11 of any thread a
    # runner is contending for and 100% of every thread no runner is using. It
    # yields within a scheduling period of a job arriving, with nothing to
    # schedule and nothing to remember.
    #
    # MEMORY is the opposite and has to be a hard wall, because memory does not
    # yield: a page a dev build holds is a page a clang-tidy job cannot have.
    # 5 GiB is exactly what the runners' 3 x 7 GiB leaves of the 26 GiB VM cap,
    # so the arithmetic is closed -- the fleet-declaration gate fails this
    # block if the two ever stop summing to the budget.
    #
    # swap_gb is deliberately non-zero where the runners' is zero, and it earns
    # its place: a full `just ci` in this slice REACHES the 5 GiB wall and
    # stays there (98405 memory.max events in one 20-minute run) with
    # oom_kill 0 -- swap is what turned that into a slow run instead of a dead
    # one. A runner that swaps is a job that has silently become an order of
    # magnitude slower and presents as a timeout; a dev gate run that swaps is
    # just slow, and slow beats losing an agent's whole suite.
    #
    # max_jobs bounds every gate's parallel width (RA8_MAX_JOBS +
    # CMAKE_BUILD_PARALLEL_LEVEL). It is a MEMORY bound wearing a CPU hat:
    # nothing here needs to cap CPU -- that is what the weight is for -- but a
    # 22-wide compile does not fit under a 5 GiB cap. 6 rather than something
    # smaller because it was measured: halving it to 3 changed a co-tenant CI
    # job's time by nothing measurable (the residual cost is SMT siblings and
    # shared cache, which no scheduler knob reaches), so the smaller number
    # would have bought CI nothing and cost dev half its throughput.
    dev_slice:
      cpu_weight: 10
      memory_gb: 5
      swap_gb: 3
      max_jobs: 6
    sizing_note: >-
      Per-instance memory is 7 GB where the formula's divisor is 8. The count
      is the formula's -- min(22/4, 26/8) = 3 -- but each instance is given
      one GB less than the division allows, so that 5 GB of the 26 GB VM cap
      stays outside the runners' reservation. That 5 GB was first held for the
      CUDA co-tenant of the Ethos-U55 / NPU work (#228); with that work months
      out the owner released it, and it is now the dev_slice above -- the
      machine's second job as a verification host. It goes back to #228 by
      deleting that block, which is why the number lives in one place rather
      than being described here. The divisor is a conservative ceiling rather
      than a measured per-job draw: a full cross-build peaked at 4.06 GiB RSS
      on this host and an idle listener holds ~95 MiB, so 7 GB has real
      headroom over anything measured here. If clang-tidy is ever measured
      above 7 GB on this machine, drop to two instances or raise the VM cap --
      do not let a job OOM, which presents as a flaky gate rather than as the
      capacity fault it is.

  # --- CT 107 on pve1: verification box + dedicated HIL listener -------------
  dev:
    class: dev_box
    summary: "shared verification box and dedicated native HIL listener"
    connect:
      address: 100.64.0.9
      user: bsikar
    provisions: [dev-box]
    hil_runner:
      name: dev-hil
      repository: "https://github.com/bsikar/ra8-firmware"
      labels: [hil, ra8d2]
      workflow: .github/workflows/hil.yml
      bench:
        host: star
        aliases: [star.local]

  # --- The bench Pi: hardware-in-the-loop (not a runner) ---------------------
  star:
    class: hil_bench
    summary: "Raspberry Pi 5: EK-RA8D2, J-Link, ESP32-C6, AD2, smart plugs"
    # One authority for the physical board-facing port. Both the hil_bench
    # role and the dev-box-installed root-helper policy derive from this exact
    # identity; a replacement or recabled NIC requires a reviewed fleet edit.
    board_interface:
      name: eth0
      mac: "2c:cf:67:4d:04:87"
      sysfs_device: "/sys/devices/platform/axi/1000120000.pcie/1f00100000.ethernet"
      phc_index: 0
    connect:
      # Tailnet, not the wlan0 DHCP lease: the LAN address moves, and this is
      # also win-ci's jump host, so a stale one breaks two machines.
      address: 100.64.0.6
      user: star
    provisions: [hil-bench]

---
# THE fleet declaration. One block per machine; everything else is derived.
#
# This file is the single registry of what hardware this project runs on.
# Adding a machine means adding a block here -- not writing a role, not editing
# an inventory, not touching a playbook. Retuning one means changing it here
# and re-converging.
#
#   just infra::list                  what is declared, and what each host runs
#   just infra::check <name>          dry run: what would change
#   just infra::apply <name>          converge that host to this file
#
# Everything downstream reads this file:
#   - scripts/dev/fleet.py           loader, validator, renderer, dispatcher
#   - infra/ansible/inventory/hosts.ini   GENERATED (git-ignored)
#   - ~/.ssh/ra8-fleet.config             GENERATED (`just infra::ssh_config`)
#   - the role variables each play runs with (see scripts/dev/fleet_model.py)
#
# The full narrative -- add a host, retune a host, remove a host -- is
# docs/CI_FLEET.md.
#
# Copyright (c) 2026 Brighton Sikarskie
# SPDX-License-Identifier: MIT

# --- The machines -----------------------------------------------------------
#
# `connect` is HOW TO REACH THE MACHINE, and it holds facts rather than names
# one computer happens to know:
#
#   address  an IP, or a DNS name a resolver can answer. NEVER an ~/.ssh/config
#            alias. Bare aliases are what this block used to carry, and they
#            resolved on exactly one laptop -- which had no ansible, while the
#            box that had ansible could not resolve a single fleet host. Nothing
#            was a working control node.
# check_fleet_declaration.py now rejects a bare label here.
#   user     the login account, if it is not the caller's own.
#   jump     an optional ProxyJump through ANOTHER HOST IN THIS FILE, named by
#            its fleet name -- so a bastion's address is also declared once.
#
# fleet.py builds every ssh and ansible invocation from these three, so all of
# it works on a machine with an empty ~/.ssh/config. `just infra::ssh_config`
# then GENERATES the friendly aliases from the same fields, which is what makes
# any machine a control node in one command instead of by hand-copying somebody
# else's private config.
#
# `class` selects the plays and the variable mapping; the classes themselves
# live in CLASSES in scripts/dev/fleet_runner_model.py.
#
#   k8s_node      the single-node k3s cluster that hosts the OpenBao vault
#   dev_box       the shared verification box + dedicated HIL listener
#   hil_bench     the hardware-in-the-loop bench Pi
#
# There is no runner pool: no host may declare `runners:`, `budget:` or
# `quiet_hours:`. A `dev_box` carrying `hil_runner:` declares its one
# repo-scoped native listener and names its `hil_bench` host, so its
# registration labels, repository and remote instrument endpoint are derived
# rather than repeated in a role.

hosts:

  # --- VM 300 on pve1: the k3s cluster and the vault -------------------------
  k3s-pve:
    class: k8s_node
    summary: "k3s single node: the OpenBao vault"
    connect:
      # Routable control-plane endpoint; do not duplicate alternate private
      # endpoints in repository documentation.
      address: 100.64.0.1
      user: ubuntu
    provisions: [k3s-node]

  # --- CT 107 on pve1: verification box + dedicated HIL listener -------------
  dev:
    class: dev_box
    summary: "shared verification box and dedicated native HIL listener"
    connect:
      address: 100.64.0.9
      user: bsikar
    provisions: [dev-box]
    hil_runner:
      name: dev-hil
      repository: "https://github.com/bsikar/ra8-firmware"
      labels: [hil, ra8d2]
      bench:
        host: star
        aliases: [star.local]

  # --- The bench Pi: hardware-in-the-loop (not a runner) ---------------------
  star:
    class: hil_bench
    summary: "Raspberry Pi 5: EK-RA8D2, J-Link, ESP32-C6, AD2, smart plugs"
    # One authority for the physical board-facing port. Both the hil_bench
    # role and the dev-box-installed root-helper policy derive from this exact
    # identity; a replacement or recabled NIC requires a reviewed fleet edit.
    board_interface:
      name: eth0
      mac: "2c:cf:67:4d:04:87"
      sysfs_device: "/sys/devices/platform/axi/1000120000.pcie/1f00100000.ethernet"
      phc_index: 0
    connect:
      # Tailnet, not the wlan0 DHCP lease: the LAN address moves.
      address: 100.64.0.6
      user: star
    provisions: [hil-bench]

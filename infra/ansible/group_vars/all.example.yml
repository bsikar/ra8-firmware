---
# Copy to group_vars/all.yml (git-ignored) and set the real values there.
#
# Secrets are pulled from OpenBao at run time -- never written to this repo.
# Requires the community.hashi_vault collection and BAO_ADDR + a token (or
# other auth) in the environment. Example shape for one secret:
#
# example_secret: >-
#   {{ lookup('community.hashi_vault.vault_kv2_get',
#             'ra8/example',
#             engine_mount_point='secret').secret.value }}

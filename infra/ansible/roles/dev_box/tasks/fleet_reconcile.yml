---
# Install a root-owned control snapshot and periodic service. Activation retains
# the exact last-good source and units until the replacement timer is proven.

- name: Read the exact staged-source archive digest
  become: true
  ansible.builtin.stat:
    path: "{{ dev_box_context_archive }}"
    checksum_algorithm: sha256
    get_checksum: true
    follow: false
  register: dev_box_reconcile_archive
  check_mode: false

- name: Inspect the reconciliation authority root
  become: true
  ansible.builtin.stat:
    path: "{{ dev_box_reconcile_root }}"
    follow: false
  register: dev_box_reconcile_root_status
  check_mode: false

- name: Remove an unsafe non-directory reconciliation authority root
  when:
    - dev_box_reconcile_root_status.stat.exists | default(false)
    - >-
      dev_box_reconcile_root_status.stat.islnk | default(false)
      or not (dev_box_reconcile_root_status.stat.isdir | default(false))
  become: true
  ansible.builtin.file:
    path: "{{ dev_box_reconcile_root }}"
    state: absent

- name: Converge the reconciliation authority root
  when: >-
    not ansible_check_mode
    or not (dev_box_reconcile_root_status.stat.exists | default(false))
    or (dev_box_reconcile_root_status.stat.isdir | default(false)
        and not (dev_box_reconcile_root_status.stat.islnk | default(false)))
  become: true
  ansible.builtin.file:
    path: "{{ dev_box_reconcile_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Recover the sole last-good source before inspecting freshness
  when: not ansible_check_mode
  become: true
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      current={{ dev_box_reconcile_source | quote }}
      previous={{ (dev_box_reconcile_source ~ '.previous') | quote }}
      marker="$previous/.ra8-source-sha256"
      if [[ ! -e "$current" && ! -L "$current" && ( -e "$previous" || -L "$previous" ) ]]; then
        [[ -d "$previous" && ! -L "$previous" ]]
        [[ "$(readlink -f -- "$previous")" == "$previous" ]]
        [[ "$(stat -c '%u:%g:%a' -- "$previous")" == 0:0:755 ]]
        [[ -f "$marker" && ! -L "$marker" ]]
        [[ "$(readlink -f -- "$marker")" == "$marker" ]]
        [[ "$(stat -c '%u:%g:%a' -- "$marker")" == 0:0:444 ]]
        [[ "$(cat -- "$marker")" =~ ^[0-9a-f]{64}$ ]]
        mv -- "$previous" "$current"
        printf 'recovered\n'
      fi
  register: dev_box_reconcile_recovery
  changed_when: "'recovered' in dev_box_reconcile_recovery.stdout"

- name: Inspect reconciliation runtime paths
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ dev_box_reconcile_state }}"
    - "{{ dev_box_reconcile_state }}/ansible-local"
    - "{{ dev_box_reconcile_state }}/control"
    - "{{ dev_box_reconcile_state }}/inventory"
    - "{{ dev_box_home }}/.local/state/ra8-fleet-mutation"
  register: dev_box_reconcile_runtime_status
  check_mode: false

- name: Remove unsafe non-directory reconciliation runtime paths
  when:
    - item.stat.exists | default(false)
    - item.stat.islnk | default(false) or not (item.stat.isdir | default(false))
  become: true
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ dev_box_reconcile_runtime_status.results }}"

- name: Converge private reconciliation runtime paths on every apply
  when: >-
    not ansible_check_mode
    or not (item.stat.exists | default(false))
    or (item.stat.isdir | default(false)
        and not (item.stat.islnk | default(false)))
  become: true
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ dev_box_user }}"
    group: "{{ dev_box_user }}"
    mode: "0700"
  loop: "{{ dev_box_reconcile_runtime_status.results }}"
- name: Bind runtime host variables to the immutable reconciliation source
  when: not ansible_check_mode
  become: true
  ansible.builtin.file:
    src: "{{ dev_box_reconcile_source }}/infra/ansible/inventory/host_vars"
    dest: "{{ dev_box_reconcile_state }}/inventory/host_vars"
    state: link
    owner: "{{ dev_box_user }}"
    group: "{{ dev_box_user }}"
    force: true


- name: Inspect the installed reconciliation source root
  become: true
  ansible.builtin.stat:
    path: "{{ dev_box_reconcile_source }}"
    follow: false
  register: dev_box_reconcile_source_status
  check_mode: false

- name: Inspect the installed reconciliation source digest
  become: true
  ansible.builtin.stat:
    path: "{{ dev_box_reconcile_source }}/.ra8-source-sha256"
    follow: false
  register: dev_box_reconcile_marker
  check_mode: false

- name: Resolve the installed reconciliation source root
  become: true
  ansible.builtin.command:
    argv: [/usr/bin/realpath, --canonicalize-existing, --, "{{ dev_box_reconcile_source }}"]
  register: dev_box_reconcile_source_realpath
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve the installed reconciliation source digest
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - --canonicalize-existing
      - --
      - "{{ dev_box_reconcile_source }}/.ra8-source-sha256"
  register: dev_box_reconcile_marker_realpath
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the installed reconciliation source digest
  when:
    - dev_box_reconcile_marker.stat.isreg | default(false)
    - not (dev_box_reconcile_marker.stat.islnk | default(false))
  become: true
  ansible.builtin.slurp:
    src: "{{ dev_box_reconcile_source }}/.ra8-source-sha256"
  register: dev_box_reconcile_marker_content
  check_mode: false

- name: Authenticate the installed reconciliation source metadata
  ansible.builtin.set_fact:
    dev_box_reconcile_installed_safe: >-
      {{ (dev_box_reconcile_source_status.stat.isdir | default(false))
         and not (dev_box_reconcile_source_status.stat.islnk | default(false))
         and (dev_box_reconcile_source_status.stat.uid | default(-1)) == 0
         and (dev_box_reconcile_source_status.stat.gid | default(-1)) == 0
         and (dev_box_reconcile_source_status.stat.mode | default('')) == '0755'
         and dev_box_reconcile_source_realpath.rc == 0
         and dev_box_reconcile_source_realpath.stdout == dev_box_reconcile_source
         and (dev_box_reconcile_marker.stat.isreg | default(false))
         and not (dev_box_reconcile_marker.stat.islnk | default(false))
         and (dev_box_reconcile_marker.stat.uid | default(-1)) == 0
         and (dev_box_reconcile_marker.stat.gid | default(-1)) == 0
         and (dev_box_reconcile_marker.stat.mode | default('')) == '0444'
         and dev_box_reconcile_marker_realpath.rc == 0
         and dev_box_reconcile_marker_realpath.stdout
             == dev_box_reconcile_source ~ '/.ra8-source-sha256'
         and (dev_box_reconcile_marker_content.content
              | default('') | b64decode | trim)
             is match('^[0-9a-f]{64}$') }}

- name: Decide whether the trusted reconciliation snapshot is stale
  ansible.builtin.set_fact:
    dev_box_reconcile_source_stale: >-
      {{ not dev_box_reconcile_installed_safe
         or (dev_box_reconcile_marker_content.content
             | default('') | b64decode | trim)
            != dev_box_reconcile_archive.stat.checksum }}

- name: Report a reconciliation snapshot refresh in check mode
  when: [ansible_check_mode, dev_box_reconcile_source_stale]
  ansible.builtin.debug:
    msg: The trusted runner-reconciliation snapshot requires an authenticated refresh.
  changed_when: true

- name: Stage and prove a reconciliation candidate
  when: [not ansible_check_mode, dev_box_reconcile_source_stale]
  block:
    - name: Replace any abandoned reconciliation candidate
      become: true
      ansible.builtin.file:
        path: "{{ dev_box_reconcile_source }}.candidate"
        state: absent
    - name: Create the reconciliation candidate root
      become: true
      ansible.builtin.file:
        path: "{{ dev_box_reconcile_source }}.candidate"
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Extract the exact reconciliation candidate
      become: true
      ansible.builtin.unarchive:
        src: "{{ dev_box_context_archive }}"
        dest: "{{ dev_box_reconcile_source }}.candidate"
        remote_src: true
    - name: Prove every extracted source member
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ dev_box_context_helper_active_entrypoint }}"
          - verify
          - --archive
          - "{{ dev_box_context_archive }}"
          - --directory
          - "{{ dev_box_reconcile_source }}.candidate"
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
    - name: Bind the candidate to its source archive
      become: true
      ansible.builtin.copy:
        dest: "{{ dev_box_reconcile_source }}.candidate/.ra8-source-sha256"
        owner: root
        group: root
        mode: "0444"
        content: "{{ dev_box_reconcile_archive.stat.checksum }}\n"
    - name: Synchronize the candidate locked Python environment
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - "UV_PROJECT_ENVIRONMENT={{ dev_box_reconcile_source }}.candidate/.venv"
          - UV_PYTHON_DOWNLOADS=never
          - /usr/bin/python3
          - -B
          - -I
          - -S
          - "{{ dev_box_reconcile_source }}.candidate/scripts/dev/bootstrap_uv.py"
          - --cache-root
          - "{{ dev_box_reconcile_source }}.candidate/.tools/uv"
          - --ensure-and-run
          - --no-config
          - --directory
          - "{{ dev_box_reconcile_source }}.candidate"
          - sync
          - --locked
          - --only-group
          - infra
          - --no-install-project
          - --python
          - /usr/bin/python3
      changed_when: true
    - name: Prove the synchronized candidate Python environment
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - "UV_PROJECT_ENVIRONMENT={{ dev_box_reconcile_source }}.candidate/.venv"
          - UV_PYTHON_DOWNLOADS=never
          - /usr/bin/python3
          - -B
          - -I
          - -S
          - "{{ dev_box_reconcile_source }}.candidate/scripts/dev/bootstrap_uv.py"
          - --cache-root
          - "{{ dev_box_reconcile_source }}.candidate/.tools/uv"
          - --run
          - --no-config
          - --directory
          - "{{ dev_box_reconcile_source }}.candidate"
          - sync
          - --locked
          - --only-group
          - infra
          - --no-install-project
          - --python
          - /usr/bin/python3
          - --check
      changed_when: false
    - name: Synchronize the candidate Galaxy collection set
      become: true
      ansible.builtin.command:
        argv: [/bin/bash, -p, scripts/dev/setup_ansible.sh]
        chdir: "{{ dev_box_reconcile_source }}.candidate"
      changed_when: true
    - name: Expose the candidate collection root read-only to the service account
      become: true
      ansible.builtin.file:
        path: "{{ dev_box_reconcile_source }}.candidate/.ansible/collections"
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Read the synchronized candidate Galaxy collection set
      become: true
      become_user: "{{ dev_box_user }}"
      ansible.builtin.command:
        argv:
          - "{{ dev_box_reconcile_source }}.candidate/.venv/bin/python3"
          - -m
          - ansible.cli.galaxy
          - collection
          - list
          - --format
          - json
        chdir: "{{ dev_box_reconcile_source }}.candidate"
      environment:
        ANSIBLE_COLLECTIONS_PATH: "{{ dev_box_reconcile_source }}.candidate/.ansible/collections"
      register: dev_box_reconcile_galaxy_list
      changed_when: false
    - name: Prove the synchronized candidate Galaxy collection set
      become: true
      become_user: "{{ dev_box_user }}"
      ansible.builtin.command:
        argv:
          - "{{ dev_box_reconcile_source }}.candidate/.venv/bin/python3"
          - "{{ dev_box_reconcile_source }}.candidate/scripts/checks/check_ansible_collections.py"
          - --stdin
          - --root
          - "{{ dev_box_reconcile_source }}.candidate/.ansible/collections"
        chdir: "{{ dev_box_reconcile_source }}.candidate"
        stdin: "{{ dev_box_reconcile_galaxy_list.stdout }}"
      changed_when: false
    - name: Render the candidate declared inventory
      become: true
      become_user: "{{ dev_box_user }}"
      ansible.builtin.command:
        argv:
          - "{{ dev_box_reconcile_source }}.candidate/.venv/bin/python3"
          - -I
          - scripts/dev/fleet.py
          - inventory
          - --stdout
        chdir: "{{ dev_box_reconcile_source }}.candidate"
      changed_when: false
    - name: Prove the candidate reconciliation controller
      become: true
      become_user: "{{ dev_box_user }}"
      ansible.builtin.command:
        argv:
          - "{{ dev_box_reconcile_source }}.candidate/.venv/bin/python3"
          - -I
          - "{{ dev_box_reconcile_source }}.candidate/scripts/dev/fleet_reconcile.py"
          - --selftest
      changed_when: false
  rescue:
    - name: Remove a failed reconciliation candidate
      become: true
      ansible.builtin.file:
        path: "{{ dev_box_reconcile_source }}.candidate"
        state: absent
    - name: Fail after preserving the active reconciliation controller
      ansible.builtin.fail:
        msg: Reconciliation candidate validation failed; active generation retained.

- name: Recreate the staged reconciliation unit set
  when: not ansible_check_mode
  become: true
  ansible.builtin.file:
    path: "{{ dev_box_reconcile_root }}/unit-candidate"
    state: "{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: [absent, directory]

- name: Render the candidate reconciliation unit set
  when: not ansible_check_mode
  become: true
  ansible.builtin.copy:
    dest: "{{ dev_box_reconcile_root }}/unit-candidate/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: "{{ dev_box_reconcile_unit }}.service"
      content: |
        # Managed by the dev_box Ansible role.
        [Unit]
        Description=Converge the RA8 ordinary GitHub runner fleet
        After=network-online.target
        Wants=network-online.target
        [Service]
        Type=oneshot
        User={{ dev_box_user }}
        Group={{ dev_box_user }}
        WorkingDirectory={{ dev_box_reconcile_source }}
        Environment=HOME={{ dev_box_home }}
        Environment=PYTHONNOUSERSITE=1
        Environment=ANSIBLE_LOCAL_TEMP={{ dev_box_reconcile_state }}/ansible-local
        Environment=ANSIBLE_SSH_CONTROL_PATH_DIR={{ dev_box_reconcile_state }}/control
        UMask=0077
        Environment=RA8_FLEET_INVENTORY={{ dev_box_reconcile_state }}/inventory/hosts.ini
        ExecStart=/usr/bin/env {{ dev_box_reconcile_source }}/.venv/bin/python3 \
          -I {{ dev_box_reconcile_source }}/scripts/dev/fleet_reconcile.py \
          --require-installed-authority --mode apply \
          --state-dir {{ dev_box_reconcile_state }} \
          --full-interval {{ dev_box_reconcile_full_interval_seconds }} \
          --producer-interval {{ dev_box_reconcile_producer_interval_seconds }}
        TimeoutStartSec=infinity
        KillMode=mixed
        TimeoutStopSec=2h
        NoNewPrivileges=true
        PrivateTmp=true
        PrivateDevices=true
        ProtectSystem=strict
        ProtectHome=read-only
        ReadWritePaths={{ dev_box_reconcile_state }}
        ReadWritePaths={{ dev_box_home }}/.local/state/ra8-fleet-mutation
    - name: "{{ dev_box_reconcile_unit }}.timer"
      content: |
        # Managed by the dev_box Ansible role.
        [Unit]
        Description=Periodically converge the RA8 ordinary GitHub runner fleet
        [Timer]
        OnBootSec=20min
        OnUnitActiveSec={{ dev_box_reconcile_interval }}
        RandomizedDelaySec={{ dev_box_reconcile_random_delay }}
        Persistent=true
        [Install]
        WantedBy=timers.target

- name: Validate the staged reconciliation unit set
  when: not ansible_check_mode
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - verify
      - "{{ dev_box_reconcile_root }}/unit-candidate/{{ dev_box_reconcile_unit }}.service"
      - "{{ dev_box_reconcile_root }}/unit-candidate/{{ dev_box_reconcile_unit }}.timer"
  changed_when: false

- name: Inspect the live reconciliation unit set
  when: not ansible_check_mode
  become: true
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
    follow: false
  loop: ["{{ dev_box_reconcile_unit }}.service", "{{ dev_box_reconcile_unit }}.timer"]
  register: dev_box_reconcile_live_units

- name: Activate the fully proven reconciliation generation
  when: [not ansible_check_mode, dev_box_reconcile_source_stale]
  block:
    - name: Stop reconciliation only at the activation boundary
      become: true
      ansible.builtin.command:
        argv: [systemctl, stop, "{{ item }}"]
      loop: ["{{ dev_box_reconcile_unit }}.timer", "{{ dev_box_reconcile_unit }}.service"]
      register: dev_box_reconcile_stop
      changed_when: dev_box_reconcile_stop.rc == 0
      failed_when: dev_box_reconcile_stop.rc not in [0, 5]
    - name: Recreate the last-good unit backup directory
      become: true
      ansible.builtin.file:
        path: "{{ dev_box_reconcile_root }}/unit-previous"
        state: "{{ item }}"
        owner: root
        group: root
        mode: "0700"
      loop: [absent, directory]
    - name: Preserve each safe last-good unit
      when:
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))
        - (item.stat.uid | default(-1)) == 0
        - (item.stat.gid | default(-1)) == 0
        - (item.stat.mode | default('')) == '0644'
      become: true
      ansible.builtin.copy:
        src: "/etc/systemd/system/{{ item.item }}"
        dest: "{{ dev_box_reconcile_root }}/unit-previous/{{ item.item | basename }}"
        remote_src: true
      loop: "{{ dev_box_reconcile_live_units.results }}"
    - name: Switch source while retaining exactly one recovery generation
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          current={{ dev_box_reconcile_source | quote }}
          candidate={{ (dev_box_reconcile_source ~ '.candidate') | quote }}
          previous={{ (dev_box_reconcile_source ~ '.previous') | quote }}
          failed={{ (dev_box_reconcile_source ~ '.failed') | quote }}
          [[ -d "$candidate" && ! -L "$candidate" ]]
          rm -rf --one-file-system -- "$failed"
          if [[ -e "$current" || -L "$current" ]]; then
            if {{ dev_box_reconcile_installed_safe | bool | lower }}; then
              if [[ -e "$previous" || -L "$previous" ]]; then
                rm -rf --one-file-system -- "$previous"
              fi
              mv -- "$current" "$previous"
            else
              mv -- "$current" "$failed"
            fi
          fi
          mv -- "$candidate" "$current"
      changed_when: true
    - name: Install the proven reconciliation unit set
      become: true
      ansible.builtin.copy:
        src: "{{ dev_box_reconcile_root }}/unit-candidate/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: ["{{ dev_box_reconcile_unit }}.service", "{{ dev_box_reconcile_unit }}.timer"]
    - name: Start reconciliation from the activated generation
      become: true
      ansible.builtin.systemd_service:
        name: "{{ dev_box_reconcile_unit }}.timer"
        enabled: true
        state: started
        daemon_reload: true
    - name: Verify the activated reconciliation generation is scheduled
      become: true
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ dev_box_reconcile_unit }}.timer"]
      changed_when: false
    - name: Retire recovery artifacts only after the timer is proven
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dev_box_reconcile_source }}.previous"
        - "{{ dev_box_reconcile_source }}.failed"
        - "{{ dev_box_reconcile_root }}/unit-previous"
  rescue:
    - name: Restore the exact last-good source after post-switch failure
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          current={{ dev_box_reconcile_source | quote }}
          previous={{ (dev_box_reconcile_source ~ '.previous') | quote }}
          failed={{ (dev_box_reconcile_source ~ '.failed') | quote }}
          marker="$previous/.ra8-source-sha256"
          if [[ -d "$previous" && ! -L "$previous" ]] \
              && [[ "$(readlink -f -- "$previous")" == "$previous" ]] \
              && [[ "$(stat -c '%u:%g:%a' -- "$previous")" == 0:0:755 ]] \
              && [[ -f "$marker" && ! -L "$marker" ]] \
              && [[ "$(readlink -f -- "$marker")" == "$marker" ]] \
              && [[ "$(stat -c '%u:%g:%a' -- "$marker")" == 0:0:444 ]] \
              && [[ "$(cat -- "$marker")" =~ ^[0-9a-f]{64}$ ]]; then
            rm -rf --one-file-system -- "$failed"
            if [[ -e "$current" || -L "$current" ]]; then
              mv -- "$current" "$failed"
            fi
            mv -- "$previous" "$current"
            printf 'restored\n'
          fi
      register: dev_box_reconcile_source_restore
      changed_when: "'restored' in dev_box_reconcile_source_restore.stdout"
    - name: Remove candidate units before restoring the last-good set
      when: "'restored' in dev_box_reconcile_source_restore.stdout"
      become: true
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: ["{{ dev_box_reconcile_unit }}.service", "{{ dev_box_reconcile_unit }}.timer"]
    - name: Restore each preserved last-good unit
      when:
        - "'restored' in dev_box_reconcile_source_restore.stdout"
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))
        - (item.stat.uid | default(-1)) == 0
        - (item.stat.gid | default(-1)) == 0
        - (item.stat.mode | default('')) == '0644'
      become: true
      ansible.builtin.copy:
        src: "{{ dev_box_reconcile_root }}/unit-previous/{{ item.item | basename }}"
        dest: "{{ item.item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ dev_box_reconcile_live_units.results }}"
    - name: Restart the exact last-good reconciliation timer
      when: "'restored' in dev_box_reconcile_source_restore.stdout"
      become: true
      ansible.builtin.systemd_service:
        name: "{{ dev_box_reconcile_unit }}.timer"
        enabled: true
        state: started
        daemon_reload: true
    - name: Fail after authenticated post-switch recovery
      when: "'restored' in dev_box_reconcile_source_restore.stdout"
      ansible.builtin.fail:
        msg: Reconciliation activation failed; exact last-good generation was recovered.
    - name: Fail closed without an authenticated last-good generation
      ansible.builtin.fail:
        msg: >-
          Reconciliation activation failed without an authenticated last-good
          generation; the timer remains stopped.

- name: Converge units when the source generation is already current
  when: [not ansible_check_mode, not dev_box_reconcile_source_stale]
  block:
    - name: Install the validated reconciliation unit set
      become: true
      ansible.builtin.copy:
        src: "{{ dev_box_reconcile_root }}/unit-candidate/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: ["{{ dev_box_reconcile_unit }}.service", "{{ dev_box_reconcile_unit }}.timer"]
    - name: Enable continuous runner reconciliation
      become: true
      ansible.builtin.systemd_service:
        name: "{{ dev_box_reconcile_unit }}.timer"
        enabled: true
        state: started
        daemon_reload: true
    - name: Verify continuous runner reconciliation is scheduled
      become: true
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ dev_box_reconcile_unit }}.timer"]
      changed_when: false

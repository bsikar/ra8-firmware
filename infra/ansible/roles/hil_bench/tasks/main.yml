---
# Provision the HIL bench Pi to a known, current, board-reachable state.
# Idempotent: safe to re-run; converges the checkout + toolchain + permissions.

- name: Install the bench build/flash toolchain
  become: true
  ansible.builtin.apt:
    name: "{{ hil_bench_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure git-lfs is initialised for the bench user
  ansible.builtin.command:
    cmd: git lfs install
  register: hil_bench_lfs_install
  changed_when: "'already initialized' not in hil_bench_lfs_install.stdout"

- name: Check the currently-installed pinned Arm toolchain version
  ansible.builtin.command:
    cmd: "{{ hil_bench_arm_gcc_prefix }}/bin/arm-none-eabi-gcc -dumpfullversion"
  register: hil_bench_arm_ver
  changed_when: false
  failed_when: false

- name: Install the pinned Arm GNU Toolchain (aarch64) to /opt
  when: hil_bench_arm_gcc_dumpversion not in (hil_bench_arm_ver.stdout | default(''))
  become: true
  block:
    - name: Download the pinned Arm toolchain tarball (sha256-verified)
      ansible.builtin.get_url:
        url: "{{ hil_bench_arm_gcc_url }}"
        dest: /tmp/ra8-armgcc.tar.xz
        checksum: "sha256:{{ hil_bench_arm_gcc_sha256_aarch64 }}"
        mode: "0644"
    - name: Create the toolchain prefix
      ansible.builtin.file:
        path: "{{ hil_bench_arm_gcc_prefix }}"
        state: directory
        mode: "0755"
    - name: Extract the toolchain (strip the tarball's top dir)
      ansible.builtin.unarchive:
        src: /tmp/ra8-armgcc.tar.xz
        dest: "{{ hil_bench_arm_gcc_prefix }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]
    - name: Put the pinned toolchain on PATH for all login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/ra8-arm-toolchain.sh
        content: "export PATH={{ hil_bench_arm_gcc_prefix }}/bin:$PATH\n"
        mode: "0644"

- name: Assert the non-apt vendor tools are present (fail loud, never skip)
  # command -v is a shell builtin, so the shell module is required here.
  ansible.builtin.shell: "command -v {{ item }}"  # noqa: command-instead-of-shell
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH | default('') }}"
  loop: "{{ hil_bench_required_vendor_tools }}"
  register: hil_bench_vendor_check
  changed_when: false
  failed_when: hil_bench_vendor_check.rc != 0

# --- linuxptp + a board-facing port that can actually timestamp -------------

- name: Install the pinned linuxptp release
  become: true
  ansible.builtin.apt:
    name: "linuxptp={{ hil_bench_linuxptp_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Assert the installed linuxptp is the pinned release
  ansible.builtin.command:
    cmd: "dpkg-query -W -f=${Version} linuxptp"
  register: hil_bench_linuxptp_installed
  changed_when: false
  failed_when: (hil_bench_linuxptp_installed.stdout | trim) != hil_bench_linuxptp_version

- name: Assert every linuxptp binary the bench scripts invoke is present
  # command -v is a shell builtin, so the shell module is required here.
  ansible.builtin.shell: "command -v {{ item }}"  # noqa: command-instead-of-shell
  args:
    executable: /bin/bash
  loop: "{{ hil_bench_linuxptp_binaries }}"
  register: hil_bench_linuxptp_bins
  changed_when: false
  failed_when: hil_bench_linuxptp_bins.rc != 0

- name: Mask the distro's system-wide PTP daemons
  # See this role's defaults: a HIL helper owns ptp4l for the length of a run,
  # and a system unit on the same interface is an invisible second speaker.
  # `systemctl mask`, not the systemd module: two of the three units are
  # templates, and the module insists on resolving an instance they cannot have
  # ("Could not find the requested service ptp4l@.service"). mask is idempotent
  # and prints the symlink line only when it actually changes something.
  become: true
  ansible.builtin.command:
    cmd: "systemctl mask {{ item }}"
  loop: "{{ hil_bench_linuxptp_masked_units }}"
  register: hil_bench_ptp_mask
  changed_when: "'Created symlink' in (hil_bench_ptp_mask.stdout + hil_bench_ptp_mask.stderr)"

- name: Read the host's default-route interface
  ansible.builtin.command:
    cmd: ip -o route show default
  register: hil_bench_default_route
  changed_when: false

- name: Assert the board-facing interface is not the host's uplink
  # The bench reaches the world over wlan0 and Tailscale rides it. Giving the
  # board-facing port the uplink's job would take the bench off the network
  # mid-run; scripts/hil/eth_tcp.sh refuses the uplink for the same reason, and
  # this assert catches the misconfiguration at provision time instead.
  ansible.builtin.assert:
    that:
      - (hil_bench_default_route.stdout.split() | length) < 5 or
        (hil_bench_default_route.stdout.split()[4]) != hil_bench_eth_iface
    fail_msg: >-
      {{ hil_bench_eth_iface }} carries this host's default route
      ({{ hil_bench_default_route.stdout | trim }}), so it cannot also be the
      board-facing bench port. Either move the uplink or point
      hil_bench_eth_iface at the port the EK-RA8D2 is cabled to.

- name: Read the board-facing interface's timestamping capabilities
  ansible.builtin.command:
    cmd: "ethtool -T {{ hil_bench_eth_iface }}"
  register: hil_bench_ethtool_t
  changed_when: false
  failed_when: false

- name: Assert the board-facing interface has a PTP hardware clock
  # This is the whole reason the Ethernet cable moved off the USB adapter
  # (#292): the adapter reports "PTP Hardware Clock: none" and software-receive
  # only, so any offset measured through it is dominated by host scheduling
  # jitter rather than by the board. Asserting the capability keeps a future
  # re-cable from silently degrading every timing result.
  ansible.builtin.assert:
    that:
      - hil_bench_ethtool_t.rc == 0
      - "'hardware-receive' in hil_bench_ethtool_t.stdout"
      - "'hardware-transmit' in hil_bench_ethtool_t.stdout"
      - hil_bench_ethtool_t.stdout is not search('PTP Hardware Clock: none')
    fail_msg: >-
      {{ hil_bench_eth_iface }} cannot hardware-timestamp
      (ethtool -T rc {{ hil_bench_ethtool_t.rc }}):
      {{ hil_bench_ethtool_t.stdout | default(hil_bench_ethtool_t.stderr) | trim }}.
      A USB-Ethernet adapter will always fail this -- none of them carry a PHC.
      Cable the EK-RA8D2 to the host's built-in Ethernet port and set
      hil_bench_eth_iface to it.

- name: Read the PHC index the board-facing interface exposes
  ansible.builtin.shell:
    cmd: >-
      ethtool -T {{ hil_bench_eth_iface }}
      | awk '/PTP Hardware Clock:/ {print $4}'
    executable: /bin/bash
  register: hil_bench_phc_index
  changed_when: false

- name: Assert the PHC character device exists
  ansible.builtin.stat:
    path: "/dev/ptp{{ hil_bench_phc_index.stdout | trim }}"
  register: hil_bench_phc_dev
  failed_when: not hil_bench_phc_dev.stat.exists

- name: Ensure the bench user can access the serial ports
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user | default('star') }}"
    groups: "{{ hil_bench_serial_group }}"
    append: true

- name: Check out the repo at the pinned ref (force -- the bench tree is disposable)
  ansible.builtin.git:
    repo: "{{ hil_bench_repo_url }}"
    dest: "{{ hil_bench_repo_dir }}"
    version: "{{ hil_bench_ref }}"
    force: true
    accept_hostkey: true
  environment:
    GIT_LFS_SKIP_SMUDGE: "1"

- name: Pull LFS content the HIL builds bake in
  ansible.builtin.command:
    cmd: git lfs pull
    chdir: "{{ hil_bench_repo_dir }}"
  register: hil_bench_lfs_pull_result
  changed_when: hil_bench_lfs_pull_result.rc == 0
  when: hil_bench_lfs_pull | bool

- name: Provision the bench-lock state directory (#497)
  # /var/lib and not /tmp or /run: the record must not depend on whether this
  # host's /tmp is a tmpfs. A reboot is handled explicitly instead, by boot_id.
  # 1777 because several accounts (the bench user, a CI runner, a human) share
  # this box and any of them may be the next acquirer; the sticky bit keeps one
  # from unlinking another's files.
  become: true
  ansible.builtin.file:
    path: "{{ hil_bench_lock_dir }}"
    state: directory
    mode: "1777"

- name: Create the flock inode and the journal
  # The flock is taken on THIS inode. Two actors flocking two different inodes
  # is the one silent-corruption path in the design, so the canonical path is
  # provisioned here rather than invented by whichever client got there first.
  become: true
  ansible.builtin.file:
    path: "{{ hil_bench_lock_dir }}/{{ item }}"
    state: touch
    mode: "0666"
    access_time: preserve
    modification_time: preserve
  loop:
    - board.lock
    - journal.ndjson

- name: Bound the release of a client that vanishes without closing its socket
  # The bench lock releases the instant an ssh CLIENT dies, because the remote
  # holder blocks on the channel as stdin -- measured at 0.29 s. That covers a
  # killed process. It does NOT cover a client whose machine loses power or is
  # severed at the network: no FIN arrives, so only sshd can notice, and with
  # the default ClientAliveInterval of 0 that falls back to TCP keepalive --
  # over two hours on this host's sysctls. That is precisely the stale lock the
  # whole design exists to rule out, so it is configured, not hoped for.
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-ra8-bench-clientalive.conf
    content: |
      # Managed by the hil_bench ansible role -- see issue #497.
      # Bounds how long a bench hold survives a client that vanished without
      # closing its socket. 15s x 4 = ~60s, against hours of TCP keepalive.
      ClientAliveInterval 15
      ClientAliveCountMax 4
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Install the bench-lock reaper timer
  # Advisory only, and deliberately so. The reaper does not release anything a
  # live holder owns within its budget -- the flock already handles death. It
  # exists to bound an OVERRUN: an agent or CI holder past the budget it
  # declared gets SIGTERM. A HUMAN holder is only ever flagged, because they
  # may be standing at the bench with a probe on a test point.
  become: true
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.body }}"
    mode: "0644"
  loop:
    - name: ra8-bench-reap.service
      body: |
        [Unit]
        Description=Reap overrun RA8 bench holds (#497)

        [Service]
        Type=oneshot
        ExecStart={{ hil_bench_repo_dir }}/scripts/hil/lib/bench_host.sh reap
    - name: ra8-bench-reap.timer
      body: |
        [Unit]
        Description=Reap overrun RA8 bench holds every 5 minutes (#497)

        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=5min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the bench reaper timer

- name: Health check -- the EK-RA8D2 must be reachable over J-Link (EIL==HIL ground truth)
  # This RESETS AND HALTS the target, so it is a bench operation like any other
  # and takes the lock. Running the playbook used to reset the board out from
  # under whatever was using it. --break-glass is deliberately NOT set: if
  # somebody is mid-suite, provisioning waits.
  ansible.builtin.shell:
    cmd: >-
      printf 'si 1\nspeed {{ hil_bench_jlink_speed }}\nr\nh\nq\n' > /tmp/hil_bench_ping.jlink &&
      {{ hil_bench_repo_dir }}/scripts/hil/bench.sh run
      --intent 'ansible hil_bench health check (resets the target)'
      --for 5m --wait 10m --
      JLinkExe -device {{ hil_bench_jlink_device }} -if SWD
      -speed {{ hil_bench_jlink_speed }} -autoconnect 1
      -CommandFile /tmp/hil_bench_ping.jlink
  register: hil_bench_jlink_probe
  changed_when: false
  failed_when: "'Cortex-M85' not in hil_bench_jlink_probe.stdout"

- name: Report bench state
  ansible.builtin.debug:
    msg: >-
      HIL bench ready: repo at {{ hil_bench_ref }} in {{ hil_bench_repo_dir }},
      toolchain + vendor tools present, board reachable
      ({{ 'Cortex-M85 found' if 'Cortex-M85' in hil_bench_jlink_probe.stdout else 'NOT found' }});
      linuxptp {{ hil_bench_linuxptp_installed.stdout | trim }} with
      {{ hil_bench_linuxptp_binaries | join(', ') }}, board-facing port
      {{ hil_bench_eth_iface }} hardware-timestamps on
      /dev/ptp{{ hil_bench_phc_index.stdout | trim }}.

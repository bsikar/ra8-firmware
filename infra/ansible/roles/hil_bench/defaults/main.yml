---
# hil_bench role defaults -- provisions the hardware-in-the-loop bench host
# (the Raspberry Pi with the EK-RA8D2 + J-Link attached) to a known, current,
# HIL-ready state. Codifies exactly what rotted: a stale/broken repo checkout
# and an unmanaged toolchain that nobody noticed because HIL had no owner.
# Override per deployment in group_vars / host_vars.

# The repo the bench checks out and runs HIL against.
hil_bench_repo_url: "git@github.com:bsikar/ra8-firmware.git"
hil_bench_repo_dir: "/home/{{ ansible_user | default('star') }}/ra8-firmware"
hil_bench_ref: "origin/dev"

# apt packages the bench needs to build + flash + probe the firmware.
# NOTE: gcc-arm-none-eabi is deliberately NOT here -- apt ships 13.2, but the
# project pins Arm GNU Toolchain 13.3.rel1 for reproducible codegen (#178: the
# miniz inflater is version-sensitive, which SIM==HIL goldens depend on). The
# pinned toolchain is installed to /opt below, matching the devcontainer.
hil_bench_apt_packages:
  - git
  - git-lfs
  - cmake
  - ninja-build
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  - usbutils

# Pinned Arm GNU Toolchain (must match .devcontainer/Dockerfile exactly so the
# bench builds byte-identical firmware to CI). Installed to the /opt path the
# CMake toolchain (cmake/toolchain-ra8d2.cmake) searches.
hil_bench_arm_gcc_release: "13.3.rel1"
hil_bench_arm_gcc_prefix: "/opt/arm-gnu-toolchain-13.3"
hil_bench_arm_gcc_sha256_aarch64: "c8824bffd057afce2259f7618254e840715f33523a3d4e4294f471208f976764"
# What `arm-none-eabi-gcc -dumpfullversion` prints for the release above -- used
# to skip the install idempotently when it is already present.
hil_bench_arm_gcc_dumpversion: "13.3.1"
# Download URL (arm-developer.com), aarch64 host. URLs are the standard
# line-length exception.
# yamllint disable-line rule:line-length
hil_bench_arm_gcc_url: "https://developer.arm.com/-/media/Files/downloads/gnu/{{ hil_bench_arm_gcc_release }}/binrel/arm-gnu-toolchain-{{ hil_bench_arm_gcc_release }}-aarch64-arm-none-eabi.tar.xz"

# Vendor tools that are NOT apt-installable (manual SEGGER / Renesas downloads).
# The role FAILS LOUD if they are missing rather than silently degrading -- a
# HIL bench without these cannot flash or probe, and a green run that skipped
# them would be a lie.
hil_bench_required_vendor_tools:
  - JLinkExe   # SEGGER J-Link (flash + SWD + VCOM)
  - rfp-cli    # Renesas Flash Programmer (DLM recovery, option bytes)

# Serial group the bench user must be in for /dev/ttyACM* access.
hil_bench_serial_group: dialout

# J-Link target for the board-reachable health check.
hil_bench_jlink_device: "R7KA8D2KF_CPU0"
hil_bench_jlink_speed: 1000

# Whether to pull LFS content (book fixtures some HIL apps bake in).
hil_bench_lfs_pull: true

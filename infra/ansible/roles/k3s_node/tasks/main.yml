---
# Bring a bare host up as the single-node k3s server the ARC runner pool runs
# on, with helm present system-wide. Idempotent: an already-correct node is a
# handful of version probes.
#
# This role is AUTHORITATIVE for how k3s and helm reach the node. It does NOT
# deploy any workload -- ARC is roles/ci_runner, the vault is roles/openbao.

- name: Install the node packages the runner build needs
  become: true
  ansible.builtin.apt:
    name: "{{ k3s_node_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Stage the uv-locked Kubernetes client export
  become: true
  ansible.builtin.copy:
    src: requirements.lock
    dest: "{{ k3s_node_requirements_lock }}"
    owner: root
    group: root
    mode: "0644"

- name: Stage the exact-environment verifier
  become: true
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../scripts/dev/verify_locked_environment.py"
    dest: "{{ k3s_node_requirements_verifier }}"
    owner: root
    group: root
    mode: "0755"

- name: Compute the candidate Kubernetes client lock digest
  ansible.builtin.set_fact:
    k3s_node_requirements_digest: >-
      {{ lookup('file', role_path + '/files/requirements.lock', rstrip=false) | hash('sha256') }}

- name: Read back the staged Kubernetes client lock bytes
  become: true
  ansible.builtin.slurp:
    src: "{{ k3s_node_requirements_lock }}"
  register: k3s_node_staged_requirements
  changed_when: false
  when: not ansible_check_mode

- name: Prove the staged lock is byte-identical to the role authority
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - (k3s_node_staged_requirements.content | b64decode | hash('sha256')) ==
        k3s_node_requirements_digest
    fail_msg: >-
      The staged Kubernetes client lock differs byte-for-byte from the
      controller role file; refusing to manage an environment from split inputs.

- name: Inspect the Kubernetes client environment lock marker
  become: true
  ansible.builtin.stat:
    path: "{{ k3s_node_requirements_marker }}"
    follow: false
  register: k3s_node_lock_marker_stat

- name: Read the Kubernetes client environment lock marker
  when: k3s_node_lock_marker_stat.stat.exists
  become: true
  ansible.builtin.slurp:
    src: "{{ k3s_node_requirements_marker }}"
  register: k3s_node_lock_marker
  changed_when: false
  check_mode: false

- name: Check whether the managed Kubernetes client interpreter exists
  become: true
  ansible.builtin.stat:
    path: "{{ k3s_node_python_venv }}/bin/python3"
  register: k3s_node_python_stat

- name: Decide whether the applied lock marker is current
  ansible.builtin.set_fact:
    k3s_node_lock_current: >-
      {{ k3s_node_lock_marker_stat.stat.exists and
         k3s_node_lock_marker.content is defined and
         (k3s_node_lock_marker.content | b64decode | trim) ==
         k3s_node_requirements_digest }}

- name: Preflight the current Kubernetes client package set
  when:
    - k3s_node_lock_current
    - k3s_node_python_stat.stat.exists
  become: true
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_python_venv }}/bin/python3"
      - "{{ k3s_node_requirements_verifier }}"
      - "{{ k3s_node_requirements_lock }}"
  register: k3s_node_exact_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Preflight the current Kubernetes client imports
  when:
    - k3s_node_lock_current
    - k3s_node_python_stat.stat.exists
  become: true
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_python_venv }}/bin/python3"
      - -c
      - "import kubernetes, yaml"
  register: k3s_node_import_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Preflight the current Kubernetes client dependency graph
  when:
    - k3s_node_lock_current
    - k3s_node_python_stat.stat.exists
  become: true
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_python_venv }}/bin/python3"
      - -m
      - pip
      - check
  register: k3s_node_pip_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Rebuild a missing, stale, or drifted managed client environment
  ansible.builtin.set_fact:
    k3s_node_python_rebuild: >-
      {{ not k3s_node_lock_current or
         not k3s_node_python_stat.stat.exists or
         (k3s_node_exact_probe.rc | default(1)) != 0 or
         (k3s_node_import_probe.rc | default(1)) != 0 or
         (k3s_node_pip_probe.rc | default(1)) != 0 }}

- name: Report a lock-driven client environment rebuild in check mode
  when:
    - ansible_check_mode
    - k3s_node_python_rebuild
  ansible.builtin.debug:
    msg: >-
      The uv-export digest changed; apply will replace
      {{ k3s_node_python_venv }} exactly at the managed-environment
      boundary so packages removed from the lock cannot remain installed.

- name: Remove the stale Kubernetes client environment
  when:
    - not ansible_check_mode
    - k3s_node_python_rebuild
  become: true
  ansible.builtin.file:
    path: "{{ k3s_node_python_venv }}"
    state: absent

- name: Create the isolated Python k8s client environment
  when: not ansible_check_mode or not k3s_node_python_rebuild
  become: true
  ansible.builtin.command:
    cmd: "python3 -m venv {{ k3s_node_python_venv }}"
    creates: "{{ k3s_node_python_venv }}/bin/python3"

- name: Install the exact hash-locked Python k8s client environment
  when:
    - not ansible_check_mode
    - k3s_node_python_rebuild
  become: true
  ansible.builtin.pip:
    requirements: "{{ k3s_node_requirements_lock }}"
    virtualenv: "{{ k3s_node_python_venv }}"
    virtualenv_command: python3 -m venv
    state: present

- name: Prove the managed environment has no missing or extra packages
  when: not ansible_check_mode or not k3s_node_python_rebuild
  become: true
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_python_venv }}/bin/python3"
      - "{{ k3s_node_requirements_verifier }}"
      - "{{ k3s_node_requirements_lock }}"
  changed_when: false
  check_mode: false

- name: Assert the isolated Kubernetes client imports and dependency health
  when: not ansible_check_mode or not k3s_node_python_rebuild
  become: true
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_python_venv }}/bin/python3"
      - -c
      - "import kubernetes, yaml"
  changed_when: false
  check_mode: false

- name: Check the isolated Kubernetes client dependency graph
  when: not ansible_check_mode or not k3s_node_python_rebuild
  become: true
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_python_venv }}/bin/python3"
      - -m
      - pip
      - check
  changed_when: false
  check_mode: false

- name: Record the verified Kubernetes client lock digest
  when:
    - not ansible_check_mode
    - k3s_node_python_rebuild
  become: true
  ansible.builtin.copy:
    content: "{{ k3s_node_requirements_digest }}\n"
    dest: "{{ k3s_node_requirements_marker }}"
    owner: root
    group: root
    mode: "0644"

# --- k3s --------------------------------------------------------------------

- name: Check the installed k3s version
  ansible.builtin.command:
    cmd: "{{ k3s_node_bin }} --version"
  register: k3s_node_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install k3s at the pinned version
  when: k3s_node_version not in (k3s_node_probe.stdout | default(''))
  become: true
  block:
    - name: Download the pinned k3s binary (sha256-verified)
      ansible.builtin.get_url:
        url: "{{ k3s_node_binary_url }}"
        dest: "{{ k3s_node_bin }}"
        checksum: "sha256:{{ k3s_node_binary_sha256 }}"
        mode: "0755"

    - name: Download the k3s installer to disk (never piped into a shell)
      ansible.builtin.get_url:
        url: "{{ k3s_node_install_url }}"
        dest: /tmp/k3s-install.sh
        checksum: "sha256:{{ k3s_node_install_sha256 }}"
        mode: "0755"

    - name: Run the installer against the already-verified binary
      # INSTALL_K3S_SKIP_DOWNLOAD makes this a unit-and-symlink step only: the
      # binary it wires up is the one checksummed above, so the installer never
      # fetches anything itself. INSTALL_K3S_VERSION still matters -- the script
      # records it in the unit's environment file.
      ansible.builtin.command:
        cmd: /tmp/k3s-install.sh
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"
        INSTALL_K3S_VERSION: "{{ k3s_node_version }}"
  always:
    - name: Remove the downloaded installer
      become: true
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent

- name: Ensure k3s is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Wait for the node's kubeconfig to appear
  become: true
  ansible.builtin.wait_for:
    path: "{{ k3s_node_kubeconfig }}"
    timeout: 180

- name: Read back the running k3s version
  ansible.builtin.command:
    cmd: "{{ k3s_node_bin }} --version"
  register: k3s_node_installed
  changed_when: false
  check_mode: false

- name: Ask the API server whether the node is actually Ready
  # `systemctl is-active k3s` proves a process is up, not that the control
  # plane admits workloads. ARC's pods will be scheduled here; ask the thing
  # that schedules them.
  become: true
  ansible.builtin.command:
    cmd: "{{ k3s_node_bin }} kubectl get nodes --no-headers"
  register: k3s_node_ready
  retries: 30
  delay: 5
  until: "' Ready ' in (' ' ~ k3s_node_ready.stdout ~ ' ')"
  changed_when: false
  check_mode: false

- name: Assert k3s is the pinned version and serving a Ready node
  ansible.builtin.assert:
    that:
      - k3s_node_version in k3s_node_installed.stdout
      - "' Ready ' in (' ' ~ k3s_node_ready.stdout ~ ' ')"
    fail_msg: >-
      k3s reports '{{ k3s_node_installed.stdout_lines | first | default('') | trim }}'
      and `kubectl get nodes` says
      '{{ k3s_node_ready.stdout | default('<nothing>') | trim }}'. The runner
      pool cannot be deployed onto a cluster that is not serving.
    success_msg: >-
      {{ k3s_node_installed.stdout_lines | first | trim }},
      node {{ k3s_node_ready.stdout_lines | first | trim }}

# --- helm -------------------------------------------------------------------

- name: Check the installed helm version
  ansible.builtin.command:
    cmd: "{{ k3s_node_helm_bin }} version --short"
  register: k3s_node_helm_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install helm at the pinned version
  when: k3s_node_helm_version not in (k3s_node_helm_probe.stdout | default(''))
  become: true
  block:
    - name: Create a scratch directory for the helm tarball
      ansible.builtin.tempfile:
        state: directory
        suffix: helm
      register: k3s_node_helm_tmp

    - name: Download the pinned helm tarball (sha256-verified)
      ansible.builtin.get_url:
        url: "{{ k3s_node_helm_url }}"
        dest: "{{ k3s_node_helm_tmp.path }}/helm.tar.gz"
        checksum: "sha256:{{ k3s_node_helm_sha256 }}"
        mode: "0644"

    - name: Unpack it
      ansible.builtin.unarchive:
        src: "{{ k3s_node_helm_tmp.path }}/helm.tar.gz"
        dest: "{{ k3s_node_helm_tmp.path }}"
        remote_src: true

    - name: Install helm system-wide
      # System-wide, not into a user's ~/bin: ci_runner's helm tasks run under
      # `become: true`, and root's PATH does not include ~ubuntu/bin. The live
      # node had it only there, which is why that role's prerequisites were
      # invisible until a fresh node was tried.
      ansible.builtin.copy:
        src: "{{ k3s_node_helm_tmp.path }}/linux-amd64/helm"
        dest: "{{ k3s_node_helm_bin }}"
        remote_src: true
        mode: "0755"
  always:
    - name: Remove the helm scratch directory
      when: k3s_node_helm_tmp.path is defined
      ansible.builtin.file:
        path: "{{ k3s_node_helm_tmp.path }}"
        state: absent

- name: Read back the helm version, as root (the context ci_runner uses)
  become: true
  ansible.builtin.command:
    cmd: helm version --short
  register: k3s_node_helm_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert helm is the pinned version AND resolvable by root
  ansible.builtin.assert:
    that:
      - k3s_node_helm_installed.rc == 0
      - k3s_node_helm_version in k3s_node_helm_installed.stdout
    fail_msg: >-
      `helm version --short` as root reported rc={{ k3s_node_helm_installed.rc }}
      '{{ k3s_node_helm_installed.stdout | default('') | trim }}', not
      {{ k3s_node_helm_version }} on PATH. ci_runner drives helm through
      kubernetes.core.helm under become, so a helm that only an interactive
      login can find is a helm ARC cannot be deployed with.
    success_msg: "helm {{ k3s_node_helm_installed.stdout | trim }} on root's PATH"

- name: Report node state
  ansible.builtin.debug:
    msg: >-
      k3s node ready: {{ k3s_node_installed.stdout_lines | first | trim }},
      helm {{ k3s_node_helm_installed.stdout | trim }},
      kubeconfig at {{ k3s_node_kubeconfig }}. Deploy workloads with
      playbooks/ci-runner.yml (ARC) and playbooks/openbao.yml (the vault).

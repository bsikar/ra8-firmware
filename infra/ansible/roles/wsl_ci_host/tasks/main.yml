---
# Prepare a WSL2 Ubuntu distro on a Windows machine to host a CI runner.
#
# Runs INSIDE the distro (connection: local) and reaches the Windows side
# through /mnt/c and WSL interop. See defaults/main.yml for why each setting is
# what it is; this file is AUTHORITATIVE for how the host is configured, and
# infra/README.md is a description of it that can go stale.
#
# Idempotent, and `-e wsl_ci_host_state=absent` undoes it.

- name: Assert a lifecycle state this role implements
  ansible.builtin.assert:
    that:
      - wsl_ci_host_state in ['present', 'absent']
    fail_msg: >-
      wsl_ci_host_state is '{{ wsl_ci_host_state }}'; this role implements
      'present' (configure) and 'absent' (undo) only.
    success_msg: "state={{ wsl_ci_host_state }}"

# --- Preflight --------------------------------------------------------------

- name: Read the kernel identity
  ansible.builtin.slurp:
    src: /proc/version
  register: wsl_ci_host_proc_version

- name: Assert this is actually a WSL distro
  # Every path below writes to /mnt/c or shells out to a .exe. On a normal
  # Linux host those either fail confusingly or, worse, create a directory
  # called /mnt/c and report success.
  ansible.builtin.assert:
    that:
      - "'microsoft' in (wsl_ci_host_proc_version.content | b64decode | lower)"
    fail_msg: >-
      /proc/version does not mention Microsoft, so this is not a WSL distro.
      This role configures WSL-specific things (the .wslconfig VM caps, the
      mirrored-networking route fix, the Windows autostart task) and has
      nothing to do on a plain Linux host -- deploy ci_runner_docker there
      directly.
    success_msg: "running inside WSL"

- name: Resolve the Windows profile directory
  ansible.builtin.set_fact:
    wsl_ci_host_profile: "/mnt/c/Users/{{ wsl_ci_host_windows_user }}"

- name: Assert the Windows profile is visible over drvfs
  # .wslconfig is per-user. Written to a profile that is not there, every cap
  # in it is silently ignored and the VM comes up uncapped, which is the
  # failure mode this check exists to catch: an uncapped VM looks fine right
  # up until a build takes the whole machine.
  ansible.builtin.stat:
    path: "{{ wsl_ci_host_profile }}"
  register: wsl_ci_host_profile_stat
  failed_when: not wsl_ci_host_profile_stat.stat.exists

# --- Removal ----------------------------------------------------------------

- name: Undo the WSL host configuration
  when: wsl_ci_host_state == 'absent'
  block:
    - name: Delete the Windows autostart task
      ansible.builtin.command:
        argv:
          - schtasks.exe
          - /Delete
          - /TN
          - "{{ wsl_ci_host_task_name }}"
          - /F
      register: wsl_ci_host_task_del
      changed_when: wsl_ci_host_task_del.rc == 0
      failed_when: false

    - name: Stop and disable the route-pin units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - ra8-wsl-route-pin.timer
        - ra8-wsl-route-pin.service
      failed_when: false

    - name: Remove the route-pin helper and its units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/ra8-wsl-route-pin.timer
        - /etc/systemd/system/ra8-wsl-route-pin.service
        - /usr/local/sbin/ra8-wsl-route-pin

    - name: Remove the slew-not-step chrony configuration
      # The drop-in is ours; chrony itself is not uninstalled, for the same
      # reason Docker is not. Removing a package from somebody's machine on the
      # way out is not this role's call.
      ansible.builtin.file:
        path: /etc/chrony/conf.d/10-ra8-slew-not-step.conf
        state: absent
      register: wsl_ci_host_chrony_conf_removed

    - name: Restart chronyd without the drop-in
      when: wsl_ci_host_chrony_conf_removed.changed
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
      failed_when: false

    - name: Unmask systemd-timesyncd so the distro has a time daemon again
      # The removal path leaves chrony installed (see above) but must not leave
      # the machine with BOTH time daemons masked -- that would hand it back
      # with no clock discipline at all, which is worse than how it was found.
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
      loop:
        - systemd-timesyncd
        - systemd-time-wait-sync
      failed_when: false

    - name: Check for the .wslconfig backup taken on first run
      ansible.builtin.stat:
        path: "{{ wsl_ci_host_profile }}/.wslconfig.ra8-backup"
      register: wsl_ci_host_backup

    - name: Restore the owner's original .wslconfig
      # Restored, not deleted. The file predates this role on this machine and
      # carries the owner's own networking settings; removing it would be us
      # reconfiguring their machine on the way out.
      when: wsl_ci_host_backup.stat.exists
      ansible.builtin.copy:
        src: "{{ wsl_ci_host_profile }}/.wslconfig.ra8-backup"
        dest: "{{ wsl_ci_host_profile }}/.wslconfig"
        remote_src: true
        mode: "0644"

    - name: Report what removal left behind
      ansible.builtin.debug:
        msg: >-
          WSL host configuration removed: autostart task
          {{ wsl_ci_host_task_name }} deleted, route-pin units removed,
          slew-not-step chrony drop-in removed, .wslconfig
          {{ 'restored from backup' if wsl_ci_host_backup.stat.exists
             else 'left as-is (no backup found)' }}. Docker Engine and Docker
          Desktop were deliberately NOT touched. Run `wsl --shutdown` from
          Windows to drop the VM caps.

# --- Configuration ----------------------------------------------------------

- name: Configure the WSL host
  when: wsl_ci_host_state == 'present'
  block:
    - name: Enable systemd and take ownership of resolv.conf
      # generateResolvConf=false is the load-bearing half. WSL's generated
      # resolv.conf points at its DNS-tunnelling endpoint, which does not
      # answer on this host, so every lookup in a CI job stalls for the full
      # resolver timeout before failing.
      ansible.builtin.copy:
        dest: /etc/wsl.conf
        mode: "0644"
        content: |
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          [boot]
          systemd=true

          [network]
          generateResolvConf=false

    - name: Remove any resolv.conf symlink WSL or systemd-resolved left behind
      # `copy` follows an existing symlink and writes through it, which would
      # put our nameservers in /run/systemd/resolve/stub-resolv.conf instead of
      # where the resolver reads them.
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent

    - name: Write a resolv.conf that answers
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          # WSL's own DNS-tunnelling endpoint does not answer on this
          # multi-homed mirrored-networking host; these do.
          {% for ns in wsl_ci_host_nameservers %}
          nameserver {{ ns }}
          {% endfor %}
          options timeout:2 attempts:2

    - name: Install the default-route pin helper
      # Inlined rather than kept as templates/*.j2 for the same reason the
      # ci_runner_docker compose body is: Jinja templates are a file type
      # nothing in this tree lints or formats, and check_lint_coverage.py
      # rejects unclassified types rather than admitting a blind spot.
      ansible.builtin.copy:
        dest: /usr/local/sbin/ra8-wsl-route-pin
        mode: "0755"
        content: |
          #!/bin/bash
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          #
          # Pick the default gateway that actually carries internet traffic and
          # pin it below every mirrored route.
          #
          # Mirrored networking copies the Windows routing table into the
          # distro. This host is multi-homed: an isolated bench LAN with NO
          # uplink, and the owner's Wi-Fi. The bench LAN's DHCP-supplied
          # gateway arrives with the LOWER metric, so unmodified WSL sends
          # every packet into a black hole. Windows itself fails over and is
          # unaffected, so the fix belongs here and not in the owner's network.
          set -u
          readonly PROBE={{ wsl_ci_host_route_probe_ip }}

          # Already pinned: nothing to do, and no probe traffic on a timer.
          if ip -4 route show default | head -1 | grep -q 'metric 5'; then
            exit 0
          fi

          while read -r gw dev; do
            [ -n "$gw" ] && [ -n "$dev" ] || continue
            if curl -s --max-time 4 --interface "$dev" -o /dev/null \
                 "http://${PROBE}"; then
              ip route replace default via "$gw" dev "$dev" metric 5
              echo "ra8-wsl-route-pin: pinned via $gw dev $dev metric 5"
              exit 0
            fi
          done < <(ip -4 route show default |
                   awk '{g="";d="";
                         for(i=1;i<=NF;i++){if($i=="via")g=$(i+1);
                                            if($i=="dev")d=$(i+1)}
                         if(g!=""&&d!="")print g, d}' | sort -u)

          echo "ra8-wsl-route-pin: no default gateway reached ${PROBE}" >&2
          exit 1

    - name: Install the route-pin service
      ansible.builtin.copy:
        dest: /etc/systemd/system/ra8-wsl-route-pin.service
        mode: "0644"
        content: |
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          [Unit]
          Description=Pin the WSL default route to the internet-bearing gateway
          After=network.target
          Wants=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/ra8-wsl-route-pin
          RemainAfterExit=no

          [Install]
          WantedBy=multi-user.target

    - name: Install the route-pin timer
      # A timer as well as a boot unit. Mirrored networking re-syncs the
      # Windows routing table on every host network change, which re-adds the
      # black-hole route underneath a job that is already running -- a boot-only
      # fix would leave that job failing with no obvious cause.
      ansible.builtin.copy:
        dest: /etc/systemd/system/ra8-wsl-route-pin.timer
        mode: "0644"
        content: |
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          [Unit]
          Description=Re-assert the pinned WSL default route

          [Timer]
          OnBootSec=10s
          OnUnitActiveSec={{ wsl_ci_host_route_pin_interval }}
          AccuracySec=5s

          [Install]
          WantedBy=timers.target

    - name: Enable and start the route-pin units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - ra8-wsl-route-pin.service
        - ra8-wsl-route-pin.timer

    # --- Clock ------------------------------------------------------------
    #
    # A WSL2 VM does not boot with a trustworthy clock, and that lands squarely
    # on the build. Observed on this host: the VM came up ~4 minutes fast, the
    # runner checked out the tree with those timestamps, timesyncd then stepped
    # the clock back, and make spent the rest of the job reporting
    #
    #   Warning: File '...o' has modification time 236 s in the future
    #   warning: Clock skew detected. Your build may be incomplete.
    #
    # That is not cosmetic: make's up-to-date decisions are timestamp
    # comparisons, so a build under a stepping clock can silently skip work or
    # relink forever.
    #
    # ORDERING WAS NECESSARY AND NOT SUFFICIENT (#509). Holding docker back
    # until the clock is synchronised fixes the step that happens at BOOT. It
    # does nothing about a step that happens at 07:13 on a host that booted
    # hours earlier -- and that is what the fleet was measured doing. Scanning
    # the 100 most recent completed workflow runs for a step whose recorded
    # completed_at precedes its own started_at (scripts/checks/
    # check_runner_clock.py, now a gate) found 16 such steps, all three
    # runners on THIS host, none anywhere else in the fleet:
    #
    #   win-ci-3: 8   win-ci-1: 5   win-ci-2: 3
    #   truenas-ci-1: 0   every ra8-ci ARC pod: 0
    #
    # The three win-ci runners are containers in one distro, so that is one
    # clock, faulting repeatedly through the working day.
    #
    # WHAT IS ACTUALLY HAPPENING. Every full-size event is a backward step of
    # 242-248 s, and the size does NOT grow with the interval between events --
    # 16 minutes apart gives 247 s, 4 minutes apart gives 242 s. A clock that
    # merely RAN FAST would produce a correction proportional to the gap. A
    # constant ~245 s offset that keeps being re-introduced does not. So this
    # is not drift: it is two time sources disagreeing by a fixed ~4 minutes
    # and taking turns.
    #
    # The two are the Windows host (which a WSL2 VM takes its clock from, and
    # which WSL re-asserts periodically and on resume) and NTP inside the
    # distro. The Windows clock is ~4 minutes fast -- the same "the VM's RTC
    # runs ~4 minutes ahead" this role already recorded, an RTC being exactly
    # what the host hands the guest. WSL pushes host time in, the distro's
    # timesyncd sees a 245 s offset, and timesyncd STEPS for anything past
    # 0.2 s. The forward pushes are invisible in the API (they only make a step
    # look longer); the backward corrections are the ones that show up.
    #
    # THE FIX HAS TO REMOVE ONE OF THE TWO SOURCES, and the half that is
    # reachable from inside the distro is the second one. So:
    #
    #  1. chrony replaces timesyncd, configured to step only while starting up
    #     and to SLEW every correction after that. A build farm wants slew: a
    #     clock that is briefly wrong but monotonic keeps every duration and
    #     every mtime comparison sound, while a clock that is instantaneously
    #     right by way of a jump corrupts both. This is unconditional and
    #     applies to any host this role is ever pointed at.
    #  2. The Windows clock is asserted, not assumed. Fixing it needs an
    #     elevated Windows action that WSL interop cannot perform (interop
    #     launches .exe with the user's filtered token, so sc.exe / w32tm
    #     /config are denied), which makes it an owner action -- and an owner
    #     action nobody is told about is one nobody performs. The play fails
    #     with the exact commands rather than converging on a host that will
    #     resume stepping.
    #
    # The gate is what proves convergence: scripts/ci.sh --gate runner-clock,
    # scheduled nightly, re-reads the fleet from the API and fails while any
    # runner is still moving its clock under a job.

    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: Stop and disable systemd-timesyncd and its wait unit
      # Explicit, not left to the chrony package's postinst. Two daemons
      # disciplining one clock is the exact shape of the fault being fixed, and
      # "the packaging probably handles it" is not a thing to find out from a
      # 4-minute step in the middle of a nightly sweep. Disabling
      # systemd-time-wait-sync in the same breath is why the Docker drop-in
      # below orders against chrony-wait instead: a wait unit for a daemon that
      # is not running would return instantly and order against nothing.
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - systemd-timesyncd
        - systemd-time-wait-sync
      failed_when: false

    - name: Mask systemd-timesyncd and its wait unit
      # A separate task from the disable above, and after it: `systemctl
      # disable` on an already-masked unit fails, so doing both in one call
      # makes the outcome depend on the module's internal ordering.
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop:
        - systemd-timesyncd
        - systemd-time-wait-sync
      failed_when: false

    - name: Read whether timesyncd is still disciplining the clock
      ansible.builtin.command:
        cmd: systemctl is-active systemd-timesyncd
      register: wsl_ci_host_timesyncd_active
      changed_when: false
      failed_when: false

    - name: Assert only one daemon is disciplining the clock
      # The two tasks above are best-effort (`failed_when: false`) because a
      # distro without timesyncd is fine. What is NOT fine is both daemons
      # running, so the OUTCOME is asserted rather than the actions assumed --
      # a silently-swallowed mask failure would otherwise leave exactly the
      # two-source fight this section exists to end.
      ansible.builtin.assert:
        that:
          - (wsl_ci_host_timesyncd_active.stdout | trim) != 'active'
        fail_msg: >-
          systemd-timesyncd is still active alongside chrony. Two daemons
          disciplining one clock is what produced the repeating 4-minute
          backward steps (#509); masking it did not take.
        success_msg: >-
          timesyncd is
          {{ wsl_ci_host_timesyncd_active.stdout | trim | default('absent', true) }};
          chrony alone disciplines this clock

    - name: Ensure chrony's drop-in directory exists
      # chrony.conf on Ubuntu carries `confdir /etc/chrony/conf.d`, so this is
      # where a managed fragment belongs -- but a fragment written into a
      # directory chrony is not reading is configuration that does nothing, so
      # it is created rather than assumed.
      ansible.builtin.file:
        path: /etc/chrony/conf.d
        state: directory
        mode: "0755"

    - name: Configure chrony to slew rather than step
      # makestep <threshold> <updates>: allow a step for an offset over
      # <threshold> seconds, but only for the first <updates> clock updates
      # after chronyd starts -- a VM legitimately comes up with a wrong clock
      # and has to be able to jump to the truth once, BEFORE any job is
      # accepted -- and slew everything after that, forever. That is the whole
      # behavioural difference from timesyncd, which has no such distinction
      # and steps for any offset over 0.2 s at any time, including the middle
      # of a 600 s fuzz budget.
      #
      # The distro's stock chrony.conf already ships `makestep 1 3`, so this
      # line usually restates the default. It is written anyway because the
      # property the whole fix rests on should be OWNED here, not inherited
      # from a packaging default that can change under us in a release note
      # nobody on this project reads.
      #
      # `confdir /etc/chrony/conf.d` is line 5 of that stock chrony.conf, which
      # is why a fragment is the right shape -- verified against the package
      # rather than assumed.
      ansible.builtin.copy:
        dest: /etc/chrony/conf.d/10-ra8-slew-not-step.conf
        mode: "0644"
        content: |
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          # A CI host's clock may be wrong; it may not be non-monotonic (#509).
          {% for server in wsl_ci_host_ntp_servers %}
          server {{ server }} iburst
          {% endfor %}
          makestep {{ wsl_ci_host_clock_step_threshold_s }} {{ wsl_ci_host_clock_step_updates }}
      register: wsl_ci_host_chrony_conf

    - name: Restart chronyd when its configuration changed
      # Explicit rather than a handler: handlers run at the end of the play,
      # long after the assertions below would have read the clock chronyd was
      # still configured the old way to discipline.
      when: wsl_ci_host_chrony_conf.changed
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
        daemon_reload: true

    - name: Enable chronyd and the unit that blocks until it has synchronised
      # chrony-wait is chrony's equivalent of systemd-time-wait-sync: it holds
      # time-sync.target until chronyd reports a disciplined clock, which is
      # what the Docker drop-in below orders against.
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - chronyd
        - chrony-wait

    - name: Install Docker Engine inside the distro
      when: wsl_ci_host_install_docker | bool
      block:
        - name: Ensure the apt keyring directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Fetch the Docker apt signing key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Install the deb822 apt-source dependency
          # ansible.builtin.deb822_repository is implemented on top of
          # python3-debian and fails hard without it. Installed here rather
          # than assumed present: a stock Ubuntu 24.04 WSL image does not
          # carry it.
          ansible.builtin.apt:
            name: python3-debian
            state: present
            update_cache: true

        - name: Drop any one-line Docker apt source
          # The deb822 source below replaces it. Left in place both would be
          # configured, and apt reports the same target twice on every update.
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/docker.list
            state: absent

        - name: Add the Docker apt repository
          ansible.builtin.deb822_repository:
            name: docker
            types: [deb]
            uris: "https://download.docker.com/linux/ubuntu"
            suites: "{{ ansible_distribution_release }}"
            components: [stable]
            architectures:
              - "{{ ansible_architecture | replace('x86_64', 'amd64') }}"
            signed_by: /etc/apt/keyrings/docker.asc
            enabled: true
            state: present

        - name: Install Docker Engine and the Compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

        - name: Ensure the Docker unit drop-in directory exists
          ansible.builtin.file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            mode: "0755"

        - name: Hold the Docker daemon back until the clock is synchronised
          # Docker starting late is the point. The runner containers are
          # `restart: unless-stopped`, so they come up with the daemon -- which
          # means the daemon's start time IS the moment this host begins
          # accepting jobs. Ordering it after the clock settles is what stops
          # the first build after every boot running under a stepping clock.
          #
          # chrony-wait.service, not systemd-time-wait-sync.service: chrony is
          # what disciplines this clock now (see the Clock section), and
          # timesyncd's wait unit would be inert with timesyncd itself
          # disabled -- an ordering constraint that orders against nothing is
          # the most expensive kind of comment.
          ansible.builtin.copy:
            dest: /etc/systemd/system/docker.service.d/10-wait-for-clock.conf
            mode: "0644"
            content: |
              # Managed by the ra8-firmware wsl_ci_host Ansible role.
              [Unit]
              After=chrony-wait.service
              Wants=chrony-wait.service

        - name: Enable and start the Docker daemon
          ansible.builtin.systemd_service:
            name: docker
            state: started
            enabled: true
            daemon_reload: true

    - name: Find which docker binary is first on PATH
      ansible.builtin.command:
        cmd: which docker
      register: wsl_ci_host_which_docker
      changed_when: false

    - name: Assert the native docker, not the Docker Desktop shim, is in use
      # Docker Desktop's WSL integration puts a shim on PATH from /mnt/c. It
      # works only while the Desktop application is running in a logged-in
      # interactive session, so a silent switch to it turns an unattended
      # runner into one that stops taking jobs whenever the owner logs out --
      # with no other symptom to notice.
      ansible.builtin.assert:
        that:
          - not (wsl_ci_host_which_docker.stdout | trim).startswith('/mnt/')
        fail_msg: >-
          `which docker` resolves to
          '{{ wsl_ci_host_which_docker.stdout | trim }}', which is the Docker
          Desktop shim on the Windows drive, not the Engine installed in this
          distro. Docker Desktop needs a logged-in GUI session, so a runner
          built on it is not unattended. Fix PATH so the distro's own
          /usr/bin/docker wins.
        success_msg: >-
          docker is {{ wsl_ci_host_which_docker.stdout | trim }} (native)

    - name: Back up the owner's .wslconfig before taking it over
      # Once only: `creates`-style guard via a stat, so a re-run does not
      # overwrite the pristine backup with our own managed copy.
      ansible.builtin.copy:
        src: "{{ wsl_ci_host_profile }}/.wslconfig"
        dest: "{{ wsl_ci_host_profile }}/.wslconfig.ra8-backup"
        remote_src: true
        force: false
        mode: "0644"
      failed_when: false

    - name: Write the .wslconfig VM caps
      ansible.builtin.copy:
        dest: "{{ wsl_ci_host_profile }}/.wslconfig"
        mode: "0644"
        content: |
          # Managed by the ra8-firmware wsl_ci_host Ansible role.
          # The owner's original is kept beside this file as
          # .wslconfig.ra8-backup and is restored by the role's removal path.
          [wsl2]
          networkingMode={{ wsl_ci_host_networking_mode }}
          dnsTunneling={{ wsl_ci_host_dns_tunneling | lower }}
          firewall={{ wsl_ci_host_firewall | lower }}

          # This box is treated as a DEDICATED BUILD HOST that happens to run
          # Windows: it is the fastest machine in the fleet and is barely used
          # interactively, so work is pushed here in preference to the slower
          # hosts. These cap the whole WSL2 VM, and what is left outside them
          # is only what an idle desktop needs -- not a gaming reservation.
          # Rationale for each number is in the role defaults.
          processors={{ wsl_ci_host_processors }}
          memory={{ wsl_ci_host_memory }}
          swap={{ wsl_ci_host_swap }}

          # Do not shut the VM down when no interactive session is attached.
          #
          # This is the single most important line here for an unattended
          # runner, and it was found the hard way: WSL tears the VM down a
          # short time after the last session exits, and it does NOT care that
          # a container inside it is midway through a CI job. The runner was
          # observed going offline with busy=true -- GitHub still had a job
          # assigned to a machine that no longer existed. A headless host has
          # no interactive session by definition, so without this the VM is
          # always seconds away from being reaped.
          vmIdleTimeout={{ wsl_ci_host_vm_idle_timeout }}

          [experimental]
          # WSL 2.6.3 rejects this key under [wsl2] ('Unknown key
          # wsl2.autoMemoryReclaim') -- placement is load-bearing, not
          # cosmetic. It is what makes the memory cap a ceiling rather than a
          # reservation.
          autoMemoryReclaim={{ wsl_ci_host_auto_memory_reclaim }}

    - name: Register the Windows autostart task
      # WSL does not start distros on boot. Booting the distro starts its
      # systemd, which starts docker, which starts the runner containers -- so
      # this one task is the whole reboot-survival chain on the Windows side.
      #
      # The command is a BLOCKING keep-alive, not `-e true`. A task that runs
      # `wsl -e true` starts the VM and exits, and WSL then reaps the VM again
      # moments later because nothing holds it open -- an autostart that
      # reliably leaves the runner offline, which is worse than none because it
      # looks configured. `sleep infinity` is one blocked process that holds
      # the distro for as long as the session lasts, and it belts-and-braces
      # the vmIdleTimeout setting rather than relying on it alone.
      ansible.builtin.command:
        argv:
          - schtasks.exe
          - /Create
          - /TN
          - "{{ wsl_ci_host_task_name }}"
          - /TR
          - "wsl.exe -d {{ wsl_ci_host_distro }} -e sleep infinity"
          - /SC
          - "{{ wsl_ci_host_task_trigger }}"
          - /RL
          - LIMITED
          - /F
      register: wsl_ci_host_task_create
      changed_when: wsl_ci_host_task_create.rc == 0

    - name: Read back the task Windows actually stored
      ansible.builtin.command:
        argv: [schtasks.exe, /Query, /TN, "{{ wsl_ci_host_task_name }}"]
      register: wsl_ci_host_task_query
      changed_when: false

    - name: Assert the autostart task exists
      ansible.builtin.assert:
        that:
          - wsl_ci_host_task_name in wsl_ci_host_task_query.stdout
        fail_msg: >-
          schtasks.exe did not report a task named
          {{ wsl_ci_host_task_name }} after creating it, so nothing will start
          this distro after a reboot and the runner would silently stay offline.
        success_msg: "autostart task {{ wsl_ci_host_task_name }} registered"

    # --- Verify the configuration actually took ---------------------------
    #
    # Every check below reads back state rather than trusting the task that set
    # it. A cap that was silently ignored, or a route fix that did not stick,
    # is worse than one never applied: the play reports a protected host and a
    # working runner, and the first symptom is a job that hangs.

    - name: Read back the caps the VM is running under
      ansible.builtin.command:
        cmd: nproc
      register: wsl_ci_host_nproc
      changed_when: false

    - name: Assert the CPU cap took effect
      # Only meaningful after `wsl --shutdown`: .wslconfig is read when the VM
      # boots, so a converge on a running VM legitimately reports the old
      # value. That is why this compares and explains rather than just failing.
      ansible.builtin.assert:
        that:
          - (wsl_ci_host_nproc.stdout | trim | int) <= (wsl_ci_host_processors | int)
        fail_msg: >-
          The distro sees {{ wsl_ci_host_nproc.stdout | trim }} processors,
          more than the {{ wsl_ci_host_processors }} this role caps it at. The
          VM is running with the pre-existing configuration: .wslconfig is read
          only at VM boot. Run `wsl --shutdown` from Windows and re-run this
          play to apply it.
        success_msg: >-
          VM sees {{ wsl_ci_host_nproc.stdout | trim }} processors
          (cap {{ wsl_ci_host_processors }})

    - name: Wait for the clock to be synchronised
      # WAITED for, not sampled once. NTPSynchronized is reset to "no" whenever
      # the time daemon (re)starts and only becomes "yes" once it has actually
      # disciplined the clock, so a single reading taken moments after this
      # play restarted chronyd races it and reports a false failure on a host
      # whose clock is fine. The property is read from the kernel's own
      # synchronisation flag, so it answers for chrony exactly as it did for
      # timesyncd.
      #
      # The underlying fault this guards is real and was measured here: the
      # VM's RTC runs ~4 minutes ahead of true time, so the distro's clock is
      # dragged BACKWARD to the truth. A build straddling that step sees file
      # modification times hundreds of seconds in the future, make reports
      # "Clock skew detected. Your build may be incomplete", and its up-to-date
      # decisions -- which are timestamp comparisons -- stop being sound. That
      # presents as a flaky gate, not as a host fault, which is why it is worth
      # blocking the deploy over.
      ansible.builtin.command:
        cmd: timedatectl show --property=NTPSynchronized --value
      register: wsl_ci_host_ntp
      changed_when: false
      until: (wsl_ci_host_ntp.stdout | trim) == 'yes'
      retries: "{{ wsl_ci_host_clock_retries | int }}"
      delay: "{{ wsl_ci_host_clock_delay | int }}"

    - name: Read the Windows host's own clock
      # Through interop, because this is the OTHER time source and it is the
      # one that is wrong. A WSL2 guest takes its clock from the host and WSL
      # re-asserts host time periodically and on resume, so a Windows clock
      # that disagrees with NTP is re-injected into the distro all day -- and
      # is then corrected back out again. Reading it is how that disagreement
      # stops being an inference and becomes a number the deploy can act on.
      ansible.builtin.command:
        argv:
          - powershell.exe
          - -NoProfile
          - -Command
          - "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"
      register: wsl_ci_host_windows_epoch
      changed_when: false
      failed_when: false

    - name: Read the distro's synchronised clock for comparison
      ansible.builtin.command:
        cmd: date -u +%s
      register: wsl_ci_host_distro_epoch
      changed_when: false

    - name: Assert the Windows clock could be read at all
      # No `when:` guard on the comparison below, so a host where interop is
      # broken cannot skip the check and converge looking healthy. A check that
      # disappears when its dependency does is the failure mode this repository
      # keeps finding; it fails here instead.
      ansible.builtin.assert:
        that:
          - wsl_ci_host_windows_epoch.rc == 0
          - (wsl_ci_host_windows_epoch.stdout | trim) is match('^[0-9]+$')
        fail_msg: >-
          powershell.exe could not be run through WSL interop (rc
          {{ wsl_ci_host_windows_epoch.rc }}), so the Windows clock -- the
          other half of the pair that has to agree -- cannot be read. Interop
          is required by this role anyway (the autostart task is created with
          schtasks.exe), so this is a broken host rather than an unsupported
          one.
        success_msg: "Windows clock read through interop"

    - name: Assert the Windows clock agrees with the distro's synchronised clock
      # THE INVARIANT (#509). chrony above guarantees this distro never steps
      # its own clock backward; it cannot stop WSL pushing the host's clock in.
      # So if the two disagree, every push re-introduces the offset and every
      # correction slews it back out, and the host is measuring durations with
      # a ruler that keeps changing length.
      #
      # This is deliberately a FAILURE and not a warning. Fixing it needs an
      # elevated Windows action, which WSL interop cannot perform -- interop
      # launches .exe under the user's filtered token, so `sc.exe config` and
      # `w32tm /config` are denied -- which makes it an owner action. An owner
      # action recorded only in a debug message is one nobody performs, and
      # this fault survived precisely that treatment once already.
      ansible.builtin.assert:
        that:
          - (((wsl_ci_host_windows_epoch.stdout | trim | int)
              - (wsl_ci_host_distro_epoch.stdout | trim | int)) | abs)
            <= (wsl_ci_host_host_clock_tolerance_s | int)
        fail_msg: >-
          The Windows host clock is
          {{ ((wsl_ci_host_windows_epoch.stdout | trim | int)
              - (wsl_ci_host_distro_epoch.stdout | trim | int)) }}
          seconds away from this distro's NTP-synchronised clock (tolerance
          {{ wsl_ci_host_host_clock_tolerance_s }} s). WSL re-asserts host time
          into the guest, so that offset will be pushed in and slewed back out
          for as long as it exists, and every time-budgeted gate on this host
          measures the wrong thing (#509). Fix it from an ELEVATED PowerShell
          on Windows -- interop cannot, it has no admin token:
          `sc.exe config w32time start= auto`;
          `net start w32time`;
          `w32tm /config /manualpeerlist:"{{ wsl_ci_host_ntp_servers | join(' ') }}"
          /syncfromflags:manual /update`; `w32tm /resync /force`. Then re-run
          this play, and confirm with `make ci-gate GATE=runner-clock`.
        success_msg: >-
          Windows and the distro agree to within
          {{ ((wsl_ci_host_windows_epoch.stdout | trim | int)
              - (wsl_ci_host_distro_epoch.stdout | trim | int)) | abs }}s

    - name: Prove the runner can actually reach GitHub
      # The point of the whole networking section. A runner that cannot resolve
      # and reach api.github.com registers, reports online and then fails every
      # job it is given, which looks like a repository problem rather than a
      # host problem.
      ansible.builtin.uri:
        url: https://api.github.com
        method: GET
        status_code: [200]
        timeout: 20
      register: wsl_ci_host_github

    - name: Report the configured host
      ansible.builtin.debug:
        msg: >-
          WSL host ready: {{ wsl_ci_host_nproc.stdout | trim }} processors,
          memory cap {{ wsl_ci_host_memory }}, swap {{ wsl_ci_host_swap }};
          default route pinned by ra8-wsl-route-pin.timer every
          {{ wsl_ci_host_route_pin_interval }}; clock disciplined by chrony,
          slew-only after the first {{ wsl_ci_host_clock_step_updates }}
          updates, and in agreement with the Windows host;
          api.github.com reachable;
          docker is {{ wsl_ci_host_which_docker.stdout | trim }}; the distro is
          started at {{ wsl_ci_host_task_trigger }} by the Windows task
          {{ wsl_ci_host_task_name }}. Deploy the runner itself with the
          ci_runner_docker role.

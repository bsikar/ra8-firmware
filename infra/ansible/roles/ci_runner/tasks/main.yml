---
# Deploy ARC (Actions Runner Controller) + the ra8-ci runner scale set into an
# existing k3s cluster. Run against the k3s node (see playbooks/ci-runner.yml).
# Idempotent: helm upgrade --install semantics + a re-imported image converge
# on re-run.
#
# This role is AUTHORITATIVE for how the runner image reaches the node.
# infra/images/README.md mirrors it for hand-running the same steps; if the two
# ever disagree, this file is right and the README is stale.

- name: Install buildah (builds the runner image on the node)
  become: true
  ansible.builtin.package:
    name: buildah
    state: present

# --- Build context ----------------------------------------------------------
#
# Staged from the CONTROL NODE'S checkout, which is the whole point: the image
# is then built from the same tree whose gates assert what it contains. See
# ci_runner_context_src in defaults/main.yml for the directory that used not to
# exist and the drift it produced (#513).

- name: Empty the staged build context
  # Emptied rather than overlaid: `copy` never deletes, so a file removed from
  # the tree would live on in the context and could still be COPYed into an
  # image by a Dockerfile that no longer mentions it.
  become: true
  ansible.builtin.file:
    path: "{{ ci_runner_context_dir }}"
    state: absent

- name: Stage the image build contexts onto the node
  become: true
  ansible.builtin.copy:
    src: "{{ ci_runner_context_src }}/{{ item.src }}"
    dest: "{{ ci_runner_context_dir }}/"
    mode: "0644"
    directory_mode: "0755"
  loop:
    - src: .devcontainer
      what: the pinned toolchain
    - src: infra/images/runner
      what: the runner layer
  loop_control:
    label: "{{ item.src }} ({{ item.what }})"

- name: Create the locked Python bootstrap path in the staged context
  become: true
  ansible.builtin.file:
    path: "{{ ci_runner_context_dir }}/scripts/dev"
    state: directory
    mode: "0755"

- name: Stage the root-context Python lock and bootstrap inputs
  become: true
  ansible.builtin.copy:
    src: "{{ ci_runner_context_src }}/{{ item.src }}"
    dest: "{{ ci_runner_context_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: .dockerignore
      dest: .dockerignore
      mode: "0644"
    - src: pyproject.toml
      dest: pyproject.toml
      mode: "0644"
    - src: uv.lock
      dest: uv.lock
      mode: "0644"
    - src: scripts/dev/bootstrap_uv.py
      dest: scripts/dev/bootstrap_uv.py
      mode: "0755"
    - src: scripts/dev/bootstrap_uv_exec.py
      dest: scripts/dev/bootstrap_uv_exec.py
      mode: "0644"
    - src: scripts/dev/managed_python_env.py
      dest: scripts/dev/managed_python_env.py
      mode: "0755"
    - src: scripts/dev/managed_python_env_checks.py
      dest: scripts/dev/managed_python_env_checks.py
      mode: "0755"
    - src: scripts/dev/uv_release.json
      dest: scripts/dev/uv_release.json
      mode: "0644"
  loop_control:
    label: "{{ item.src }}"

- name: Read back every staged root-context authority byte-for-byte
  when: not ansible_check_mode
  become: true
  ansible.builtin.slurp:
    src: "{{ ci_runner_context_dir }}/{{ item }}"
  register: ci_runner_root_context_bytes
  loop:
    - .dockerignore
    - pyproject.toml
    - scripts/dev/bootstrap_uv.py
    - scripts/dev/bootstrap_uv_exec.py
    - scripts/dev/managed_python_env.py
    - scripts/dev/managed_python_env_checks.py
    - scripts/dev/uv_release.json
    - uv.lock

- name: Prove the staged root authorities match the control checkout exactly
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - (item.content | b64decode | hash('sha256')) ==
        (lookup('file', ci_runner_context_src + '/' + item.item, rstrip=false)
         | hash('sha256'))
    fail_msg: >-
      The staged root-context input {{ item.item }} differs byte-for-byte from
      {{ ci_runner_context_src }} on the control node; refusing a split-input
      image build.
  loop: "{{ ci_runner_root_context_bytes.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert both Dockerfiles and every locked Python input arrived
  # These files are outputs of the staging tasks above. In check mode Ansible
  # validates every control-side source and reports the copies, but correctly
  # does not create their target-side outputs. Inspecting the old target
  # context then would turn an intended change into a false missing-file
  # failure.
  when: not ansible_check_mode
  # A `buildah bud` against a missing -f is an error, but a HALF-staged context
  # is not: it builds, from whatever did arrive. Check the two files the builds
  # name before running either.
  become: true
  ansible.builtin.stat:
    path: "{{ ci_runner_context_dir }}/{{ item }}"
  register: ci_runner_context_stat
  loop:
    - .dockerignore
    - .devcontainer/Dockerfile
    - pyproject.toml
    - runner/Dockerfile
    - scripts/dev/bootstrap_uv.py
    - scripts/dev/bootstrap_uv_exec.py
    - scripts/dev/managed_python_env.py
    - scripts/dev/managed_python_env_checks.py
    - scripts/dev/uv_release.json
    - uv.lock

- name: Fail loud when the staged context is incomplete
  when:
    - not ansible_check_mode
    - ci_runner_context_stat.results | rejectattr('stat.exists') | list | length > 0
  ansible.builtin.fail:
    msg: >-
      The staged build context under {{ ci_runner_context_dir }} is missing
      {{ ci_runner_context_stat.results | rejectattr('stat.exists')
         | map(attribute='item') | join(', ') }}. It is copied from
      {{ ci_runner_context_src }} on the control node, so this means the play
      was run from somewhere that is not a checkout of this repository.
      Building on would produce an image from half a tree.

- name: Build the devcontainer toolchain image (single source of truth)
  become: true
  ansible.builtin.command:
    cmd: >-
      buildah bud --isolation chroot
      -t {{ ci_runner_devcontainer_image }}
      -f {{ ci_runner_context_dir }}/.devcontainer/Dockerfile
      {{ ci_runner_context_dir }}
  register: ci_runner_dc_build
  changed_when: ci_runner_dc_build.rc == 0

- name: Build the runner image (devcontainer + actions-runner)
  become: true
  ansible.builtin.command:
    cmd: >-
      buildah bud --isolation chroot
      --build-arg BASE_IMAGE={{ ci_runner_devcontainer_image }}
      -t {{ ci_runner_image }}
      -f {{ ci_runner_context_dir }}/runner/Dockerfile
      {{ ci_runner_context_dir }}/runner
  register: ci_runner_runner_build
  changed_when: ci_runner_runner_build.rc == 0

- name: Ensure the k3s auto-import and staging directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ci_runner_image_dir }}"
    - "{{ ci_runner_image_stage_dir }}"

# buildah's docker-archive transport APPENDS to an existing archive rather than
# replacing it, so a stage file left behind by an interrupted run would produce
# a two-image archive of twice the size. Start from nothing.
- name: Remove any staged archive left by an interrupted run
  become: true
  ansible.builtin.file:
    path: "{{ ci_runner_image_stage }}"
    state: absent

# Staged, not written straight into the watched directory -- see the comment
# on ci_runner_image_stage_dir for the partial-import failure that causes.
- name: Export the runner image to a staged docker-archive
  become: true
  ansible.builtin.command:
    cmd: >-
      buildah push {{ ci_runner_image }}
      docker-archive:{{ ci_runner_image_stage }}:{{ ci_runner_image }}
  changed_when: true

# The tag-drift trap that produced #484: the archive recovered by hand carried
# :latest while the scale set boots :v2, so the import "succeeded" and the pods
# still could not find their image. Read the tag the archive actually claims
# BEFORE it is published, and refuse to continue on a mismatch. Both producers
# write the Docker manifest.json this reads -- `buildah push docker-archive:`
# always, `ctr images export` unless --skip-manifest-json is passed.
- name: Read the image tags embedded in the staged archive
  become: true
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys
        import tarfile
        with tarfile.open(sys.argv[1]) as archive:
            entries = json.load(archive.extractfile("manifest.json"))
        for entry in entries:
            for tag in entry.get("RepoTags") or []:
                print(tag)
      - "{{ ci_runner_image_stage }}"
  register: ci_runner_archive_tags
  changed_when: false

- name: Assert the staged archive is tagged exactly as the scale set expects
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - ci_runner_image in ci_runner_archive_tags.stdout_lines
    fail_msg: >-
      {{ ci_runner_image_stage }} is tagged
      {{ ci_runner_archive_tags.stdout_lines | default(['<none>']) | join(', ') }}
      but the scale set boots {{ ci_runner_image }} with imagePullPolicy Never.
      Importing this archive would leave every pod in ErrImageNeverPull (#484).
      Rebuild the archive with the tag the deployment uses.
    success_msg: "staged archive is tagged {{ ci_runner_image }}"

# Atomic rename into the watched directory: k3s sees one complete file.
- name: Publish the archive into the k3s auto-import directory
  become: true
  ansible.builtin.command:
    cmd: mv -f {{ ci_runner_image_stage }} {{ ci_runner_image_archive }}
  changed_when: true

# k3s would import the archive on its own (watcher now, agent start later), but
# a provisioning run must converge without waiting on either, so import here
# too. Both paths are idempotent -- the same digest under the same name.
- name: Import the runner image into the node's containerd
  become: true
  ansible.builtin.command:
    cmd: k3s ctr -n k8s.io images import {{ ci_runner_image_archive }}
  changed_when: true

# Pin it against the containerd CRI garbage collector, which is what evicted
# the image in #484. Verified on the node: containerd v2.1.5-k3s1 honours
# io.cri-containerd.pinned, and k3s applies that same label itself to
# everything it imports from ci_runner_image_dir (labelImages in
# pkg/agent/containerd). This makes the import done above -- which does not go
# through that code path -- pinned as well.
- name: Pin the runner image so containerd's CRI GC cannot evict it
  become: true
  ansible.builtin.command:
    cmd: >-
      k3s ctr -n k8s.io images label {{ ci_runner_image }}
      io.cri-containerd.pinned=pinned
  changed_when: true

- name: Read back the imported image ref and its labels
  become: true
  ansible.builtin.command:
    cmd: k3s ctr -n k8s.io images ls name=={{ ci_runner_image }}
  register: ci_runner_image_check
  changed_when: false

- name: Assert the image the pods boot exists in containerd and is pinned
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - ci_runner_image in ci_runner_image_check.stdout
      - "'io.cri-containerd.pinned=pinned' in ci_runner_image_check.stdout"
    fail_msg: >-
      containerd has no pinned {{ ci_runner_image }} after import. The pods use
      imagePullPolicy Never, so they cannot recover this themselves -- they
      would sit in ErrImageNeverPull until someone noticed (#484).
      Node reported: {{ ci_runner_image_check.stdout | default('<no output>') }}
    success_msg: "{{ ci_runner_image }} present in containerd and pinned"

# Pre-#484 deploys left the archive in /tmp, where nothing re-imports it and
# systemd-tmpfiles eventually deletes it. Drop it so there is exactly one
# archive on the node and it is the durable one.
- name: Remove the pre-#484 archive from /tmp
  become: true
  ansible.builtin.file:
    path: /tmp/ra8-ci-runner.tar
    state: absent

# The pinned-tool cache backing store (#486). Chowned to the runner uid/gid
# here, on the node, so the hostPath mount below is writable the moment a pod
# starts -- an ephemeral, one-pod-per-job runner never gets the chance to run
# its own one-time chown step.
- name: Ensure the pinned-tool cache directory exists and is owned by the runner user
  become: true
  ansible.builtin.file:
    path: "{{ ci_runner_tools_cache_node_dir }}"
    state: directory
    owner: "{{ ci_runner_uid }}"
    group: "{{ ci_runner_gid }}"
    mode: "0755"

- name: Install the ARC controller
  become: true
  vars:
    ansible_python_interpreter: "{{ ci_runner_python_interpreter }}"
  kubernetes.core.helm:
    name: arc
    chart_ref: "{{ ci_runner_controller_chart }}"
    chart_version: "{{ ci_runner_arc_chart_version }}"
    release_namespace: "{{ ci_runner_controller_namespace }}"
    create_namespace: true
    kubeconfig: "{{ ci_runner_kubeconfig }}"

- name: Ensure the runner namespace exists
  become: true
  vars:
    ansible_python_interpreter: "{{ ci_runner_python_interpreter }}"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ ci_runner_namespace }}"
    state: present
    kubeconfig: "{{ ci_runner_kubeconfig }}"

- name: Record whether an explicit ARC credential was supplied
  ansible.builtin.set_fact:
    ci_runner_explicit_github_credential_supplied: >-
      {{ (ci_runner_github_pat | default('') | trim | length) > 0 }}

- name: Probe the existing ARC credential without returning its value
  # An established runner pool already has this secret. Requiring every
  # idempotent converge to re-materialise its value on the control node makes
  # an image refresh depend on a second copy of a long-lived credential. A
  # first deployment must still supply ci_runner_github_pat; later runs may
  # preserve the live Secret after the target-side template proves its expected
  # key is non-empty. The controller receives only "present", never the value.
  become: true
  ansible.builtin.command:
    argv:
      - "{{ ci_runner_k3s_bin }}"
      - kubectl
      - --kubeconfig
      - "{{ ci_runner_kubeconfig }}"
      - --namespace
      - "{{ ci_runner_namespace }}"
      - get
      - secret
      - "{{ ci_runner_github_secret_name }}"
      - --output
      - >-
        go-template={{ '{{' }} if .data.github_token {{ '}}' }}present{{ '{{' }} end {{ '}}' }}
  register: ci_runner_existing_github_credential
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require one explicit or already-deployed ARC credential source
  ansible.builtin.assert:
    that:
      - ci_runner_explicit_github_credential_supplied | bool
        or (
          ci_runner_existing_github_credential.rc == 0
          and (ci_runner_existing_github_credential.stdout | trim) == 'present'
        )
    fail_msg: >-
      No deployed {{ ci_runner_github_secret_name }} Secret with a github_token
      key exists, and ci_runner_github_pat was not supplied. Bootstrap from a
      mode-0600 infra/ansible/private/secrets.yml or the documented OpenBao
      lookup; established converges preserve the deployed Secret.
    success_msg: >-
      ARC credential source is available without exposing its value.

- name: Create or rotate the GitHub PAT secret ARC registers with
  when: ci_runner_explicit_github_credential_supplied | bool
  become: true
  no_log: true
  vars:
    ansible_python_interpreter: "{{ ci_runner_python_interpreter }}"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ ci_runner_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ci_runner_github_secret_name }}"
        namespace: "{{ ci_runner_namespace }}"
      type: Opaque
      stringData:
        github_token: "{{ ci_runner_github_pat }}"

- name: Install the ra8-ci runner scale set
  become: true
  vars:
    ansible_python_interpreter: "{{ ci_runner_python_interpreter }}"
  kubernetes.core.helm:
    name: "{{ ci_runner_scale_set_name }}"
    chart_ref: "{{ ci_runner_scaleset_chart }}"
    chart_version: "{{ ci_runner_arc_chart_version }}"
    release_namespace: "{{ ci_runner_namespace }}"
    kubeconfig: "{{ ci_runner_kubeconfig }}"
    values:
      githubConfigUrl: "{{ ci_runner_github_url }}"
      githubConfigSecret: "{{ ci_runner_github_secret_name }}"
      runnerScaleSetName: "{{ ci_runner_scale_set_name }}"
      minRunners: "{{ ci_runner_min | int }}"
      maxRunners: "{{ ci_runner_max | int }}"
      template:
        spec:
          # hostPath, not emptyDir (#486): an emptyDir is exactly as ephemeral
          # as the pod, so it would still lose the cached doxygen download
          # every time the (ephemeral, one-pod-per-job) runner is recycled.
          # The single-node k3s cluster makes a node-local hostPath as durable
          # as the ccache mount the containerised `just ci` path already uses
          # for the same reason.
          volumes:
            - name: ra8-tools-cache
              hostPath:
                path: "{{ ci_runner_tools_cache_node_dir }}"
                type: DirectoryOrCreate
          containers:
            - name: runner
              image: "{{ ci_runner_image }}"
              imagePullPolicy: Never
              command: ["/home/runner/run.sh"]
              volumeMounts:
                - name: ra8-tools-cache
                  mountPath: "{{ ci_runner_tools_cache_mount }}"
              resources:
                requests:
                  cpu: "{{ ci_runner_cpu_request }}"
                  memory: "{{ ci_runner_mem_request }}"
                limits:
                  cpu: "{{ ci_runner_cpu_limit }}"
                  memory: "{{ ci_runner_mem_limit }}"

---
# Re-read unit files after this role writes or removes any of them. Without it
# `systemctl enable` acts on whatever systemd last parsed, which on a first
# install is nothing at all.
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

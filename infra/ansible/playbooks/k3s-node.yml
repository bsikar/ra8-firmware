---
# Bring a bare host up as the single-node k3s server the rig's CI and secrets
# run on, then deploy the vault onto it.
#
# Operator entry point: `just infra::apply k3s-pve`. The fleet dispatcher
# generates inventory, derives variables, and preserves the declared play
# order; this file is an internal Ansible implementation detail.
#
# The vault is deployed but deliberately NOT initialised or unsealed -- both
# produce secrets. The play reports what it left for the operator; the steps are
# in scripts/secrets/README.md.
- name: Provision the k3s node and its vault
  hosts: k3s_nodes
  gather_facts: true
  roles:
    - k3s_node
    - openbao

---
# Turn a Windows machine's WSL2 Ubuntu distro into a CI runner host, and deploy
# the runner into it.
#
# Two roles, in order: `wsl_ci_host` does everything Windows- and WSL-specific
# (VM caps, the mirrored-networking route fix, systemd, Docker Engine, the
# Windows autostart task), then `ci_runner_docker` -- the same role the NAS
# uses, unmodified -- deploys the runner container. See infra/README.md.
#
# WHERE THIS RUNS: on the target, inside the distro. WSL has no SSH daemon of
# its own, and giving it one would mean opening an inbound port on somebody's
# personal daily-driver machine and punching a hole in their firewall so a
# config management tool could reach it. The play is therefore copied in and
# run with `--connection=local`, which costs nothing and asks nothing of their
# network.
#
# That copy-in used to be a hand-run pipeline written out here. It is codified
# now -- scripts/dev/fleet.py knows this host's transport from its block in
# infra/fleet.yml -- so the whole operation is:
#
#   gh api -X POST repos/bsikar/ra8-firmware/actions/runners/registration-token
#   python3 scripts/dev/fleet.py apply win-ci \
#     -e ci_runner_docker_registration_token=<token>
#
#   # just the drain script and the quiet-hours timer, touching no container:
#   python3 scripts/dev/fleet.py apply win-ci --tags capacity
#
#   # remove, with a removal token from .../actions/runners/remove-token:
#   python3 scripts/dev/fleet.py remove win-ci \
#     -e ci_runner_docker_removal_token=<token>
#
# The token is good for one hour and one use, so no long-lived credential ever
# lands on the machine. See the ci_runner_docker credentials defaults, and
# docs/CI_FLEET.md for the runbooks.
- name: Configure a WSL2 host and deploy a CI runner into it
  hosts: all
  connection: local
  gather_facts: true
  # Loaded explicitly rather than by inventory host name: this play runs with
  # `-i localhost,` (see above), so the host is called "localhost" and Ansible
  # would never pick up inventory/host_vars/win-ci.yml on its own.
  # scripts/dev/fleet.py passes -e wsl_ci_host_id=<fleet host name>; a second
  # WSL machine is a second block in infra/fleet.yml and a second file there.
  vars:
    wsl_ci_host_id: "win-ci"
  vars_files:
    - "{{ playbook_dir }}/../inventory/host_vars/{{ wsl_ci_host_id }}.yml"
  pre_tasks:
    - name: Load local secrets if present (bootstrap writes private/secrets.yml)
      ansible.builtin.include_vars: "{{ item }}"
      vars:
        item: "{{ playbook_dir }}/../private/secrets.yml"
      when: item is exists
  roles:
    - wsl_ci_host
    - ci_runner_docker
    # Last: the capacity script has to name the instance containers the role
    # above has just created, and its timer is what stands this host down
    # during the owner's declared quiet hours.
    #
    # Tagged so `--tags capacity` can refresh the drain script and the timer on
    # their own, without re-running the Windows-side setup or touching a single
    # container.
    - role: fleet_capacity
      tags: [capacity]

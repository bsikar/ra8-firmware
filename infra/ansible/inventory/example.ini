# Copy to inventory/hosts.ini (git-ignored) and fill in real hosts.
# Placeholder values only -- no real hostnames or IPs live in the repo.

# The k3s node that hosts the ARC controller + runner pods.
[ci_runners]
k3s-node ansible_host=REPLACE_WITH_HOST ansible_user=REPLACE_WITH_USER

# Second build host: a plain self-hosted runner in Docker, on a machine that is
# NOT the k3s node (ci_runner_docker role). The point is to stop CI and the dev
# container contending for one CPU, so putting this host in [ci_runners] as
# well would defeat it.
[ci_runners_docker]
docker-runner ansible_host=REPLACE_WITH_HOST ansible_user=REPLACE_WITH_USER

# HIL bench: the Pi with the EK-RA8D2 + J-Link attached (hil_bench role).
[hil_bench]
hil-pi ansible_host=REPLACE_WITH_HOST ansible_user=REPLACE_WITH_USER

# Developer boxes (dev role -- planned).
# [dev_boxes]

# Third build host: a Windows machine's WSL2 Ubuntu distro (wsl_ci_host role,
# then ci_runner_docker into it). It is listed for completeness only -- that
# play runs ON the target with --connection=local, because WSL has no SSH
# daemon and giving a personal daily-driver machine one, plus the firewall hole
# to reach it, is not a reasonable ask. See playbooks/wsl-ci-host.yml.
[wsl_ci_hosts]
win-ci-1 ansible_connection=local

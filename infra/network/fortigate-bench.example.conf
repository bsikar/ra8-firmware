# EXAMPLE ONLY: documentation and validation fixture. Do not apply to hardware.
# The addresses use TEST-NET ranges and the MAC addresses are locally
# administered placeholders. Live replay reads the private operator file.
config system global
set hostname "example-firewall"
set admin-scp enable
set gui-theme mariner
end

config system virtual-switch
edit "internal"
set physical-switch "sw0"
config port
edit "port1"
next
edit "port3"
next
edit "port5"
next
edit "port7"
next
edit "port9"
next
edit "port11"
next
end
next
edit "lan-even"
set physical-switch "sw0"
config port
edit "port2"
next
edit "port4"
next
edit "port6"
next
edit "port8"
next
edit "port10"
next
edit "port12"
next
end
next
end

config system interface
edit "internal"
set mode static
set ip 192.0.2.1 255.255.255.0
set allowaccess ping https ssh
set alias "bench-lan"
set description "example isolated LAN"
next
end

config system interface
edit "lan-even"
set ip 198.51.100.1 255.255.255.0
set allowaccess ping https ssh
set type hard-switch
set description "even ports (2,4,6,8,10,12): internet via wan1"
set alias "even-wan"
set device-identification enable
set lldp-transmission enable
set role lan
next
end

config system interface
edit "wan1"
set mode dhcp
set allowaccess ping
set defaultgw enable
set distance 5
next
edit "wan2"
set mode static
set allowaccess ping
next
end

config system dhcp server
edit 1
set dns-service default
set default-gateway 192.0.2.1
set netmask 255.255.255.0
set interface "internal"
config ip-range
edit 1
set start-ip 192.0.2.100
set end-ip 192.0.2.199
next
end
config reserved-address
edit 1
set ip 192.0.2.10
set mac 02:00:00:00:00:10
set description "example-ap"
next
edit 2
set ip 192.0.2.101
set mac 02:00:00:00:00:11
set description "example-client"
next
end
next
edit 3
set dns-service default
set default-gateway 198.51.100.1
set netmask 255.255.255.0
set interface "lan-even"
config ip-range
edit 1
set start-ip 198.51.100.100
set end-ip 198.51.100.199
next
end
config reserved-address
edit 1
set ip 198.51.100.102
set mac 02:00:00:00:00:12
set description "example-camera"
next
end
next
end

config firewall policy
edit 1
set name "even-to-wan"
set srcintf "lan-even"
set dstintf "wan1"
set srcaddr "all"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
set nat enable
next
edit 2
set name "deny-odd-to-wan"
set srcintf "internal"
set dstintf "wan1"
set srcaddr "all"
set dstaddr "all"
set schedule "always"
set service "ALL"
set logtraffic disable
next
edit 3
set name "odd-to-even-mgmt"
set srcintf "internal"
set dstintf "lan-even"
set srcaddr "all"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
next
end

config system central-management
set type none
end
config system fortiguard
set auto-join-forticloud disable
set antispam-force-off enable
set webfilter-force-off enable
end
config system autoupdate schedule
set status disable
end

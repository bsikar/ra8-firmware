# fortigate-bench.conf -- idempotent FortiOS CLI for the ESP32-C6 wireless
# bench LAN, now split into an ISLANDED odd segment and an INTERNET-UPLINKED
# even segment (for devices that need internet access). Replay it AFTER
# `execute factoryreset` with (the sibling declaration is the default):
#
#     just infra::fortigate_bootstrap
#
# This is VENDOR FortiOS CLI, not first-party firmware: the repo's C23 / SOUP
# coding rules do not apply to it. fg_bringup.py strips every line that starts
# with '#' before sending, so this file may carry comments and this licence
# header. It NEVER contains the admin password: fg_bringup.py sets that from
# OpenBao (secret/ra8d2/bench-network) during `bootstrap`, before this replay
# runs.
#
# ---------------------------------------------------------------------------
# STATUS: this declaration began with the configuration captured READ-ONLY from
# the unit (FortiGate-81E-POE, FortiOS v6.4.6 build1879) on 2026-08-02 and now
# carries reviewed desired-state changes. The star-bench-wired and cam-relay
# reservations were synchronized from the live declaration on 2026-08-28.
# This is authoritative replay state, not a claim that live state matches every
# command. A replay can disrupt the even segment and requires explicit review
# and approval.
#
# TOPOLOGY -- two hard-switch segments on the one physical switch (sw0):
#   * "internal" (odd ports 1,3,5,7,9,11): 10.0.40.1/24, DHCP .100-.199.
#     ISLANDED -- policy 2 explicitly DENIES odd -> wan1 even though wan1's
#     DHCP route is device-wide. ALL the bench kit lives here (AP, C6, bench Pi).
#   * "lan-even"  (even ports 2,4,6,8,10,12): 10.0.41.1/24, DHCP .100-.199.
#     NATs out wan1 (policy 1) -- for even-segment devices that need internet.
#   Odd may reach even for management (policy 3); even may NOT reach odd.
#
# THE LATENT LEAK THIS FILE MUST NOT REINTRODUCE: policy 1 pre-existed as
# `srcintf lan -> wan1 all/all accept NAT`, inert ONLY because wan1 had no
# address. wan1 now takes a DHCP lease, so that old pair would have silently
# handed the WHOLE islanded bench full internet with no further change. Policy
# 1 srcintf is therefore "lan-even", NEVER "lan"; do not "simplify" it back.
#
# The primary LAN hard-switch is named "lan" (type hard-switch) on this box;
# fg_bringup.py detect_lan() resolves the real name post-wipe and rewrites the
# "internal" token below to it, so this file stays model-agnostic. The SECOND
# switch is named "lan-even" literally (a name we chose, not a factory name)
# and shares no substring with "internal", so that rewrite -- a plain replace
# of the "internal" token -- leaves every "lan-even" reference untouched.
#
# PRE-FLIGHT (confirmed on this unit -- serial recorded in OpenBao
# secret/ra8d2/bench-network key `fortigate_serial`; the serial is kept in the
# vault, not here, because FortiOS derives the `maintainer` recovery password
# from it as `bcpb<serial>` -- see infra/network/README.md):
#   - The AP (Meraki MR18) MAC is 00:18:0a:7b:dd:eb; it is reserved to
#     10.0.40.10 below so it lands there whether it is static or DHCP.
#   - The wired bench Pi (star-bench-wired) MAC is 00:05:1b:db:75:d3; DHCP
#     server 1 reservation 2 pins it to 10.0.40.101 on the odd segment.
#   - The camera relay (cam-relay) MAC is 88:a2:9e:9b:d0:ea; DHCP server 3
#     reservation 1 pins it to 10.0.41.102 on the even segment.
#   - C6, iPhone, Mac, and Windows clients remain transient DHCP leases. Do not
#     add a reservation for any of them when reconciling a live lease table.
#   - PoE on the LAN ports is ON by default on the 81E-POE; verify with
#     `get system poe`. No `config` knob is asserted here so we cannot wrongly
#     disable it.
# ---------------------------------------------------------------------------

# --- Identity --------------------------------------------------------------
config system global
set hostname "ra8-bench-fw"
set admin-scp enable
set gui-theme mariner
end

# --- Hard-switch split: odd ports islanded, even ports uplinked ------------
# "internal" (rewritten to the real primary name) keeps ONLY the odd ports;
# "lan-even" is a second hard-switch on the same physical switch (sw0) carrying
# the even ports. On a factory-reset unit the single switch holds every port,
# so the primary's odd-only member list must free the even ports before
# lan-even can claim them -- confirm that convergence at the next bootstrap.
config system virtual-switch
edit "internal"
set physical-switch "sw0"
config port
edit "port1"
next
edit "port3"
next
edit "port5"
next
edit "port7"
next
edit "port9"
next
edit "port11"
next
end
next
edit "lan-even"
set physical-switch "sw0"
config port
edit "port2"
next
edit "port4"
next
edit "port6"
next
edit "port8"
next
edit "port10"
next
edit "port12"
next
end
next
end

# --- LAN (odd) interface: 10.0.40.1/24, admin over ssh+https+ping ----------
config system interface
edit "internal"
set mode static
set ip 10.0.40.1 255.255.255.0
set allowaccess ping https ssh
set alias "bench-lan"
set description "isolated ESP32-C6 bench LAN (no uplink)"
next
end

# --- LAN-even interface: 10.0.41.1/24, internet via wan1 -------------------
config system interface
edit "lan-even"
set ip 10.0.41.1 255.255.255.0
set allowaccess ping https ssh
set type hard-switch
set description "even ports (2,4,6,8,10,12): internet via wan1"
set alias "even-wan"
set device-identification enable
set lldp-transmission enable
set role lan
next
end

# --- WAN1 uplink: DHCP from the house AT&T gateway (even segment only) -----
# wan1 is NO LONGER dark. It takes a DHCP lease and installs a default route
# (defaultgw enable, distance 5 -- the FortiOS DHCP-WAN defaults, stated
# explicitly here). The odd segment is kept off it by firewall policy 2; only
# the even segment NATs out (policy 1). wan2 stays dark.
config system interface
edit "wan1"
set mode dhcp
set allowaccess ping
set defaultgw enable
set distance 5
next
edit "wan2"
set mode static
set allowaccess ping
next
end

# --- DHCP: odd pool (.40.100-.199) and even pool (.41.100-.199) ------------
# .40.2-.99 / .41.2-.99 stay free for statics. The AP lives at the static
# .40.10 (set on the AP itself), reserved to its MAC so it lands there either
# way. star-bench-wired is reserved at .40.101 and cam-relay at .41.102.
# Transient client leases are not reservations. Server 2 (fortilink
# 169.254.1.x) is a FortiOS default left untouched.
config system dhcp server
edit 1
set dns-service default
set default-gateway 10.0.40.1
set netmask 255.255.255.0
set interface "internal"
config ip-range
edit 1
set start-ip 10.0.40.100
set end-ip 10.0.40.199
next
end
config reserved-address
edit 1
set ip 10.0.40.10
set mac 00:18:0a:7b:dd:eb
set description "MR18-AP"
next
edit 2
set ip 10.0.40.101
set mac 00:05:1b:db:75:d3
set description "star-bench-wired"
next
end
next
edit 3
set dns-service default
set default-gateway 10.0.41.1
set netmask 255.255.255.0
set interface "lan-even"
config ip-range
edit 1
set start-ip 10.0.41.100
set end-ip 10.0.41.199
next
end
config reserved-address
edit 1
set ip 10.0.41.102
set mac 88:a2:9e:9b:d0:ea
set description "cam-relay"
next
end
next
end

# --- Firewall: even NATs out, odd is denied out, odd may manage even -------
# Policy 1 srcintf is "lan-even", NEVER "lan": with wan1 now up, an
# "lan -> wan1 accept" here would internet-expose the whole islanded bench.
# Policy 2 has NO `set action`, so it DENIES (the FortiOS default) -- this is
# what keeps the odd segment off the uplink; do not add `set action accept`.
config firewall policy
edit 1
set name "even-to-wan"
set srcintf "lan-even"
set dstintf "wan1"
set srcaddr "all"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
set nat enable
next
edit 2
set name "deny-odd-to-wan"
set srcintf "internal"
set dstintf "wan1"
set srcaddr "all"
set dstaddr "all"
set schedule "always"
set service "ALL"
set logtraffic disable
next
edit 3
set name "odd-to-even-mgmt"
set srcintf "internal"
set dstintf "lan-even"
set srcaddr "all"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
next
end

# --- Cut phone-home traffic (belt-and-braces on the uplinked even segment) -
config system central-management
set type none
end
config system fortiguard
set auto-join-forticloud disable
set antispam-force-off enable
set webfilter-force-off enable
end
config system autoupdate schedule
set status disable
end

# --- wan1 owns the device-wide default route; policy 2 denies ODD access. ---

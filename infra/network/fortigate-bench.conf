#
# fortigate-bench.conf -- idempotent FortiOS CLI for the isolated ESP32-C6
# wireless bench LAN. Replay it AFTER `execute factoryreset` with:
#
#     python3 infra/network/fg_bringup.py bootstrap infra/network/fortigate-bench.conf
#
# fg_bringup.py strips every line that starts with '#' before sending, so this
# file may carry comments and this licence header. It NEVER contains the admin
# password: fg_bringup.py sets that from OpenBao (secret/ra8d2/bench-network)
# during `bootstrap`, before this replay runs.
#
# ---------------------------------------------------------------------------
# STATUS: this config has NOT yet been applied to hardware. The pre-wipe
# FortiGate rejects both the owner-supplied password and the admin/<blank>
# factory default, so `execute factoryreset` cannot be reached over the
# console, and there is no authorised power-cycle path for the maintainer
# recovery account. See infra/network/README.md ("Current status"). The blocks
# below are the reviewed TARGET config for a standalone FortiGate 81E-POE on
# FortiOS 7.x, to be confirmed against the real post-reset interface names.
#
# PRE-FLIGHT (confirmed on this unit -- serial recorded in OpenBao
# secret/ra8d2/bench-network key `fortigate_serial`; FortiOS v6.4.6
# build1879). The serial is kept in the vault rather than here because
# FortiOS derives the `maintainer` recovery password from it as
# `bcpb<serial>` -- see infra/network/README.md:
#   - The LAN hardware switch is named "lan" (type hard-switch) on this box.
#     fg_bringup.py detect_lan() resolves the real name post-wipe and rewrites
#     the "internal" token below to it, so this file stays model-agnostic.
#   - The AP (Meraki MR18) MAC is 00:18:0a:7b:dd:eb; it is reserved to
#     10.0.40.10 below so it lands there whether it is static or DHCP.
#   - PoE on the LAN ports is ON by default on the 81E-POE; verify with
#     `get system poe`. No `config` knob is asserted here so we cannot wrongly
#     disable it.
# ---------------------------------------------------------------------------

# --- Identity --------------------------------------------------------------
config system global
set hostname "ra8-bench-fw"
set admin-scp enable
set gui-theme mariner
end

# --- LAN interface: 10.0.40.1/24, admin over ssh+https+ping ----------------
config system interface
edit "internal"
set mode static
set ip 10.0.40.1 255.255.255.0
set allowaccess ping https ssh
set alias "bench-lan"
set description "isolated ESP32-C6 bench LAN (no uplink)"
next
end

# --- Keep the WAN dark: no DHCP client, no address, isolation is the point -
config system interface
edit "wan1"
set mode static
set allowaccess ping
next
edit "wan2"
set mode static
set allowaccess ping
next
end

# --- DHCP on the LAN: .100-.199 pool, .2-.99 reserved for statics ----------
# The AP lives at the static .10 (set on the AP itself), outside this pool.
config system dhcp server
edit 1
set dns-service default
set default-gateway 10.0.40.1
set netmask 255.255.255.0
set interface "internal"
config ip-range
edit 1
set start-ip 10.0.40.100
set end-ip 10.0.40.199
next
end
config reserved-address
edit 1
set ip 10.0.40.10
set mac 00:18:0a:7b:dd:eb
set description "MR18-AP"
next
end
next
end

# --- Cut phone-home traffic (belt-and-braces; there is no route anyway) -----
config system central-management
set type none
end
config system fortiguard
set auto-join-forticloud disable
set antispam-force-off enable
set webfilter-force-off enable
end
config system autoupdate schedule
set status disable
end

# --- No default route: the bench is deliberately islanded. Nothing here. ----

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Page 2</title>
    <!-- Per-page pixel viewport: the fixed-layout way to pin a page to the
         image's intrinsic size. The compiler keeps only each chapter's <body>
         subtree, so this <head> <meta> is dropped from the .rabook (harmless:
         the renderer sizes the page from the image's own dimensions). -->
    <meta name="viewport" content="width=32, height=24"/>
  </head>
  <body>
    <img src="../images/page2.png" alt="Page 2"/>
  </body>
</html>

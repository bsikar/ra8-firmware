<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Page 1</title>
  </head>
  <body>
    <!-- Plain image-only page: no flowable text, one full-page raster. The src is
         relative to THIS file (text/), so it points up-and-over into images/.

         strings differ, which is the img-src vs manifest-href gap the spike
         surfaces (see the fixture README). -->
    <img src="../images/page1.png" alt="Page 1"/>

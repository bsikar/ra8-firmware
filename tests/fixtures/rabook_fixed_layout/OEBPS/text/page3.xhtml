<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Page 3</title>
  </head>
  <body>
    <!-- SVG <image> wrapper page: the other common fixed-layout idiom. The raster
         is referenced by an <svg><image xlink:href=...> instead of a bare <img>.
         The compiler keeps the inline <svg>/<image> as ordinary DOM elements
         (it is NOT a manifest image/svg+xml item), and the referenced PNG is
         transcoded to 4bpp like any other manifest raster. The xlink:href has
         the same text/ vs images/ path mismatch as page1. -->
    <svg xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 0 21 28" width="21" height="28">
      <image width="21" height="28" xlink:href="../images/page3.png"/>
    </svg>
  </body>
</html>

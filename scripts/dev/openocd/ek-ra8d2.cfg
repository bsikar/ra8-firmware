# ek-ra8d2.cfg -- OpenOCD board configuration for the EK-RA8D2 evaluation kit.
#
# This is the GPL-tools alternative to the SEGGER J-Link / Ozone path. It is
# intended for users on Linux (and anyone who cannot install the proprietary
# SEGGER package). The default macOS / Windows path remains:
#
#     scripts/dev/flash.sh   -> JLinkExe
#     scripts/dev/debug.sh   -> JLinkGDBServer + arm-none-eabi-gdb
#     scripts/dev/ozone.sh   -> SEGGER Ozone
#
# Hardware notes (EK-RA8D2, Renesas part 968-K7EKA8D2S01001BE):
#   - Primary core:    Arm Cortex-M85 @ 1 GHz (with Helium / MVE)
#   - Secondary core:  Arm Cortex-M33 @ 250 MHz
#   - Code memory:     1 MB MRAM at 0x02000000 (non-volatile)
#   - System RAM:      2 MB SRAM with ECC
#   - On-board debug:  SEGGER J-Link OB exposed as a USB CMSIS-DAP/SWD link.
#
# OpenOCD reaches the on-board J-Link OB via libusb and the upstream
# `interface/jlink.cfg`. No SEGGER software is required at runtime; libusb
# permissions (udev rules on Linux) are.
#
# Tested with: openocd 0.12.0 (development mainline, post-2024 Cortex-M85 support).

# ---------------------------------------------------------------------------
# Adapter / transport
# ---------------------------------------------------------------------------

# The on-board debugger is a J-Link OB. Use the upstream J-Link interface
# script; OpenOCD talks to it over USB via libusb.
source [find interface/jlink.cfg]

# SWD is the only viable transport on the EK-RA8D2 -- the BGA package does
# not break out the JTAG TCK/TDI/TDO pins to the debug header.
transport select swd

# 4 MHz matches what scripts/dev/flash.sh and scripts/dev/debug.sh use for JLinkExe;
# the on-board J-Link OB has been validated at this speed.
adapter speed 4000

# ---------------------------------------------------------------------------
# Target -- Cortex-M85 (primary core)
# ---------------------------------------------------------------------------
#
# The RA8D2 is a dual-core part (M85 + M33). This config targets the M85
# (CPU0); the M33 secondary core would need a separate AP/DAP entry.
#
# TODO: confirm DAP AP index for the Cortex-M85 on RA8D2. The Hardware
# User's Manual (R01UH1065EJ) section on the Debug subsystem lists per-core
# AP indices; until that is cross-checked on hardware, leave the default
# AP (0) and let OpenOCD auto-detect via SWD multidrop.
#
# TODO: confirm SWD DPIDR / target ID for R7KA8D2KFLCAC. Once captured from a
# live `dap info` run, set:
#     swd newdap r7ka8d2 cpu -irlen 4 -expected-id 0x<idcode>
# Without the expected-id, OpenOCD will print a warning but proceed.

set _CHIPNAME r7ka8d2
set _CPUNAME  cpu0

swj_newdap $_CHIPNAME cpu -irlen 4
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Cortex-M85 uses the same generic cortex_m driver as M3/M4/M7/M33; OpenOCD
# 0.12+ recognises the M85 CPUID. Older OpenOCD versions will still attach
# but report the core as "Cortex-M unknown".
target create $_CHIPNAME.$_CPUNAME cortex_m -dap $_CHIPNAME.dap

# ---------------------------------------------------------------------------
# Flash / MRAM bank
# ---------------------------------------------------------------------------
#
# RA8D2 boots from 1 MB of MRAM at 0x02000000. MRAM differs from
# conventional NOR flash: writes do not require an erase cycle, and there is
# no page/sector model. A generic on-chip "flash" driver is the wrong fit;
# we treat the region as a programmable memory bank via the cortex_m loader.
#
# TODO: confirm MRAM unlock / write-enable sequence. The HUM
# (R01UH1065EJ) chapter on the Code Flash / MRAM controller documents:
#   - PWPR-style register protection unlock
#   - MRAM write-enable and busy-wait timing
# Until an OpenOCD flash driver lands upstream for this controller (or we
# write one out-of-tree), `program` will work for RAM-resident loads but
# MRAM programming requires either:
#   (a) an OpenOCD flash driver patch, or
#   (b) a small in-RAM stub loader that the host invokes via `monitor`.
#
# For now we declare a "virtual" bank so `flash info` / `flash banks` show
# something coherent; actual programming during bring-up should use the
# SEGGER path (scripts/dev/flash.sh). Once an MRAM driver is verified, switch
# the driver name from `cortex_m` placeholder to the real one.

set _MRAM_BASE 0x02000000
set _MRAM_SIZE 0x00100000

# TODO: replace `cortex_m` driver placeholder with a real RA-MRAM driver
# once available upstream or out-of-tree.
# flash bank $_CHIPNAME.mram <driver> $_MRAM_BASE $_MRAM_SIZE 0 0 $_CHIPNAME.$_CPUNAME

# ---------------------------------------------------------------------------
# Reset configuration
# ---------------------------------------------------------------------------
#
# The EK-RA8D2 routes the MCU reset to the J-Link OB's nSRST line, so
# `srst_only` works. Use `connect_assert_srst` to guarantee the core is
# halted at the reset vector before OpenOCD inspects memory (the M85 may
# otherwise have already executed bootloader code by the time SWD attaches).
reset_config srst_only srst_nogate connect_assert_srst

# ---------------------------------------------------------------------------
# Working area (used by flash loaders, algorithm execution)
# ---------------------------------------------------------------------------
#
# 2 MB of ECC SRAM is plenty; allocate the bottom 64 KB as a working area
# for any flash-loader algorithms.
$_CHIPNAME.$_CPUNAME configure -work-area-phys 0x22000000 \
                               -work-area-size 0x10000   \
                               -work-area-backup 0

syntax = "proto3";

package ra8.mdl;

// Payloads carried inside ESP-hosted's generated CustomRpc protobuf envelope.
// The RA8 owns destination paths and transactional storage. The requested
// format names the bytes the C6 returns: LOOSE is an untyped source body,
// while a container format requires the source/backend to provide that exact
// artifact and the RA8 to validate it before publication. Both endpoints
// reject unknown fields. Wire extensions therefore require an explicit
// protocol-version change instead of silently changing job semantics.

// Values intentionally match mdl_format_t. Keep the generated and shared
// enums synchronized; production TUs assert the mapping at compile time.
enum Format {
  FORMAT_LOOSE = 0;
  FORMAT_CBZ = 1;
  FORMAT_CBT = 2;
  FORMAT_CBR = 3;
  FORMAT_CBT_XZ = 4;
  FORMAT_CBT_GZ = 5;
  FORMAT_EPUB = 6;
  FORMAT_JOF = 7;
  FORMAT_RABOOK = 8;
  FORMAT_INVALID = 255;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_ACCEPTED = 1;
  STATE_DOWNLOADING = 2;
  STATE_COMPLETE = 3;
  STATE_CANCELLED = 4;
  STATE_FAILED = 5;
}

message StartRequest {
  uint32 protocol_version = 1;
  string url = 2;
  Format format = 3;
  string user_agent = 4;
  string referer = 5;
  string if_none_match = 6;
  string if_modified_since = 7;
  uint32 timeout_ms = 8;
}

message Accepted {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  uint32 max_chunk_bytes = 3;
  Format format = 4;
}

message NextRequest {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  uint64 acknowledged_offset = 3;
  uint32 max_bytes = 4;
}

message Chunk {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  uint32 sequence = 3;
  uint64 offset = 4;
  bytes data = 5;
  uint64 total_bytes = 6;
  State state = 7;
  int32 status = 8;
  bytes sha256 = 9;
  int32 http_status = 10;
  string retry_after = 11;
  string etag = 12;
  string last_modified = 13;
  string content_type = 14;
}

message CancelRequest {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
}

message Cancelled {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  int32 status = 3;
}

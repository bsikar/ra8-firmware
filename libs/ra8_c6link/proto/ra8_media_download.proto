syntax = "proto3";

package ra8.mdl;

// Payloads carried inside ESP-hosted's generated CustomRpc protobuf envelope.
// The RA8 owns destination paths, storage, and media transformation. The C6
// performs one operation only: bounded retrieval of the raw HTTPS body.
// Both endpoints reject unknown fields. Wire extensions therefore require an
// explicit protocol-version change instead of silently changing job semantics.

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_ACCEPTED = 1;
  STATE_DOWNLOADING = 2;
  STATE_COMPLETE = 3;
  STATE_CANCELLED = 4;
  STATE_FAILED = 5;
}

message StartRequest {
  uint32 protocol_version = 1;
  string url = 2;
  reserved 3;
  reserved "format";
}

message Accepted {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  uint32 max_chunk_bytes = 3;
}

message NextRequest {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  uint64 acknowledged_offset = 3;
  uint32 max_bytes = 4;
}

message Chunk {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  uint32 sequence = 3;
  uint64 offset = 4;
  bytes data = 5;
  uint64 total_bytes = 6;
  State state = 7;
  int32 status = 8;
  bytes sha256 = 9;
}

message CancelRequest {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
}

message Cancelled {
  uint32 protocol_version = 1;
  uint32 job_id = 2;
  int32 status = 3;
}

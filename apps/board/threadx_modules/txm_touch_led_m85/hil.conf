# Touch-to-LED ThreadX module demo (EK-RA8D2, RA8FW-1262).
# Admits txm_touch_led_m33.ra8app under display | led, opens the GT911 touch
# controller, and waits for a touch press (real touch on silicon or `--click`
# under ra8_emulator) to drive LED1 ON and repaint the module region green.
HIL_MODE=uart_scrape
HIL_EXPECT="txm_touch_led_m85: PASS"
HIL_EXPECT_NEGATIVE="FAIL|HardFault|TIMEOUT"
HIL_TIMEOUT_S=15

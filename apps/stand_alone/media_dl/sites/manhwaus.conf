#
# Site descriptor for manhwaus.net (manhwa aggregator).
# Series page URL shape: https://manhwaus.net/webtoon/<slug>/
# Pass the series URL with --series; this file supplies the scraping rules.

name = ManhwaUS
host = manhwaus.net
kind = manhwa

# --- chapter list (on a series page) ---
# Chapter links look like .../webtoon/<slug>/chapter-<N>/ ; keep anchors whose
# href contains this. main additionally restricts to the given series' prefix.
chapter_url_contains = /chapter-
# Site lists newest-first; "asc" sorts by the number in the URL so --chapters N
# from --start 0 gives chapter 1, 2, ...
chapter_order = asc

# --- search / discovery ---
# `--search TERM` fetches search_url with {q} replaced by the URL-encoded term
# and keeps result anchors whose series URL contains search_result_contains.
# `--browse` lists browse_url (the latest-updates page) using the same filter.
# Series pages live at .../webtoon/<slug>/, so that path fragment is the filter.
search_url = https://manhwaus.net/search/?s={q}
search_result_contains = /webtoon/
browse_url = https://manhwaus.net/

# --- page images (on a chapter page) ---
# Reader images are lazy <img> elements hosted on numbered `iiNNN` subdomains.
# The storage path is not stable: current chapters use both /online/ and
# /chapters/. Prefer data-src and select the dedicated image host so main-site
# thumbnails, the search-loading.gif spinner, and navigation icons are dropped.
page_img_attr = data-src
page_img_url_contains = https://ii

# --- metadata (series/chapter HTML) ---
series_title_selector = meta:og:title
series_summary_selector = meta:og:description
series_author_selector = label:Author(s):
series_artist_selector = label:Artist(s):
series_cover_selector = meta:og:image
chapter_title_selector = meta:og:title
language = en
reading_direction = ltr

# --- politeness (milliseconds; jittered in [min,max]) ---
img_delay_min = 500
img_delay_max = 1200
chapter_delay_min = 1500
chapter_delay_max = 3000

[package]
name = "firmware_pipeline_rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "firmware_pipeline_rust_main"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" role="img" aria-label="Display and render -- two halves that do not touch. coupling derived from #include edges between libs/, port/ and src/; the number on an arrow is how many files carry it down: ra8_reflow - to  ra8_core (50), ra8_widget - to  ra8_core (22), ra8_display_pal - to  ra8_core (19), ra8_gfx - to  ra8_core (9)       ra8_display_pal - to  ra8_hal (3), ra8_reflow - to  ra8_mem (3), ra8_display_pal - to  ra8_board_ek_ra8d2 (1) in:   ra8_rabook_compile - to  ra8_reflow (5), ra8_zoom - to  ra8_ui (3), ra8_zoom - to  ra8_gfx (2), ra8_epub - to  ra8_reflow (1) The honest finding: there is no include edge between the DISPLAY half (grey) and the RENDER half. ra8_display_pal reaches ra8_hal and ra8_core and nothing else in this cluster; ra8_fonts is generated data with no edges at all. The two halves meet only in an application, which owns the framebuffer and hands it to both. 5 internal edges across 9 libraries. Derivation: every arrow is an #include of a header owned by the target unit. CMake cannot answer this -- libs/*/CMakeLists.txt are">
  <defs>
    <marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker>
    <marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="aGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="aWrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="612" fill="#fdfdfb"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="24" y="32" fill="#1b1f24" font-size="14" font-weight="bold">Display and render -- two halves that do not touch</text>
    <text x="24" y="52" fill="#57606a" font-size="9">coupling derived from #include edges between libs/, port/ and src/; the number on an arrow is how many files carry it</text>
    <rect x="20" y="70" width="860" height="348" rx="8" fill="none" stroke="#aeb4bb" stroke-width="1.2"/>
    <line x1="238" y1="140" x2="344" y2="256" stroke="#1b1f24" stroke-width="1.2" marker-end="url(#aInk)"/>
    <text x="280" y="201" text-anchor="middle" fill="#1b1f24" font-size="9">7</text>
    <line x1="238" y1="140" x2="450" y2="170" stroke="#1b1f24" stroke-width="1.2" marker-end="url(#aInk)"/>
    <text x="355" y="158" text-anchor="middle" fill="#1b1f24" font-size="9">1</text>
    <line x1="450" y1="140" x2="344" y2="256" stroke="#1b1f24" stroke-width="1.2" marker-end="url(#aInk)"/>
    <text x="386" y="201" text-anchor="middle" fill="#1b1f24" font-size="9">2</text>
    <line x1="660" y1="140" x2="556" y2="256" stroke="#1b1f24" stroke-width="1.2" marker-end="url(#aInk)"/>
    <text x="597" y="201" text-anchor="middle" fill="#1b1f24" font-size="9">3</text>
    <line x1="450" y1="226" x2="344" y2="256" stroke="#1b1f24" stroke-width="1.2" marker-end="url(#aInk)"/>
    <text x="386" y="244" text-anchor="middle" fill="#1b1f24" font-size="9">2</text>
    <rect x="140" y="86" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="238" y="110" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_widget</text>
    <text x="238" y="126" text-anchor="middle" fill="#57606a" font-size="9">toolbar, nav, views</text>
    <rect x="351" y="86" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="450" y="110" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_keyboard</text>
    <text x="450" y="126" text-anchor="middle" fill="#57606a" font-size="9">on-screen keys</text>
    <rect x="562" y="86" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="660" y="110" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_reflow</text>
    <text x="660" y="126" text-anchor="middle" fill="#57606a" font-size="9">HTML/CSS pagination</text>
    <rect x="351" y="172" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="450" y="196" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_box</text>
    <text x="450" y="212" text-anchor="middle" fill="#57606a" font-size="9">box-model layout</text>
    <rect x="246" y="258" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#1a7f37" stroke-width="1.4"/>
    <text x="344" y="282" text-anchor="middle" fill="#1a7f37" font-size="10">ra8_ui</text>
    <text x="344" y="298" text-anchor="middle" fill="#57606a" font-size="9">hit-test, screen stack</text>
    <rect x="457" y="258" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#1a7f37" stroke-width="1.4"/>
    <text x="556" y="282" text-anchor="middle" fill="#1a7f37" font-size="10">ra8_gfx</text>
    <text x="556" y="298" text-anchor="middle" fill="#57606a" font-size="9">software 2D</text>
    <rect x="35" y="344" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#57606a" stroke-width="1.4"/>
    <text x="134" y="368" text-anchor="middle" fill="#57606a" font-size="10">ra8_display_pal</text>
    <text x="134" y="384" text-anchor="middle" fill="#57606a" font-size="9">GLCDC + e-paper</text>
    <rect x="246" y="344" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#57606a" stroke-width="1.4"/>
    <text x="344" y="368" text-anchor="middle" fill="#57606a" font-size="10">ra8_fonts</text>
    <text x="344" y="384" text-anchor="middle" fill="#57606a" font-size="9">font data (generated)</text>
    <rect x="457" y="344" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#57606a" stroke-width="1.4"/>
    <text x="556" y="368" text-anchor="middle" fill="#57606a" font-size="10">ra8_epd_cal</text>
    <text x="556" y="384" text-anchor="middle" fill="#57606a" font-size="9">VCOM calibration</text>
    <rect x="668" y="344" width="197" height="52" rx="5" fill="#fdfdfb" stroke="#57606a" stroke-width="1.4"/>
    <text x="766" y="368" text-anchor="middle" fill="#57606a" font-size="10">ra8_touch_cal</text>
    <text x="766" y="384" text-anchor="middle" fill="#57606a" font-size="9">touch calibration</text>
    <rect x="20" y="442" width="860" height="74" rx="6" fill="none" stroke="#aeb4bb" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="34" y="460" fill="#1b1f24" font-size="10" font-weight="bold">seams to the rest of the tree</text>
    <text x="34" y="478" fill="#57606a" font-size="9">down: ra8_reflow -&gt; ra8_core (50), ra8_widget -&gt; ra8_core (22), ra8_display_pal -&gt; ra8_core (19), ra8_gfx -&gt; ra8_core (9)</text>
    <text x="34" y="494" fill="#57606a" font-size="9">      ra8_display_pal -&gt; ra8_hal (3), ra8_reflow -&gt; ra8_mem (3), ra8_display_pal -&gt; ra8_board_ek_ra8d2 (1)</text>
    <text x="34" y="510" fill="#57606a" font-size="9">in:   ra8_rabook_compile -&gt; ra8_reflow (5), ra8_zoom -&gt; ra8_ui (3), ra8_zoom -&gt; ra8_gfx (2), ra8_epub -&gt; ra8_reflow (1)</text>
    <text x="24" y="538" fill="#57606a" font-size="9">The honest finding: there is no include edge between the DISPLAY half (grey) and the RENDER half. ra8_display_pal reaches</text>
    <text x="24" y="554" fill="#57606a" font-size="9">ra8_hal and ra8_core and nothing else in this cluster; ra8_fonts is generated data with no edges at all. The two halves meet</text>
    <text x="24" y="570" fill="#57606a" font-size="9">only in an application, which owns the framebuffer and hands it to both. 5 internal edges across 9 libraries.</text>
    <text x="24" y="586" fill="#57606a" font-size="9">Derivation: every arrow is an #include of a header owned by the target unit. CMake cannot answer this -- libs/*/CMakeLists.txt are</text>
  </g>
</svg>

    <rect x="497" y="510" width="217" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="605" y="534" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_jpeg</text>
    <text x="605" y="550" text-anchor="middle" fill="#57606a" font-size="9">software JPEG</text>
    <rect x="20" y="608" width="940" height="74" rx="6" fill="none" stroke="#aeb4bb" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="34" y="626" fill="#1b1f24" font-size="10" font-weight="bold">seams to the rest of the tree</text>
    <text x="34" y="644" fill="#57606a" font-size="9">down: ra8_epub -&gt; ra8_core (31), ra8_comic -&gt; ra8_core (28), ra8_rabook_compile -&gt; ra8_core (25), ra8_jof -&gt; ra8_core (23)</text>
    <text x="34" y="660" fill="#57606a" font-size="9">      ra8_rabook_compile -&gt; ra8_reflow (5), ra8_rabook_import -&gt; ra8_fs (4), ra8_rabook_import -&gt; ra8_mem (4)</text>
    <text x="34" y="676" fill="#57606a" font-size="9">in:   ra8_mdl_storage_vfs -&gt; ra8_book (2), ra8_camera -&gt; ra8_jpeg (1), ra8_c6link -&gt; ra8_mdl (1)</text>
    <text x="24" y="704" fill="#57606a" font-size="9">The densest cluster in the tree: 16 internal edges, and every one points downward -- producers above, containers in the</text>
    <text x="24" y="720" fill="#57606a" font-size="9">middle, codecs at the bottom. ra8_mdl and ra8_cache_store sit in this subject area but have no include edge to any of it.</text>
    <text x="24" y="736" fill="#57606a" font-size="9">Derivation: every arrow is an #include of a header owned by the target unit. CMake cannot answer this -- libs/*/CMakeLists.txt are</text>
    <text x="24" y="752" fill="#57606a" font-size="9">no-ops and consumers glob libs/&lt;lib&gt;/src/*.c into one object library, so there are no target_link_libraries edges to read.</text>

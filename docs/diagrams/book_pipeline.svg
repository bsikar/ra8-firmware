    <text x="489" y="444" text-anchor="middle" fill="#57606a" font-size="9">no-heap pull reader</text>
    <rect x="612" y="404" width="217" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>

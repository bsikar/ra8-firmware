    <rect x="381" y="86" width="217" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="489" y="110" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_rabook_import</text>
    <text x="489" y="126" text-anchor="middle" fill="#57606a" font-size="9">on-device import seam</text>
    <rect x="35" y="192" width="217" height="52" rx="5" fill="#fdfdfb" stroke="#1a7f37" stroke-width="1.4"/>

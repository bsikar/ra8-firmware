<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 682" width="980" role="img" aria-label="Book pipeline -- EPUB and comics into a paged container. coupling derived from #include edges between libs/, port/ and src/; the number on an arrow is how many files carry it down: ra8_epub - to  ra8_core (31), ra8_comic - to  ra8_core (28), ra8_rabook_compile - to  ra8_core (25), ra8_jof - to  ra8_core (23)       ra8_rabook_compile - to  ra8_reflow (5), ra8_rabook_import - to  ra8_fs (4), ra8_rabook_import - to  ra8_mem (4) in:   ra8_mdl_storage_vfs - to  ra8_book (2), ra8_camera - to  ra8_jpeg (1), ra8_c6link - to  ra8_mdl (1) The densest cluster in the tree: 16 internal edges, and every one points downward -- producers above, containers in the middle, codecs at the bottom. ra8_mdl and ra8_cache_store sit in this subject area but have no include edge to any of it. Derivation: every arrow is an #include of a header owned by the target unit. CMake cannot answer this -- libs/*/CMakeLists.txt are">

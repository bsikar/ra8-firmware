    <rect x="266" y="298" width="217" height="52" rx="5" fill="#fdfdfb" stroke="#1b1f24" stroke-width="1"/>
    <text x="374" y="322" text-anchor="middle" fill="#1b1f24" font-size="10">ra8_epub</text>

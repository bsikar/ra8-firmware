pin_file = "coprocessor/esp32c6/pins.env"
pin_key = "ESP_HOSTED_MCU_COMMIT"
upstream_pin = "949bb30612747a3bd9e402eda8d01fbfa1f8503e"

# Pre-image Git blob ids of every file the series touches, read from the exact
# pinned upstream commit. `git apply --check` alone cannot bind the series to
# the pin: the patches carry zero context, so they still apply to an upstream
# whose target files have drifted outside the hunks. Measured against
# https://github.com/espressif/esp-hosted-mcu at ESP_HOSTED_MCU_COMMIT.
[component.upstream_blobs]
"slave/CMakeLists.txt" = "fff63ee15cf7030493e8162065fec918524c11d0"
"slave/main/idf_component.yml" = "9e8358bd080e22ab708c60b5121b40c3073da1e7"
"slave/main/slave_control.c" = "7c51888e7c6d7784a94a365a3d965a247f07bfcc"

